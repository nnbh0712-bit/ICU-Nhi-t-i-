/* ------------------------------------------------------------
   LỊCH CỮ CỦA KHOA — quy trình Bước 2
     mức 1 và 2 : 10 – 13 – 16 – 19 – 22 – 1 – 4 – 7 giờ
     mức 3      : 10 – 12 – 14 – 16 – 18 – 20 – 22 – 0 – 2 – 4 – 6 – 8 giờ
   Lịch này dùng để HIỆN cữ kế tiếp cho điều dưỡng biết khi nào tới lượt.
   CHỈ SỐ tuân thủ vẫn tính theo khoảng cách thực giữa hai lượt xoay
   (xem turnInfo) — người xoay lúc 16g20 không bị ghi là trễ cữ.
   ------------------------------------------------------------ */
function lichCu(level, settings) {
  const st = settings || DB.data.settings || DEFAULT_SETTINGS();
  const ds = level >= (st.turnHighFrom != null ? st.turnHighFrom : 3)
    ? (st.turnSlotsHigh || [10, 12, 14, 16, 18, 20, 22, 0, 2, 4, 6, 8])
    : (st.turnSlots || [10, 13, 16, 19, 22, 1, 4, 7]);
  return ds.slice().sort((a, b) => a - b);
}
/* Cữ kế tiếp sau một mốc thời gian */
function cuKeTiep(level, ref, settings) {
  const gio = lichCu(level, settings);
  const d = new Date(ref == null ? Date.now() : ref);
  for (const h of gio) {
    const t = new Date(d); t.setHours(h, 0, 0, 0);
    if (t.getTime() > d.getTime()) return t;
  }
  const t = new Date(d); t.setDate(t.getDate() + 1); t.setHours(gio[0], 0, 0, 0);
  return t;
}
/* Tư thế gợi ý cho một cữ.
   Quy trình chỉ quy định MỘT điều: cữ 10 giờ nằm nghiêng TRÁI.
   Các cữ sau app gợi ý luân phiên trái → ngửa → phải → ngửa; đây là gợi ý
   của phần mềm, không phải quy định của khoa, điều dưỡng đổi được. */
function tuTheCu(level, when, settings) {
  const gio = lichCu(level, settings);
  const i0 = gio.indexOf(10), i = gio.indexOf(dOf(when).getHours());
  if (i < 0 || i0 < 0) return null;
  const vong = ["ngtrai", "ngua", "ngphai", "ngua"];
  const b = ((i - i0) % gio.length + gio.length) % gio.length;
  return vong[b % 4];
}

function turnInfo(ep, now) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const nowMs = now ? dOf(now).getTime() : Date.now();
  const last = DB.lastAssessment(ep.id);
  const clv = last ? careLevelOf(last) : 1;
  const every = turnEveryFor(clv, st);          // khoảng cách mục tiêu, giờ
  const step = every * 3600000;

  const turns = (DB.data.turns || [])
    .filter(t => t.episodeId === ep.id)
    .sort((a, b) => a.at.localeCompare(b.at));

  const daXoay = turns.filter(t => !t.skipped);
  const lastTurn = daXoay[daXoay.length - 1] || null;
  const lastSkip = turns[turns.length - 1] || null;

  /* Mốc tính: lần xoay gần nhất, chưa có thì lấy lúc nhập khoa */
  const mocMs = lastTurn ? dOf(lastTurn.at).getTime() : dOf(ep.admittedAt).getTime();
  const cachMs = nowMs - mocMs;                  // đã bao lâu kể từ mốc
  const dueMs = mocMs + step;                    // khi nào tới lúc xoay tiếp

  /* Khoảng cách giữa các lần xoay trong 24 giờ qua — dùng cho chỉ số */
  const gan = daXoay.filter(t => dOf(t.at).getTime() >= nowMs - 24 * 3600000);
  const khoang = [];
  for (let i = 1; i < gan.length; i++)
    khoang.push(dOf(gan[i].at).getTime() - dOf(gan[i - 1].at).getTime());
  const dat = khoang.filter(k => k <= step + 30 * 60000).length;   // châm chước 30 phút khi TÍNH CHỈ SỐ

  return {
    every, level: clv, step,
    last: lastTurn,
    lastAny: lastSkip,
    never: !daXoay.length,
    mocAt: new Date(mocMs),
    cach: cachMs,                                 // ms kể từ lần xoay gần nhất
    due: new Date(dueMs),                         // tới lúc nên xoay tiếp
    toiLuc: nowMs >= dueMs,                       // đã tới hoặc quá lúc nên xoay
    quaBaoLau: Math.max(0, nowMs - dueMs),
    soLuot24h: gan.length,
    khoang, datKhoang: dat,
    skip24h: turns.filter(t => t.skipped && dOf(t.at).getTime() >= nowMs - 24 * 3600000).length
  };
}

/* Các lượt xoay trong 24 giờ qua, mới nhất trước — để vẽ nhật ký */
function turnLog24(ep, n) {
  const from = Date.now() - 24 * 3600000;
  return (DB.data.turns || [])
    .filter(t => t.episodeId === ep.id && dOf(t.at).getTime() >= from)
    .sort((a, b) => b.at.localeCompare(a.at))
    .slice(0, n || 20);
}

   phiếu không sửa được, nên trạng thái liền thương lưu riêng theo khoá này. */
/* Một tổn thương được nhận ra bằng đợt điều trị + vị trí + thiết bị.
   Tên vị trí quy về mã của bảng 29 vị trí trước khi ghép, để tên cũ và tên
   mới của cùng một chỗ (ví dụ "Vùng cùng cụt" của bản trước và "Xương cùng"
   của phiếu khám da) không bị tách thành hai tổn thương khác nhau. */
function lesionKey(epId, l) {
  const s = l.site || "";
  return epId + "|" + (kdMa(s) || s) + "|" + (l.device || "");
}
const LESION_STATUS = {
  theodoi:  { t: "Đang theo dõi",  tag: "watch" },
  caithien: { t: "Đang cải thiện", tag: "poa" },
  xauhon:   { t: "Nặng thêm",      tag: "hapi" },
  lanh:     { t: "Đã lành",        tag: "healed" }
};
/* Các trạng thái ghi được nhiều lần trong quá trình theo dõi */
const LESION_PROGRESS = ["theodoi", "caithien", "xauhon"];

/* Tập hợp tổn thương của một đợt điều trị, kèm trạng thái liền thương.
   Lấy bản ghi mới nhất của mỗi vị trí trong toàn bộ các phiếu đã ký. */
function lesionsOfEpisode(epId) {
  const out = new Map();
  /* Hai nguồn ghi tổn thương, xếp chung theo thời gian rồi cuộn tới:
       - phiếu Waterlow đã ký (lần đầu nhập khoa, và các lần đánh giá lại)
       - bản ghi tổn thương riêng (ghi giữa hai lần đánh giá)
     Cuộn theo đúng thứ tự thời gian thì bản ghi sau luôn đè bản ghi trước,
     nên "độ hiện tại" là độ ghi gần nhất, bất kể ghi bằng đường nào. */
  const nguon = [];
  DB.assessmentsOf(epId).forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => nguon.push({ at: a.at, l }));
  });
  (DB.data.lesionLogs || []).filter(x => x.episodeId === epId)
    .forEach(x => nguon.push({ at: x.at, l: x }));
  nguon.sort((x, y) => String(x.at).localeCompare(String(y.at)));

  nguon.forEach(({ at, l }) => {
      const key = lesionKey(epId, l);
      const prev = out.get(key);
      out.set(key, {
        key, site: l.site, device: l.device || "", stage: l.stage, poa: prev ? prev.poa : !!l.poa,
        size: l.size, note: l.note,
        foundAt: prev ? prev.foundAt : (l.foundAt || at),
        lastAt: at, isDevice: !!l.device,
        photos: (prev ? prev.photos : []).concat(l.photos || []),
        firstStage: prev ? prev.firstStage : l.stage
      });
  });
  return [...out.values()].map(l => {
    const st = DB.lesionState(l.key);
    return Object.assign(l, { status: st ? st.status : "theodoi", state: st });
  });
}

/* --- Ca trực, phục vụ màn hình giao ban --- */
/* Giờ ca trực do khoa Hồi sức tích cực cung cấp (23/09/2026) */
const SHIFTS = [
  { v: "sang",   t: "Ca sáng",  from: 7,  to: 15 },
  { v: "chieu",  t: "Ca chiều", from: 15, to: 21 },
  { v: "dem",    t: "Ca tối",   from: 21, to: 7  }
];
/* Độ dài một ca, tính thẳng từ giờ vào – giờ ra. Ca bắc qua nửa đêm thì cộng vòng.
   Ba ca của khoa dài không bằng nhau (8 / 6 / 10 giờ) nên KHÔNG được giả định 8 giờ. */
function shiftLen(s) { return s.to > s.from ? s.to - s.from : (24 - s.from) + s.to; }
function qua0h(s) { return s.to <= s.from; }

function currentShift(d) {
  const h = (d || new Date()).getHours();
  for (let i = 0; i < SHIFTS.length; i++) {
    const s = SHIFTS[i];
    if (qua0h(s) ? (h >= s.from || h < s.to) : (h >= s.from && h < s.to)) return s;
  }
  return SHIFTS[SHIFTS.length - 1];
}
/* Mốc bắt đầu và kết thúc của ca đang xét */
function shiftRange(shift, ref) {
  const d = new Date(ref || Date.now());
  const start = new Date(d);
  start.setMinutes(0, 0, 0);
  start.setHours(shift.from);
  /* Đang ở phần sau nửa đêm của ca bắc ngày, hoặc chưa tới giờ vào ca → lùi một ngày */
  if (qua0h(shift) ? d.getHours() < shift.to : d.getHours() < shift.from)
    start.setDate(start.getDate() - 1);
  const end = new Date(start.getTime() + shiftLen(shift) * 3600000);
  return { start, end };
}

/* --- Cài đặt mặc định --- */
const DEFAULT_SETTINGS = () => ({
  wardName: "Khoa Cấp cứu Hồi sức tích cực Chống độc Người lớn",
  hospital: "Bệnh viện Bệnh Nhiệt đới",
  thresholds: [10, 15, 20],          // ngưỡng lên mức 1, 2, 3 — quy trình Bước 1.3
  reassessHours: [48, 24, 12, 8],    // hạn đánh giá lại theo mức — quy định của khoa
  /* Xoay trở — quy trình Bước 2 */
  turnEveryHours: 3,                 // có nguy cơ và nguy cơ cao: mỗi 3 giờ
  turnEveryHoursHigh: 2,             // nguy cơ rất cao: mỗi 2 giờ
  turnHighFrom: 3,                   // chỉ mức nguy cơ RẤT CAO mới dùng khoảng 2 giờ
  turnSlots: [10, 13, 16, 19, 22, 1, 4, 7],                  // lịch cữ mức 1 và 2
  turnSlotsHigh: [10, 12, 14, 16, 18, 20, 22, 0, 2, 4, 6, 8],// lịch cữ mức 3
  hoTieuChi: DEFAULT_HO_TIEUCHI(),  // tiêu chí bàn giao trọng điểm
  firstAssessHours: 1,               // quy trình Bước 1: trong vòng 1 giờ sau nhập khoa
  tuDongRatCao: true,                // uốn ván, sốc nhiễm khuẩn, tổn thương thần kinh vào thẳng mức rất cao
  khamDaMoiGio: 8,                   // quy trình Bước 1: khám da mỗi 8 giờ, vào đầu ca
  icuEscalate: 2,                    // số yếu tố hồi sức để nâng một mức
  nangTheoIcu: true,                 // nâng mức khi đủ số yếu tố hồi sức — EPUAP/NPIAP 2019
  nangTheoLoet: true,                // nâng mức khi đã có tổn thương — EPUAP/NPIAP 2019
  idleMinutes: 20,
  photosEnabled: true,
  bundles: DEFAULT_BUNDLES.map(b => ({ level: b.level, ten: b.ten, items: b.items.slice() })),
  bundleNhom: (() => {
    const o = {};
    Object.keys(BUNDLE_META).forEach(t => { o[t] = BUNDLE_META[t].nhom; });
    return o;
  })(),
  bundleTuy: Object.keys(BUNDLE_META).filter(t => BUNDLE_META[t].tuy),
  autoFlagVeryHigh: true,
  autoFlagNewInjury: true,
  autoFlagOverdue: true
});

/* --- Tính điểm --- */
function scoreWaterlow(ans) {
  let total = 0;
  const detail = {};
  WATERLOW.forEach(b => {
    const sel = ans[b.key];
    let s = 0;
    if (b.multi) {
      (sel || []).forEach(i => { s += (b.opts[i]?.p || 0); });
      if (b.cap != null) s = Math.min(s, b.cap);
    } else if (sel != null && b.opts[sel]) {
      s = b.opts[sel].p;
    }
    detail[b.key] = s; total += s;
  });
  const n = mstScore(ans.mst || {});
  detail.mst = n; total += n;
  return { total, detail, mst: n };
}
function mstScore(m) {
  let s = 0;
  ["a", "b", "c"].forEach(k => {
    const i = m[k];
    if (typeof i === "number" && MST[k].opts[i]) s += MST[k].opts[i].p;
  });
  return s;
}
function levelOf(total, settings) {
  const t = (settings || DB.data.settings || DEFAULT_SETTINGS()).thresholds;
  if (total >= t[2]) return 3;
  if (total >= t[1]) return 2;
  if (total >= t[0]) return 1;
  return 0;
}
/* Mức khuyến cáo chăm sóc: nâng một bậc nếu nhiều yếu tố hồi sức hoặc đã có tổn thương */
function careLevelOf(a, settings) {
  const st = settings || DB.data.settings || DEFAULT_SETTINGS();
  let lv = a.level != null ? a.level : levelOf(a.score, st);
  const nIcu = (a.icu || []).length;
  const hasLesion = (a.lesions || []).length > 0 || (a.mdrpi || []).length > 0;
  /* Hai luật nâng mức, khoa bật tắt riêng trong Cài đặt.
     Không có trong quy trình của khoa — căn cứ là EPUAP/NPIAP/PPPIA 2019,
     tài liệu tham khảo số 2 của chính quy trình. */
  const doIcu = st.nangTheoIcu !== false && nIcu >= st.icuEscalate;
  const doLoet = st.nangTheoLoet !== false && hasLesion;
  if (doIcu || doLoet) lv = Math.min(3, lv + 1);
  /* Sàng lọc loét ngay nhập viện: uốn ván, sốc nhiễm khuẩn và tổn thương thần
     kinh vào thẳng nguy cơ rất cao, không chờ điểm Waterlow.
     (Đề xuất năm 2026 trong báo cáo tổng kết của khoa.) */
  if (st.tuDongRatCao !== false && nhomRatCao(a.nhomBenh)) lv = 3;
  return lv;
}
/* Vì sao mức chăm sóc được nâng — chỉ nêu lý do THẬT SỰ áp dụng cho ca này */
function lyDoNangMuc(a, settings) {
  const st = settings || DB.data.settings || DEFAULT_SETTINGS();
  const ds = [];
  const nIcu = (a.icu || []).length;
  if (st.nangTheoIcu !== false && nIcu >= st.icuEscalate)
    ds.push(`có <b>${nIcu} yếu tố nguy cơ đặc thù hồi sức</b>`);
  if (st.nangTheoLoet !== false && ((a.lesions || []).length || (a.mdrpi || []).length))
    ds.push("<b>đã có tổn thương</b>");
  return ds;
}

/* Có nhóm bệnh nào buộc lên nguy cơ rất cao không */
function nhomRatCao(ds) {
  return (ds || []).some(k => {
    const g = NHOM_BENH.find(x => x.k === k);
    return g && g.ratCao;
  });
}
/* Danh sách mục gói của một mức, cộng thêm can thiệp chuyên biệt theo nhóm bệnh */
function bundleItems(level, nhomBenh, settings) {
  const ds = bundleFor(level, settings).slice();
  (nhomBenh || []).forEach(k => {
    const g = NHOM_BENH.find(x => x.k === k);
    if (g) g.items.forEach(([nhom, t]) => { if (ds.indexOf(t) < 0) ds.push(t); });
  });
  return ds;
}
/* Mục gói của một phiếu đã ký — theo mức và nhóm bệnh lưu trong phiếu đó */
function goiCuaPhieu(a) {
  return bundleItems(mucGoiCuaPhieu(a), a && a.nhomBenh);
}
/* Tên gói theo quy trình: phòng ngừa cơ bản / tăng cường / tối đa */
function tenGoi(level, settings) {
  const st = settings || DB.data.settings || DEFAULT_SETTINGS();
  const b = (st.bundles || DEFAULT_BUNDLES).find(x => x.level === level)
         || DEFAULT_BUNDLES.find(x => x.level === level);
  return (b && b.ten) || (DEFAULT_BUNDLES.find(x => x.level === level) || {}).ten || "Gói chăm sóc";
}
/* Mức chăm sóc của một phiếu: LẤY MỨC ĐÃ LƯU LÚC KÝ, không tính lại.

   Tính lại thì kết quả phụ thuộc Cài đặt HIỆN TẠI. Điều dưỡng trưởng đổi
   ngưỡng "số yếu tố hồi sức để nâng mức" là mọi phiếu cũ đổi mức theo,
   và các mục gói đã tick trong phiếu đó biến mất khỏi màn hình vì không
   còn khớp mức. Mức đã ký là mức của lúc đó, không đổi. */
function mucGoiCuaPhieu(a) {
  return a && a.careLevel != null ? a.careLevel : careLevelOf(a);
}

function bundleFor(level, settings) {
  const st = settings || DB.data.settings || DEFAULT_SETTINGS();
  const b = (st.bundles || DEFAULT_BUNDLES).find(x => x.level === level);
  return b ? b.items : [];
}
/* ============================================================
   TRẠNG THÁI GÓI CHĂM SÓC
   ------------------------------------------------------------
   Một mục được coi là ĐÃ THỰC HIỆN nếu bản ghi mới nhất của nó
   (trong cùng đợt điều trị, cùng mức chăm sóc) nói là đã làm.

   Hai nguồn, trộn chung theo thời gian:
     - ô tích lúc ký phiếu đánh giá  (a.bundle, mốc thời gian a.at)
     - bản ghi thực hiện ghi sau đó  (bundleLogs)
   Nhờ vậy phiếu cũ vẫn đọc được y như trước, không phải chuyển đổi gì.
   ============================================================ */
/* Ca trực chứa một mốc thời gian: {shift, start, end} */
function caCuaLuc(ms) {
  const d = new Date(ms == null ? Date.now() : ms);
  const s = currentShift(d);
  const r = shiftRange(s, d);
  return { shift: s, start: r.start, end: r.end };
}

/* Những mục của gói đã được ghi TRONG MỘT CA TRỰC.
   Hai nguồn, trộn theo thời gian:
     - ô tích lúc ký phiếu đánh giá, nếu phiếu ký trong ca đó
     - bản ghi đánh dấu trong ca
   Trả về Map: mục → { at, by }. */
function bundleState(epId, level, tuMs, denMs) {
  const st = new Map();
  const trong = t => {
    const x = dOf(t).getTime();
    return (tuMs == null || x >= tuMs) && (denMs == null || x < denMs);
  };
  const nguon = [];
  DB.assessmentsOf(epId).forEach(a => {
    const lv = mucGoiCuaPhieu(a);
    if (lv !== level || !trong(a.at)) return;
    (a.bundle || []).forEach(item => nguon.push({ at: a.at, item, by: a.userId, tuPhieu: true }));
  });
  (DB.data.bundleLogs || []).filter(b =>
    b.episodeId === epId && b.level === level && trong(b.at)
  ).forEach(b => nguon.push({ at: b.at, item: b.item, by: b.by, done: b.done !== false }));
  nguon.sort((x, y) => String(x.at).localeCompare(String(y.at)));
  /* Bản ghi sau đè bản ghi trước. Mục bị bỏ tick thì rời khỏi danh sách đang đánh dấu. */
  nguon.forEach(x => {
    if (x.done === false) st.delete(x.item);
    else st.set(x.item, { done: true, at: x.at, by: x.by, tuPhieu: !!x.tuPhieu });
  });
  return st;
}

/* Gói của ca trực đang diễn ra (hoặc ca chứa mốc ref) */
function bundleCa(epId, level, ref) {
  const c = caCuaLuc(ref);
  return { ca: c, st: bundleState(epId, level, c.start.getTime(), c.end.getTime()) };
}

/* Tỷ lệ gói của CA TRỰC chứa phiếu đánh giá này.
   Dùng cho cột "% gói" trong tệp Excel — đọc là "ca đó làm được mấy phần gói". */
function bundleRateOf(a) {
  const lv = mucGoiCuaPhieu(a);
  const items = mucTinhChiSo(goiCuaPhieu(a));
  if (!items.length) return null;
  const c = caCuaLuc(dOf(a.at).getTime());
  const st = bundleState(a.episodeId, lv, c.start.getTime(), c.end.getTime());
  const n = items.filter(it => st.has(it)).length;
  return { xong: n, tong: items.length, ty: n / items.length, ca: c.shift.t };
}

/* Tuân thủ gói chăm sóc, tính trên TỪNG CA TRỰC trong kỳ báo cáo.
   Mỗi cặp (người bệnh × ca trực) là một phiếu gói. */
function bundleCaStats(from, to) {
  const tu = from.getTime(), den = to.getTime();
  let tong = 0, cong = 0, du = 0;
  DB.liveEpisodes().forEach(ep => {
    const vao = dOf(ep.admittedAt).getTime();
    const ra = ep.dischargedAt ? dOf(ep.dischargedAt).getTime() : Date.now();
    let moc = Math.max(tu, vao);
    let canh = 0;
    while (moc < Math.min(den, ra) && canh++ < 400) {
      const c = caCuaLuc(moc);
      const a = DB.assessmentsOf(ep.id).filter(x => dOf(x.at).getTime() < c.end.getTime())[0];
      if (a) {
        const lv = mucGoiCuaPhieu(a);
        const items = mucTinhChiSo(goiCuaPhieu(a));
        if (items.length) {
          const st = bundleState(ep.id, lv, c.start.getTime(), c.end.getTime());
          const n = items.filter(it => st.has(it)).length;
          tong++; cong += n / items.length;
          if (n === items.length) du++;
        }
      }
      moc = c.end.getTime();
    }
  });
  return { soCa: tong, ty: tong ? cong / tong : null, duGoi: du };
}

function ageBandIndex(age) {
  if (age == null) return null;
  if (age < 14) return null;
  if (age <= 49) return 0;
  if (age <= 64) return 1;
  if (age <= 74) return 2;
  if (age <= 80) return 3;
  return 4;
}

/* --- Hạn đánh giá lại --- */
function dueInfo(ep) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const last = DB.lastAssessment(ep.id);
  if (!last) {
    const due = new Date(dOf(ep.admittedAt).getTime() + st.firstAssessHours * 3600000);
    return { first: true, due, overdue: Date.now() > due.getTime(), last: null };
  }
  const lv = last.level != null ? last.level : levelOf(last.score);
  const hrs = st.reassessHours[lv] != null ? st.reassessHours[lv] : 24;
  const due = new Date(dOf(last.at).getTime() + hrs * 3600000);
  return { first: false, due, overdue: Date.now() > due.getTime(), last, hours: hrs };
}

/* --- Nhãn dùng chung --- */
const levelClass = lv => "r" + Math.max(0, Math.min(3, lv || 0));
function levelPill(lv, extra) {
  const L = LEVELS[Math.max(0, Math.min(3, lv || 0))];
  return `<span class="pill ${levelClass(lv)}${extra || ""}"><span class="bullet"></span>${esc(L.short)}</span>`;
}

function renderStatus() {
  const el = $("#syncline"); if (!el) return;
  if (DB.mode !== "sheet") { el.textContent = "Dữ liệu lưu trên máy này"; return; }
  el.textContent = DB.syncing ? "Đang đồng bộ…"
    : DB.online ? "Đã đồng bộ " + (DB.lastSync ? fmtTime(DB.lastSync) : "")
    : "Mất kết nối máy chủ";
  el.style.color = DB.online ? "" : "var(--bad)";
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("ltd_theme", next); } catch (e) {}
}

function bindFirstRun() {
  const f = $("#fr-form"), msg = $("#fr-msg");
  f.onsubmit = async e => {
    e.preventDefault();
    const url = $("#fr-url").value.trim();
    msg.hidden = false; msg.style.color = "var(--ink-3)";
    if (!/^https?:\/\//.test(url)) {
      msg.textContent = "Địa chỉ phải bắt đầu bằng https://"; msg.style.color = "var(--bad)"; return;
    }
    msg.textContent = "Đang kết nối…";
    try {
      const server = await DB.peek(url);
      if (!server || !(server.users || []).length) {
        msg.textContent = "Kho dữ liệu này đang trống. Hỏi lại điều dưỡng trưởng.";
        msg.style.color = "var(--bad)"; return;
      }
      CFG.write({ mode: "sheet", url });
      DB.mode = "sheet"; DB.url = url;
      DB.adopt(server); DB.dirty = false;
      try { localStorage.removeItem("ltd_dirty"); } catch (e) {}
      SHOW_SETUP = false;
      toast("Đã nối vào kho dữ liệu của khoa. Đăng nhập bằng tài khoản của bạn.", "ok", 7000);
      render();
    } catch (err) {
      msg.innerHTML = "Không kết nối được. Kiểm tra mạng và xem đã dán <b>trọn vẹn</b> địa chỉ chưa (phải kết thúc bằng <code>/exec</code>).";
      msg.style.color = "var(--bad)";
    }
  };
  const back = $("#fr-back");
  if (back) back.onclick = () => { SHOW_SETUP = false; render(); };
  const demoBtn = $("#fr-demo");
  if (!demoBtn) return;
  demoBtn.onclick = () => confirmBox("Dùng thử với dữ liệu mẫu",
    "Ứng dụng sẽ tạo người bệnh hư cấu để bạn xem thử. Dữ liệu này chỉ nằm trên máy này và không liên quan tới người bệnh thật.",
    "Tạo dữ liệu mẫu", async () => {
      toast("Đang tạo dữ liệu mẫu…");
      await seedDemo();
      toast("Xong. Đăng nhập bằng ddt.chau hoặc dd.an, mật khẩu 123456", "ok", 7000);
      render();
    });
}

  const f = $("#loginform"); if (!f) return;

    const pw = $("#lg-pw").value;

    // Có thể tồn tại nhiều tài khoản trùng tên đăng nhập sau khi hợp nhất dữ liệu:
    // chọn đúng tài khoản có mật khẩu khớp.
    const hash = hashPw(pw, DB.data.meta.salt);
    const cands = DB.data.users.filter(x =>

  if (su) su.onclick = () => { SHOW_SETUP = true; render(); };
}

      $$("[data-qturn]").forEach(b => b.onclick = () => {

      bindPatientRows(); bindFlagCards(); bindCharts();
    }
  };
}

}

function changePasswordDialog() {
  modal({
    title: "Đổi mật khẩu",
    body: `<div class="field"><label for="cp-old">Mật khẩu hiện tại</label><input id="cp-old" type="password"></div>
      <div class="field"><label for="cp-new">Mật khẩu mới</label><input id="cp-new" type="password">
        <span class="help">Ít nhất 6 ký tự.</span></div>
      <div class="field"><label for="cp-new2">Nhập lại mật khẩu mới</label><input id="cp-new2" type="password"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Cập nhật", kind: "pri", onClick: (b) => {
      const o = $("#cp-old", b).value, n = $("#cp-new", b).value, n2 = $("#cp-new2", b).value;
      const u = Session.user;
      if (u.pw !== hashPw(o, DB.data.meta.salt)) { toast("Mật khẩu hiện tại không đúng", "err"); return false; }
      if (n.length < 6) { toast("Mật khẩu mới phải từ 6 ký tự", "err"); return false; }
      if (n !== n2) { toast("Hai lần nhập không khớp", "err"); return false; }
      u.pw = hashPw(n, DB.data.meta.salt); u.mustChange = false; touch(u);
      DB.log("doi-mat-khau", "Tự đổi mật khẩu");
      DB.save(); toast("Đã đổi mật khẩu", "ok");
    }}]
  });
}
</script>
<script>
/* ============================================================
   DANH SÁCH & HỒ SƠ NGƯỜI BỆNH
   ============================================================ */
let PQ = { q: "", filter: "dang", sort: "uutien", view: null,
           ky: "", from: "", to: "" };   // ky: "" = không lọc ngày

/* Khoảng ngày đang lọc trong danh sách người bệnh.
   Lọc theo NGÀY NHẬP KHOA của đợt gần nhất, vì đó là mốc điều dưỡng nhớ. */
function pqWindow() {
  const parse = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  if (!PQ.ky) return null;
  const n = new Date();
  if (PQ.ky === "khac") {
    let f = parse(PQ.from), t = parse(PQ.to);
    if (!f && !t) return null;
    if (!f) f = new Date(2000, 0, 1);
    if (!t) t = n;
    if (f > t) { const x = f; f = t; t = x; }
    return { from: f, to: new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1),
             nhan: `${fmtDate(f)} – ${fmtDate(t)}` };
  }
  if (PQ.ky[0] === "m") {
    const back = +PQ.ky.slice(1);
    const f = new Date(n.getFullYear(), n.getMonth() - back, 1);
    const t = new Date(f.getFullYear(), f.getMonth() + 1, 1);
    return { from: f, to: t > n ? n : t, nhan: back ? "tháng trước" : "tháng này" };
  }
  const ng = +PQ.ky.slice(1);
  return { from: new Date(n.getTime() - ng * 86400000), to: n, nhan: ng + " ngày gần nhất" };
}
const PQKY = [["", "Mọi thời điểm"], ["d7", "7 ngày gần nhất"], ["d30", "30 ngày gần nhất"],
              ["m0", "Tháng này"], ["m1", "Tháng trước"], ["khac", "Chọn khoảng ngày…"]];   // view: "the" = thẻ, "bang" = bảng
/* Chưa chọn thì tự quyết theo bề ngang màn hình: máy tính xem bảng, điện thoại xem thẻ */
function listView() {
  if (PQ.view) return PQ.view;
  try { return window.innerWidth >= 900 ? "bang" : "the"; } catch (e) { return "the"; }
}

/* Sắp xếp tên theo lối Việt Nam: lấy TÊN trước, rồi mới tới họ và chữ lót */
function nameKey(full) {
  const parts = String(full || "").trim().split(/\s+/);
  const ten = parts.length ? parts[parts.length - 1] : "";
  return ten + " " + parts.slice(0, -1).join(" ");
}
const SORTS = [
  { v: "uutien", t: "Ưu tiên chăm sóc" },
  { v: "az",     t: "Tên A → Z" },
  { v: "za",     t: "Tên Z → A" },
  { v: "giuong", t: "Theo giường" },
  { v: "nvmoi",  t: "Nhập viện mới nhất" },
  { v: "nvcu",   t: "Nhập viện lâu nhất" },
  { v: "diem",   t: "Điểm Waterlow cao nhất" }
];

function viewPatients() {
  const q = noAccent(PQ.q);
  let list = livePatients().map(p => {
    const ep = DB.activeEpisode(p.id);
    const lastEp = ep || DB.episodesOf(p.id)[0];
    const last = lastEp ? DB.lastAssessment(lastEp.id) : null;
    return { p, ep, lastEp, last, due: ep ? dueInfo(ep) : null,
             lv: last ? (last.level != null ? last.level : levelOf(last.score)) : null };
  });
  if (PQ.filter === "dang") list = list.filter(x => x.ep);
  if (PQ.filter === "xuat") list = list.filter(x => !x.ep);
  if (q) list = list.filter(x => noAccent(x.p.name).includes(q) || noAccent(x.p.mrn).includes(q));
  /* Lọc ngày: đợt gần nhất phải có giao với khoảng đang chọn */
  const pw = pqWindow();
  if (pw) list = list.filter(x => {
    if (!x.lastEp) return false;
    const vao = dOf(x.lastEp.admittedAt).getTime();
    const ra = x.lastEp.dischargedAt ? dOf(x.lastEp.dischargedAt).getTime() : Date.now();
    return ra >= pw.from.getTime() && vao < pw.to.getTime();
  });
  const byName = (a, b) => nameKey(a.p.name).localeCompare(nameKey(b.p.name), "vi");
  const admOf = r => (r.lastEp ? dOf(r.lastEp.admittedAt).getTime() : 0);
  list.sort((a, b) => {
    switch (PQ.sort) {
      case "az": return byName(a, b);
      case "za": return byName(b, a);
      case "giuong": {
        const ab = (a.ep && a.ep.bed) || "zzz", bb = (b.ep && b.ep.bed) || "zzz";
        return ab.localeCompare(bb, "vi", { numeric: true }) || byName(a, b);
      }
      case "nvmoi": return admOf(b) - admOf(a) || byName(a, b);
      case "nvcu":  return admOf(a) - admOf(b) || byName(a, b);
      case "diem":  return ((b.last && b.last.score) || -1) - ((a.last && a.last.score) || -1) || byName(a, b);
      default: {
        if (PQ.filter === "dang") {
          const ao = a.due && a.due.overdue ? 1 : 0, bo = b.due && b.due.overdue ? 1 : 0;
          if (ao !== bo) return bo - ao;
          if ((b.lv == null ? -1 : b.lv) !== (a.lv == null ? -1 : a.lv))
            return (b.lv == null ? -1 : b.lv) - (a.lv == null ? -1 : a.lv);
        }
        return byName(a, b);
      }
    }
  });

  const counts = {
    dang: livePatients().filter(p => DB.activeEpisode(p.id)).length,
    xuat: livePatients().filter(p => !DB.activeEpisode(p.id)).length
  };

  const html = `
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1;position:relative">
        <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none"><use href="#i-search"/></svg>
        <input id="psearch" type="search" placeholder="Tìm theo tên hoặc mã hồ sơ" value="${esc(PQ.q)}"
          style="padding-left:34px" autocomplete="off">
      </div>
      <button class="btn pri" data-newp aria-label="Tạo hồ sơ mới"><svg><use href="#i-plus"/></svg><span class="hidesm">Hồ sơ mới</span></button>
    </div>
    <div class="listbar">
      <div class="lb1" role="tablist">
        ${[["dang", "Đang điều trị", counts.dang], ["xuat", "Đã kết thúc", counts.xuat], ["all", "Tất cả", livePatients().length]]
          .map(([k, t, n]) => `<button class="lbchip" data-filter="${k}"
            aria-pressed="${PQ.filter === k}"><span class="t">${t}</span><span class="n">${n}</span></button>`).join("")}
      </div>
      <div class="lb2">
      <label class="sortsel">
        <span>Thời gian</span>
        <select id="pky">${PQKY.map(([v, t]) =>
          `<option value="${v}"${PQ.ky === v ? " selected" : ""}>${t}</option>`).join("")}</select>
      </label>
      <label class="sortsel">
        <span>Sắp xếp</span>
        <select id="psort">${SORTS.map(s =>
          `<option value="${s.v}" ${PQ.sort === s.v ? "selected" : ""}>${esc(s.t)}</option>`).join("")}</select>
      </label>
      <div class="viewtog" role="group" aria-label="Kiểu hiển thị">
        <button data-view="the" aria-pressed="${listView() === "the"}">Thẻ</button>
        <button data-view="bang" aria-pressed="${listView() === "bang"}">Bảng</button>
      </div>
      </div>
    </div>
    ${PQ.ky === "khac" ? `<div class="rprange" style="margin-top:8px">
      <label for="pq-from">Từ</label>
      <input id="pq-from" type="date" value="${esc(PQ.from)}" max="${isoDay(new Date())}">
      <label for="pq-to">đến</label>
      <input id="pq-to" type="date" value="${esc(PQ.to)}" max="${isoDay(new Date())}">
      <button class="btn sm pri" data-pqgo>Xem</button>
    </div>` : ""}
    ${pw ? `<p class="sorthint">Đang lọc: người bệnh có mặt tại khoa trong <b>${esc(pw.nhan)}</b>
      — ${list.length} hồ sơ.</p>` : ""}
    ${PQ.sort === "az" || PQ.sort === "za" ? `<p class="sorthint">Xếp theo tên gọi, không theo họ.</p>` : ""}
    ${list.length ? (listView() === "bang" ? patientTable(list) : `<div class="plist">${list.map(r => r.ep
        ? patientRow(r, { showDue: true })
        : dischargedRow(r)).join("")}</div>`)
      : `<div class="empty">${PQ.q ? "Không tìm thấy người bệnh nào khớp với từ khoá."
            : livePatients().length ? "Chưa có người bệnh nào trong nhóm này."
            : "Danh sách còn trống. Bấm nút bên dưới để tạo hồ sơ người bệnh đầu tiên."}
          <div style="margin-top:12px"><button class="btn sm pri" data-newp>
            ${PQ.q ? `Tạo hồ sơ mới cho “${esc(PQ.q)}”` : "Tạo hồ sơ người bệnh"}</button></div></div>`}
  `;
  return {
    title: "Người bệnh", sub: `${counts.dang} đang điều trị`, html,
    bind() {
      const s = $("#psearch");
      s.oninput = () => { PQ.q = s.value; const p = s.selectionStart; render();
        const n = $("#psearch"); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} } };
      $$("[data-filter]").forEach(b => b.onclick = () => { PQ.filter = b.dataset.filter; render(); });
      const so = $("#psort");
      if (so) so.onchange = () => { PQ.sort = so.value; render(); };
      const ky = $("#pky");
      if (ky) ky.onchange = () => {
        PQ.ky = ky.value;
        if (PQ.ky !== "khac") { PQ.from = ""; PQ.to = ""; }
        render();
        if (PQ.ky === "khac") { const f = $("#pq-from"); if (f) f.focus(); }
      };
      const pgo = $("[data-pqgo]");
      if (pgo) pgo.onclick = () => {
        PQ.from = ($("#pq-from") || {}).value || "";
        PQ.to = ($("#pq-to") || {}).value || "";
        if (!PQ.from && !PQ.to) { toast("Chưa chọn ngày nào", "err"); return; }
        render();
      };
      $$("[data-view]").forEach(b => b.onclick = () => { PQ.view = b.dataset.view; render(); });
      $$("tr[data-row]").forEach(tr => tr.onclick = () => Nav.go("patient", { id: tr.dataset.row }));
      $$("[data-newp]").forEach(b => b.onclick = () => newPatientDialog(PQ.q));
      bindPatientRows();
    }
  };
}

/* Dạng bảng — một dòng một người bệnh, đọc nhanh khi chiếu máy chiếu hoặc xem trên máy tính */
function patientTable(list) {
  const showOut = list.some(r => !r.ep);
  return `<div class="card" style="padding:14px">
    <div class="tablewrap"><table class="ptable">
      <thead><tr><th>Người bệnh</th><th>Mã hồ sơ</th><th>Giường</th><th>Ngày<br>nằm</th>
        <th>Waterlow</th><th>Mức</th><th>${showOut ? "Tình trạng" : "Đánh giá gần nhất"}</th>
        <th>Xoay trở<br>24 giờ</th><th>Tổn<br>thương</th></tr></thead>
      <tbody>${list.map(r => {
        const { p, ep, lastEp, last, lv, due } = r;
        const ls = last ? (last.lesions || []).length + (last.mdrpi || []).length : 0;
        const ti = ep ? turnInfo(ep) : null;
        const dayN = lastEp ? daysBetween(lastEp.admittedAt, (ep ? new Date() : lastEp.dischargedAt)) + 1 : "—";
        const tinh = ep
          ? `<span style="${due && due.overdue ? "color:var(--r2-ink);font-weight:600" : ""}">${
              last ? ago(last.at) : "chưa có"}${due && due.overdue ? " · quá hạn" : ""}</span>`
          : `<span style="color:var(--ink-3)">${esc(ketThucOf(lastEp))} ${lastEp ? fmtDate(lastEp.dischargedAt) : "—"}</span>`;
        return `<tr data-row="${p.id}" style="cursor:pointer"${ep ? "" : ' class="out"'}>
          <td><b>${esc(p.name)}</b></td>
          <td class="mono">${esc(p.mrn)}</td>
          <td>${esc((ep || lastEp || {}).bed || "—")}</td>
          <td class="num">${dayN}</td>
          <td class="num">${last ? last.score : "—"}</td>
          <td>${lv != null ? levelPill(lv, " sm") : '<span class="pill neutral sm">chưa đánh giá</span>'}</td>
          <td>${tinh}</td>
          <td class="num">${ti ? `<span style="${ti.toiLuc && !ti.never ? "color:var(--r2-ink);font-weight:600" : ""}">${
            ti.soLuot24h} lượt</span>${ti.khoang.length
              ? `<span class="tsub">${ti.datKhoang}/${ti.khoang.length} khoảng đạt</span>` : ""}${
            ti.skip24h ? `<span class="tsub">${ti.skip24h} lượt hoãn</span>` : ""}` : "—"}</td>
          <td class="num">${ls || "—"}</td></tr>`;
      }).join("")}</tbody></table></div>
    <p style="font-size:12px;color:var(--ink-3);margin-top:9px">
      Cột <b>Xoay trở 24 giờ</b>: số lượt đã ghi trong 24 giờ qua, và bao nhiêu khoảng cách
      giữa hai lần xoay nằm trong mục tiêu của khoa. Màu đỏ là đã quá khoảng cách mục tiêu.</p>
  </div>`;
}

/* Hình thức kết thúc đợt điều trị. Hồ sơ cũ chưa ghi thì để "Đã kết thúc",
   không đoán là ra viện. */
const KETTHUC = ["Chuyển khoa", "Chuyển viện", "Ra viện", "Tử vong"];
function ketThucOf(ep) {
  const t = ep && ep.dischargeType;
  return KETTHUC.indexOf(t) >= 0 ? t : "Đã kết thúc";
}

function dischargedRow(r) {
  const { p, lastEp, last, lv } = r;
  const age = ageFrom(p.dob);
  return `<button class="prow" data-patient="${p.id}" style="opacity:.86">
    <span class="stripe" style="background:var(--line-2)"></span>
    <span class="body">
      <span class="n">${esc(p.name)}</span>
      <span class="m"><span class="mono">${esc(p.mrn)}</span><span class="sep">·</span>
        <span>${age != null ? age + " tuổi" : "—"}</span></span>
      <span class="m">${esc(ketThucOf(lastEp))} ${lastEp ? fmtDate(lastEp.dischargedAt) : "—"}${last ? " · Waterlow lần cuối " + last.score : ""}</span>
    </span>
    <span class="right"><span class="pill neutral sm">${esc(ketThucOf(lastEp))}</span></span>
  </button>`;
}

/* --- Tạo hồ sơ mới / tìm trùng --- */
function newPatientDialog(prefill) {
  modal({
    title: "Hồ sơ người bệnh mới",
    body: `<div class="notice"><svg><use href="#i-info"/></svg>
        <span>Nếu người bệnh đã từng nằm khoa, hãy tìm lại hồ sơ cũ bằng tên và ngày sinh thay vì tạo mới.</span></div>
      <div class="field"><label for="np-name">Họ và tên</label>
        <input id="np-name" type="text" value="${esc(prefill || "")}" placeholder="Nguyễn Văn A"></div>
      <div class="grid2">
        <div class="field"><label for="np-mrn">Mã hồ sơ bệnh viện</label>
          <input id="np-mrn" type="text" placeholder="vd: 26-045678" class="mono">
          <span class="help">Đây là mã định danh chính, không trùng lặp.</span></div>
        <div class="field"><label for="np-dob">Ngày sinh</label><input id="np-dob" type="date"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="np-sex">Giới tính</label>
          <select id="np-sex"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
        <div class="field"><label for="np-bed">Giường</label><input id="np-bed" type="text" placeholder="vd: HS-07"></div>
      </div>
      <div class="field"><label for="np-dx">Chẩn đoán chính</label>
        <input id="np-dx" type="text" placeholder="vd: Viêm phổi nặng, sốc nhiễm khuẩn"></div>
      <div id="np-dup"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Tạo và nhập khoa", kind: "pri", onClick: (b) => {
      const name = $("#np-name", b).value.trim();
      const mrn = $("#np-mrn", b).value.trim();
      const dob = $("#np-dob", b).value;
      if (!name) { toast("Chưa nhập họ tên", "err"); return false; }
      if (!mrn) { toast("Chưa nhập mã hồ sơ bệnh viện", "err"); return false; }
      const dupMrn = livePatients().find(p => p.mrn.toLowerCase() === mrn.toLowerCase());
      if (dupMrn) {
        toast("Mã hồ sơ này đã tồn tại — mở hồ sơ cũ.", "err", 4500);
        Nav.go("patient", { id: dupMrn.id });
        return;
      }
      const dupName = livePatients().find(p => noAccent(p.name) === noAccent(name) && p.dob === dob && dob);
      if (dupName && !b.dataset.forced) {
        b.dataset.forced = "1";
        $("#np-dup", b).innerHTML = `<div class="notice warn"><svg><use href="#i-alert"/></svg>
          <span>Đã có hồ sơ <b>${esc(dupName.name)}</b> (mã ${esc(dupName.mrn)}) cùng tên và ngày sinh.
          Bấm lại nút “Tạo và nhập khoa” nếu đây thực sự là người bệnh khác, hoặc
          <a href="#" data-open-dup>mở hồ sơ cũ</a>.</span></div>`;
        $("[data-open-dup]", b).onclick = e => { e.preventDefault(); Nav.go("patient", { id: dupName.id }); $(".modal").remove(); };
        return false;
      }
      const p = touch({ id: uid("p"), name, mrn, dob, sex: $("#np-sex", b).value,
        createdAt: new Date().toISOString(), createdBy: Session.user.id });
      DB.data.patients.push(p);
      const ep = newEpisode(p.id, $("#np-bed", b).value.trim(), $("#np-dx", b).value.trim());
      DB.log("tao-nguoi-benh", `Tạo hồ sơ ${name} (${mrn}) và nhập khoa`, "patient", p.id);
      DB.save();
      toast("Đã tạo hồ sơ và nhập khoa", "ok");
      Nav.go("patient", { id: p.id });
    }}]
  });
}
function newEpisode(patientId, bed, dx) {
  const ep = touch({ id: uid("e"), patientId, admittedAt: new Date().toISOString(), dischargedAt: null,
    bed: bed || "", diagnosis: dx || "", admittedBy: Session.user.id });
  DB.data.episodes.push(ep);
  return ep;
}

/* ============================================================
   HỒ SƠ MỘT NGƯỜI BỆNH
   ============================================================ */
/* Một dòng trong Diễn tiến đánh giá — dùng chung, không viết lại lần hai */
function assessRow(a) {
  const l = a.level != null ? a.level : levelOf(a.score);
  return `<div class="tlrow ${levelClass(l)}">
    <div class="tcol"><div class="tscore">${a.score}</div><div class="tline"></div></div>
    <div class="tbody">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${levelPill(l, " sm")}
        ${(a.lesions || []).length ? `<span class="tag hapi">${(a.lesions || []).length} tổn thương</span>` : ""}
        ${(a.mdrpi || []).length ? `<span class="tag">${(a.mdrpi || []).length} do thiết bị</span>` : ""}
        ${(a.icu || []).length ? `<span class="tag">${(a.icu || []).length} yếu tố hồi sức</span>` : ""}
      </div>
      <div class="tmeta">${fmtDT(a.at)} · ${esc(DB.userName(a.userId))}</div>
      ${a.note ? `<div class="tnote">${esc(a.note)}</div>` : ""}
      <div class="btnrow" style="margin-top:5px">
        <button class="btn ghost sm" data-viewa="${a.id}" style="padding-left:0">Xem chi tiết phiếu</button>
        <button class="btn ghost sm" data-ptda="${a.id}">Phiếu theo dõi</button>
      </div>
    </div></div>`;
}


/* Việc hành chính của hồ sơ — gom vào một hộp thoại, mở từ nút ở đầu trang.
   Để riêng khỏi phần chăm sóc, vì đây là việc ít làm và dễ bấm nhầm. */
/* Thẻ đang mở của từng hồ sơ. Vẽ lại màn hình (sau khi ghi xoay trở, ghi diễn tiến
   tổn thương…) thì quay về đúng thẻ đang xem, không văng về Tổng quan. */
let PTAB = {};
/* Thay đổi gói chăm sóc chưa lưu, theo từng đợt điều trị: { epId: { mục: true/false } }.
   Giữ ngoài DB nên chuyển thẻ hay vẽ lại màn hình đều không mất. */
let GOIPEND = {};
/* Bộ lọc ngày của mục Lịch sử thực hiện, và ngăn kéo đó đang mở hay đóng */
let GOILS = {}, GOILSMO = {};

function hanhChinhDialog(p, ep) {
  const m = modal({
    title: "Hành chính",
    body: `<div class="hclist">
      ${ep ? `<button class="btn" data-hc-editep>Sửa giường / chẩn đoán</button>` : ""}
      <button class="btn" data-hc-editp>Sửa thông tin hành chính</button>
      ${ep ? `<button class="btn danger" data-hc-discharge>Kết thúc đợt điều trị</button>` : ""}
      ${!ep ? `<button class="btn pri" data-hc-readmit>Nhập viện lại</button>` : ""}
      ${Session.isHead() ? `<button class="btn danger" data-hc-voidp>Huỷ hồ sơ</button>` : ""}
    </div>
    <p class="hcsub">Phiếu đánh giá đã ký không sửa được — muốn sửa thì đánh giá lại.
      Mọi lần sửa hồ sơ đều lưu vết người sửa và thời điểm sửa.</p>`,
    actions: [{ label: "Đóng" }]
  });
  const g = (s, f) => { const el = $(s, m.body); if (el) el.onclick = () => { m.close(); f(); }; };
  g("[data-hc-editep]",    () => editEpisodeDialog(ep));
  g("[data-hc-editp]",     () => editPatientDialog(p));
  g("[data-hc-discharge]", () => dischargeDialog(p, ep));
  g("[data-hc-readmit]",   () => readmitDialog(p));
  g("[data-hc-voidp]",     () => voidPatientDialog(p));
}

function viewPatient({ id }) {
  const p = DB.patient(id);
  if (!p) return { title: "Không tìm thấy", html: `<div class="empty">Hồ sơ không còn tồn tại.</div>` };
  if (isVoid(p)) return {
    title: p.name, sub: "hồ sơ đã huỷ",
    html: `<section class="card"><div class="notice warn"><svg><use href="#i-alert"/></svg><span>
        Hồ sơ này đã bị huỷ ${fmtDT(p.voidedAt)} bởi
        <b>${esc(p.voidedByName || DB.userName(p.voidedBy))}</b> — lý do: ${esc(p.voidReason || "—")}.<br>
        Hồ sơ không còn trong danh sách người bệnh và không được tính vào báo cáo.
        ${Session.isHead() ? "Khôi phục được trong Cài đặt." : "Cần khôi phục thì báo điều dưỡng trưởng."}
      </span></div></section>` + editHistoryBlock(p),
    bind() {}
  };
  const ep = DB.activeEpisode(p.id);
  const eps = DB.episodesOf(p.id);
  const curEp = ep || eps[0];
  const assessments = curEp ? DB.assessmentsOf(curEp.id) : [];
  const last = assessments[0] || null;
  const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
  const clv = last ? mucGoiCuaPhieu(last) : null;
  const due = ep ? dueInfo(ep) : null;
  const age = ageFrom(p.dob);
  const flags = DB.flagsOf(p.id);
  const openF = flags.filter(f => f.status !== "dong");

  /* Việc còn nợ của chính người bệnh này — dùng lại đúng hàm của trang chủ,
     để hai nơi không bao giờ nói khác nhau. */
  const tiCur = ep ? turnInfo(ep) : null;
  const vcl = ep ? viecCuaNguoiBenh({ p, ep, due, lv, last, ti: tiCur }) : { viec: [], uu: 0 };

  /* Một nút chính duy nhất trên cả trang: việc gấp nhất.
     Các nút còn lại là nút viền, để mắt biết bấm gì trước. */
  const uuTien = vcl.viec.length
    ? (vcl.viec.find(v => v.k === "assess") ? "assess"
      : vcl.viec.find(v => v.k === "turn") ? "turn" : "flag")
    : null;

  const canLam = !ep ? "" : `
      <div class="canlam ${vcl.viec.some(v => v.gap) ? "gap" : ""}">
        <div class="cl-h">${vcl.viec.length ? "Cần làm" : "Không còn việc nợ"}</div>
        ${vcl.viec.length
          ? `<ul>${vcl.viec.map(v => `<li>${esc(v.t)}</li>`).join("")}</ul>`
          : `<p class="cl-ok">Đúng hạn đánh giá, đúng khoảng cách xoay trở,
               không có lưu ý nào chưa xử lý.</p>`}
        <div class="btnrow">
          <button class="btn ${uuTien === "assess" ? "pri" : ""}" data-assess>${
            last ? "Đánh giá lại" : "Đánh giá loét tì đè"}</button>
          <button class="btn ${uuTien === "turn" ? "pri" : ""}" data-turn2>Ghi xoay trở</button>
          ${Session.isHead() ? `<button class="btn" data-flag>Cần quan tâm</button>` : ""}
        </div>
      </div>`;

  const header = `
    <section class="card">
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:190px">
          <p style="font-size:13.5px;color:var(--ink);margin:0">
            <span class="mono">${esc(p.mrn)}</span> · ${age != null ? age + " tuổi" : "—"} ·
            ${p.sex === "nu" ? "Nữ" : "Nam"} · sinh ${fmtDate(p.dob)}</p>
          ${curEp ? `<p style="font-size:13px;color:var(--ink-2);margin-top:4px">
            Giường <b>${esc(curEp.bed || "chưa xếp")}</b> · ${esc(curEp.diagnosis || "chưa ghi chẩn đoán")}</p>` : ""}
          ${curEp ? `<p style="font-size:12.5px;color:var(--ink-3);margin-top:3px">
            ${ep ? `Nhập khoa ${fmtDT(ep.admittedAt)} · ngày điều trị thứ ${daysBetween(ep.admittedAt, new Date()) + 1}`
                 : `Đợt gần nhất: ${fmtDate(curEp.admittedAt)} – ${fmtDate(curEp.dischargedAt)}`}</p>` : ""}
          <button class="hcnut" data-hc><svg><use href="#i-cog"/></svg>Hành chính</button>
          ${ep ? `<button class="hcnut" data-ptd><svg><use href="#i-handover"/></svg>Phiếu theo dõi</button>` : ""}
        </div>
        ${last ? `<div class="result ${levelClass(lv)}" style="min-width:142px;padding:13px 15px">
          <span class="big" style="font-size:38px">${last.score}</span>
          <span class="lvl">${esc(LEVELS[lv].short)}</span>
          <span class="sub">Waterlow · ${ago(last.at)}</span>
        </div>` : `<div class="empty" style="min-width:142px;padding:16px">Chưa đánh giá</div>`}
      </div>
      ${ep ? canLam : `<div class="btnrow" style="margin-top:13px">
        <button class="btn pri" data-readmit>Nhập viện lại</button></div>`}
    </section>`;

  /* BẢN THỬ: bảng xoay trở + danh sách tổn thương có trạng thái liền thương */
  const turnSec = turnBlock(p, ep);
  /* Khám da nay nằm gọn bên trong khối tổn thương, không còn là khối riêng */
  const khamDa = "";
  const lesionsBlock = lesionsBlockNew(curEp, !!ep);

  const photoTl = photoTimeline(p.id, curEp);

  /* Gói chăm sóc: danh sách việc làm được ĐÁNH DẤU BẤT CỨ LÚC NÀO trong ca,
     không phải chỉ đúng lúc ký phiếu. Mỗi lần đánh dấu ghi lại tên người và giờ.
     Gói của các mức trước vẫn giữ, gấp lại bên dưới. */
  /* Gói chăm sóc: tick nhiều mục rồi bấm LƯU LẠI một lượt.
     Thay đổi chưa lưu giữ trong GOIPEND theo từng đợt điều trị, nên chuyển
     thẻ qua lại không mất. */
  const careBlock = last ? (() => {
    const items = goiCuaPhieu(last);              // gói theo mức + can thiệp theo nhóm bệnh
    const demItems = mucTinhChiSo(items);          // mẫu số bỏ mục tuỳ điều kiện vật tư
    /* Gói là phiếu của TỪNG CA TRỰC: vào ca thì trắng, tick phần mình làm */
    const bc = bundleCa(curEp.id, clv);
    const tt = bc.st;
    const pend = GOIPEND[curEp.id] || {};
    const daLuu = it => tt.has(it);                             // đang đánh dấu trong ca này
    const dangChon = it => (it in pend) ? pend[it] : daLuu(it);  // gồm cả thay đổi chưa lưu
    const doi = items.filter(it => (it in pend) && pend[it] !== daLuu(it));
    const xong = demItems.filter(daLuu);
    const ls = goiLichSu(curEp.id);

    /* Ô luôn bấm được: trong ca tình trạng người bệnh có thể đổi, nên
       tick hay bỏ tick lúc nào cũng được, bấm Lưu là ghi lại phiếu mới. */
    const dong = it => {
      const s = tt.get(it);
      const luu = daLuu(it), chon = dangChon(it), khac = chon !== luu;
      return `<button class="bitem ${chon ? "xong" : ""} ${khac ? "chualuu" : ""}"
        ${ep ? "" : "disabled"} aria-pressed="${chon}" data-goi="${esc(it)}">
        <span class="box"><svg><use href="#i-check"/></svg></span>
        <span class="bt">${esc(it)}${mucTuyChon(it)
          ? `<span class="tuy">tuỳ điều kiện vật tư</span>` : ""}${khac
          ? `<span class="bwho cl">chưa lưu</span>` : ""}</span>
      </button>`;
    };

    /* Lịch sử: gom theo ngày, mới nhất trước, có ô lọc để tìm lại phiếu cũ */
    const lsKy = (GOILS[curEp.id] || {}).ky || "";
    const ngayCoTmp = [...new Set(ls.map(g => isoDay(dOf(g.at))))].sort().reverse();
    /* Chọn "một ngày" mà chưa chỉ ngày nào thì lấy ngày gần nhất có ghi */
    const lsNgay = (GOILS[curEp.id] || {}).ngay || (lsKy === "ngay" ? (ngayCoTmp[0] || "") : "");
    const lsLoc = (() => {
      if (lsKy === "ngay" && lsNgay) return ls.filter(g => isoDay(dOf(g.at)) === lsNgay);
      if (lsKy === "d7" || lsKy === "d30") {
        const moc = Date.now() - (+lsKy.slice(1)) * 86400000;
        return ls.filter(g => dOf(g.at).getTime() >= moc);
      }
      return ls;
    })();
    const ngayCo = ngayCoTmp;
    const lsNhom = goiTheoNgay(lsLoc);

    const lsHtml = ls.length ? `<details class="fold" ${GOILSMO[curEp.id] ? "open" : ""} data-goils>
      <summary>Lịch sử thực hiện<span class="fsum">${ls.length} lần ghi · ${
        ngayCo.length} ngày</span></summary>
      <div class="foldin">
        <div class="lsbar">
          <label for="gls-ky">Xem</label>
          <select id="gls-ky">
            ${[["", "Tất cả"], ["d7", "7 ngày gần nhất"], ["d30", "30 ngày gần nhất"],
               ["ngay", "Chọn một ngày…"]].map(([v, t]) =>
              `<option value="${v}"${v === lsKy ? " selected" : ""}>${t}</option>`).join("")}
          </select>
          ${lsKy === "ngay" ? `<select id="gls-ngay">
            ${ngayCo.map(n => `<option value="${n}"${n === lsNgay ? " selected" : ""}>${
              fmtDate(n)}</option>`).join("")}</select>` : ""}
          <span class="lsdem">${lsLoc.length}/${ls.length} lần ghi</span>
        </div>
        ${lsNhom.length ? lsNhom.map(nn => `
          <div class="lsngay">${fmtDate(nn.ngay)}<span>${nn.lan.length} lần ghi</span></div>
          <div class="gls">${nn.lan.map(g => `
            <div class="glrow">
              <div class="glt">${fmtTime(g.at)}</div>
              <div class="gld">
                <b>${esc(DB.userName(g.by))}</b>
                <span class="glm">${esc(g.ca || "")}${g.kyPhieu ? " · tích lúc ký phiếu đánh giá" : ""}
                  · mức ${esc(LEVELS[g.level].short.toLowerCase())} · ${g.lam.length} mục</span>
                <ul class="gllam">${g.lam.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
              </div>
            </div>`).join("")}</div>`).join("")
        : `<div class="empty">Không có lần ghi nào trong kỳ đã chọn.</div>`}
      </div>
    </details>` : "";

    return `<section class="card" id="goi-sec">
      <div class="card-h"><h2>${esc(tenGoi(clv))}</h2>
        <span class="hint">${esc(LEVELS[clv].short)}${clv > lv ? " · đã nâng một mức" : ""}</span></div>
      ${clv > lv ? `<div class="notice"><svg><use href="#i-info"/></svg>
        <span>${nhomRatCao(last.nhomBenh)
          ? `Người bệnh thuộc nhóm <b>${esc((last.nhomBenh || []).map(nhomBenhTen).join(", "))}</b> — theo quy định sàng lọc của khoa, vào thẳng mức nguy cơ rất cao, không chờ điểm Waterlow.`
          : `Mức chăm sóc được nâng lên vì người bệnh ${lyDoNangMuc(last).join(" và ")}.
             <span style="opacity:.8">Căn cứ EPUAP/NPIAP/PPPIA 2019 — không phải quy định của khoa.</span>`}</span></div>` : ""}

      ${(() => {
        /* Tên người và giờ ghi đưa lên đầu phiếu, không lặp ở từng dòng nữa */
        const lan = [...tt.values()].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        const nguoi = [...new Set(lan.map(x => x.by))];
        return `<div class="goica">Phiếu gói của <b>${esc(bc.ca.shift.t.toLowerCase())}</b>
          · ${fmtDate(bc.ca.start)}${lan.length
            ? ` · ghi lúc <b>${fmtTime(lan[0].at)}</b> — ${esc(DB.userName(nguoi[0]))}${
                nguoi.length > 1 ? ` và ${nguoi.length - 1} người khác` : ""}`
            : " · ca này chưa ghi"}</div>`;
      })()}

      <div class="goihead">
        <span class="goiso ${xong.length === demItems.length ? "du" : ""}">${xong.length}/${demItems.length}</span>
        <span class="goitxt">${xong.length === demItems.length
          ? "ca này đã ghi đủ gói"
          : `ca này còn <b>${demItems.length - xong.length}</b> mục chưa ghi`}${(() => {
            const tuy = items.filter(it => mucTuyChon(it) && daLuu(it)).length;
            return tuy ? ` · ${tuy} mục tuỳ điều kiện vật tư đã làm, không tính vào tỷ lệ` : "";
          })()}</span>
        ${ep ? `<div class="btnrow" style="margin-left:auto">
          ${xong.length < demItems.length ? `<button class="btn sm" data-goiall>Chọn hết</button>` : ""}
          ${items.some(dangChon) ? `<button class="btn sm" data-goinone>Bỏ chọn tất cả</button>` : ""}
        </div>` : ""}
      </div>

      <div class="goilive">${BUNDLE_NHOM.map(nh => {
        const ds = items.filter(it => nhomCuaMuc(it) === nh);
        if (!ds.length) return "";
        return `<div class="bgroup"><div class="bgname">${esc(nh)}</div>
          <div class="bundle">${ds.map(dong).join("")}</div></div>`;
      }).join("")}</div>

      ${ep ? (doi.length ? `<div class="goiluu">
        <span class="gltxt"><b>${doi.length} thay đổi chưa lưu</b> — bấm Lưu để ghi phiếu
          kèm tên bạn và giờ hiện tại.</span>
        <div class="btnrow">
          <button class="btn sm" data-goibo>Bỏ thay đổi</button>
          <button class="btn sm pri" data-goiluu>Lưu</button>
        </div>
      </div>` : `<p class="goinote">Tick vào những mục <b>đã làm trong ca này</b> rồi bấm <b>Lưu</b>.
        Trong ca đổi cách chăm sóc thì cứ tick hay bỏ tick lại rồi lưu tiếp — mỗi lần lưu là một
        phiếu trong Lịch sử. <b>Sang ca sau danh sách trắng lại</b> cho ca đó ghi phần của họ.</p>`) : ""}

      ${lsHtml}
    </section>`;
  })() : "";

  const tl = assessments.length ? `
    <section class="card">
      <div class="card-h"><h2>Diễn tiến đánh giá</h2>
        <span class="hint">${assessments.length} lượt · đợt điều trị hiện tại</span></div>
      ${assessments.length > 1 ? chartPatientTrend(assessments) : ""}
      <div class="tl" style="margin-top:${assessments.length > 1 ? "14px" : "0"}">
        ${assessments.slice(0, 1).map(assessRow).join("")}
      </div>
      ${assessments.length > 1 ? `<details class="fold">
        <summary>${assessments.length - 1} lượt đánh giá cũ hơn<span class="fsum">từ ${
          fmtDate(assessments[assessments.length - 1].at)}</span></summary>
        <div class="foldin"><div class="tl">${assessments.slice(1).map(assessRow).join("")}</div></div>
      </details>` : ""}
    </section>` : "";

  const doneF = flags.filter(f => f.status === "dong");
  /* Còn việc chưa xử lý thì mở sẵn; xong hết rồi thì gói lại một dòng */
  const flagBlock = !flags.length ? "" : openF.length ? `
    <section>
      <div class="card-h"><h2>Lưu ý của điều dưỡng trưởng</h2>
        <span class="hint">${openF.length} chưa xử lý</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">${openF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
      ${doneF.length ? `<section class="card" style="margin-top:10px;padding-top:2px">
        <details class="fold bare">
          <summary>Lưu ý đã đóng<span class="fsum">${doneF.length} mục</span></summary>
          <div class="foldin" style="display:flex;flex-direction:column;gap:10px">
            ${doneF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
        </details></section>` : ""}
    </section>` : `
    <section class="card">
      <details class="fold bare">
        <summary>Lưu ý của điều dưỡng trưởng<span class="fsum">đã xử lý xong ${doneF.length} mục</span></summary>
        <div class="foldin" style="display:flex;flex-direction:column;gap:10px">
          ${doneF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
      </details>
    </section>`;

  const epsBlock = eps.length > 1 ? `
    <details class="fold">
      <summary>Các đợt điều trị<span class="fsum">${eps.length} đợt</span></summary>
      <div class="foldin"><div class="tablewrap"><table><thead><tr><th>Đợt</th><th>Nhập khoa</th><th>Xuất khoa</th><th>Số ngày</th><th>Lượt đánh giá</th><th>Waterlow cao nhất</th></tr></thead><tbody>
        ${eps.map((e, i) => {
          const as = DB.assessmentsOf(e.id);
          const mx = as.length ? Math.max(...as.map(a => a.score)) : null;
          return `<tr><td>${eps.length - i}</td><td>${fmtDate(e.admittedAt)}</td>
            <td>${e.dischargedAt ? fmtDate(e.dischargedAt) : "<b>đang điều trị</b>"}</td>
            <td class="num">${daysBetween(e.admittedAt, e.dischargedAt || new Date()) + 1}</td>
            <td class="num">${as.length}</td><td class="num">${mx == null ? "—" : mx}</td></tr>`;
        }).join("")}
      </tbody></table></div></div>
    </details>` : "";


  const khacBlock = `
    <section class="card">
      <div class="card-h"><h2>Hành chính</h2></div>
      <div class="khac">
      </div>
    </section>`;


  /* ---------- Chia hồ sơ thành bốn thẻ ---------- */
  const soTT = curEp ? lesionsOfEpisode(curEp.id).filter(l => l.status !== "lanh").length : 0;
  const tabs = [
    { k: "tq",  t: "Tổng quan", cham: vcl.viec.length > 0 },
    { k: "tt",  t: "Tổn thương", num: soTT || null },
    { k: "xt",  t: "Xoay trở",  cham: !!(tiCur && (tiCur.toiLuc || tiCur.never)) },
    { k: "dt",  t: "Diễn tiến" }
  ];
  const noiDung = {
    tq: header + flagBlock + careBlock + editHistoryBlock(p),
    tt: khamDa + lesionsBlock + photoTl,
    xt: turnSec || `<div class="empty">Người bệnh đã xuất khoa, không còn theo dõi xoay trở.</div>`,
    dt: tl + epsBlock
  };
  /* Thẻ nào đang mở: lấy lại của lần trước nếu thẻ đó còn tồn tại */
  const dangMo = tabs.some(t => t.k === PTAB[p.id]) ? PTAB[p.id] : tabs[0].k;
  PTAB[p.id] = dangMo;

  const tabHtml = `
    <div class="ptabs" role="tablist">${tabs.map(t => `
      <button role="tab" data-ptab="${t.k}" aria-selected="${t.k === dangMo}">
        ${esc(t.t)}${t.cham ? `<span class="dot"></span>` : ""}${
          t.num ? `<span class="num">${t.num}</span>` : ""}</button>`).join("")}</div>
    ${tabs.map(t => `<div data-ppane="${t.k}"${t.k === dangMo ? "" : " hidden"}>${noiDung[t.k]}</div>`).join("")}`;

  return {
    title: p.name, sub: p.mrn,
    html: tabHtml,
    bind() {
      const ep3 = $("[data-editp]"); if (ep3) ep3.onclick = () => editPatientDialog(p);
      const vp = $("[data-voidp]"); if (vp) vp.onclick = () => voidPatientDialog(p);
      const hc = $("[data-hc]"); if (hc) hc.onclick = () => hanhChinhDialog(p, ep);
      const tb = $("[data-turn]"); if (tb) tb.onclick = () => turnDialog(p, ep);
      const tb2 = $("[data-turn2]"); if (tb2) tb2.onclick = () => turnDialog(p, ep);
      bindLesionActions(p.id);
      const ptd = $("[data-ptd]"); if (ptd) ptd.onclick = () => phieuTheoDoi(p, ep);
      /* Mỗi phiếu đánh giá đã ký có một phiếu theo dõi đóng băng của riêng nó */
      $$("[data-ptda]").forEach(b => b.onclick = () => {
        const a = DB.data.assessments.find(x => x.id === b.dataset.ptda);
        if (a) phieuTheoDoi(p, curEp, a);
      });
      /* Gói chăm sóc — chọn nhiều mục rồi lưu một lượt */
      if (ep && last) {
        const clvNow = mucGoiCuaPhieu(last);
        const pend = GOIPEND[ep.id] = GOIPEND[ep.id] || {};
        const daLuu = it => bundleCa(ep.id, clvNow).st.has(it);   // đang đánh dấu trong ca này
        $$("[data-goi]").forEach(b => b.onclick = () => {
          const it = b.dataset.goi;
          const moi = b.getAttribute("aria-pressed") !== "true";
          /* Bấm về đúng trạng thái đã lưu thì coi như không đổi gì */
          if (moi === daLuu(it)) delete pend[it]; else pend[it] = moi;
          render();
        });
        const all = $("[data-goiall]");
        if (all) all.onclick = () => {
          mucTinhChiSo(goiCuaPhieu(last)).forEach(it => { if (!daLuu(it)) pend[it] = true; });
          render();
        };
        const non = $("[data-goinone]");
        if (non) non.onclick = () => {
          goiCuaPhieu(last).forEach(it => { if (daLuu(it)) pend[it] = false; else delete pend[it]; });
          render();
        };
        const boC = $("[data-goibo]");
        if (boC) boC.onclick = () => { GOIPEND[ep.id] = {}; render(); };
        const lu = $("[data-goiluu]");
        if (lu) lu.onclick = () => {
          const n = luuGoi(p, ep, clvNow, pend);
          GOIPEND[ep.id] = {};
          if (n) toast(`Đã ghi ${n} mục vào hồ sơ`, "ok");
          render();
        };
        /* Lịch sử: nhớ ngăn kéo đang mở, và lọc theo ngày */
        const lsD = $("[data-goils]");
        if (lsD) lsD.ontoggle = () => { GOILSMO[ep.id] = lsD.open; };
        const lsK = $("#gls-ky");
        if (lsK) lsK.onchange = () => {
          GOILS[ep.id] = GOILS[ep.id] || {};
          GOILS[ep.id].ky = lsK.value;
          if (lsK.value !== "ngay") GOILS[ep.id].ngay = "";
          GOILSMO[ep.id] = true;
          render();
        };
        const lsN = $("#gls-ngay");
        if (lsN) lsN.onchange = () => {
          GOILS[ep.id] = GOILS[ep.id] || {};
          GOILS[ep.id].ngay = lsN.value;
          GOILSMO[ep.id] = true;
          render();
        };
      }
      const a = $("[data-assess]"); if (a) a.onclick = () => Nav.go("assess", { patientId: p.id, episodeId: ep.id });
      const f = $("[data-flag]"); if (f) f.onclick = () => flagDialog(p.id, ep.id);
      const d = $("[data-discharge]"); if (d) d.onclick = () => dischargeDialog(p, ep);
      const r = $("[data-readmit]"); if (r) r.onclick = () => readmitDialog(p);
      const e2 = $("[data-editep]"); if (e2) e2.onclick = () => editEpisodeDialog(ep);
      $$("[data-viewa]").forEach(b => b.onclick = () => showAssessment(b.dataset.viewa));
      bindFlagCards(); bindCharts(); hydratePhotos();
      /* Đổi thẻ — chỉ ẩn/hiện, không vẽ lại, nên không mất chỗ đang mở */
      $$("[data-ptab]").forEach(b => b.onclick = () => {
        PTAB[p.id] = b.dataset.ptab;
        $$("[data-ptab]").forEach(x => x.setAttribute("aria-selected", x === b));
        $$("[data-ppane]").forEach(pn => pn.hidden = pn.dataset.ppane !== b.dataset.ptab);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  };
}

function lesionView(l, isDevice) {
  return `<div class="lesion">
    <div class="lh"><span class="t">${esc(l.site)}${isDevice && l.device ? ` — ${esc(l.device)}` : ""}</span>
      <span class="pill neutral sm">Độ ${esc(l.stage)}</span></div>
    <div class="tagrow">
      <span class="tag ${l.poa ? "poa" : "hapi"}">${l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa"}</span>
      ${isDevice ? `<span class="tag">Do thiết bị y tế</span>` : ""}
      <span class="tag">Phát hiện ${fmtDate(l.foundAt)}</span>
      ${l.size ? `<span class="tag">${esc(l.size)}</span>` : ""}
    </div>
    ${l.note ? `<p style="font-size:13px;color:var(--ink-2)">${esc(l.note)}</p>` : ""}
    ${(l.photos || []).length ? `<div class="gal">${l.photos.map(ph =>
      `<figure data-lb="${ph.id}" data-cap="${esc(l.site + " · " + fmtDT(ph.at))}">
        <img data-photo="${ph.id}" alt="Ảnh ${esc(l.site)}">
        <figcaption>${fmtDate(ph.at)}</figcaption></figure>`).join("")}</div>` : ""}
  </div>`;
}

/* Dòng thời gian ảnh theo vị trí — dùng để so sánh tiến triển */
function photoTimeline(pid, ep) {
  if (!ep) return "";
  const all = DB.assessmentsOf(ep.id).slice().reverse();
  const bySite = {};
  all.forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => {
      (l.photos || []).forEach(ph => {
        (bySite[l.site] = bySite[l.site] || []).push({ ...ph, stage: l.stage, site: l.site });
      });
    });
  });
  const sites = Object.keys(bySite).filter(s => bySite[s].length);
  if (!sites.length) return "";
  const nAnh = sites.reduce((n, s) => n + bySite[s].length, 0);
  return `
    <details class="fold">
      <summary>So sánh tiến triển bằng hình ảnh<span class="fsum">${sites.length} vị trí · ${nAnh} ảnh</span></summary>
      <div class="foldin">
    ${sites.map(s => `<div style="margin-bottom:14px">
      <div class="eyebrow" style="margin-bottom:6px">${esc(s)}</div>
      <div class="gal">${bySite[s].map(ph => `<figure data-lb="${ph.id}" data-cap="${esc(s + " · độ " + ph.stage + " · " + fmtDT(ph.at))}">
        <img data-photo="${ph.id}" alt="Ảnh ${esc(s)} ngày ${fmtDate(ph.at)}">
        <figcaption>${fmtDate(ph.at)} · độ ${esc(ph.stage)}</figcaption></figure>`).join("")}</div>
    </div>`).join("")}
      </div>
    </details>`;
}

async function hydratePhotos(root) {
  const imgs = $$("img[data-photo]", root);
  for (const im of imgs) {
    if (im.dataset.loaded) continue;
    const d = await Photos.get(im.dataset.photo);
    if (d) { im.src = d; im.dataset.loaded = "1"; }
    else { im.replaceWith(Object.assign(document.createElement("div"),
      { className: "empty", style: "font-size:11px;padding:8px;height:100%;display:grid;place-items:center", textContent: "Ảnh không có trên máy này" })); }
  }
  $$("[data-lb]", root).forEach(fg => fg.onclick = async () => {
    const d = await Photos.get(fg.dataset.lb);
    if (d) lightbox(d, fg.dataset.cap); else toast("Ảnh chưa được tải về máy này", "err");
  });
}

/* --- Nhập / xuất viện --- */
function dischargeDialog(p, ep) {
  modal({
    title: "Kết thúc đợt điều trị",
    body: `<p style="font-size:14px;line-height:1.55">Xác nhận <b>${esc(p.name)}</b> ra khỏi khoa.
        Hồ sơ vẫn được lưu; khi người bệnh nhập lại chỉ cần tìm theo tên và ngày sinh rồi bấm “Nhập viện lại”.</p>
      <div class="field"><label for="dc-type">Hình thức kết thúc</label>
        <select id="dc-type">${KETTHUC.map(t => `<option>${t}</option>`).join("")}</select></div>
      <div class="field"><label for="dc-note">Ghi chú bàn giao (tình trạng da khi rời khoa)</label>
        <textarea id="dc-note" placeholder="vd: Vùng cùng cụt còn hồng ban độ I, đã bàn giao khoa Nội."></textarea></div>`,
    actions: [{ label: "Huỷ" }, { label: "Xác nhận xuất khoa", kind: "pri", onClick: (b) => {
      ep.dischargedAt = new Date().toISOString();
      ep.dischargeType = $("#dc-type", b).value;
      ep.dischargeNote = $("#dc-note", b).value.trim();
      ep.dischargedBy = Session.user.id;
      touch(ep);
      DB.data.flags.filter(f => f.episodeId === ep.id && f.status !== "dong").forEach(f => {
        f.status = "dong";
        f.events.push({ by: Session.user.id, at: new Date().toISOString(), type: "dong", text: "Đóng tự động do người bệnh xuất khoa" });
      });
      DB.log("xuat-khoa", `${p.name} (${p.mrn}) — ${ep.dischargeType}`, "episode", ep.id);
      DB.save(); toast("Đã kết thúc đợt điều trị", "ok");
    }}]
  });
}
function readmitDialog(p) {
  modal({
    title: "Nhập viện lại",
    body: `<p style="font-size:14px;line-height:1.55">Mở đợt điều trị mới cho <b>${esc(p.name)}</b> (${esc(p.mrn)}).
        Toàn bộ hồ sơ và ảnh các đợt trước vẫn được giữ để so sánh.</p>

function editEpisodeDialog(ep) {

      <div class="field"><label for="ee-dx">Chẩn đoán chính</label><input id="ee-dx" type="text" value="${esc(ep.diagnosis || "")}"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Lưu", kind: "pri", onClick: (b) => {

/* --- Xem lại một phiếu đánh giá đã ký --- */
function showAssessment(aid) {
  const a = DB.data.assessments.find(x => x.id === aid);
  if (!a) return;
  const lv = a.level != null ? a.level : levelOf(a.score);
  const rows = WATERLOW.map(b => {
    const s = a.answers[b.key];
    let txt = "—";
    if (b.multi) txt = (s || []).map(i => b.opts[i]?.t).filter(Boolean).join("; ") || "không chọn";
    else if (s != null && b.opts[s]) txt = b.opts[s].t;
    return `<tr><td>${esc(b.title)}</td><td>${esc(txt)}</td><td class="num">${a.detail[b.key] || 0}</td></tr>`;
  }).join("");
  const mstTxt = (() => {
    const m = a.answers.mst || {};
    const ds = ["a", "b", "c"]
      .map(k => (typeof m[k] === "number" && MST[k].opts[m[k]]) ? MST[k].opts[m[k]].t : null)
      .filter(Boolean);
    if (ds.length) return ds.join("; ");
    /* Phiếu cũ trước bản 1.6 ghi theo kiểu khác — hiện lại cho đọc được */
    if (m.a != null || m.b != null || m.c != null) return "ghi theo bản cũ của phần mềm";
    return "—";
  })();
  modal({
    title: "Phiếu đánh giá đã ký", wide: true,
    body: `<div class="result ${levelClass(lv)}">
        <span class="big">${a.score}</span><span class="lvl">${esc(LEVELS[lv].name)}</span>
        <span class="sub">${fmtDT(a.at)} · ${esc(DB.userName(a.userId))}</span></div>
      <div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Mục</th><th>Lựa chọn</th><th>Điểm</th></tr></thead>
        <tbody>${rows}<tr><td>Yếu tố dinh dưỡng</td><td>${esc(mstTxt)}</td><td class="num">${a.detail.mst || 0}</td></tr>
        <tr style="font-weight:700"><td colspan="2">Tổng điểm Waterlow</td><td class="num">${a.score}</td></tr></tbody></table></div>
      ${(a.nhomBenh || []).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Nhóm người bệnh đặc thù</div>
        <div class="tagrow">${a.nhomBenh.map(k => `<span class="tag">${esc(nhomBenhTen(k))}</span>`).join("")}</div></div>` : ""}
      ${(a.icu || []).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Yếu tố nguy cơ đặc thù hồi sức</div>
        <div class="tagrow">${a.icu.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>` : ""}
      ${(a.lesions || []).length || (a.mdrpi || []).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Tổn thương ghi nhận</div>
        ${(a.lesions || []).map(l => lesionView(l)).join("")}${(a.mdrpi || []).map(l => lesionView(l, true)).join("")}</div>`
        : `<div class="notice"><svg><use href="#i-check"/></svg><span>Không ghi nhận tổn thương do tì đè tại thời điểm đánh giá.</span></div>`}
      ${a.note ? `<div><div class="eyebrow" style="margin-bottom:4px">Ghi chú</div><p style="font-size:14px;line-height:1.5">${esc(a.note)}</p></div>` : ""}
      <div class="notice"><svg><use href="#i-shield"/></svg><span>Phiếu đã ký bởi <b>${esc(DB.userName(a.userId))}</b> lúc ${fmtDT(a.at)} và không thể chỉnh sửa. Mọi thay đổi phải thực hiện bằng một lượt đánh giá mới.</span></div>`,
    actions: [{ label: "Đóng" }]
  });
  setTimeout(() => hydratePhotos($(".modal")), 60);
}
</script>
<script>
/* ============================================================
   PHIẾU ĐÁNH GIÁ LOÉT TÌ ĐÈ — 4 BƯỚC
   ============================================================ */
let AS = null;
const STEP_TITLES = ["Thang điểm Waterlow", "Yếu tố nguy cơ hồi sức", "Khám da và tổn thương", "Kết quả và gói chăm sóc"];

function initAssess(patientId, episodeId) {
  const p = DB.patient(patientId);
  const prev = DB.lastAssessment(episodeId);
  const ans = {};
  WATERLOW.forEach(b => { ans[b.key] = b.multi ? [] : null; });
  ans.mst = {};
  // Gợi ý sẵn từ hồ sơ và lần đánh giá trước
  if (p) {
    ans.sex = p.sex === "nu" ? 1 : 0;
    const ab = ageBandIndex(ageFrom(p.dob));
    if (ab != null) ans.age = ab;
  }
  if (prev) {
    // Chép lại các mục ít thay đổi để điều dưỡng chỉ cần soát lại
    ["build", "tissue", "neuro", "med"].forEach(k => {
      ans[k] = Array.isArray(prev.answers[k]) ? prev.answers[k].slice() : prev.answers[k];
    });
    /* Phiếu cũ (trước bản 1.6) ghi phần dinh dưỡng theo kiểu khác — chỉ chép
       sang những giá trị còn hợp lệ, tránh hiện tick sẵn sai. */
    const cu = prev.answers.mst || {};
    ans.mst = {};
    ["a", "b", "c"].forEach(k => {
      const v = cu[k];
      if (typeof v === "number" && MST[k].opts[v]) ans.mst[k] = v;
    });
  }
  AS = {
    patientId, episodeId, step: 0, ans,
    icu: prev ? (prev.icu || []).slice() : [],
    noLesion: true, lesions: [], mdrpi: [],
    bundle: [], note: "", carriedFrom: prev ? prev.id : null,
    chung: { nhiet: 0, mo: 0, camgiac: 0 },
    nhomBenh: ((DB.episode && DB.episode(episodeId)) || {}).nhomBenh || (prev ? (prev.nhomBenh || []).slice() : [])
  };
  /* Tổn thương đang theo dõi được mang sang để ghi tiếp.
     Lấy từ DANH SÁCH TỔN THƯƠNG CỦA ĐỢT ĐIỀU TRỊ, không phải từ phiếu đánh giá
     lần trước — vì tổn thương còn được ghi qua phiếu khám da và qua nút "Ghi
     nhận tổn thương mới", những đường đó không đi qua phiếu đánh giá nào cả. */
  const dangTheoDoi = lesionsOfEpisode(episodeId).filter(l => l.status !== "lanh");
  const mang = l => ({
    k: kdMa(l.site), site: l.site, stage: l.stage || "", sau: 0, poa: !!l.poa,
    size: l.size || "", note: l.note || "", photos: [],
    foundAt: l.foundAt, device: l.device || null, ghi: true, carried: true
  });
  AS.lesions = dangTheoDoi.filter(l => !l.isDevice).map(mang);
  AS.mdrpi   = dangTheoDoi.filter(l => l.isDevice).map(mang);
  AS.noLesion = AS.lesions.length === 0;
}

function viewAssess({ patientId, episodeId }) {
  if (!AS || AS.episodeId !== episodeId) initAssess(patientId, episodeId);
  const p = DB.patient(patientId);
  const ep = DB.episode(episodeId);
  if (!p || !ep) return { title: "Lỗi", html: `<div class="empty">Không tìm thấy đợt điều trị.</div>` };

  const body = [stepWaterlow, stepICU, stepSkin, stepResult][AS.step]();
  const html = `
    <div class="steps">${[0, 1, 2, 3].map(i =>
      `<span class="s ${i === AS.step ? "on" : i < AS.step ? "done" : ""}"></span>`).join("")}</div>
    <div class="stepinfo"><h2>${esc(STEP_TITLES[AS.step])}</h2><span class="of mono">Bước ${AS.step + 1}/4</span></div>
    <div id="stepbody">${body}</div>
    ${stickyBar()}`;

  return {
    title: p.name, sub: "Đánh giá · giường " + (ep.bed || "—"), html,
    bind() {
      bindStep();
      $("#as-next").onclick = nextStep;
      const pv = $("#as-prev"); if (pv) pv.onclick = () => { AS.step--; render(); lenDau(); };
      recalcAssess();
    }
  };
}

function stickyBar() {
  const last = AS.step === 3;
  return `<div class="stickybar">
    <div class="live"><span class="l">Tổng điểm Waterlow</span>
      <span class="v" id="live-score">0</span></div>
    <span id="live-pill"></span>
    ${AS.step > 0 ? `<button class="btn sm" id="as-prev">Quay lại</button>` : ""}
    <button class="btn pri" id="as-next">${last ? "Hoàn tất và ký" : "Tiếp tục"}</button>
  </div>`;
}

function recalcAssess() {
  if (!AS) return;
  const r = scoreWaterlow(AS.ans);
  const lv = levelOf(r.total);
  const s = $("#live-score"); if (s) s.textContent = r.total;
  const pl = $("#live-pill"); if (pl) pl.innerHTML = levelPill(lv, " sm");
  WATERLOW.forEach(b => {
    const el = $(`[data-pts="${b.key}"]`);
    if (el) { el.textContent = "+" + (r.detail[b.key] || 0); el.classList.toggle("on", (r.detail[b.key] || 0) > 0); }
  });
  const m = $('[data-pts="mst"]');
  if (m) { m.textContent = "+" + r.mst; m.classList.toggle("on", r.mst > 0); }
  const warn = $("#mst-warn");
  if (warn) warn.hidden = r.mst < 2;
  return r;
}

/* ---------- Bước 1: Waterlow ---------- */
function stepWaterlow() {
  const p = DB.patient(AS.patientId);
  const carried = AS.carriedFrom ? `<div class="notice"><svg><use href="#i-info"/></svg>
    <span>Một số mục ít thay đổi đã được điền sẵn từ lần đánh giá trước. <b>Vui lòng soát lại toàn bộ</b> trước khi ký.</span></div>` : "";
  const groups = { "": [], "Nguy cơ đặc biệt": [] };
  WATERLOW.forEach((b, i) => groups[b.group || ""].push({ b, i }));
  const renderBlock = ({ b, i }) => `
    <div class="qblock">
      <div class="qhead"><span class="qnum">${i + 1}</span><span class="t">${esc(b.title)}</span>
        <span class="pts" data-pts="${b.key}">+0</span></div>
      ${b.hint ? `<p class="qnote" style="padding-top:8px;font-size:12.5px;color:var(--ink-3);margin:0">${esc(b.hint)}</p>` : ""}
      <div class="qopts">${b.opts.map((o, j) => optHTML(b, j, o)).join("")}</div>
    </div>`;
  return carried + `
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:4px">
      ${esc(p.name)} · ${ageFrom(p.dob) != null ? ageFrom(p.dob) + " tuổi" : ""} · Chạm vào ô đúng với tình trạng người bệnh.</p>
    ${groups[""].map(renderBlock).join("")}
    ${mstBlock()}
    <div class="eyebrow" style="margin:18px 0 8px">Nguy cơ đặc biệt</div>
    ${groups["Nguy cơ đặc biệt"].map(renderBlock).join("")}`;
}
function optHTML(b, j, o) {
  const sel = AS.ans[b.key];
  const on = b.multi ? (sel || []).includes(j) : sel === j;
  return `<button class="opt ${b.multi ? "multi" : ""}" type="button" aria-pressed="${on}"
    data-opt="${b.key}" data-i="${j}" data-multi="${b.multi ? 1 : 0}" data-excl="${o.excl ? 1 : 0}">
    <span class="mark"><svg><use href="#i-check"/></svg></span>
    <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`;
}
function mstBlock() {
  const m = AS.ans.mst || {};
  /* Thang Waterlow tính BMI ở HAI chỗ: câu Thể trạng, và trong phần dinh dưỡng.
     Câu Thể trạng đã trả lời từ 20 trở lên thì phần dinh dưỡng chắc chắn là
     "Trên 20" — app tự điền, khỏi hỏi lại. Dưới 20 thì vẫn phải chọn tay vì
     phải biết có dưới 18,5 hay không. */
  const tt = AS.ans.build;            // 0 TB · 1 trên TB · 2 béo phì · 3 dưới TB
  const tuBiet = tt != null && tt !== 3;
  if (tuBiet && m.b !== 0) { m.b = 0; AS.ans.mst = m; }
  const cau = (k, q) => `
    <div style="padding:8px 13px 0"><div class="eyebrow">${esc(q)}</div></div>
    <div class="qopts">${MST[k].opts.map((o, j) =>
      `<button class="opt" type="button" aria-pressed="${m[k] === j}" data-mst="${k}" data-i="${j}">
        <span class="mark"><svg><use href="#i-check"/></svg></span>
        <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`).join("")}</div>`;
  return `<div class="qblock">
    <div class="qhead"><span class="qnum">DD</span><span class="t">${esc(MST.nhan)}</span>
      <span class="pts" data-pts="mst">+0</span></div>
    <p class="qnote" style="padding-top:8px;font-size:12.5px;color:var(--ink-3);margin:0">
      Theo đúng bảng Waterlow điều chỉnh khoa đang dùng. Ba mục độc lập, mỗi mục chọn một dòng.</p>
    ${cau("a", MST.a.q)}
    ${tuBiet
      ? `<div style="padding:8px 13px 0"><div class="eyebrow">${esc(MST.b.q)}</div></div>
         <div class="qnote" style="padding-top:5px"><div class="notice"><svg><use href="#i-check"/></svg>
           <span>Đã có ở câu <b>Thể trạng</b> phía trên — BMI từ 20 trở lên nên mục này
           tự tính <b>+0</b>. Thang Waterlow tính BMI ở hai chỗ, app chỉ hỏi bạn một lần.</span></div></div>`
      : cau("b", MST.b.q)}
    ${cau("c", MST.c.q)}
    <div class="qnote" id="mst-warn" hidden><div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Điểm dinh dưỡng từ 2 trở lên — cần hội chẩn dinh dưỡng cho người bệnh.</span></div></div>
  </div>`;
}
