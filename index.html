<!doctype html><html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7a76">
<meta name="description" content="Hệ thống đánh giá nguy cơ loét tì đè theo thang Waterlow và theo dõi chăm sóc cho khoa Hồi sức tích cực">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loét tì đè">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;min-height:100dvh}
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Phòng ngừa Loét tì đè</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   HỆ THỐNG ĐÁNH GIÁ & THEO DÕI LOÉT TÌ ĐÈ — Khoa Hồi sức tích cực
   Bảng màu đã kiểm định mù màu (deutan/protan/tritan) & tương phản.
   ============================================================ */
:root{
  --ink:#0f1e21; --ink-2:#3d5155; --ink-3:#6b8084;
  --bg:#f2f6f5; --card:#ffffff; --card-2:#f7faf9;
  --line:#dbe5e3; --line-2:#c6d4d2;
  --accent:#0d7a76; --accent-ink:#ffffff; --accent-soft:#e2f0ef; --accent-2:#0a5f5c;
  --focus:#0d7a76;
  /* Mức nguy cơ — dùng cho pill, luôn kèm chữ */
  --r0:#1a8f5a; --r0-bg:#e4f4ec; --r0-ink:#0c5c39;
  --r1:#d4a017; --r1-bg:#fbf1d9; --r1-ink:#73560a;
  --r2:#e2590f; --r2-bg:#fdeae0; --r2-ink:#8a3408;
  --r3:#ad2040; --r3-bg:#fce8ec; --r3-ink:#7a1630;
  /* Thang thứ bậc một sắc — dùng cho biểu đồ (đã kiểm định) */
  --ord1:#e0a15c; --ord2:#cc7a2c; --ord3:#a85720; --ord4:#7a3517;
  /* Chuỗi 2 nhóm (loét có sẵn / mới phát sinh) */
  --s1:#2a78d6; --s2:#eb6834;
  --grid:#e4ebea; --axis:#c6d4d2; --muted:#7d9296;
  --good:#1a8f5a; --warn:#d4a017; --bad:#ad2040;
  --shadow:0 1px 2px rgba(15,30,33,.05), 0 8px 24px -12px rgba(15,30,33,.14);
  --shadow-lg:0 2px 4px rgba(15,30,33,.06), 0 24px 48px -20px rgba(15,30,33,.24);
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#e6eeed; --ink-2:#a9bcbe; --ink-3:#83989c;
  --bg:#0f1516; --card:#1b2426; --card-2:#202b2d;
  --line:#2b3739; --line-2:#3a494b;
  --accent:#2aa39d; --accent-ink:#07211f; --accent-soft:#12302f; --accent-2:#3fbdb6;
  --focus:#2aa39d;
  --r0:#33b077; --r0-bg:#11301f; --r0-ink:#7fd7a9;
  --r1:#e0b42f; --r1-bg:#2e2608; --r1-ink:#efd27a;
  --r2:#f2742e; --r2-bg:#331a0b; --r2-ink:#f7ab7c;
  --r3:#dc4a68; --r3-bg:#33131c; --r3-ink:#f096a6;
  --ord1:#8a4f1c; --ord2:#b06a26; --ord3:#d18a3f; --ord4:#eeb272;
  --s1:#3987e5; --s2:#d95926;
  --grid:#273335; --axis:#3a494b; --muted:#83989c;
  --good:#33b077; --warn:#e0b42f; --bad:#dc4a68;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ink:#e6eeed; --ink-2:#a9bcbe; --ink-3:#83989c;
  --bg:#0f1516; --card:#1b2426; --card-2:#202b2d;
  --line:#2b3739; --line-2:#3a494b;
  --accent:#2aa39d; --accent-ink:#07211f; --accent-soft:#12302f; --accent-2:#3fbdb6;
  --focus:#2aa39d;
  --r0:#33b077; --r0-bg:#11301f; --r0-ink:#7fd7a9;
  --r1:#e0b42f; --r1-bg:#2e2608; --r1-ink:#efd27a;
  --r2:#f2742e; --r2-bg:#331a0b; --r2-ink:#f7ab7c;
  --r3:#dc4a68; --r3-bg:#33131c; --r3-ink:#f096a6;
  --ord1:#8a4f1c; --ord2:#b06a26; --ord3:#d18a3f; --ord4:#eeb272;
  --s1:#3987e5; --s2:#d95926;
  --grid:#273335; --axis:#3a494b; --muted:#83989c;
  --good:#33b077; --warn:#e0b42f; --bad:#dc4a68;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.011em}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- Khung ứng dụng ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.shell{display:flex;min-height:100%;flex:1}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.topbar h1{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:block;letter-spacing:.02em}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--card);border-radius:10px;color:var(--ink-2);flex:none}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.iconbtn svg{width:19px;height:19px;flex:none}
.content{flex:1;padding:16px 16px 92px;width:100%;max-width:1280px;margin:0 auto}
.page{display:flex;flex-direction:column;gap:16px}

/* ---------- Thanh điều hướng dưới (điện thoại) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  /* Lớp vẽ riêng: tránh lỗi thanh trôi theo trang trên Safari iPhone */
  transform:translateZ(0);-webkit-transform:translateZ(0)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar svg{width:22px;height:22px}
.tabbar .dot{position:absolute;top:5px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;
  font-family:var(--mono)}

/* ---------- Thẻ ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h2{font-size:14px;letter-spacing:.01em}
.card-h .hint{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:400}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.divider{height:1px;background:var(--line);border:0;margin:14px 0}

/* ---------- Ô số liệu ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;
  display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.tile .lab{font-size:11.5px;color:var(--ink-3);font-weight:500;line-height:1.3}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .note{font-size:11.5px;color:var(--ink-3)}
.tile.tap{cursor:pointer}
.tile.tap:hover{border-color:var(--line-2)}
.tile.alert .val{color:var(--bad)}
.tile.warnT .val{color:var(--r2-ink)}

/* ---------- Nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  padding:10px 15px;font-weight:500;font-size:14px;min-height:42px;transition:.12s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Biểu mẫu ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .help{font-size:11.5px;color:var(--ink-3)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);
  min-height:42px;font-size:15px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* ---------- Lựa chọn dạng ô bấm (Waterlow) ---------- */
.qblock{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.qblock+.qblock{margin-top:10px}
.qhead{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--card-2);border-bottom:1px solid var(--line)}
.qnum{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none;font-family:var(--mono)}
.qhead .t{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.qhead .pts{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);
  background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px 7px;flex:none}
.qhead .pts.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.qopts{display:flex;flex-direction:column;padding:5px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 9px;border-radius:9px;border:1px solid transparent;
  background:none;text-align:left;width:100%;min-height:44px;transition:.1s}
.opt:hover{background:var(--card-2)}
.opt .mark{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line-2);flex:none;
  display:grid;place-items:center;transition:.12s}
.opt.multi .mark{border-radius:6px}
.opt .mark svg{width:12px;height:12px;opacity:0;color:#fff}
.opt .txt{flex:1;min-width:0;font-size:14px;line-height:1.35}
.opt .p{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);flex:none;
  min-width:26px;text-align:right}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.opt[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .mark svg{opacity:1}
.opt[aria-pressed="true"] .p{color:var(--accent)}
.qnote{padding:0 13px 12px}

/* ---------- Pill mức nguy cơ ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;
  font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill .bullet{width:8px;height:8px;border-radius:50%;flex:none}
.pill.r0{background:var(--r0-bg);color:var(--r0-ink);border-color:color-mix(in srgb,var(--r0) 34%,transparent)}
.pill.r0 .bullet{background:var(--r0)}
.pill.r1{background:var(--r1-bg);color:var(--r1-ink);border-color:color-mix(in srgb,var(--r1) 38%,transparent)}
.pill.r1 .bullet{background:var(--r1)}
.pill.r2{background:var(--r2-bg);color:var(--r2-ink);border-color:color-mix(in srgb,var(--r2) 38%,transparent)}
.pill.r2 .bullet{background:var(--r2)}
.pill.r3{background:var(--r3-bg);color:var(--r3-ink);border-color:color-mix(in srgb,var(--r3) 38%,transparent)}
.pill.r3 .bullet{background:var(--r3)}
.pill.neutral{background:var(--card-2);color:var(--ink-2);border-color:var(--line)}
.pill.sm{font-size:11px;padding:2px 8px 2px 7px}

/* ---------- Danh sách người bệnh ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;text-align:left;width:100%;transition:.12s}
.prow:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.prow .stripe{width:4px;flex:none;background:var(--line-2)}
.prow.r0 .stripe{background:var(--r0)} .prow.r1 .stripe{background:var(--r1)}
.prow.r2 .stripe{background:var(--r2)} .prow.r3 .stripe{background:var(--r3)}
.prow .body{flex:1;min-width:0;padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.prow .n{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .m{font-size:12px;color:var(--ink-3);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.prow .m .sep{opacity:.4}
.prow .right{padding:11px 13px 11px 6px;display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;gap:5px;flex:none}
.prow .score{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
.prow .scorelab{font-size:10px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}

/* ---------- Chuỗi cần quan tâm ---------- */
.flag{border:1px solid var(--line);border-left:4px solid var(--r2);border-radius:var(--r-md);
  background:var(--card);overflow:hidden}
.flag.done{border-left-color:var(--r0);opacity:.94}
.flag.auto{border-left-style:dashed}
.flag .fh{padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.flag .ftop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flag .fname{font-weight:600;font-size:14.5px}
.flag .ftext{font-size:14px;color:var(--ink);line-height:1.45}
.chain{border-top:1px solid var(--line);background:var(--card-2);padding:10px 13px;
  display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:10px;position:relative;padding-bottom:12px}
.step:last-child{padding-bottom:0}
.step .col{display:flex;flex-direction:column;align-items:center;flex:none;width:18px}
.step .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);margin-top:4px;flex:none;
  border:2px solid var(--card-2);box-shadow:0 0 0 1.5px var(--accent)}
.step .line{flex:1;width:1.5px;background:var(--line-2);margin:3px 0 -3px}
.step:last-child .line{display:none}
.step .txt{flex:1;min-width:0;font-size:13px;line-height:1.45;padding-bottom:2px}
.step .who{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);display:block;margin-top:2px}
.step.pending .dot{background:var(--card);box-shadow:0 0 0 1.5px var(--line-2)}
.step.pending .txt{color:var(--ink-3)}

/* ---------- Timeline đánh giá ---------- */
.tl{display:flex;flex-direction:column}
.tlrow{display:flex;gap:11px;padding-bottom:14px;position:relative}
.tlrow:last-child{padding-bottom:0}
.tlrow .tcol{width:34px;flex:none;display:flex;flex-direction:column;align-items:center}
.tlrow .tscore{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:14px;flex:none;border:1.5px solid}
.tlrow.r0 .tscore{background:var(--r0-bg);color:var(--r0-ink);border-color:color-mix(in srgb,var(--r0) 40%,transparent)}
.tlrow.r1 .tscore{background:var(--r1-bg);color:var(--r1-ink);border-color:color-mix(in srgb,var(--r1) 45%,transparent)}
.tlrow.r2 .tscore{background:var(--r2-bg);color:var(--r2-ink);border-color:color-mix(in srgb,var(--r2) 45%,transparent)}
.tlrow.r3 .tscore{background:var(--r3-bg);color:var(--r3-ink);border-color:color-mix(in srgb,var(--r3) 45%,transparent)}
.tlrow .tline{flex:1;width:1.5px;background:var(--line);margin:4px 0 -10px}
.tlrow:last-child .tline{display:none}
.tlrow .tbody{flex:1;min-width:0;padding-top:3px}
.tlrow .tmeta{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.tlrow .tnote{font-size:13.5px;margin-top:3px;line-height:1.45}

/* ---------- Ảnh tổn thương ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:var(--card-2);aspect-ratio:1;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-family:var(--mono)}
.gal .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;border:0;
  background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.photoadd{border:1.5px dashed var(--line-2);border-radius:10px;aspect-ratio:1;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--card-2);
  color:var(--ink-3);font-size:11px;text-align:center;padding:6px}
.photoadd svg{width:22px;height:22px}

/* ---------- Tổn thương ---------- */
.lesion{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--card-2);
  display:flex;flex-direction:column;gap:10px}
.lesion+.lesion{margin-top:10px}
.lesion .lh{display:flex;align-items:center;gap:8px}
.lesion .lh .t{font-weight:600;font-size:14px;flex:1}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  color:var(--ink-2);white-space:nowrap}
.tag.poa{background:color-mix(in srgb,var(--s1) 14%,var(--card));border-color:color-mix(in srgb,var(--s1) 40%,transparent);color:var(--s1)}
.tag.hapi{background:color-mix(in srgb,var(--s2) 14%,var(--card));border-color:color-mix(in srgb,var(--s2) 40%,transparent);color:var(--s2)}

/* ---------- Bảng ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- Biểu đồ ---------- */
.chart{width:100%;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .vlab{font-family:var(--mono);font-size:11px;fill:var(--ink-2);font-weight:500}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.hoverbox{position:fixed;z-index:200;pointer-events:none;background:var(--card);border:1px solid var(--line-2);
  border-radius:9px;padding:7px 10px;box-shadow:var(--shadow-lg);font-size:12.5px;max-width:230px}
.hoverbox b{font-family:var(--mono)}

/* ---------- Hộp thoại ---------- */
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(10,20,22,.5);padding:0;backdrop-filter:blur(2px)}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet .sh h3{font-size:16px;flex:1}
.sheet .sb{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:9px}
.sheet .sf .btn{flex:1}
@media(min-width:640px){.modal{align-items:center;padding:20px}.sheet{border-radius:20px}}
.lightbox{position:fixed;inset:0;z-index:400;background:rgba(6,12,13,.94);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.lightbox img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:10px}
.lightbox .cap{color:#e6eeed;font-family:var(--mono);font-size:12.5px;text-align:center}

/* ---------- Thông báo nhanh ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));
  z-index:500;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:11px;padding:11px 14px;font-size:13.5px;
  box-shadow:var(--shadow-lg);animation:tin .2s ease-out}
.toast.err{background:var(--bad);color:#fff}
.toast.ok{background:var(--accent);color:var(--accent-ink)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Trống & ghi chú ---------- */
.empty{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:13.5px;
  border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--card-2)}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-md);font-size:13px;line-height:1.45;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);color:var(--ink)}
.notice svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--accent)}
.notice.warn{background:var(--r1-bg);border-color:color-mix(in srgb,var(--r1) 38%,transparent)}
.notice.warn svg{color:var(--r1-ink)}
.notice.bad{background:var(--r3-bg);border-color:color-mix(in srgb,var(--r3) 38%,transparent)}
.notice.bad svg{color:var(--r3-ink)}

/* ---------- Đăng nhập ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:
    radial-gradient(1000px 420px at 50% -8%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 70%),
    var(--bg)}
.loginbox{width:100%;max-width:392px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.brand .glyph{width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:var(--shadow)}
.brand .glyph svg{width:29px;height:29px}
.brand h1{font-size:20px;letter-spacing:-.02em}
.brand p{font-size:13px;color:var(--ink-3)}
.loginbox form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow)}
.hintbox{font-size:12px;color:var(--ink-3);text-align:center;line-height:1.55}
.hintbox code{font-family:var(--mono);background:var(--card);border:1px solid var(--line);
  padding:1px 5px;border-radius:5px;font-size:11.5px;color:var(--ink-2)}

/* ---------- Các bước của form đánh giá ---------- */
.steps{display:flex;gap:6px;margin-bottom:4px}
.steps .s{flex:1;height:3.5px;border-radius:2px;background:var(--line)}
.steps .s.on{background:var(--accent)}
.steps .s.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.stepinfo{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.stepinfo h2{font-size:17px}
.stepinfo .of{font-size:12px;color:var(--ink-3);font-family:var(--mono);margin-left:auto}
.stickybar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:30;
  background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:9px;display:flex;gap:8px;align-items:center;
  box-shadow:var(--shadow);margin-top:4px}
.stickybar .live{flex:1;min-width:0;padding-left:5px}
.stickybar .live .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stickybar .live .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.1}

/* ---------- Kết quả ---------- */
.result{border-radius:var(--r-lg);padding:18px;border:1px solid;display:flex;flex-direction:column;gap:5px}
.result.r0{background:var(--r0-bg);border-color:color-mix(in srgb,var(--r0) 40%,transparent);color:var(--r0-ink)}
.result.r1{background:var(--r1-bg);border-color:color-mix(in srgb,var(--r1) 45%,transparent);color:var(--r1-ink)}
.result.r2{background:var(--r2-bg);border-color:color-mix(in srgb,var(--r2) 45%,transparent);color:var(--r2-ink)}
.result.r3{background:var(--r3-bg);border-color:color-mix(in srgb,var(--r3) 45%,transparent);color:var(--r3-ink)}
.result .big{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.result .lvl{font-size:17px;font-weight:600}
.result .sub{font-size:13px;opacity:.86}
.bundle{display:flex;flex-direction:column;gap:2px}
.bitem{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:10px;
  border:1px solid transparent;background:none;text-align:left;width:100%;min-height:44px}
.bitem:hover{background:var(--card-2)}
.bitem .box{width:21px;height:21px;border-radius:6px;border:1.8px solid var(--line-2);flex:none;
  display:grid;place-items:center;margin-top:1px}
.bitem .box svg{width:13px;height:13px;opacity:0;color:#fff}
.bitem[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.bitem[aria-pressed="true"] .box svg{opacity:1}
.bitem .bt{flex:1;min-width:0;font-size:14px;line-height:1.42}
.bitem[aria-pressed="true"] .bt{color:var(--ink-2)}

/* ---------- Máy tính: thanh bên ---------- */
@media(min-width:900px){
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;width:232px;flex:none;border-right:1px solid var(--line);
    background:var(--card);position:sticky;top:0;height:100vh;padding:16px 12px;gap:3px;overflow-y:auto}
  .rail .rbrand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .rail .rbrand .glyph{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;flex:none}
  .rail .rbrand .glyph svg{width:19px;height:19px}
  .rail .rbrand .t{font-size:13.5px;font-weight:600;line-height:1.25}
  .rail .rbrand .t span{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
  .rail button.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;
    background:none;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left;position:relative}
  .rail button.nav:hover{background:var(--card-2);color:var(--ink)}
  .rail button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .rail button.nav svg{width:19px;height:19px;flex:none}
  .rail button.nav .dot{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
  .rail .rfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
  .content{padding:22px 26px 40px}
  .topbar{padding:12px 26px}
  .toasts{bottom:24px;right:24px;left:auto;transform:none}
  .stickybar{bottom:16px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
}
@media(min-width:1180px){
  .split{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
}

/* ============================================================
   BẢN THỬ — xoay trở, liền thương, giao ban
   ============================================================ */
.thubanner{position:sticky;top:0;z-index:40;background:var(--r1-bg);color:var(--r1-ink);
  border-bottom:1px solid var(--r1);padding:7px 14px;font-size:12.5px;font-weight:600;
  text-align:center;line-height:1.4}
.thubanner b{font-weight:700}

.bigtap{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:15px 16px;border-radius:var(--r-md);border:0;background:var(--accent);color:var(--accent-ink);
  font-size:15.5px;font-weight:600;box-shadow:var(--shadow)}
.bigtap:hover{background:var(--accent-2)}
.bigtap svg{width:21px;height:21px}
.bigtap.warnb{background:var(--r2);color:#fff}

.turnhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.turnhead .now{font-size:20px;font-weight:700;letter-spacing:-.02em}
.turnhead .when{font-size:12.5px;color:var(--ink-3)}
.turnhead .when.bad{color:var(--r2-ink);font-weight:600}

.turnstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.turnchip{flex:none;min-width:72px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);
  padding:7px 9px;text-align:center}
.turnchip .h{font-family:var(--mono);font-size:12.5px;font-weight:600}
.turnchip .p{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.3}
.turnchip .w{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.turnchip.gap{min-width:34px;display:grid;place-items:center;background:none;border-style:dashed;
  color:var(--ink-3);font-size:11px}
/* trạng thái từng cữ */
.turnchip.s-done{border-color:var(--r0);background:var(--r0-bg)}
.turnchip.s-done .h{color:var(--r0-ink)}
.turnchip.s-late{border-color:var(--r1);background:var(--r1-bg)}
.turnchip.s-late .h{color:var(--r1-ink)}
.turnchip.s-miss{border-color:var(--r3);background:var(--r3-bg)}
.turnchip.s-miss .h,.turnchip.s-miss .w{color:var(--r3-ink);font-weight:600}
.turnchip.s-skip{border-color:var(--line-2);background:var(--card);border-style:dashed}
.turnchip.s-now{border-color:var(--accent);background:var(--accent-soft);border-width:2px}
.turnchip.s-now .h{color:var(--accent)}
.turnchip.s-future{opacity:.5;border-style:dashed;background:none}

.turnlog{display:flex;flex-direction:column;gap:0}
.turnlog .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.turnlog .row:last-child{border-bottom:0}
.turnlog .row .t{font-family:var(--mono);font-size:13px;font-weight:600;min-width:46px;flex:none}
/* Dòng nhật ký có cả giờ và ngày: ngày xuống dòng riêng, đừng dính vào giờ */
.turnlog .row .t span{display:block;font-weight:400;font-size:11px;color:var(--ink-3);
  margin-top:2px;white-space:nowrap}
.turnlog .row .t:has(span){min-width:74px}
.turnlog .row .d{flex:1;min-width:0;font-size:13.5px}
.turnlog .row .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.turnlog .row .gaptag{font-size:11px;font-family:var(--mono);color:var(--ink-3);align-self:center}
.turnlog .row .gaptag.bad{color:var(--r2-ink);font-weight:600}

.lesion.healed{opacity:.9;border-color:var(--r0)}
.lshist{margin-top:4px;border-top:1px dashed var(--line);padding-top:8px}
.lsrow{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.lsrow .tag{flex:none;margin-top:1px}
.lsrow .lsnote{font-size:13px;line-height:1.45;color:var(--ink)}
.lsrow .who{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.tag.healed{background:var(--r0-bg);color:var(--r0-ink);border-color:var(--r0)}
.tag.watch{background:var(--r1-bg);color:var(--r1-ink);border-color:var(--r1)}

.hoshift{display:flex;gap:6px;flex-wrap:wrap}
.hoshift button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:500}
.hoshift button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}

.hocase{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r-md);padding:11px 13px;
  background:var(--card);margin-bottom:9px}
.hocase.r3{border-left-color:var(--r3)} .hocase.r2{border-left-color:var(--r2)}
.hocase.r1{border-left-color:var(--r1)} .hocase.r0{border-left-color:var(--r0)}
.hocase .hn{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.hocase .hn b{font-size:15px}
.hocase .hn .bed{font-family:var(--mono);font-size:12px;background:var(--card-2);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px}
.hocase ul{margin:7px 0 0;padding-left:17px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.hocase ul li::marker{color:var(--ink-3)}
.hocase .todo{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.hocase .todo b{color:var(--r2-ink)}
/* Thanh lọc + sắp xếp danh sách người bệnh */
.listbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.listbar .btnrow{flex:1;min-width:0}
.sortsel{display:flex;align-items:center;gap:7px;flex:none}
.sortsel>span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sortsel select{width:auto;min-width:172px;padding:7px 10px;font-size:13px}
.sorthint{font-size:12px;color:var(--ink-3);margin-top:-6px;line-height:1.45}
.viewtog{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.viewtog button{border:0;background:none;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink-2)}
.viewtog button + button{border-left:1px solid var(--line)}
.viewtog button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ptable{min-width:860px}
.ptable thead th{line-height:1.25;padding:9px 9px}
.ptable td{padding:9px 9px}
.ptable th,.ptable td{white-space:nowrap}
.ptable td:first-child{white-space:normal;min-width:150px}
.ptable tbody tr:hover{background:var(--accent-soft)}
.ptable tbody tr.out{color:var(--ink-3)}
.ptable tbody tr.out b{font-weight:500}
@media(max-width:560px){
  .listbar{flex-direction:column;align-items:stretch}
  .sortsel{justify-content:space-between}
  .sortsel select{flex:1;min-width:0;margin-left:8px}
}

/* Sổ giao ban */
.gblog-day{margin-bottom:16px}
.gblog-date{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:0 2px 7px}
/* Bộ lọc ngày của sổ giao ban */
.gbfilter{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.gbfilter .btnrow{margin:0}
.gbrange{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:13px;color:var(--ink-2)}
.gbrange label{font-size:13px;color:var(--ink-2);white-space:nowrap;margin:0;flex:none}
.gbrange input[type=date]{padding:6px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;
  width:150px;flex:none;-webkit-appearance:none;appearance:none}
@media (max-width:520px){.gbrange{width:100%}.gbrange input[type=date]{flex:1 1 130px;width:auto}}
/* Lịch sử sửa thông tin hành chính */
.editlog .was{text-decoration:line-through;color:var(--ink-3)}
.editlog .now{font-weight:600;color:var(--ink)}
/* Việc cần làm — một người bệnh một thẻ, gộp hết việc còn nợ */
.vwrap{display:flex;flex-direction:column;gap:9px}
.vrow{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:var(--r-md);padding:12px 14px}
.vrow.gap{border-left-color:var(--r2)}
.vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vbed{font:600 12px/1 var(--mono);color:var(--ink-2);background:var(--card-2);
  border:1px solid var(--line);border-radius:6px;padding:4px 7px;flex:none}
.vname{background:none;border:0;padding:0;font:600 15.5px/1.3 var(--sans);color:var(--ink);
  cursor:pointer;text-align:left}
.vname:hover{color:var(--accent-2);text-decoration:underline}
.vlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.vlist li{font-size:13.5px;color:var(--ink-2);padding-left:15px;position:relative;line-height:1.45}
.vlist li::before{content:"";position:absolute;left:3px;top:7px;width:5px;height:5px;
  border-radius:50%;background:var(--ink-3)}
.vlist li.gap{color:var(--r2-ink);font-weight:600}
.vlist li.gap::before{background:var(--r2)}
.vact{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
@media (max-width:420px){.vact .btn{flex:1 1 auto}}
/* Thanh chọn kỳ báo cáo */
.rpbar{margin-bottom:14px}
.rpline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rpline label{font-size:13px;color:var(--ink-2);white-space:nowrap;margin:0;flex:none}
.rpsel{flex:1 1 220px;max-width:280px;padding:8px 32px 8px 11px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;
  font-weight:600;-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
    linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.rprange{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);
  margin-top:10px}
.rprange label{font-size:13px;color:var(--ink-2);white-space:nowrap;margin:0;flex:none}
.rprange input[type=date]{padding:6px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;width:150px;flex:none;
  -webkit-appearance:none;appearance:none}
.rpnote{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:10px 0 0}
@media (max-width:520px){.rprange input[type=date]{flex:1 1 130px;width:auto}}
/* Khối thu gọn — giữ màn hình hồ sơ ngắn lại */
.fold{border-top:1px solid var(--line);margin-top:12px}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:11px 2px 3px;font-size:13.5px;font-weight:600;color:var(--accent-2);
  user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-4px;
  transition:transform .15s;flex:none}
.fold[open]>summary::after{transform:rotate(-135deg);margin-top:2px}
.fold>summary .fsum{margin-left:auto;margin-right:4px;font-weight:400;font-size:12.5px;
  color:var(--ink-3)}
.fold>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.fold .foldin{padding-top:10px}
.fold.bare{border-top:0;margin-top:0}
.fold.sm>summary{font-size:12.5px;padding:7px 2px 2px}
.carelead{font-size:13.5px;color:var(--ink-2);margin:0 0 9px}
.carelead.ok{color:var(--r0-ink);font-weight:600}
@media print{.fold>summary{display:none}.fold .foldin{padding-top:0}
  .fold>.foldin,.fold[open]>.foldin{display:block!important}}
.gblog-row{display:flex;gap:11px;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-left-width:4px;border-radius:var(--r-md);padding:10px 13px;margin-bottom:7px}
.gblog-row.s-ok{border-left-color:var(--r0)}
.gblog-row.s-wait{border-left-color:var(--r1)}
.gblog-row.s-gap{border-left-color:var(--r3);background:var(--card-2)}
.gblog-row.s-running{border-left-color:var(--accent);border-style:dashed}
.gb-sh{flex:none;width:96px;font-size:13.5px;font-weight:600;line-height:1.3}
.gb-sh span{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono);font-weight:400}
.gb-body{flex:1;min-width:0}
.gb-sign{font-size:13.5px;line-height:1.45}
.gb-sign span{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.gb-sign .gb-wait{color:var(--r2-ink);font-weight:600;font-family:var(--sans)}
.gb-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.gb-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gb-pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-3);white-space:nowrap}
.gb-pill.ok{background:var(--r0-bg);color:var(--r0-ink);border-color:var(--r0)}
.gb-pill.wait{background:var(--r1-bg);color:var(--r1-ink);border-color:var(--r1)}
.gb-pill.gap{background:var(--r3-bg);color:var(--r3-ink);border-color:var(--r3);font-weight:600}
.gb-pill.running{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media(max-width:560px){
  .gblog-row{flex-wrap:wrap}
  .gb-sh{width:auto}
  .gb-right{width:100%;flex-direction:row;align-items:center;justify-content:space-between}
}

/* Ghi cả buồng một lượt */
.rndrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 13px;margin-bottom:9px}
.rndrow.skipped{background:var(--card-2);border-style:dashed}
.rnd-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.rnd-h b{font-size:15px}
.rnd-h .bed{font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.rnd-slot{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.rnd-slot.bad{color:var(--r2-ink);font-weight:600}
.rnd-prev{font-size:12px;color:var(--ink-3);margin-left:auto}
.rnd-pos{display:flex;gap:6px;flex-wrap:wrap}
.rnd-pos button{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:13.5px;font-weight:500;min-height:40px}
.rnd-pos button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}
.rnd-pos button.skip{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.rnd-pos button.skip[aria-pressed="true"]{background:var(--r2);border-color:var(--r2);color:#fff}
.rnd-reason{margin-top:9px}
.rnd-skin{display:flex;align-items:center;gap:8px;margin-top:9px;border:0;background:none;padding:0;
  font-size:12.5px;color:var(--ink-3)}
.rnd-skin .box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;flex:none}
.rnd-skin .box svg{width:13px;height:13px;opacity:0}
.rnd-skin[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rnd-skin[aria-pressed="true"] .box svg{opacity:1}
.rnd-skin[aria-pressed="true"]{color:var(--ink-2)}

.whyline{margin-top:6px;font-size:11.5px;color:var(--ink-3);font-style:italic;line-height:1.45}
/* Hộp gói phần lưu ý đã đóng */
.closedbox>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  padding:3px 0;font-size:13.5px;color:var(--ink-2)}
.closedbox>summary::-webkit-details-marker{display:none}
.closedbox>summary::before{content:"";width:0;height:0;flex:none;
  border-left:6px solid var(--ink-3);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  transition:transform .15s}
.closedbox[open]>summary::before{transform:rotate(90deg)}
.closedbox>summary .ct{font-weight:600}
.closedbox>summary .cn{font-family:var(--mono);font-size:12px;background:var(--r0-bg);color:var(--r0-ink);
  border:1px solid var(--r0);border-radius:999px;padding:1px 9px}
.closedbox>summary .cx{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.closedbox[open]>summary .cx{visibility:hidden}
.hnotes{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.hnote{display:flex;gap:8px;background:var(--accent-soft);border-radius:var(--r-sm);padding:8px 11px;
  font-size:13.5px;line-height:1.5}
.hnote .q{font-size:22px;line-height:.9;color:var(--accent);font-weight:700;flex:none}
.hnote .who{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:3px}

@media print{
  .rail,.tabbar,.topbar,.thubanner,.noprint{display:none!important}
  .content{padding:0}
  .card{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}

/* ============================================================
   PHÂN CẤP LẠI HỒ SƠ NGƯỜI BỆNH
   1. Mục gấp nhìn ra ngay là NGĂN KÉO, không giống tiêu đề mục
   2. Tiêu đề mục có vạch màu dẫn mắt
   3. Bỏ bớt một tầng thẻ ở phần Tổn thương
   4. Chỉ một nút chính trên cả trang
   ============================================================ */

/* 1. Ngăn kéo — nền xám, chữ nhỏ, không đậm */
.fold{border-top:0;margin-top:9px}
.fold>summary{font-size:12.5px;font-weight:500;color:var(--ink-2);
  background:var(--card-2);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px}
.fold>summary:hover{border-color:var(--line-2)}
.fold>summary::after{width:7px;height:7px;margin-top:-3px}
.fold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.fold[open]>summary::after{margin-top:1px}
.fold .foldin{padding:11px 1px 2px}
.fold.bare{margin-top:9px}
.fold.sm>summary{font-size:12px;padding:7px 10px}

/* Gom mọi ngăn kéo ít dùng về cuối trang */
.khac{display:flex;flex-direction:column;gap:0}
.khac .fold:first-child{margin-top:0}

/* 2. Tiêu đề mục — vạch màu dẫn mắt, đậm hơn nội dung bên trong */
.card-h{align-items:center}
.card-h h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h h2::before{content:"";width:3px;height:15px;border-radius:2px;
  background:var(--accent);flex:none}

/* 3. Phần không có khung thẻ — bỏ một tầng viền */
section.phang{background:none;border:0;box-shadow:none;padding:0}
section.phang>.card-h{padding:0 2px}
section.phang .lesion{background:var(--card);border-color:var(--line-2)}

/* 4. Thẻ VIỆC CẦN LÀM — thay cho các khung cảnh báo rải rác */
.canlam{border:1px solid var(--line-2);border-radius:var(--r-md);
  background:var(--card-2);padding:12px 13px;margin-top:13px}
.canlam.gap{border-color:color-mix(in srgb,var(--r1) 50%,transparent);
  background:var(--r1-bg)}
.canlam .cl-h{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);margin-bottom:8px}
.canlam.gap .cl-h{color:var(--r1-ink)}
.canlam ul{margin:0 0 11px;padding-left:17px}
.canlam li{font-size:13.5px;line-height:1.55;color:var(--ink);margin-bottom:3px}
.canlam .cl-ok{font-size:13.5px;color:var(--r0-ink);font-weight:600;margin:0}
.canlam .btnrow{margin:0}

/* Nút ghi xoay trở: to khi tới lúc, thường khi chưa tới */
.bigtap.nhe{min-height:44px;font-size:14px;background:var(--card);
  color:var(--ink);border:1px solid var(--line-2);font-weight:600;box-shadow:none}
.bigtap.nhe svg{color:var(--ink-3)}
.bigtap.nhe:hover{border-color:var(--ink-3)}

/* Chữ mô tả bên phải tiêu đề: bớt dày trên điện thoại */
@media (max-width:520px){
  .card-h{flex-wrap:wrap}
  .card-h .hint{margin-left:0;flex-basis:100%;margin-top:2px;font-size:11.5px}
}

/* Hàng thẻ trong hồ sơ người bệnh */
.ptabs{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin:0 0 14px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 1 auto;white-space:nowrap;border:0;background:none;font:inherit;
  font-size:13px;font-weight:600;color:var(--ink-2);padding:9px 12px;border-radius:9px;
  cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-selected=true]{background:var(--card);color:var(--accent-2);
  box-shadow:0 1px 3px rgba(0,0,0,.07)}
.ptabs .dot{width:7px;height:7px;border-radius:50%;background:var(--r1);flex:none}
.ptabs .num{font-size:11px;font-weight:700;background:var(--line-2);color:var(--ink-2);
  border-radius:999px;padding:0 6px;min-width:17px;text-align:center}
.ptabs button[aria-selected=true] .num{background:var(--accent);color:var(--accent-ink)}
@media (max-width:430px){
  .ptabs{padding:3px;gap:2px}
  .ptabs button{padding:8px 5px;font-size:11.5px;gap:4px}
  .ptabs .num{font-size:10px;padding:0 4px;min-width:14px}
  .ptabs .dot{width:6px;height:6px}
}

/* Nút Hành chính — nhỏ, nhạt, nằm ngay dưới ba dòng thông tin người bệnh */
.hcnut{margin-top:9px;display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:var(--card-2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer}
.hcnut:hover{border-color:var(--line-2);color:var(--ink)}
.hcnut svg{width:14px;height:14px;flex:none;color:var(--ink-3)}
/* Danh sách việc hành chính trong hộp thoại */
.hclist{display:flex;flex-direction:column;gap:8px}
.hclist .btn{justify-content:flex-start;width:100%}
.hcsub{font-size:12.5px;color:var(--ink-3);margin:2px 0 0;line-height:1.5}

/* ===== Thẻ ca trọng điểm trong giao ban =====
   Trước đây mỗi ca đổ ra 4–6 dòng mô tả, rồi mới tới việc phải làm, rồi lại
   một dòng nhắc lại lý do — đọc xong không biết phải làm gì. Nay chỉ còn
   hai dòng quan trọng nhất; phần mô tả gấp lại sau nút Chi tiết ca. */
.hocase .hwhy{margin-top:7px;font-size:13px;line-height:1.5;color:var(--ink-2);
  background:var(--card-2);border-radius:var(--r-sm);padding:7px 10px}
.hocase .hwhy b{color:var(--ink);font-weight:600}
.hocase .todo{font-size:13.5px;line-height:1.55}
.hocase .fold{margin-top:9px}
.hocase .fold>summary{background:none;border:0;border-top:1px dashed var(--line);
  border-radius:0;padding:8px 2px 2px;color:var(--ink-3)}
.hocase .fold>summary:hover{color:var(--ink-2)}
.hocase .fold .foldin{padding-top:4px}
.hocase .fold ul{margin-top:0}
/* Ba ô số liệu một hàng trên điện thoại thay vì hai ô rồi lẻ một ô */
.hotiles{grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:8px}
.hotiles .tile{padding:9px 10px}
.hotiles .tile .lab{font-size:11px;line-height:1.35}
.hotiles .tile .val{font-size:24px}
.hotiles .tile .note{font-size:10.5px;line-height:1.35}
@media print{.hocase .fold>summary{display:none}}

/* Ca chỉ cần theo dõi tiếp — một dòng, bấm mới mở */
.hocase.slim{padding:0 11px}
.hocase.slim>.fold>summary{padding:10px 2px;font-size:13.5px;color:var(--ink);
  font-weight:400;gap:8px;background:none;border:0}
.hocase.slim>.fold>summary b{font-weight:600;font-size:14px}
.hocase.slim>.fold>summary .fsum{font-size:12px;color:var(--ink-3)}
.hocase.slim .foldin{padding:2px 0 11px}
.hocase.slim+.hocase.slim{margin-top:7px}
.gbnhom{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;
  color:var(--ink-3);margin:16px 0 8px}
@media print{.hocase.slim>.fold>summary{display:none}}

/* ===== Hàng lọc danh sách người bệnh =====
   Trước đây ba ô lọc, hai danh sách xổ và nút Thẻ/Bảng cùng nằm trong một
   hàng bọc dòng, nên ô "Đã kết thúc · 132" bị đẩy xuống giữa chừng, nhìn lệch.
   Nay tách hẳn hai dòng: dòng trên là ba ô lọc, dòng dưới là hai danh sách xổ
   và nút Thẻ/Bảng dạt về phải — nằm ngay trên thẻ người bệnh đầu tiên. */
.listbar{display:block}
/* Ba ô lọc luôn nằm trên MỘT dòng, chia đều — kể cả khi số đếm lên ba chữ số */
.lb1{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.lbchip{font:inherit;cursor:pointer;min-width:0;display:flex;align-items:baseline;
  justify-content:center;gap:6px;padding:8px 10px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  font-size:13px;font-weight:500;line-height:1.3}
.lbchip:hover{border-color:var(--ink-3)}
.lbchip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbchip .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:none}
.lbchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}
.lbchip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.8}
@media (max-width:430px){
  .lbchip{flex-direction:column;align-items:center;gap:1px;padding:7px 6px;font-size:12px}
  .lbchip .n{font-size:13px;font-weight:700;color:var(--ink-2)}
  .lbchip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:1}
}
.lb2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lb2 .viewtog{margin-left:auto}
.listbar .sortsel select{min-width:150px}
/* Trên điện thoại: Thời gian và Sắp xếp vẫn CÙNG MỘT DÒNG, nhãn nằm trên ô chọn.
   Thẻ/Bảng xuống dòng riêng, dạt phải, nằm sát thẻ người bệnh đầu tiên. */
@media (max-width:620px){
  .lb2{gap:10px}
  .listbar .sortsel{flex:1 1 40%;min-width:142px;flex-direction:column;align-items:stretch;gap:3px}
  .listbar .sortsel>span{font-size:11.5px}
  .listbar .sortsel select{min-width:0;width:100%}
  .lb2 .viewtog{margin-left:auto;order:9}
}
/* Máy nhỏ nhất (iPhone SE 320px): thu ô chọn lại để hai ô vẫn đứng cùng dòng */
@media (max-width:370px){
  .lb2{gap:8px}
  .listbar .sortsel{min-width:128px}
  .listbar .sortsel select{padding:7px 8px;font-size:12.5px}
}

/* Đầu thẻ ca trọng điểm */
.hocase .hn .mrn{font-size:12px;color:var(--ink-3)}
.hocase .hdx{margin-top:5px;font-size:13px;color:var(--ink-2);line-height:1.45}
.hocase .hpts{margin:9px 0 0;padding-left:17px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.hocase .hpts li::marker{color:var(--ink-3)}
.hocase .todo{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.hocase.slim .hdx{margin:0 0 6px;font-size:12.5px;color:var(--ink-3)}

/* ===== Gói chăm sóc bấm được ===== */
.goihead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.goiso{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);
  background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:3px 10px}
.goiso.du{background:var(--r0-bg);border-color:var(--r0);color:var(--r0-ink)}
.goitxt{font-size:13.5px;color:var(--ink-2);flex:1;min-width:120px}
.goihead .btn{margin-left:auto}
.goilive .bitem{cursor:pointer;text-align:left;width:100%;font:inherit}
.goilive .bitem:hover{border-color:var(--accent)}
.goilive .bitem[disabled]{cursor:default;opacity:.6}
.bitem .bwho{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;
  font-weight:400;font-family:var(--mono)}
.bitem.xong .bt{color:var(--ink-2)}
.goinote{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:10px 0 0}
/* Mục đang chọn nhưng chưa lưu */
.bitem.chualuu{border-color:var(--r1);background:var(--r1-bg);border-style:dashed}
.bitem.chualuu .box{border-color:var(--r1)}
.bitem.chualuu.xong .box{background:var(--r1);border-color:var(--r1)}
.bitem .bwho.cl{color:var(--r1-ink);font-weight:600;font-family:var(--sans)}
/* Thanh lưu */
.goiluu{margin-top:12px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  background:var(--r1-bg);border:1px solid var(--r1);border-radius:var(--r-md);padding:11px 13px}
.goiluu .gltxt{flex:1;min-width:170px;font-size:13px;line-height:1.5;color:var(--r1-ink)}

  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return r ? `${h} giờ ${r} phút` : `${h} giờ`;
  const d = Math.floor(h / 24);
  return `${d} ngày ${h % 24} giờ`;
}
function ago(v) {
  const ms = Date.now() - dOf(v).getTime();
  if (ms < 60000) return "vừa xong";
  return fmtDur(ms) + " trước";
}
function ageFrom(dob) {
  if (!dob) return null;
  const d = dOf(dob), n = new Date();
  let a = n.getFullYear() - d.getFullYear();
  const m = n.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < d.getDate())) a--;
  return a;
}
function isoDay(v) { const d = dOf(v); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function startOfDay(v) { const d = dOf(v); d.setHours(0, 0, 0, 0); return d; }
function daysBetween(a, b) { return Math.max(0, Math.round((dOf(b) - dOf(a)) / 86400000)); }
/* Bỏ dấu tiếng Việt để tìm kiếm không dấu */
function noAccent(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
}

/* ---------- SHA-256 thuần JS (chạy được cả khi mở file offline) ---------- */
const sha256 = (function () {
  const K = [];
  (function () {
    function isP(n) { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
    let n = 2;
    for (let i = 0; i < 64;) { if (isP(n)) { K[i] = (Math.cbrt(n) % 1 * 4294967296) | 0; i++; } n++; }
  })();
  const H0 = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  return function (msg) {
    const b = new TextEncoder().encode(msg);
    const l = b.length, bits = l * 8;
    const withPad = new Uint8Array((((l + 9) >> 6) + 1) << 6);
    withPad.set(b); withPad[l] = 0x80;
    new DataView(withPad.buffer).setUint32(withPad.length - 4, bits >>> 0);
    new DataView(withPad.buffer).setUint32(withPad.length - 8, Math.floor(bits / 4294967296));
    const H = H0.slice(), w = new Int32Array(64), dv = new DataView(withPad.buffer);
    for (let o = 0; o < withPad.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, bb, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
        const mj = (a & bb) ^ (a & c) ^ (bb & c);
        const t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
      }
      const v = [a, bb, c, d, e, f, g, h];
      for (let i = 0; i < 8; i++) H[i] = (H[i] + v[i]) | 0;
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
  };
})();
const hashPw = (pw, salt) => sha256("ltd:" + (salt || "khoa-hstc") + ":" + pw);

/* ---------- Kho ảnh cục bộ (IndexedDB) ---------- */
const Photos = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise(res => {
      let rq;
      try { rq = indexedDB.open("ltd_photos", 1); } catch (e) { return res(null); }
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore("p"); } catch (e) {} };
      rq.onsuccess = () => { this._db = rq.result; res(this._db); };
      rq.onerror = () => res(null);
    });
  },
  async put(id, dataUrl) {
    const db = await this.open(); if (!db) return false;
    return new Promise(res => {
      try {
        const tx = db.transaction("p", "readwrite");
        tx.objectStore("p").put(dataUrl, id);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  async getLocal(id) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => {
      try {
        const rq = db.transaction("p", "readonly").objectStore("p").get(id);
        rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  /* Ở chế độ dùng chung: nếu máy này chưa có ảnh thì tải về từ Drive rồi lưu tạm */
  async get(id) {
    const local = await this.getLocal(id);
    if (local) return local;
    if (DB.mode !== "sheet" || !DB.url) return null;
    try {
      const out = await DB.call("photo.get", { id });
      if (out && out.dataUrl) { await this.put(id, out.dataUrl); return out.dataUrl; }
    } catch (e) {}
    return null;
  },
  /* Đẩy ảnh lên Drive để các máy khác xem được */
  async push(id, dataUrl) {
    if (DB.mode !== "sheet" || !DB.url) return false;
    try { await DB.call("photo.put", { id, dataUrl }); return true; }
    catch (e) { toast("Ảnh đã lưu trên máy này nhưng chưa đẩy lên máy chủ được", "err", 5000); return false; }
  },
  async del(id) {
    const db = await this.open(); if (!db) return;
    try { db.transaction("p", "readwrite").objectStore("p").delete(id); } catch (e) {}
  },
  async clearAll() {
    const db = await this.open(); if (!db) return;
    try { db.transaction("p", "readwrite").objectStore("p").clear(); } catch (e) {}
  }
};

/* Nén ảnh + đóng dấu mã hồ sơ, ngày giờ lên ảnh (phục vụ truy vết) */
function compressImage(file, stamp) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Không đọc được ảnh"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Tệp không phải là ảnh"));
      img.onload = () => {
        const MAX = 1280;
        let { width: w, height: h } = img;
        const sc = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const cx = cv.getContext("2d");
        cx.drawImage(img, 0, 0, w, h);
        if (stamp) {
          const fs = Math.max(11, Math.round(w / 42));
          cx.font = `600 ${fs}px ui-monospace, monospace`;
          const tw = cx.measureText(stamp).width;
          cx.fillStyle = "rgba(0,0,0,.6)";
          cx.fillRect(0, h - fs * 2.1, tw + fs * 1.4, fs * 2.1);
          cx.fillStyle = "#fff";
          cx.fillText(stamp, fs * 0.7, h - fs * 0.65);
        }
        resolve(cv.toDataURL("image/jpeg", 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Kho dữ liệu ---------- */
const emptyDB = () => ({
  meta: { ver: APP_VER, rev: 0, salt: "khoa-hstc", epoch: uid("ep") },
  settings: null,
  users: [], patients: [], episodes: [], assessments: [], flags: [], audit: [],
  /* --- ba nhóm dữ liệu mới của bản thử --- */
  turns: [],         // lượt xoay trở: {id, patientId, episodeId, at, pos, by, skinOk, note}
  lesionStates: [],  // trạng thái liền thương: {id, key, episodeId, site, device, status, at, by, note}
  /* Bản ghi tổn thương ghi ngoài phiếu đánh giá. Chỉ ghi thêm, không sửa,
     không xoá — y như phiếu đánh giá đã ký.
     {id, patientId, episodeId, at, by, kind:"moi"|"capnhat",
      site, device, stage, poa, size, note, photos:[{id,at,by}], foundAt} */
  lesionLogs: [],
  /* Lần thực hiện từng mục gói chăm sóc. Chỉ ghi thêm, không sửa, không xoá.
     {id, patientId, episodeId, at, by, item, level, done} */
  bundleLogs: [],

     Chỉ ghi thêm, không sửa, không xoá.
     {id, patientId, episodeId, at, by, shift, binhThuong,
      chung:{nhiet,mo,camgiac},
      viTri:[{k, size, sau, stage, note}], note} */
  skinChecks: [],
  handovers: [],     // biên bản giao ban: {id, at, shift, day, by, note, snapshot, receivedBy, receivedAt}
  handoverNotes: []  // dặn dò cho ca sau theo từng người bệnh: {id, episodeId, day, shift, text, by, at}
});

/* Đánh dấu thời điểm sửa, để khi hai máy cùng sửa một bản ghi thì biết bản nào mới hơn */
function touch(o) { if (o) o.updatedAt = new Date().toISOString(); return o; }
const stamp = o => (o && (o.updatedAt || o.createdAt)) || "";

/* Hợp nhất dữ liệu hai máy — không để máy này ghi đè mất việc của máy kia */
function mergeDB(local, server) {
  const out = emptyDB();
  out.meta = Object.assign({}, local.meta, server.meta);
  out.meta.rev = Math.max(local.meta?.rev || 0, server.meta?.rev || 0) + 1;

  // Phiếu đánh giá và nhật ký không bao giờ sửa: gộp theo mã, không mất bản nào
  const union = key => {
    const m = new Map();
    (server[key] || []).forEach(x => m.set(x.id, x));
    (local[key] || []).forEach(x => { if (!m.has(x.id)) m.set(x.id, x); });
    return [...m.values()];
  };
  out.assessments = union("assessments").sort((a, b) => a.at.localeCompare(b.at));
  out.audit = union("audit").sort((a, b) => a.at.localeCompare(b.at)).slice(-4000);
  // Lượt xoay trở và biên bản giao ban cũng không sửa: gộp theo mã
  out.turns = union("turns").sort((a, b) => a.at.localeCompare(b.at));
  out.lesionLogs = union("lesionLogs").sort((a, b) => a.at.localeCompare(b.at));
  out.bundleLogs = union("bundleLogs").sort((a, b) => a.at.localeCompare(b.at));
  out.skinChecks = union("skinChecks").sort((a, b) => a.at.localeCompare(b.at));
  out.handoverNotes = union("handoverNotes").sort((a, b) => a.at.localeCompare(b.at));
  // Biên bản giao ban có hai chữ ký (giao và nhận): lấy bản có đủ chữ ký hơn
  const hm = new Map();
  [...(server.handovers || []), ...(local.handovers || [])].forEach(h => {
    const cur = hm.get(h.id);
    if (!cur) { hm.set(h.id, h); return; }
    if (h.receivedAt && !cur.receivedAt) hm.set(h.id, h);
    else if (stamp(h) > stamp(cur)) hm.set(h.id, h);
  });
  out.handovers = [...hm.values()].sort((a, b) => a.at.localeCompare(b.at));

  // Hồ sơ, đợt điều trị, tài khoản: bản nào sửa sau thì thắng
  const newer = key => {
    const m = new Map();
    [...(server[key] || []), ...(local[key] || [])].forEach(x => {
      const cur = m.get(x.id);
      if (!cur || stamp(x) > stamp(cur)) m.set(x.id, x);
    });
    return [...m.values()];
  };
  out.patients = newer("patients");
  out.episodes = newer("episodes");
  out.users = newer("users");

  // Trạng thái liền thương: gộp theo khoá tổn thương, bản ghi sau thắng
  const lm = new Map();
  [...(server.lesionStates || []), ...(local.lesionStates || [])].forEach(x => {
    const cur = lm.get(x.key);
    if (!cur || stamp(x) > stamp(cur)) lm.set(x.key, x);
  });
  out.lesionStates = [...lm.values()];

  // Chuỗi cần lưu ý: gộp từng bước xử lý, giữ trạng thái đi xa nhất
  const rank = { moi: 0, tiepnhan: 1, xuly: 2, dong: 3 };
  const fm = new Map();
  [...(server.flags || []), ...(local.flags || [])].forEach(f => {
    const cur = fm.get(f.id);
    if (!cur) { fm.set(f.id, clone(f)); return; }
    const key = e => e.type + "|" + e.at + "|" + (e.by || "");
    const seen = new Set((cur.events || []).map(key));
    (f.events || []).forEach(e => { if (!seen.has(key(e))) cur.events.push(e); });
    cur.events.sort((a, b) => a.at.localeCompare(b.at));
    if ((rank[f.status] || 0) > (rank[cur.status] || 0)) cur.status = f.status;
  });
  out.flags = [...fm.values()];

  // Cài đặt chuyên môn: bản sửa sau thắng
  out.settings = stamp(local.settings) > stamp(server.settings)
    ? local.settings : (server.settings || local.settings);

  return out;
}

const DB = {
  data: emptyDB(),
  mode: "local",          // "local" | "sheet"
  url: "",
  online: true,
  syncing: false,
  lastSync: null,
  dirty: false,

  /* --- nạp --- */
  async boot() {
    const cfg = CFG.read();
    // Link mời:  .../?s=<địa chỉ máy chủ>  (chấp nhận cả dạng #s= của bản cũ).
    // Máy chưa cài gì thì tự nối luôn; máy đã cài rồi thì hỏi lại trước khi đổi.
    let invited = null;
    try {
      const m = (String(location.search || "") + String(location.hash || ""))
        .match(/[?#&]s=([^&#]+)/);
      if (m) invited = decodeURIComponent(m[1]);
    } catch (e) {}
    if (invited && !/^https?:\/\//.test(invited)) invited = null;

    let noiThang = false;
    if (invited && cfg.url && cfg.url === invited) {
      this.inviteSame = true;            // đã nối đúng kho này rồi
    } else if (invited) {
      noiThang = true;                   // tạm thời, quyết sau khi biết máy có dữ liệu chưa
    }
    if (invited) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
    }
    this.mode = cfg.mode === "sheet" && cfg.url ? "sheet" : "local";
    this.url = cfg.url || "";
    this.loadLocal();

    /* Chỉ nối thẳng khi máy THỰC SỰ trắng. Máy đã có dữ liệu — kể cả dữ liệu
       mẫu hay dữ liệu ghi offline chưa kịp đẩy lên — thì phải hỏi, vì nối vào
       kho khác là thay sạch dữ liệu đang có. */
    if (noiThang) {
      const coDuLieu = this.data.users.length || this.data.patients.length;
      if (coDuLieu) {
        this.invitePending = invited;    // hỏi lại sau khi giao diện đã lên
      } else {
        CFG.write({ mode: "sheet", url: invited });
        this.mode = "sheet"; this.url = invited;
        this.invitedFresh = true;
      }
    }
    try { this.dirty = localStorage.getItem("ltd_dirty") === "1"; } catch (e) {}
    if (this.mode === "sheet") { await this.sync(true); }
  },
  loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { this.data = Object.assign(emptyDB(), JSON.parse(raw)); }
    } catch (e) { console.warn("Không đọc được dữ liệu cục bộ", e); }
  },
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); return true; }
    catch (e) {
      toast("Bộ nhớ trình duyệt đã đầy. Hãy xuất dữ liệu ra tệp rồi xoá bớt ảnh cũ.", "err", 7000);
      return false;
    }
  },
  save() {
    this.data.meta.rev = (this.data.meta.rev || 0) + 1;
    this.saveLocal();
    if (this.mode === "sheet") {
      this.dirty = true;
      // Ghi nhớ là còn việc chưa đẩy lên, để mất mạng rồi tắt app vẫn không mất
      try { localStorage.setItem("ltd_dirty", "1"); } catch (e) {}
      this.queueSync();
    }
    render();
  },
  queueSync() {
    clearTimeout(this._st);
    this._st = setTimeout(() => this.sync(), 900);
  },

  /* --- đồng bộ Google Sheet --- */
  async call(action, payload, url) {
    const target = url || this.url;
    if (!target) throw new Error("Chưa cấu hình địa chỉ máy chủ");
    const res = await fetch(target, {
      method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, payload })
    });
    if (!res.ok) throw new Error("Máy chủ trả về lỗi " + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "Lỗi không xác định");
    return j.data;
  },
  /* Xem máy chủ đang có gì, không đụng tới dữ liệu trên máy */
  async peek(url) {
    const out = await this.call("sync", { push: null }, url);
    return (out && out.db) || null;
  },
  /* Thay toàn bộ dữ liệu trên máy bằng dữ liệu cho trước */
  adopt(db) {
    this.data = Object.assign(emptyDB(), db);
    this.saveLocal();
    if (Session.user && !this.user(Session.user.id)) {
      Session.logout(true);
      toast("Tài khoản của bạn không có trong dữ liệu vừa nhận. Vui lòng đăng nhập lại.", "err", 7000);
    } else if (Session.user) {
      Session.user = this.user(Session.user.id);
    }
  },
  async sync(initial) {
    if (this.mode !== "sheet" || this.syncing) return;
    this.syncing = true; renderStatus();
    try {
      const replace = this.forceReplace;
      const out = await this.call("sync", {
        push: (this.dirty || replace) ? this.data : null,
        replace: !!replace
      });
      this.forceReplace = false;
      if (out && out.db) this.adopt(out.db);
      this.dirty = false;
      try { localStorage.removeItem("ltd_dirty"); } catch (e) {}
      this.online = true; this.lastSync = Date.now();
    } catch (e) {
      this.online = false;
      if (initial) toast("Không kết nối được máy chủ — đang dùng dữ liệu trên máy.", "err", 5000);
    } finally { this.syncing = false; renderStatus(); render(); }
  },

  /* --- truy vết --- */
  log(action, detail, entity, entityId) {
    this.data.audit.push({
      id: uid("a"), at: new Date().toISOString(),
      userId: Session.user ? Session.user.id : null,
      userName: Session.user ? Session.user.name : "—",
      action, detail: detail || "", entity: entity || "", entityId: entityId || ""
    });
    if (this.data.audit.length > 4000) this.data.audit.splice(0, this.data.audit.length - 4000);
  },

  /* --- truy vấn --- */
  user(id) { return this.data.users.find(u => u.id === id); },
  userName(id) { const u = this.user(id); return u ? u.name : "—"; },
  patient(id) { return this.data.patients.find(p => p.id === id); },
  episode(id) { return this.data.episodes.find(e => e.id === id); },
  activeEpisode(pid) {
    return this.data.episodes.filter(e => e.patientId === pid && !e.dischargedAt)
      .sort((a, b) => b.admittedAt.localeCompare(a.admittedAt))[0] || null;
  },
  episodesOf(pid) {
    return this.data.episodes.filter(e => e.patientId === pid)
      .sort((a, b) => b.admittedAt.localeCompare(a.admittedAt));
  },
  assessmentsOf(epId) {
    return this.data.assessments.filter(a => a.episodeId === epId)
      .sort((a, b) => b.at.localeCompare(a.at));
  },
  lastAssessment(epId) { return this.assessmentsOf(epId)[0] || null; },
  flagsOf(pid) {
    return this.data.flags.filter(f => f.patientId === pid)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  },
  openFlags() {
    const v = this.voidedSet();
    return this.data.flags.filter(f => f.status !== "dong" && !v.has(f.patientId))
      .sort((a, b) => (b.priority || 0) - (a.priority || 0) || b.createdAt.localeCompare(a.createdAt));
  },
  admittedPatients() {
    return this.data.episodes.filter(e => !e.dischargedAt)
      .map(e => ({ ep: e, p: this.patient(e.patientId) }))
      .filter(x => x.p && !x.p.voidedAt);
  },
  /* Hồ sơ đã huỷ không được tính vào bất cứ thống kê hay danh sách nào */
  voidedSet() {
    const s = new Set();
    this.data.patients.forEach(p => { if (p.voidedAt) s.add(p.id); });
    return s;
  },
  liveEpisodes() {
    const v = this.voidedSet();
    return v.size ? this.data.episodes.filter(e => !v.has(e.patientId)) : this.data.episodes;
  },

  /* --- bản thử: xoay trở & liền thương --- */
  turnsOf(epId, sinceMs) {
    const from = sinceMs ? Date.now() - sinceMs : 0;
    return (this.data.turns || [])
      .filter(t => t.episodeId === epId && dOf(t.at).getTime() >= from)
      .sort((a, b) => b.at.localeCompare(a.at));
  },
  lastTurn(epId) { return this.turnsOf(epId)[0] || null; },
  lesionState(key) { return (this.data.lesionStates || []).find(s => s.key === key) || null; },
  bundleLogsOf(epId) {
    return (this.data.bundleLogs || []).filter(l => l.episodeId === epId)
      .sort((a, b) => a.at.localeCompare(b.at));
  },
  /* Bản ghi tổn thương của một đợt điều trị, cũ trước mới sau */
  lesionLogsOf(epId) {
    return (this.data.lesionLogs || []).filter(l => l.episodeId === epId)
      .sort((a, b) => a.at.localeCompare(b.at));
  },
  /* Phiếu khám da của một đợt điều trị, MỚI TRƯỚC CŨ SAU */
  skinChecksOf(epId) {
    return (this.data.skinChecks || []).filter(l => l.episodeId === epId)
      .sort((a, b) => b.at.localeCompare(a.at));
  }

const Session = {
  user: null, at: null, _idle: null,
  restore() {
    try {
      const s = JSON.parse(sessionStorage.getItem("ltd_ses") || "null");
      if (s && s.uid) {
        const u = DB.user(s.uid);
        if (u && u.active !== false) { this.user = u; this.at = s.at; this.touch(); return true; }
      }
    } catch (e) {}
    return false;
  },
  login(u) {
    this.user = u; this.at = new Date().toISOString();
    try { sessionStorage.setItem("ltd_ses", JSON.stringify({ uid: u.id, at: this.at })); } catch (e) {}
    DB.log("dang-nhap", "Đăng nhập hệ thống");
    DB.save(); this.touch();
  },
  logout(silent) {
    if (this.user && !silent) DB.log("dang-xuat", "Đăng xuất");
    this.user = null;
    try { sessionStorage.removeItem("ltd_ses"); } catch (e) {}
    if (!silent) DB.save();

  },
  touch() {
    clearTimeout(this._idle);
    const mins = (DB.data.settings?.idleMinutes) || 20;
    this._idle = setTimeout(() => {
      if (this.user) { this.logout(true); toast("Đã tự khoá do không thao tác. Vui lòng đăng nhập lại.", "err", 6000); }
    }, mins * 60000);

  isAdmin() { return this.user && this.user.role === "admin"; },

  go(name, params) { this.stack.push({ name, params: params || {} }); render(); window.scrollTo(0, 0); },
  replace(name, params) { this.stack[this.stack.length - 1] = { name, params: params || {} }; render(); window.scrollTo(0, 0); },
  tab(name) { this.stack = [{ name, params: {} }]; render(); window.scrollTo(0, 0); },

};

/* ---------- Thông báo nhanh ---------- */
function toast(msg, kind, ms) {
  const host = $("#toasts"); if (!host) return;
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s"; setTimeout(() => el.remove(), 260); }, ms || 3200);
}

function lenDau() {
  try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); }
}

function modal({ title, body, actions, wide }) {
  const host = $("#modalhost");
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sh"><h3>${esc(title)}</h3>
      <button class="iconbtn" data-close aria-label="Đóng"><svg><use href="#i-x"/></svg></button></div>
    <div class="sb"></div><div class="sf"></div></div>`;
  const bodyEl = $(".sb", wrap), footEl = $(".sf", wrap);
  if (typeof body === "string") bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
  const close = () => wrap.remove();
  (actions || [{ label: "Đóng" }]).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn" + (a.kind ? " " + a.kind : "");
    b.textContent = a.label;
    b.onclick = () => { if (!a.onClick || a.onClick(bodyEl, close) !== false) close(); };
    footEl.appendChild(b);
  });
  wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
  $("[data-close]", wrap).onclick = close;
  host.appendChild(wrap);
  const f = bodyEl.querySelector("input,select,textarea");
  if (f) setTimeout(() => f.focus(), 60);
  return { el: wrap, body: bodyEl, close };
}
function confirmBox(title, text, okLabel, onOk, danger) {
  modal({
    title, body: `<p style="font-size:14.5px;line-height:1.55">${text}</p>`,
    actions: [
      { label: "Huỷ" },
      { label: okLabel || "Đồng ý", kind: danger ? "danger" : "pri", onClick: () => { onOk(); } }
    ]
  });
}
function lightbox(src, caption) {
  const el = document.createElement("div");
  el.className = "lightbox";
  el.innerHTML = `<img alt="Ảnh tổn thương"><div class="cap">${esc(caption || "")}</div>`;
  $("img", el).src = src;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

/* ---------- Xuất tệp ---------- */
async function downloadFile(name, content, type) {
  const text = "﻿" + content;
  // Khi chạy bản trình diễn trên web, phải xin phép người xem mới tải được
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) {
        try { await dl.save({ filename: name, data: text }); }
        catch (e) { if (e && e.code !== "declined") toast("Không tải được tệp: " + (e.message || e.code), "err", 5000); }
        return;
      }
    }
  } catch (e) {}
  const blob = new Blob([text], { type: type || "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 400);
}
function toCSV(rows) {
  return rows.map(r => r.map(c => {
    const s = c == null ? "" : String(c);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
}
