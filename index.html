/* ---------- SỔ GIAO BAN — điều dưỡng trưởng xem lại toàn bộ ---------- */
let GBLOG = { days: 14, from: "", to: "", custom: false };   // custom = tự chọn khoảng ngày

/* Mục đang chọn trong danh sách xổ — nhớ lựa chọn của người dùng, không suy đoán */
function gbSel(ranged) {
  if (GBLOG.custom) return "khac";
  if (!ranged) return "d" + GBLOG.days;
  const n = new Date();
  for (const back of [0, 1]) {
    const d = new Date(n.getFullYear(), n.getMonth() - back, 1);
    const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    if (GBLOG.from === isoDay(d) && GBLOG.to === isoDay(e > n ? n : e)) return "m" + back;
  }
  return "khac";
}
function gbSetMonth(back) {
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth() - back, 1);
  const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  GBLOG.from = isoDay(d); GBLOG.to = isoDay(e > n ? n : e); GBLOG.custom = false;
}

/* Mốc khoa bắt đầu dùng ứng dụng — trước mốc này không có gì để giao ban,
   nên không tính là "ca không ai chốt" */
function wardStartMs() {
  const t = [];
  const push = v => { if (v) { const m = dOf(v).getTime(); if (!isNaN(m)) t.push(m); } };
  DB.data.episodes.forEach(e => push(e.admittedAt));
  DB.data.patients.forEach(p => push(p.createdAt));
  DB.data.assessments.forEach(a => push(a.at));
  (DB.data.turns || []).forEach(x => push(x.at));
  (DB.data.handovers || []).forEach(h => push(h.at));
  DB.data.flags.forEach(f => push(f.createdAt));
  (DB.data.audit || []).forEach(a => push(a.at));
  return t.length ? Math.min.apply(null, t) : null;
}

function viewHandoverLog() {
  const now = new Date();
  const all = hoAll();
  const startMs = wardStartMs();

  /* Khoảng xem: hoặc do người dùng chọn từ ngày – đến ngày, hoặc theo nút số ngày */
  const parseDay = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); 
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  let dFrom = parseDay(GBLOG.from), dTo = parseDay(GBLOG.to);
  const ranged = !!(dFrom || dTo);
  if (ranged) {
    if (!dFrom) dFrom = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 13);
    if (!dTo) dTo = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (dFrom > dTo) { const t = dFrom; dFrom = dTo; dTo = t; }
  } else {
    dTo = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    dFrom = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (GBLOG.days - 1));
  }
  const days = Math.round((dTo - dFrom) / 864e5) + 1;

  /* Dựng đủ mọi ca trong khoảng, kể cả ca KHÔNG có biên bản — chỗ trống mới là thứ cần thấy.
     Nhưng chỉ tính từ lúc khoa bắt đầu dùng ứng dụng trở đi. */
  const list = [];
  for (let d = 0; d < days; d++) {
    const day = new Date(dTo.getFullYear(), dTo.getMonth(), dTo.getDate() - d);
    SHIFTS.forEach(sh => {
      const { start, end } = shiftRange(sh, new Date(day.getFullYear(), day.getMonth(), day.getDate(), sh.from, 30));
      if (start > now) return;                       // ca chưa tới
      const dayKey = isoDay(start);
      const h = hoFind(dayKey, sh.v);
      const running = now < end;                     // ca đang trực, chưa tới giờ chốt
      if (!h && !running) {
        if (startMs == null) return;                 // khoa chưa dùng ngày nào
        if (end.getTime() <= startMs) return;        // ca kết thúc trước khi khoa bắt đầu dùng
      }
      list.push({ day: dayKey, start, shift: sh, ho: h, running });
    });
  }
  list.sort((a, b) => b.start - a.start);

  const closed = list.filter(x => !x.running);
  const signed = closed.filter(x => x.ho);
  const received = signed.filter(x => x.ho.receivedAt);
  const gaps = closed.filter(x => !x.ho);
  const waiting = signed.filter(x => !x.ho.receivedAt);
  const delays = received.map(x => dOf(x.ho.receivedAt) - dOf(x.ho.at)).filter(v => v >= 0);
  const medDelay = delays.length
    ? delays.slice().sort((a, b) => a - b)[Math.floor(delays.length / 2)] : null;

  const byDay = {};
  list.forEach(x => { (byDay[x.day] = byDay[x.day] || []).push(x); });
  const dayKeys = Object.keys(byDay).sort().reverse();

  /* Khoảng thực sự có dữ liệu = khoảng đã chọn, cắt bớt phần trước khi khoa dùng app */
  const toEnd = new Date(dTo.getFullYear(), dTo.getMonth(), dTo.getDate() + 1).getTime();
  const chuaDung = startMs == null || startMs >= toEnd;   // cả khoảng nằm trước khi khoa dùng
  const winFrom = chuaDung ? dFrom : new Date(Math.max(startMs, dFrom.getTime()));
  const subTxt = ranged ? `${fmtDate(dFrom)} – ${fmtDate(dTo)}`
    : startMs == null ? "khoa chưa bắt đầu dùng"
    : (startMs > dFrom.getTime()
        ? `từ ${fmtDate(new Date(startMs))} — ngày khoa bắt đầu dùng`
        : `${days} ngày gần nhất`);
  const tinhTu = chuaDung
    ? (startMs == null ? "khoa chưa bắt đầu dùng" : "khoa chưa dùng trong khoảng này")
    : `tính từ ${fmtDate(winFrom)}`;

  const rowHtml = x => {
    const h = x.ho;
    const st = x.running ? "running" : !h ? "gap" : h.receivedAt ? "ok" : "wait";
    const lab = { running: "đang trực", gap: "không có biên bản", ok: "đủ hai chữ ký", wait: "chưa ai nhận" }[st];
    return `<div class="gblog-row s-${st}">
      <div class="gb-sh">${esc(x.shift.t)}<span>${pad(x.shift.from)}:00–${pad(x.shift.to)}:00</span></div>
      <div class="gb-body">
        ${h ? `<div class="gb-sign">${esc(DB.userName(h.by))} <span>giao ${fmtTime(h.at)}</span>
            ${h.receivedAt ? `→ ${esc(DB.userName(h.receivedBy))} <span>nhận ${fmtTime(h.receivedAt)}</span>`
                           : `<span class="gb-wait">chưa có ai nhận</span>`}</div>
          <div class="gb-meta">${h.body ? h.body.sum.tong : "—"} người bệnh ·
            ${h.body ? h.body.sum.moiphatsinh : 0} loét mới ·
            ${h.body ? h.body.sum.quahandg : 0} quá hạn đánh giá${h.note ? " · " + esc(h.note) : ""}</div>`
        : `<div class="gb-meta">${x.running ? "Ca đang trực, chưa tới giờ chốt bàn giao."
            : "<b>Không có ai chốt bàn giao ca này.</b>"}</div>`}
      </div>
      <div class="gb-right">
        <span class="gb-pill ${st}">${lab}</span>
        ${h ? `<button class="btn sm" data-hodoc="${h.id}">Mở</button>` : ""}
      </div>
    </div>`;
  };

  const html = `
    <section class="card rpbar">
      <div class="rpline">
        <label for="gb-ky">Khoảng xem</label>
        <select id="gb-ky" class="rpsel">
          ${[["d7", "7 ngày gần nhất"], ["d14", "14 ngày gần nhất"], ["d30", "30 ngày gần nhất"],
             ["d90", "90 ngày gần nhất"], ["m0", "Tháng này"], ["m1", "Tháng trước"],
             ["khac", "Chọn khoảng ngày…"]].map(([v, t]) =>
            `<option value="${v}"${v === gbSel(ranged) ? " selected" : ""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="rprange" ${gbSel(ranged) === "khac" ? "" : "hidden"}>
        <label for="gb-from">Từ</label>
        <input id="gb-from" type="date" value="${esc(GBLOG.from || isoDay(dFrom))}" max="${esc(isoDay(now))}">
        <label for="gb-to">đến</label>
        <input id="gb-to" type="date" value="${esc(GBLOG.to || isoDay(dTo))}" max="${esc(isoDay(now))}">
        <button class="btn sm pri" data-gbgo>Xem</button>
      </div>
    </section>

    <section class="tiles">
      <div class="tile"><span class="lab">Ca đã qua trong kỳ</span><span class="val mono">${closed.length}</span>
        <span class="note">${tinhTu}</span></div>
      <div class="tile ${gaps.length ? "alert" : ""}"><span class="lab">Ca không ai chốt</span>
        <span class="val mono">${gaps.length}</span>
        <span class="note">${closed.length ? Math.round(signed.length / closed.length * 100) : 0}% ca có bàn giao</span></div>
      <div class="tile ${waiting.length ? "warnT" : ""}"><span class="lab">Chốt nhưng chưa ai nhận</span>
        <span class="val mono">${waiting.length}</span>
        <span class="note">${received.length} ca đủ hai chữ ký</span></div>
      <div class="tile"><span class="lab">Từ chốt đến nhận</span>
        <span class="val mono">${medDelay == null ? "—" : Math.round(medDelay / 60000)}</span>
        <span class="note">phút, trung vị</span></div>
    </section>

    <section>
      <div class="card-h"><h2>Sổ giao ban</h2><span class="hint">mới nhất trước</span></div>
      ${dayKeys.length ? dayKeys.map(k => `<div class="gblog-day">
        <div class="gblog-date">${fmtDate(byDay[k][0].start)}</div>
        ${byDay[k].sort((a, b) => b.start - a.start).map(rowHtml).join("")}
      </div>`).join("") : `<p class="empty">${chuaDung
        ? "Khoảng ngày này nằm trước lúc khoa bắt đầu dùng ứng dụng, nên không có ca nào để hiển thị."
        : "Không có ca nào trong khoảng ngày đã chọn."}</p>`}
    </section>`;

  return {
    title: "Sổ giao ban", sub: subTxt, html,
    bind() {
      const sel = $("#gb-ky");
      if (sel) sel.onchange = () => {
        const v = sel.value;
        if (v[0] === "d") { GBLOG.days = +v.slice(1); GBLOG.from = ""; GBLOG.to = ""; GBLOG.custom = false; }
        else if (v[0] === "m") gbSetMonth(+v.slice(1));
        else { if (!GBLOG.from && !GBLOG.to) gbSetMonth(0); GBLOG.custom = true; }
        render();
        if (v === "khac") { const f = $("#gb-from"); if (f) f.focus(); }
      };
      const go = $("[data-gbgo]");
      if (go) go.onclick = () => {
        GBLOG.from = ($("#gb-from") || {}).value || "";
        GBLOG.to = ($("#gb-to") || {}).value || "";
        if (!GBLOG.from && !GBLOG.to) { toast("Chưa chọn ngày nào", "err"); return; }
        render();
      };
      $$("[data-hodoc]").forEach(b => b.onclick = () => Nav.go("handoverdoc", { id: b.dataset.hodoc }));
  const gl = $("[data-gblog]"); if (gl) gl.onclick = () => Nav.go("handoverlog");
    }
  };
}

/* ---------- Thao tác dùng chung ---------- */
function bindHandoverActions(shift, dayKey, body) {
  $$("[data-hopatient]").forEach(b => b.onclick = () => Nav.go("patient", { id: b.dataset.hopatient }));
  $$("[data-hodoc]").forEach(b => b.onclick = () => Nav.go("handoverdoc", { id: b.dataset.hodoc }));
  const gl = $("[data-gblog]"); if (gl) gl.onclick = () => Nav.go("handoverlog");

  /* Điều dưỡng dặn thêm cho từng người bệnh */
  $$("[data-honote]").forEach(b => b.onclick = () => {
    const ep = DB.episode(b.dataset.honote);
    const p = ep && DB.patient(ep.patientId);
    if (!ep || !p || !shift) return;
    modal({
      title: "Dặn ca sau — " + p.name,
      body: `<p style="font-size:13.5px;color:var(--ink-2);line-height:1.55">
          Ghi những gì chỉ người trực mới biết, máy không tự tổng hợp được.</p>
        <div class="field"><label for="hn-text">Nội dung dặn ca sau</label>
          <textarea id="hn-text" placeholder="vd: Nghiêng trái thì SpO₂ tụt còn 88%, chỉ nghiêng phải và nửa ngồi. Đã báo bác sĩ."></textarea></div>`,
      actions: [{ label: "Huỷ" }, { label: "Lưu dặn dò", kind: "pri", onClick: (bd) => {
        const text = $("#hn-text", bd).value.trim();
        if (!text) { toast("Chưa nhập nội dung", "err"); return false; }
        DB.data.handoverNotes.push({
          id: uid("hn"), episodeId: ep.id, patientId: p.id, day: dayKey, shift: shift.v,
          text, by: Session.user.id, at: new Date().toISOString()
        });
        DB.log("dan-ca-sau", `${p.name}: ${text.slice(0, 60)}`, "episode", ep.id);
        DB.save();
        toast("Đã thêm vào bàn giao ca sau", "ok");
        render();
      }}]
    });
  });

  /* Người giao ca chốt */
  const sg = $("[data-hosign]");
  if (sg && shift) sg.onclick = () => {
    const note = (($("#ho-note") || {}).value || "").trim();
    confirmBox("Chốt bàn giao " + shift.t.toLowerCase(),
      `Sau khi chốt, biên bản ca này <b>đóng lại và không sửa được</b>, chờ điều dưỡng ca sau bấm nhận.
       Bạn đang ký với tên <b>${esc(Session.user.name)}</b>.`,
      "Chốt và ký", () => {
        const frozen = buildHandoverBody(shift);   // đóng băng đúng lúc ký
        DB.data.handovers.push(touch({
          id: uid("ho"), at: new Date().toISOString(), shift: shift.v, shiftName: shift.t,
          day: dayKey, by: Session.user.id, note, body: frozen,
          receivedBy: null, receivedAt: null, receiveNote: ""
        }));
        DB.log("giao-ban-chot", `${shift.t} — ${frozen.sum.tong} người bệnh`, "handover", "");
        DB.save();
        toast("Đã chốt bàn giao " + shift.t.toLowerCase() + ". Chờ ca sau xác nhận.", "ok", 6000);
        render();
      });
  };

  /* Người nhận ca xác nhận */
  $$("[data-horecv]").forEach(btn => btn.onclick = () => {
    const h = (DB.data.handovers || []).find(x => x.id === btn.dataset.horecv);
    if (!h) { toast("Không tìm thấy biên bản", "err"); return; }
    /* Người giao không được tự nhận: hai chữ ký phải là hai người */
    if (h.by === Session.user.id) {
      modal({
        title: "Không tự nhận bàn giao của mình được",
        body: `<div class="notice warn"><svg><use href="#i-alert"/></svg><span>
            Biên bản này do <b>chính bạn</b> chốt lúc ${fmtDT(h.at)}.
            Người nhận ca phải <b>đăng nhập tài khoản của họ</b> rồi mới bấm nhận.</span></div>
          <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:10px">
            Biên bản bàn giao chỉ có giá trị khi <b>hai chữ ký là hai người khác nhau</b> —
            một người giao, một người nhận. Nếu cùng một tài khoản ký cả hai đầu thì
            không còn chứng minh được ca sau đã thật sự tiếp nhận.</p>`,
        actions: [{ label: "Đã hiểu", kind: "pri" }]
      });
      return;
    }
    if (h.receivedAt) { toast("Biên bản này đã có người nhận rồi", "err"); render(); return; }
    modal({
      title: "Nhận bàn giao " + h.shiftName.toLowerCase(),
      body: `<div class="notice"><svg><use href="#i-shield"/></svg><span>
          Bấm nhận là bạn <b>đã đọc và đồng ý</b>; việc còn tồn thuộc ca của bạn.
          Ghi tên <b>${esc(Session.user.name)}</b> và giờ phút.</span></div>
        <div class="field"><label for="hr-note">Ý kiến khi nhận (không bắt buộc)</label>
          <textarea id="hr-note" placeholder="vd: Đã nhận. Sẽ kiểm tra lại vùng cùng cụt giường HS-01 ngay đầu ca."></textarea></div>`,
      actions: [{ label: "Huỷ" }, { label: "Xác nhận đã nhận bàn giao", kind: "pri", onClick: (bd) => {
        h.receivedBy = Session.user.id;
        h.receivedAt = new Date().toISOString();
        h.receiveNote = $("#hr-note", bd).value.trim();
        touch(h);
        DB.log("giao-ban-nhan", `${h.shiftName} — nhận bàn giao`, "handover", h.id);
        DB.save();
        toast("Đã xác nhận nhận bàn giao", "ok", 5000);
        render();
      }}]
    });
  });
}


/* ============================================================
   PHIẾU KHÁM DA VÙNG TÌ ĐÈ — quy trình Bước 1
   Mặc định mọi vị trí bình thường: người bệnh không có gì thì bấm
   "Da bình thường" là xong. Chỗ nào bất thường thì chọn từ thanh
   vị trí, chấm đỏ hiện lên hình, rồi ghi kích thước / độ sâu / phân độ.
   ============================================================ */

/* Hình người: nét ngoài, dùng chung cho mặt trước và mặt sau */
function hinhNguoi(mat) {
  const d = mat === "sau"
    ? `M50 6c-7 0-12 5-12 12s5 13 12 13 12-6 12-13S57 6 50 6z`
    : `M50 6c-7 0-12 5-12 12s5 13 12 13 12-6 12-13S57 6 50 6z`;
  return `<svg viewBox="0 0 100 220" class="bodysvg" aria-hidden="true">
    <path d="${d}" class="bd"/>
    <path d="M46 31h8v9h-8z" class="bd"/>
    <path d="M34 40h32c3 0 5 2 5 5v55c0 3-2 5-5 5H34c-3 0-5-2-5-5V45c0-3 2-5 5-5z" class="bd"/>
    <path d="M29 46l-8 6-5 44 7 2 9-42z" class="bd"/>
    <path d="M71 46l8 6 5 44-7 2-9-42z" class="bd"/>
    <path d="M36 105h12l3 60-2 42h-12l1-42z" class="bd"/>
    <path d="M64 105H52l-3 60 2 42h12l-1-42z" class="bd"/>
    <path d="M36 207h13v7H36z" class="bd"/>
    <path d="M64 207H51v7h13z" class="bd"/>
  </svg>`;
}

/* Một mặt của hình, kèm các chấm vị trí.
   attr: tên thuộc tính data- gắn lên chấm, để màn hình đánh giá và phiếu
   khám da dùng chung một hình mà xử lý bấm khác nhau. */
function matHinh(mat, chon, attr) {
  const a = attr || "kd";
  const ds = KHAM_DA_VITRI.filter(v => v.mat === mat);
  return `<div class="bodywrap">
    <div class="bodylab">${mat === "truoc" ? "Nhìn từ phía trước" : "Nhìn từ phía sau"}</div>
    <div class="bodybox">
      ${hinhNguoi(mat)}
      ${ds.map(v => {
        const co = chon.has(v.k);
        return `<button type="button" class="bdot ${co ? "co" : ""}" data-${a}="${v.k}"
          style="left:${v.x}%;top:${(v.y / 220 * 100).toFixed(2)}%"
          title="${esc(v.t)}" aria-label="${esc(v.t)}" aria-pressed="${co}"></button>`;
      }).join("")}
    </div>
  </div>`;
}
/* Hai mặt hình, dùng chung cho mọi màn hình cần chấm vị trí */
function hinhViTri(chon, attr) {
  return `<div class="bodies">${matHinh("truoc", chon, attr)}${matHinh("sau", chon, attr)}</div>`;
}

/* Phiếu khám da đầu ca */
function khamDaDialog(p, ep) {
  if (!ep) { toast("Người bệnh đã kết thúc đợt điều trị", "err"); return; }
  const chon = new Map();                    // k -> {size, sau, stage, note}
  const chung = { nhiet: 0, mo: 0, camgiac: 0 };
  const ca = caCuaLuc();

  const veHinh = b => {
    const k = new Set(chon.keys());
    $("#kd-hinh", b).innerHTML = matHinh("truoc", k, "kd") + matHinh("sau", k, "kd");
    $$("#kd-hinh [data-kd]", b).forEach(x => x.onclick = () => bat(b, x.dataset.kd));
  };
  const veChon = b => {
    const ds = [...chon.keys()];
    $("#kd-so", b).textContent = ds.length
      ? `${ds.length} vị trí bất thường` : "Chưa đánh dấu vị trí nào — da bình thường";
    $("#kd-so", b).className = ds.length ? "kdso co" : "kdso";
    $("#kd-ds", b).innerHTML = ds.map(k => {
      const v = chon.get(k);
      const ghi = !!v.ghi;
      return `<div class="kdrow" data-kdrow="${k}">
        <div class="kdh"><span class="t">${esc(kdTen(k))}</span>
          <button type="button" class="lnk" data-kdbo="${k}">Bỏ</button></div>
        <div class="qopts" style="padding:0">
          <button class="opt" type="button" aria-pressed="${!ghi}" data-kdg="${k}" data-v="0">
            <span class="mark"><svg><use href="#i-check"/></svg></span>
            <span class="txt">Chỉ ghi nhận quan sát</span></button>
          <button class="opt" type="button" aria-pressed="${ghi}" data-kdg="${k}" data-v="1">
            <span class="mark"><svg><use href="#i-check"/></svg></span>
            <span class="txt">Ghi thành tổn thương — theo dõi diễn tiến, thêm ảnh, đánh dấu đã lành</span></button>
        </div>
        <div class="grid2">
          <div class="field"><label>Kích thước</label>
            <input type="text" data-kdf="size" value="${esc(v.size || "")}" placeholder="vd: 3 × 2 cm"></div>
          <div class="field"><label>Độ sâu</label>
            <select data-kdf="sau">${KHAM_DA_SAU.map((x, i) =>
              `<option value="${i}"${v.sau === i ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Phân độ (NPIAP / EPUAP)</label>
          <select data-kdf="stage"><option value="">Chưa phân độ</option>
            ${STAGES.map(x => `<option value="${x.v}"${v.stage === x.v ? " selected" : ""}>${esc(x.t)}</option>`).join("")}</select></div>
        ${ghi ? `<div class="kdnguon"><div class="eyebrow">Nguồn gốc tổn thương</div>
          <div class="qopts" style="padding:0">
            <button class="opt" type="button" aria-pressed="${!v.poa}" data-kdp="${k}" data-v="0">
              <span class="mark"><svg><use href="#i-check"/></svg></span>
              <span class="txt">Phát sinh tại khoa</span></button>
            <button class="opt" type="button" aria-pressed="${!!v.poa}" data-kdp="${k}" data-v="1">
              <span class="mark"><svg><use href="#i-check"/></svg></span>
              <span class="txt">Đã có sẵn khi vào khoa</span></button>
          </div>
          <span class="help">Chỗ này quyết định chỉ số loét mới của khoa. Ghi cho đúng.</span></div>` : ""}
        <div class="field"><label>Mô tả</label>
          <input type="text" data-kdf="note" value="${esc(v.note || "")}" placeholder="vd: đỏ không mất màu khi ấn"></div>
      </div>`;
    }).join("");
    $$("[data-kdchip]", b).forEach(c =>
      c.setAttribute("aria-pressed", chon.has(c.dataset.kdchip)));
    $$("#kd-ds [data-kdg]", b).forEach(x => x.onclick = () => {
      chon.get(x.dataset.kdg).ghi = x.dataset.v === "1";
      veChon(b);
    });
    $$("#kd-ds [data-kdp]", b).forEach(x => x.onclick = () => {
      chon.get(x.dataset.kdp).poa = x.dataset.v === "1";
      $$(`[data-kdp="${x.dataset.kdp}"]`, b).forEach(o => o.setAttribute("aria-pressed", o === x));
    });
    $$("#kd-ds [data-kdbo]", b).forEach(x => x.onclick = () => bat(b, x.dataset.kdbo));
    $$("#kd-ds [data-kdf]", b).forEach(inp => inp.onchange = inp.oninput = () => {
      const k = inp.closest("[data-kdrow]").dataset.kdrow;
      const f = inp.dataset.kdf;
      chon.get(k)[f] = f === "sau" ? +inp.value : inp.value;
    });
  };
  const bat = (b, k) => {
    if (chon.has(k)) chon.delete(k);
    else chon.set(k, { size: "", sau: 0, stage: "", note: "", ghi: false, poa: false });
    veHinh(b); veChon(b);
  };

  const m = modal({
    title: "Khám da vùng tì đè",
    body: `
      <div class="notice"><svg><use href="#i-info"/></svg><span>
        Phiếu của <b>${esc(ca.shift.t.toLowerCase())}</b> · ${fmtDate(ca.start)}.
        Mặc định mọi vị trí bình thường — không có gì bất thường thì bấm thẳng
        <b>Da bình thường</b>.</span></div>
      <div class="field"><label>Quan sát chung</label>
        <div class="kdchung">${KHAM_DA_CHUNG.map(c => `
          <div class="kdc"><div class="eyebrow">${esc(c.t)}</div>
            <select data-kdc="${c.k}">${c.opts.map((o, i) =>
              `<option value="${i}">${esc(o)}</option>`).join("")}</select></div>`).join("")}</div></div>
      <div class="field"><label>Vị trí bất thường</label>
        <span class="help">Chạm vào chấm trên hình, hoặc chọn tên ở thanh bên dưới.</span>
        <div id="kd-hinh" class="bodies"></div>
        <div id="kd-so" class="kdso">Chưa đánh dấu vị trí nào — da bình thường</div>
        <details><summary style="cursor:pointer;font-size:13px;color:var(--ink-2);padding:6px 0">
          Chọn theo tên vị trí</summary>
          <div class="kdchips">${KHAM_DA_VITRI.map(v =>
            `<button type="button" class="kdchip" aria-pressed="${chon.has(v.k)}" data-kdchip="${v.k}">${esc(v.t)}</button>`).join("")}</div>
        </details>
      </div>
      <div id="kd-ds"></div>
      <div class="field"><label for="kd-note">Ghi chú thêm</label>
        <textarea id="kd-note" placeholder="vd: da vùng dưới dây cố định nội khí quản hơi đỏ, đã xoay đổi vị trí"></textarea></div>`,
    actions: [{ label: "Huỷ" }, { label: "Lưu phiếu khám da", kind: "pri", onClick: b => {
      const rec = {
        id: uid("kd"), patientId: p.id, episodeId: ep.id,
        at: new Date().toISOString(), by: Session.user.id, shift: ca.shift.v,
        binhThuong: chon.size === 0,
        chung: {
          nhiet: +$('[data-kdc="nhiet"]', b).value,
          mo: +$('[data-kdc="mo"]', b).value,
          camgiac: +$('[data-kdc="camgiac"]', b).value
        },
        viTri: [...chon.entries()].map(([k, v]) => Object.assign({ k }, v)),
        note: $("#kd-note", b).value.trim()
      };
      const ghiTT = [...chon.entries()].filter(([, v]) => v.ghi);
      const gio = rec.at;
      (DB.data.skinChecks = DB.data.skinChecks || []).push(rec);
      DB.log("kham-da", `${p.name} (${p.mrn}) — khám da ${rec.binhThuong
        ? "bình thường" : `${rec.viTri.length} vị trí bất thường`}`, "episode", ep.id);
      DB.save();
      toast(rec.binhThuong ? "Đã ghi: da bình thường"
        : `Đã ghi ${rec.viTri.length} vị trí bất thường`, "ok");
      /* Vị trí điều dưỡng chọn "ghi thành tổn thương" thì vào danh sách tổn thương
         của đợt điều trị — theo dõi diễn tiến, thêm ảnh, đánh dấu đã lành được.
         Còn lại chỉ nằm trong phiếu khám da, không vào chỉ số loét của khoa. */
      if (ghiTT.length) {
        /* Vị trí đã có trong danh sách thì bản ghi này là CẬP NHẬT, không phải
           vết mới — nhưng vẫn phải ghi, nếu không nhãn "đã vào danh sách tổn
           thương" trên phiếu khám da là nói dối. Vị trí đã lành thì mở lại. */
        const dangCo = new Map(lesionsOfEpisode(ep.id).map(x => [x.site, x]));
        let n = 0;
        ghiTT.forEach(([k, v]) => {
          const ten = kdTen(k);
          const cu = dangCo.get(ten);
          const moi = !cu || cu.status === "lanh";
          (DB.data.lesionLogs = DB.data.lesionLogs || []).push({
            id: uid("ll"), patientId: p.id, episodeId: ep.id, at: gio, by: Session.user.id,
            kind: moi ? "moi" : "capnhat", site: ten, device: null,
            stage: v.stage || (cu ? cu.stage : "I"), poa: cu ? !!cu.poa : !!v.poa,
            size: v.size || "", note: v.note || "", photos: [],
            foundAt: cu && !moi ? cu.foundAt : gio, tuKhamDa: rec.id
          });
          moLaiNeuDaLanh(ep.id, ten, null);
          n++;
        });
        if (n) {
          DB.log("ghi-ton-thuong-moi",
            `${p.name} (${p.mrn}) — ${n} tổn thương ghi từ phiếu khám da`, "episode", ep.id);
          DB.save();
          toast(`Đã ghi ${n} tổn thương vào đợt điều trị`, "ok");
        }
      }
      render();
    }}]
  });

  veHinh(m.body); veChon(m.body);
  $$("[data-kdchip]", m.body).forEach(c => c.onclick = () => bat(m.body, c.dataset.kdchip));
}

/* Phiếu khám da của ca trực đang làm, nếu đã có */
function khamDaCa(epId, ref) {
  const c = caCuaLuc(ref);
  return DB.skinChecksOf(epId).find(x => {
    const t = dOf(x.at).getTime();
    return t >= c.start.getTime() && t < c.end.getTime();
  }) || null;
}

/* Tình trạng da gần nhất, một dòng — dùng cho bàn giao và phiếu theo dõi */
function tinhTrangDa(epId) {
  const k = DB.skinChecksOf(epId)[0];
  if (!k) return "Chưa khám da trong hồ sơ";
  if (k.binhThuong) return `Da bình thường (khám ${fmtDT(k.at)})`;
  return `${k.viTri.map(v => kdTen(v.k) + (v.stage ? ` độ ${v.stage}` : "")).join(", ")} (khám ${fmtDT(k.at)})`;
}

/* ============================================================
   PHIẾU THEO DÕI ĐIỀU DƯỠNG — quy trình Bước 4.1
   In ra đúng các mục khoa đang viết tay, để điều dưỡng khỏi ghi hai lần.
   Hai chỗ trong văn bản khoa được sửa cho đúng:
     · bỏ mẫu số "/23" — thang Waterlow không có mức tối đa 23 điểm
     · dùng ba mức của quy trình thay cho "(cao/trung bình/thấp)"
   ============================================================ */
function phieuTheoDoi(p, ep, phieu) {
  if (!ep) { toast("Người bệnh đã kết thúc đợt điều trị", "err"); return; }
  const st = DB.data.settings || DEFAULT_SETTINGS();
  /* phieu = một phiếu đánh giá đã ký → dựng lại phiếu theo dõi ĐÚNG LÚC ĐÓ.
     Không truyền gì → phiếu đang hiện hành, dùng để bàn giao tại giường. */
  const dong_bang = !!phieu;
  const last = phieu || DB.lastAssessment(ep.id);
  const moc = dong_bang ? dOf(phieu.at).getTime() : Date.now();
  const lv = last ? mucGoiCuaPhieu(last) : null;
  const ti = turnInfo(ep, dong_bang ? new Date(moc) : null);
  const ca = caCuaLuc(moc);

  /* a. Tình trạng da — phiếu khám da đi kèm phiếu đánh giá này, hoặc gần nhất trước đó */
  const kd = dong_bang
    ? (DB.skinChecksOf(ep.id).find(x => x.tuPhieu === phieu.id)
       || DB.skinChecksOf(ep.id).find(x => dOf(x.at).getTime() <= moc))
    : DB.skinChecksOf(ep.id)[0];
  const daTxt = !kd ? "Chưa khám da trong hồ sơ"
    : kd.binhThuong ? `Da bình thường (khám ${fmtDT(kd.at)})`
    : `${kd.viTri.map(v => kdTen(v.k) + (v.stage ? ` độ ${v.stage}` : "")).join(", ")} (khám ${fmtDT(kd.at)})`;

  /* c. Can thiệp phòng ngừa — gói của ca chứa mốc thời gian này */
  const daTick = last
    ? (dong_bang ? (last.bundle || []) : [...bundleCa(ep.id, lv).st.keys()])
    : [];
  const nhom = n => daTick.filter(x => nhomCuaMuc(x) === n);
  const beMat = nhom("Bề mặt hỗ trợ"), daCs = nhom("Chăm sóc da"), dd = nhom("Dinh dưỡng");

  /* d. Ghi nhận loét */
  const les = dong_bang
    ? [...(phieu.lesions || []), ...(phieu.mdrpi || [])]
    : lesionsOfEpisode(ep.id).filter(l => l.status !== "lanh");

  const dong = (nhan, noiDung) =>
    `<div class="ptdrow"><span class="ptdk">${nhan}</span><span class="ptdv">${noiDung}</span></div>`;

  modal({
    title: "Phiếu theo dõi điều dưỡng",
    wide: true,
    body: `<div class="ptd">
      <div class="ptdhead">
        <div class="ptdt">PHIẾU THEO DÕI ĐIỀU DƯỠNG — PHÒNG NGỪA LOÉT TÌ ĐÈ</div>
        <div class="ptds">${esc(st.wardName)} · ${esc(st.hospital)}</div>
      </div>
      ${dong_bang
        ? `<div class="notice"><svg><use href="#i-shield"/></svg><span>
            Phiếu dựng lại từ <b>lượt đánh giá đã ký lúc ${fmtDT(phieu.at)}</b>
            (${esc(DB.userName(phieu.userId))}) — giữ nguyên nội dung của thời điểm đó,
            không đổi theo dữ liệu về sau.</span></div>`
        : `<div class="notice"><svg><use href="#i-info"/></svg><span>
            Phiếu <b>đang hiện hành</b>, dựng từ lượt đánh giá gần nhất và tình trạng hiện tại
            — dùng để bàn giao tại giường bệnh. Mỗi lượt đánh giá đã ký có phiếu riêng
            trong thẻ <b>Diễn tiến</b>.</span></div>`}
      <div class="ptdbn">
        <div><b>Họ tên:</b> ${esc(p.name)}</div>
        <div><b>Mã hồ sơ:</b> <span class="mono">${esc(p.mrn)}</span></div>
        <div><b>Giường:</b> ${esc(ep.bed || "—")}</div>
        <div><b>Chẩn đoán:</b> ${esc(ep.diagnosis || "—")}</div>
      </div>
      ${dong("Ngày / Giờ", `${fmtTime(moc)} · ${fmtDate(moc)} — ${esc(ca.shift.t.toLowerCase())}`)}
      ${dong("a. Tình trạng da", esc(daTxt))}
      ${dong("b. Đánh giá nguy cơ", last
        ? `Thang điểm Waterlow <b>${last.score} điểm</b>, xác định mức độ nguy cơ
           <b>${esc(LEVELS[last.level].short.toLowerCase())}</b>${
           lv !== last.level ? ` — áp ${esc(tenGoi(lv).toLowerCase())}` : ""}
           <span class="ptdm">(đánh giá ${fmtDT(last.at)}, ${esc(DB.userName(last.userId))})</span>`
        : "<i>Chưa đánh giá lần nào trong đợt điều trị này</i>")}
      ${dong("c. Can thiệp phòng ngừa", `
        Xoay <b>${esc(ti.never ? "chưa ghi lượt nào" : posName(ti.last.pos).toLowerCase())}</b>.
        Duy trì xoay trở tư thế mỗi <b>${ti.every} giờ</b>${
          lv != null ? ` (lịch cữ ${lichCu(lv).map(h => pad(h) + "g").join(" · ")})` : ""}.
        ${beMat.length ? esc(beMat.join("; ")) + ". " : ""}
        ${daCs.length ? esc(daCs.join("; ")) + ". " : "Giữ da sạch và khô. "}
        ${dd.length ? esc(dd.join("; ")) + "." : "Bảo đảm dinh dưỡng đầy đủ."}
        <span class="ptdm">(${ti.soLuot24h} lượt xoay trong 24 giờ trước mốc này)</span>`)}
      ${dong("d. Ghi nhận loét", les.length
        ? `<ul class="ptdl">${les.map(l => `<li>Vết loét vùng <b>${esc(l.site)}</b>${
            l.device ? ` (do ${esc(l.device)})` : ""}, phân độ <b>${esc(l.stage)}</b>${
            l.size ? `, kích thước <b>${esc(l.size)}</b>` : ""}${
            l.note ? `. ${esc(l.note)}` : ""}${
            l.poa ? " <i>— có sẵn khi nhập khoa</i>" : " <i>— phát sinh tại khoa</i>"}</li>`).join("")}</ul>`
        : "Không ghi nhận loét.")}
      <div class="ptdky">
        <div>Điều dưỡng lập phiếu<br><b>${esc(dong_bang
          ? DB.userName(phieu.userId) : Session.user.name)}</b></div>
        <div>Điều dưỡng trưởng<br><span class="ptdm">………………………</span></div>
      </div>
      <div class="ptdm" style="margin-top:10px">Phiếu do phần mềm lập từ hồ sơ điện tử,
        theo Bước 4.1 quy trình phòng ngừa loét tì đè của khoa. Phiếu này không thay thế
        bàn giao bằng lời tại giường bệnh.</div>
    </div>`,
    actions: [{ label: "Đóng" }, { label: "In phiếu", kind: "pri",
      onClick: () => {
        document.body.classList.add("inphieu");
        window.print();
        setTimeout(() => document.body.classList.remove("inphieu"), 400);
        return false;
      } }]
  });
}
</script>
<script>
/* ============================================================
   SỬA THÔNG TIN HÀNH CHÍNH & HUỶ HỒ SƠ NHẬP NHẦM
   ------------------------------------------------------------
   Nguyên tắc:
   - Thông tin hành chính (tên, mã hồ sơ, ngày sinh, giới tính) SỬA ĐƯỢC,
     vì nhập sai là chuyện xảy ra thật và để sai thì nguy hiểm hơn.
   - Nhưng mọi lần sửa đều để lại vết: ai sửa, lúc nào, sửa từ gì thành gì,
     vì lý do gì. Vết này không xoá được.
   - Phiếu đánh giá đã ký vẫn KHÔNG sửa được — đó là nội dung lâm sàng.
   - Hồ sơ nhập nhầm thì HUỶ chứ không xoá: biến khỏi danh sách và khỏi
     mọi báo cáo, nhưng vẫn còn trong dữ liệu để truy vết, và khôi phục được.
   ============================================================ */

/* --- Hồ sơ đã huỷ thì coi như không tồn tại với phần còn lại của ứng dụng --- */
function isVoid(p) { return !!(p && p.voidedAt); }
function livePatients() { return DB.data.patients.filter(p => !isVoid(p)); }
function voidedPatients() {
  return DB.data.patients.filter(isVoid)
    .sort((a, b) => String(b.voidedAt).localeCompare(String(a.voidedAt)));
}

const PFIELDS = [
  { k: "name", t: "Họ và tên" },
  { k: "mrn",  t: "Mã hồ sơ bệnh viện" },
  { k: "dob",  t: "Ngày sinh", date: true },
  { k: "sex",  t: "Giới tính", map: { nam: "Nam", nu: "Nữ" } }
];
const pfShow = (f, v) => !v ? "—" : f.date ? fmtDate(v) : (f.map ? f.map[v] || v : v);

/* ============================================================
   SỬA THÔNG TIN HÀNH CHÍNH
   ============================================================ */
function editPatientDialog(p) {
  modal({
    title: "Sửa thông tin hành chính",
    body: `
      <div class="notice"><svg><use href="#i-info"/></svg><span>
        Chỉ sửa khi <b>nhập sai</b>. Mọi thay đổi đều ghi lại tên bạn, giờ phút và
        nội dung cũ — điều dưỡng trưởng xem được trong Nhật ký thao tác.</span></div>
      <div class="field"><label for="ep-name">Họ và tên</label>
        <input id="ep-name" type="text" value="${esc(p.name)}"></div>
      <div class="grid2">
        <div class="field"><label for="ep-mrn">Mã hồ sơ bệnh viện</label>
          <input id="ep-mrn" type="text" class="mono" value="${esc(p.mrn)}"></div>
        <div class="field"><label for="ep-dob">Ngày sinh</label>
          <input id="ep-dob" type="date" value="${esc(p.dob || "")}"></div>
      </div>
      <div class="field"><label for="ep-sex">Giới tính</label>
        <select id="ep-sex">
          <option value="nam"${p.sex === "nam" ? " selected" : ""}>Nam</option>
          <option value="nu"${p.sex === "nu" ? " selected" : ""}>Nữ</option>
        </select></div>
      <div class="field"><label for="ep-why">Lý do sửa</label>
        <input id="ep-why" type="text" placeholder="vd: nhập nhầm ngày sinh khi tiếp nhận">
        <span class="help">Bắt buộc. Ghi ngắn gọn vì sao phải sửa.</span></div>
      <div id="ep-warn"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Lưu thay đổi", kind: "pri", onClick: b => {
      const next = {
        name: $("#ep-name", b).value.trim(),
        mrn:  $("#ep-mrn", b).value.trim(),
        dob:  $("#ep-dob", b).value,
        sex:  $("#ep-sex", b).value
      };
      const why = $("#ep-why", b).value.trim();

      if (!next.name) { toast("Chưa nhập họ tên", "err"); return false; }
      if (!next.mrn)  { toast("Chưa nhập mã hồ sơ bệnh viện", "err"); return false; }

      const dup = DB.data.patients.find(x =>
        x.id !== p.id && !isVoid(x) && x.mrn.toLowerCase() === next.mrn.toLowerCase());
      if (dup) {
        $("#ep-warn", b).innerHTML = `<div class="notice warn"><svg><use href="#i-alert"/></svg>
          <span>Mã hồ sơ <b>${esc(next.mrn)}</b> đang thuộc về ${esc(dup.name)}.
          Mỗi người bệnh một mã riêng — kiểm tra lại mã trước khi lưu.</span></div>`;
        return false;
      }

      const changes = PFIELDS
        .filter(f => (p[f.k] || "") !== (next[f.k] || ""))
        .map(f => ({ k: f.k, t: f.t, from: p[f.k] || "", to: next[f.k] || "" }));
      if (!changes.length) { toast("Không có gì thay đổi", "err"); return false; }
      if (!why) { toast("Chưa ghi lý do sửa", "err"); return false; }

      const rec = {
        at: new Date().toISOString(), by: Session.user.id,
        byName: Session.user.name, why,
        fields: changes.map(c => ({ k: c.k, t: c.t, from: c.from, to: c.to }))
      };
      p.edits = (p.edits || []).concat([rec]);
      changes.forEach(c => { p[c.k] = next[c.k]; });
      touch(p);

      const desc = changes.map(c => {
        const f = PFIELDS.find(x => x.k === c.k);
        return `${c.t}: ${pfShow(f, c.from)} → ${pfShow(f, c.to)}`;
      }).join(" · ");
      DB.log("sua-thong-tin-nb", `${desc} — lý do: ${why}`, "patient", p.id);
      DB.save();
      toast("Đã lưu và ghi vết thay đổi", "ok");
      render();
    }}]
  });
}

/* Lịch sử chỉnh sửa, hiện ngay trong hồ sơ để không ai phải đi tìm */
function editHistoryBlock(p) {
  const eds = p.edits || [];
  if (!eds.length) return "";
  const rows = eds.slice().reverse().map(e => `<div class="row">
    <div class="t">${fmtTime(e.at)}<span>${fmtDate(e.at)}</span></div>
    <div class="d">
      ${(e.fields || []).map(f => {
        const def = PFIELDS.find(x => x.k === f.k) || { t: f.t };
        return `<b>${esc(f.t || def.t)}</b>:
          <span class="was">${esc(pfShow(def, f.from))}</span> →
          <span class="now">${esc(pfShow(def, f.to))}</span>`;
      }).join("<br>")}
      <div class="m">${esc(e.byName || DB.userName(e.by))} sửa · lý do: ${esc(e.why || "—")}</div>
    </div>
  </div>`).join("");
  return `<section class="card noprint">
    <details class="closedbox">
      <summary>Lịch sử chỉnh sửa thông tin hành chính (${eds.length} lần)</summary>
      <div class="turnlog editlog" style="margin-top:10px">${rows}</div>
    </details>
  </section>`;
}

/* ============================================================
   HUỶ HỒ SƠ NHẬP NHẦM — chỉ điều dưỡng trưởng
   ============================================================ */
function patientFootprint(p) {
  const eps = DB.data.episodes.filter(e => e.patientId === p.id);
  const epIds = eps.map(e => e.id);
  return {
    eps: eps.length,
    assess: DB.data.assessments.filter(a => epIds.includes(a.episodeId)).length,
    turns: (DB.data.turns || []).filter(t => t.patientId === p.id).length,
    flags: DB.data.flags.filter(f => f.patientId === p.id).length,
    notes: (DB.data.handoverNotes || []).filter(n => n.patientId === p.id).length
  };
}

function voidPatientDialog(p) {
  const fp = patientFootprint(p);
  const has = fp.assess + fp.turns + fp.flags + fp.notes;
  modal({
    title: "Huỷ hồ sơ nhập nhầm",
    body: `
      <p style="font-size:14px;line-height:1.55">Huỷ hồ sơ <b>${esc(p.name)}</b>
        (mã ${esc(p.mrn)}).</p>
      <div class="notice"><svg><use href="#i-info"/></svg><span>
        Hồ sơ sẽ <b>biến khỏi danh sách người bệnh và khỏi mọi báo cáo, giao ban</b>,
        nhưng vẫn còn trong dữ liệu để truy vết. Điều dưỡng trưởng khôi phục lại được
        trong Cài đặt.</span></div>
      ${has ? `<div class="notice warn"><svg><use href="#i-alert"/></svg><span>
        Hồ sơ này <b>đã có dữ liệu chăm sóc</b>:
        ${[fp.assess ? fp.assess + " phiếu đánh giá" : "", fp.turns ? fp.turns + " lần ghi xoay trở" : "",
           fp.flags ? fp.flags + " mục cần lưu ý" : "", fp.notes ? fp.notes + " lời dặn giao ban" : ""]
          .filter(Boolean).join(", ")}.
        Nếu đây là người bệnh thật thì <b>đừng huỷ</b> — chỉ sửa lại thông tin sai,
        hoặc cho xuất viện.</span></div>` : ""}
      <div class="field"><label for="vp-why">Lý do huỷ</label>
        <input id="vp-why" type="text" placeholder="vd: tạo trùng, đã có hồ sơ mã 26-045678">
        <span class="help">Bắt buộc.</span></div>`,
    actions: [{ label: "Không huỷ" }, { label: "Huỷ hồ sơ", kind: "danger", onClick: b => {
      const why = $("#vp-why", b).value.trim();
      if (!why) { toast("Chưa ghi lý do huỷ", "err"); return false; }
      p.voidedAt = new Date().toISOString();
      p.voidedBy = Session.user.id;
      p.voidedByName = Session.user.name;
      p.voidReason = why;
      touch(p);
      DB.log("huy-ho-so", `${p.name} (${p.mrn}) — lý do: ${why}`, "patient", p.id);
      DB.save();
      toast("Đã huỷ hồ sơ. Khôi phục được trong Cài đặt.", "ok", 6000);
      Nav.go("patients");
    }}]
  });
}

function restorePatientDialog(p) {
  modal({
    title: "Khôi phục hồ sơ",
    body: `<p style="font-size:14px;line-height:1.55">Khôi phục hồ sơ <b>${esc(p.name)}</b>
      (mã ${esc(p.mrn)}) về lại danh sách người bệnh?</p>
      <p style="font-size:13px;color:var(--ink-2);margin-top:8px">
        Đã huỷ ${fmtDT(p.voidedAt)} bởi ${esc(p.voidedByName || DB.userName(p.voidedBy))} —
        lý do: ${esc(p.voidReason || "—")}</p>`,
    actions: [{ label: "Thôi" }, { label: "Khôi phục", kind: "pri", onClick: () => {
      const dup = DB.data.patients.find(x =>
        x.id !== p.id && !isVoid(x) && x.mrn.toLowerCase() === String(p.mrn).toLowerCase());
      if (dup) { toast(`Mã ${p.mrn} hiện thuộc về ${dup.name}. Sửa mã trước khi khôi phục.`, "err", 6000); return false; }
      const why = p.voidReason;
      delete p.voidedAt; delete p.voidedBy; delete p.voidedByName; delete p.voidReason;
      touch(p);
      DB.log("khoi-phuc-ho-so", `${p.name} (${p.mrn}) — từng huỷ vì: ${why || "—"}`, "patient", p.id);
      DB.save();
      toast("Đã khôi phục hồ sơ", "ok");
      render();
    }}]
  });
}

/* Thẻ quản lý hồ sơ đã huỷ, đặt trong Cài đặt của điều dưỡng trưởng */
function voidedCard() {
  const list = voidedPatients();
  if (!list.length) return "";
  return `<section class="card">
    <div class="card-h"><h2>Hồ sơ đã huỷ</h2><span class="hint">${list.length} hồ sơ</span></div>
    <p class="hintbox">Các hồ sơ này không hiện trong danh sách người bệnh và không được tính
      vào bất kỳ báo cáo nào. Dữ liệu vẫn còn để truy vết.</p>
    <div class="turnlog" style="margin-top:10px">
      ${list.map(p => `<div class="row">
        <div class="t">${fmtTime(p.voidedAt)}<span>${fmtDate(p.voidedAt)}</span></div>
        <div class="d"><b>${esc(p.name)}</b> · <span class="mono">${esc(p.mrn)}</span>
          <div class="m">${esc(p.voidedByName || DB.userName(p.voidedBy))} huỷ ·
            lý do: ${esc(p.voidReason || "—")}</div></div>
        <button class="btn sm" data-restore="${p.id}" style="align-self:center">Khôi phục</button>
      </div>`).join("")}
    </div>
  </section>`;
}
function bindVoidedCard() {
  $$("[data-restore]").forEach(b => b.onclick = () => {
    const p = DB.patient(b.dataset.restore);
    if (p) restorePatientDialog(p);
  });
}
</script>
<script>
/* ============================================================
   TRANG CHỦ — GỘP VIỆC THEO NGƯỜI BỆNH
   ------------------------------------------------------------
   Trước đây trang chủ chia theo LOẠI VIỆC: Cần lưu ý, Đến hạn
   đánh giá, Cữ xoay trở, Đang theo dõi sát — bốn danh sách.
   Một người bệnh có ba việc thì xuất hiện ba lần ở ba chỗ,
   nên đọc xong không biết rốt cuộc phải tới giường nào.

   Giờ gộp lại: MỘT NGƯỜI BỆNH MỘT DÒNG, liệt kê mọi việc còn
   nợ của người đó. Điều dưỡng đi một lần, làm hết.
   ============================================================ */

/* Việc còn nợ của một người bệnh, kèm mức khẩn để xếp thứ tự */
function viecCuaNguoiBenh(r) {
  const viec = [];
  let uu = 0;

  const fl = DB.flagsOf(r.p.id).filter(f => f.status !== "dong");
  const flMoi = fl.filter(f => f.status === "moi");
  if (flMoi.length) {
    viec.push({ k: "flag", t: `${flMoi.length} lưu ý chưa tiếp nhận`, gap: true });
    uu += 100;
  }
  const flNhan = fl.filter(f => f.status === "tiepnhan");
  if (flNhan.length) {
    viec.push({ k: "flag", t: `${flNhan.length} lưu ý chưa ghi kết quả`, gap: true });
    uu += 80;
  }

  if (r.due && r.due.overdue) {
    viec.push({ k: "assess",
      t: r.due.first ? "Chưa đánh giá lần đầu" : `Quá hạn đánh giá ${fmtDur(Date.now() - r.due.due.getTime())}`,
      gap: true });
    uu += r.due.first ? 90 : 60;
  }

  const ti = r.ti;
  if (ti && ti.never) {
    viec.push({ k: "turn", t: "Chưa ghi lượt xoay trở nào", gap: true });
    uu += 50;
  } else if (ti && ti.toiLuc) {
    viec.push({ k: "turn",
      t: `Đã ${fmtDur(ti.cach)} chưa xoay — mục tiêu mỗi ${ti.every} giờ`, gap: true });
    uu += 55;
  }

  if (r.lv === 3) uu += 8; else if (r.lv === 2) uu += 4;
  return { viec, uu };
}

function dongViec(r, v) {
  const lvc = r.lv == null ? "" : levelClass(r.lv);
  return `<article class="vrow ${v.viec.some(x => x.gap) ? "gap" : ""}">
    <div class="vhead">
      <span class="vbed">${esc(r.ep.bed || "—")}</span>
      <button class="vname" data-patient="${r.p.id}">${esc(r.p.name)}</button>
      ${r.lv != null ? levelPill(r.lv, " sm") : `<span class="pill neutral sm">chưa đánh giá</span>`}
      ${r.last ? `<span class="tag mono">Waterlow ${r.last.score}</span>` : ""}
    </div>
    <ul class="vlist">
      ${v.viec.map(x => `<li class="${x.gap ? "gap" : ""}">${esc(x.t)}</li>`).join("")}
    </ul>
    <div class="vact">${(() => {
      const nut = [];
      if (v.viec.some(x => x.k === "turn"))
        nut.push(`<button class="btn sm CLS" data-qturn="${r.ep.id}">Ghi xoay trở</button>`);
      if (v.viec.some(x => x.k === "assess"))
        nut.push(`<button class="btn sm CLS" data-qassess="${r.p.id}|${r.ep.id}">Đánh giá</button>`);
      nut.push(`<button class="btn sm CLS" data-patient="${r.p.id}">${
        v.viec.some(x => x.k === "flag") ? "Xem lưu ý" : "Mở hồ sơ"}</button>`);
      /* Nút đầu tiên là việc gấp nhất — luôn có một nút chính để bấm */
      return nut.map((h, i) => h.replace("CLS", i === 0 ? "pri" : "")).join("");
    })()}</div>
  </article>`;
}

/* Khối "Việc cần làm" thay cho bốn danh sách cũ */
function viecCanLamBlock(rows) {
  const ds = rows.map(r => ({ r, v: viecCuaNguoiBenh(r) }))
    .filter(x => x.v.viec.length)
    .sort((a, b) => b.v.uu - a.v.uu);

  if (!ds.length) {
    return `<section>
      <div class="card-h"><h2>Việc cần làm</h2></div>
      <div class="card"><div class="empty">
        Không còn việc nào đang nợ. Cả buồng đúng hạn đánh giá, đúng cữ xoay trở,
        và không có lưu ý nào chưa xử lý.</div></div>
    </section>`;
  }

  const hien = ds.slice(0, 6), con = ds.slice(6);
  const soGap = ds.filter(x => x.v.viec.some(y => y.gap)).length;

  return `<section id="viec-sec">
    <div class="card-h"><h2>Việc cần làm</h2>
      <span class="hint">${ds.length} người bệnh${soGap ? ` · ${soGap} đang trễ` : ""}</span></div>
    <div class="vwrap">${hien.map(x => dongViec(x.r, x.v)).join("")}</div>
    ${con.length ? `<div class="card" style="margin-top:10px;padding-top:2px">
      <details class="fold bare">
        <summary>${con.length} người bệnh còn lại<span class="fsum">việc chưa gấp</span></summary>
        <div class="foldin"><div class="vwrap">${con.map(x => dongViec(x.r, x.v)).join("")}</div></div>
      </details></div>` : ""}
  </section>`;
}

function bindViec() {
  $$("[data-patient]").forEach(b => b.onclick = () => Nav.go("patient", { id: b.dataset.patient }));
  $$("[data-qassess]").forEach(b => b.onclick = () => {
    const [pid, epid] = b.dataset.qassess.split("|");
    Nav.go("assess", { patientId: pid, episodeId: epid });
  });
}

<script>
/* ============================================================
   XUẤT BÁO CÁO — EXCEL (.xlsx) VÀ WORD (.docx)
   ------------------------------------------------------------
   Viết thẳng bằng JavaScript, KHÔNG dùng thư viện ngoài, để ứng
   dụng vẫn chạy được khi mất mạng. Cả hai định dạng đều là tệp
   nén ZIP chứa XML, nên chỉ cần một bộ đóng gói ZIP là đủ.

   Excel: dữ liệu thô nhiều sheet — để làm nghiên cứu, lọc, pivot.
   Word:  bản báo cáo có bố cục — để điều dưỡng trưởng sửa và nộp.
   ============================================================ */

/* ---------- Đóng gói ZIP (chế độ lưu thẳng, không nén) ---------- */
const CRC_TAB = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TAB[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipMake(files) {
  const enc = new TextEncoder();
  const parts = [], dir = [];
  let off = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const c = crc32(data);
    const head = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0), u16(0),
      u16(0), u16(0), u32(c), u32(data.length), u32(data.length),
      u16(name.length), u16(0));
    parts.push(new Uint8Array(head), name, data);
    dir.push({ name, crc: c, size: data.length, off });
    off += head.length + name.length + data.length;
  });

  const cen = [];
  let cenLen = 0;
  dir.forEach(d => {
    const h = [].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0), u16(0),
      u16(0), u16(0), u32(d.crc), u32(d.size), u32(d.size),
      u16(d.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(d.off));
    cen.push(new Uint8Array(h), d.name);
    cenLen += h.length + d.name.length;
  });
  cen.push(new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cenLen), u32(off), u16(0))));

  const all = parts.concat(cen);
  const total = all.reduce((n, a) => n + a.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(a => { out.set(a, p); p += a.length; });
  return out;
}

const xesc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");

function taiTep(name, bytes, mime) {
  const blob = new Blob([bytes], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ---------- EXCEL ----------
   sheets: [{ ten, cols:[{t,w}], rows:[[giá trị…]] }]
   Giá trị: số → ô số; Date → ô ngày; còn lại → chữ.            */
function xlsxMake(sheets) {
  const serial = d => (d.getTime() - d.getTimezoneOffset() * 60000) / 86400000 + 25569;
  const colName = n => { let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };

  const sheetXml = sh => {
    const cols = (sh.cols || []).map((c, i) =>
      `<col min="${i + 1}" max="${i + 1}" width="${c.w || 14}" customWidth="1"/>`).join("");
    const head = `<row r="1">${(sh.cols || []).map((c, i) =>
      `<c r="${colName(i)}1" s="2" t="inlineStr"><is><t>${xesc(c.t)}</t></is></c>`).join("")}</row>`;
    const body = sh.rows.map((row, ri) => `<row r="${ri + 2}">${row.map((v, ci) => {
      const ref = colName(ci) + (ri + 2);
      if (v == null || v === "" || (v && typeof v === "object" && !(v instanceof Date) && !v.__ngay)) return "";
      if (v && v.__ngay) return `<c r="${ref}" s="3"><v>${serial(v.__ngay)}</v></c>`;
      if (v instanceof Date) return `<c r="${ref}" s="1"><v>${serial(v)}</v></c>`;
      if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    }).join("")}</row>`).join("");
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
${cols ? `<cols>${cols}</cols>` : ""}<sheetData>${head}${body}</sheetData></worksheet>`;
  };

  const files = [
    { name: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>` },
    { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` },
    { name: "xl/workbook.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s, i) =>
  `<sheet name="${xesc(s.ten).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { name: "xl/styles.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="2"><numFmt numFmtId="164" formatCode="dd/mm/yyyy\\ hh:mm"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FFE2F0EF"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="4">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` }
  ];
  sheets.forEach((s, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s) }));
  return zipMake(files);
}

/* ---------- WORD ----------
   khoi: [{k:"h1"|"h2"|"p"|"note", t}] hoặc {k:"bang", head:[], rows:[[]]} */
function docxMake(tieuDe, khoi) {
  const p = (t, opt) => {
    const o = opt || {};
    return `<w:p><w:pPr>${o.style ? `<w:pStyle w:val="${o.style}"/>` : ""}
      ${o.space ? `<w:spacing w:before="${o.space}"/>` : ""}</w:pPr>
      <w:r><w:rPr>${o.b ? "<w:b/>" : ""}${o.i ? "<w:i/>" : ""}
        ${o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : ""}
        ${o.color ? `<w:color w:val="${o.color}"/>` : ""}</w:rPr>
      <w:t xml:space="preserve">${xesc(t)}</w:t></w:r></w:p>`;
  };
  const cell = (t, b, shade) => `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>
    ${shade ? `<w:shd w:val="clear" w:fill="${shade}"/>` : ""}</w:tcPr>
    <w:p><w:r><w:rPr>${b ? "<w:b/>" : ""}<w:sz w:val="20"/></w:rPr>
    <w:t xml:space="preserve">${xesc(t)}</w:t></w:r></w:p></w:tc>`;
  const table = (head, rows) => `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/>
    <w:tblW w:w="5000" w:type="pct"/><w:tblBorders>
    ${["top", "left", "bottom", "right", "insideH", "insideV"].map(s =>
      `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="BCD3D0"/>`).join("")}
    </w:tblBorders></w:tblPr>
    <w:tr>${head.map(h => cell(h, true, "E2F0EF")).join("")}</w:tr>
    ${rows.map(r => `<w:tr>${r.map(c => cell(c == null ? "" : String(c))).join("")}</w:tr>`).join("")}
    </w:tbl>${p("")}`;

  const body = khoi.map(b => {
    if (b.k === "bang") return table(b.head, b.rows);
    if (b.k === "h1") return p(b.t, { b: true, sz: 36, color: "0A5F5C", space: 240 });
    if (b.k === "h2") return p(b.t, { b: true, sz: 28, color: "0A5F5C", space: 240 });
    if (b.k === "note") return p(b.t, { i: true, sz: 18, color: "6B8185" });
    return p(b.t, { sz: 22 });
  }).join("");

  return zipMake([
    { name: "[Content_Types].xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>` },
    { name: "_rels/.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>` },
    { name: "word/_rels/document.xml.rels", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>` },
    { name: "word/styles.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>
<w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults>
<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/></w:style>
</w:styles>` },
    { name: "word/document.xml", data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>` }
  ]);
}

<script>
/* ============================================================
   NỘI DUNG BÁO CÁO — dựng từ kỳ đang xem trong tab Báo cáo
   ============================================================ */
const dOrNull = v => { if (!v) return ""; const d = dOf(v); return isNaN(d) ? "" : d; };
/* Ngày không kèm giờ — dựng ở nửa đêm giờ địa phương để Excel không lệch ngày */
function ngayOnly(v) {
  if (!v) return "";
  const d = dOf(v); if (isNaN(d)) return "";
  return { __ngay: new Date(d.getFullYear(), d.getMonth(), d.getDate()) };
}

function baoCaoSheets(m, win) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const inWin = t => { if (!t) return false; const x = dOf(t).getTime();
    return x >= win.from.getTime() && x <= win.to.getTime(); };
  const LV = i => (LEVELS[i] || {}).short || "";

  /* 1. Bộ chỉ số — cái điều dưỡng trưởng cần nhất */
  const chiSo = [
    ["Kỳ báo cáo", win.label],
    ["Ngày xuất", new Date()],
    ["Số người bệnh có mặt trong kỳ", m.eps.length],
    ["Tổng ngày nằm viện", Math.round(m.patientDays)],
    ["Số lượt đánh giá", m.asses.length],
    ["Loét mới phát sinh tại khoa", m.hapi.length],
    ["Trong đó do thiết bị y tế", m.mdrpi.length],
    ["Tỷ suất loét mới / 1000 ngày nằm", m.hapiRate == null ? "" : +m.hapiRate.toFixed(2)],
    ["Loét có sẵn khi vào khoa", m.poa.length],
    [`Tỷ lệ đánh giá trong ${st.firstAssessHours} giờ đầu (%)`, m.firstRate == null ? "" : Math.round(m.firstRate * 100)],
    ["Tỷ lệ đánh giá lại đúng hạn (%)", m.onTime == null ? "" : Math.round(m.onTime * 100)],
    ["Tuân thủ gói chăm sóc (%)", m.bundleRate == null ? "" : Math.round(m.bundleRate * 100)],
    ["Số lưu ý đã phát", m.flagsN],
    ["Thời gian trung bình tới khi tiếp nhận (phút)", m.accAvg == null ? "" : Math.round(m.accAvg / 60000)],
    ["Thời gian trung bình tới khi thực hiện xong (phút)", m.doneAvg == null ? "" : Math.round(m.doneAvg / 60000)]
  ];

  /* 2. Chỉ số theo tháng */
  const thang = m.months.map(x => [x.label, x.nhapKhoa, x.poa, x.hapi,
    +x.tyLe.toFixed(2), Math.round(x.patientDays), x.assessments,
    +x.rate.toFixed(2), Math.round(x.bundle)]);

  /* 3. Lượt đánh giá */
  const dg = DB.data.assessments.filter(a => inWin(a.at))
    .sort((a, b) => a.at.localeCompare(b.at)).map(a => {
      const p = DB.patient(a.patientId) || {}, e = DB.episode(a.episodeId) || {};
      const lv = a.level != null ? a.level : levelOf(a.score);
      const br = bundleRateOf(a);
      return [dOrNull(a.at), p.mrn, p.name, ngayOnly(p.dob), p.sex === "nu" ? "Nữ" : "Nam",
        e.bed, a.score, LV(lv), LV(a.careLevel != null ? a.careLevel : lv),
        (a.icu || []).length, (a.lesions || []).length + (a.mdrpi || []).length,
        (br ? br.xong : (a.bundle || []).length), (br ? br.tong : a.bundleTotal || 0),
        br ? Math.round(br.ty * 100) : "",
        DB.userName(a.userId), a.note || ""];
    });

  /* 4. Tổn thương — gộp cả hai nguồn: phiếu đánh giá đã ký và bản ghi tổn thương riêng */
  const ttNguon = [];
  DB.data.assessments.filter(a => inWin(a.at)).forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => ttNguon.push({
      at: a.at, patientId: a.patientId, by: a.userId, cach: "Trong phiếu đánh giá", l }));
  });
  (DB.data.lesionLogs || []).filter(x => inWin(x.at)).forEach(x => ttNguon.push({
    at: x.at, patientId: x.patientId, by: x.by,
    cach: x.kind === "capnhat" ? "Bản ghi cập nhật" : "Bản ghi tổn thương mới", l: x }));
  const tt = ttNguon.sort((a, b) => String(a.at).localeCompare(String(b.at))).map(x => {
    const p = DB.patient(x.patientId) || {}, l = x.l;
    return [ngayOnly(l.foundAt || x.at), dOrNull(x.at), p.mrn, p.name, l.site, "Độ " + l.stage,
      l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa", l.device || "",
      l.size || "", (l.photos || []).length, x.cach, DB.userName(x.by), l.note || ""];
  });

  /* 4b. Gói chăm sóc — từng lần đánh dấu, ai làm lúc nào */
  const gcsNguon = [];
  DB.data.assessments.filter(a => inWin(a.at)).forEach(a => {
    const lv = mucGoiCuaPhieu(a);
    (a.bundle || []).forEach(it => gcsNguon.push({
      at: a.at, patientId: a.patientId, by: a.userId, item: it, level: lv,
      done: true, cach: "Tích lúc ký phiếu" }));
  });
  (DB.data.bundleLogs || []).filter(b => inWin(b.at) && b.done !== false).forEach(b => gcsNguon.push({
    at: b.at, patientId: b.patientId, by: b.by, item: b.item, level: b.level,
    cach: "Đánh dấu trong ca" }));
  const gcs = gcsNguon.sort((a, b) => String(a.at).localeCompare(String(b.at))).map(x => {
    const p = DB.patient(x.patientId) || {};
    return [dOrNull(x.at), p.mrn, p.name, LV(x.level), x.item, x.cach, DB.userName(x.by)];
  });

  /* 4c. Khám da vùng tì đè — phiếu đầu ca */
  const CAT = {}; SHIFTS.forEach(c => CAT[c.v] = c.t);
  const kd = [];
  (DB.data.skinChecks || []).filter(k => inWin(k.at))
    .sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(k => {
      const p = DB.patient(k.patientId) || {};
      const chung = [KHAM_DA_CHUNG[0].opts[k.chung ? k.chung.nhiet : 0],
                     KHAM_DA_CHUNG[1].opts[k.chung ? k.chung.mo : 0],
                     KHAM_DA_CHUNG[2].opts[k.chung ? k.chung.camgiac : 0]];
      if (k.binhThuong || !(k.viTri || []).length) {
        kd.push([dOrNull(k.at), CAT[k.shift] || "", p.mrn, p.name, "Da bình thường",
          "", "", "", "", "", chung[0], chung[1], chung[2], k.note || "", DB.userName(k.by)]);
        return;
      }
      (k.viTri || []).forEach(v => kd.push([dOrNull(k.at), CAT[k.shift] || "", p.mrn, p.name,
        "Có bất thường", kdTen(v.k), v.size || "", KHAM_DA_SAU[v.sau] || "", v.stage || "",
        v.note || "", chung[0], chung[1], chung[2], k.note || "", DB.userName(k.by)]));
    });

  /* 5. Xoay trở */
  const POSN = {};
  POSITIONS.forEach(o => POSN[o.v] = o.t);
  const xt = (DB.data.turns || []).filter(t => inWin(t.at))
    .sort((a, b) => a.at.localeCompare(b.at)).map(t => {
      const p = DB.patient(t.patientId) || {}, e = DB.episode(t.episodeId) || {};
      return [dOrNull(t.at), p.mrn, p.name, e.bed,
        t.skipped ? "Chưa xoay được" : (POSN[t.pos] || t.pos || ""),
        t.skipped ? "" : (t.skinOk ? "Có" : "Không"),
        t.reason || "", t.note || "", DB.userName(t.by)];
    });

  /* 6. Cần lưu ý */
  const ST = { moi: "Mới", tiepnhan: "Đã tiếp nhận", xuly: "Đã thực hiện", dong: "Đã đóng" };
  const cl = DB.data.flags.filter(f => inWin(f.createdAt))
    .sort((a, b) => a.createdAt.localeCompare(b.createdAt)).map(f => {
      const p = DB.patient(f.patientId) || {};
      const ev = k => (f.events || []).find(e => e.type === k);
      const acc = ev("tiepnhan"), xl = ev("xuly"), dg2 = ev("dong");
      const phut = e => e ? Math.round((dOf(e.at) - dOf(f.createdAt)) / 60000) : "";
      return [dOrNull(f.createdAt), p.mrn, p.name, f.text,
        f.auto ? "Tự động" : DB.userName(f.createdBy), ST[f.status] || f.status,
        dOrNull(acc && acc.at), acc ? DB.userName(acc.by) : "",
        dOrNull(xl && xl.at), xl ? DB.userName(xl.by) : "", xl ? xl.text : "",
        dOrNull(dg2 && dg2.at), dg2 ? DB.userName(dg2.by) : "", phut(acc), phut(xl)];
    });

  return [
    { ten: "Bộ chỉ số", cols: [{ t: "Chỉ số", w: 44 }, { t: "Giá trị", w: 22 }], rows: chiSo },
    { ten: "Theo tháng", rows: thang, cols: [{ t: "Tháng", w: 10 },
      { t: "Người bệnh nhập khoa", w: 20 }, { t: "Loét tuyến trước", w: 16 },
      { t: "Loét mới tại khoa", w: 17 }, { t: "Tỷ lệ loét mới (%)", w: 17 },
      { t: "Ngày nằm viện", w: 14 }, { t: "Lượt đánh giá", w: 14 },
      { t: "Tỷ suất/1000 ngày", w: 17 }, { t: "Tuân thủ gói (%)", w: 16 }] },
    { ten: "Lượt đánh giá", rows: dg, cols: [{ t: "Thời điểm", w: 17 }, { t: "Mã hồ sơ", w: 13 },
      { t: "Họ tên", w: 22 }, { t: "Ngày sinh", w: 12 }, { t: "Giới", w: 7 }, { t: "Giường", w: 9 },
      { t: "Waterlow", w: 10 }, { t: "Mức nguy cơ", w: 16 }, { t: "Mức chăm sóc", w: 16 },
      { t: "Yếu tố hồi sức", w: 14 }, { t: "Số tổn thương", w: 14 }, { t: "Gói đã làm", w: 12 },
      { t: "Tổng mục gói", w: 13 }, { t: "Tuân thủ (%)", w: 13 }, { t: "Người đánh giá", w: 20 },
      { t: "Ghi chú", w: 34 }] },
    { ten: "Tổn thương", rows: tt, cols: [{ t: "Ngày phát hiện", w: 16 }, { t: "Thời điểm ghi", w: 17 },
      { t: "Mã hồ sơ", w: 13 },
      { t: "Họ tên", w: 22 }, { t: "Vị trí", w: 18 }, { t: "Phân độ", w: 10 }, { t: "Nguồn gốc", w: 20 },
      { t: "Thiết bị y tế", w: 16 }, { t: "Kích thước", w: 12 }, { t: "Số ảnh", w: 8 },
      { t: "Ghi bằng cách nào", w: 21 }, { t: "Người ghi nhận", w: 20 }, { t: "Mô tả", w: 34 }] },
    { ten: "Gói chăm sóc", rows: gcs, cols: [{ t: "Thời điểm", w: 17 }, { t: "Mã hồ sơ", w: 13 },
      { t: "Họ tên", w: 22 }, { t: "Mức chăm sóc", w: 16 }, { t: "Mục", w: 42 },
      { t: "Ghi bằng cách nào", w: 22 }, { t: "Người ghi", w: 20 }] },
    { ten: "Khám da", rows: kd, cols: [{ t: "Thời điểm", w: 17 }, { t: "Ca trực", w: 10 },
      { t: "Mã hồ sơ", w: 13 }, { t: "Họ tên", w: 22 }, { t: "Kết quả", w: 15 },
      { t: "Vị trí", w: 20 }, { t: "Kích thước", w: 12 }, { t: "Độ sâu", w: 26 },
      { t: "Phân độ", w: 10 }, { t: "Mô tả", w: 30 }, { t: "Nhiệt độ da", w: 20 },
      { t: "Độ chắc mô", w: 16 }, { t: "Cảm giác", w: 18 }, { t: "Ghi chú phiếu", w: 30 },
      { t: "Người khám", w: 20 }] },
    { ten: "Xoay trở", rows: xt, cols: [{ t: "Thời điểm", w: 17 }, { t: "Mã hồ sơ", w: 13 },
      { t: "Họ tên", w: 22 }, { t: "Giường", w: 9 }, { t: "Tư thế", w: 18 },
      { t: "Đã xem da", w: 11 }, { t: "Lý do chưa xoay", w: 24 }, { t: "Ghi chú", w: 26 },
      { t: "Người ghi", w: 20 }] },
    { ten: "Cần lưu ý", rows: cl, cols: [{ t: "Thời điểm phát", w: 17 }, { t: "Mã hồ sơ", w: 13 },
      { t: "Họ tên", w: 22 }, { t: "Nội dung", w: 40 }, { t: "Nguồn", w: 18 }, { t: "Trạng thái", w: 14 },
      { t: "Tiếp nhận lúc", w: 17 }, { t: "Người tiếp nhận", w: 20 }, { t: "Thực hiện lúc", w: 17 },
      { t: "Người thực hiện", w: 20 }, { t: "Nội dung thực hiện", w: 40 }, { t: "Đóng lúc", w: 17 },
      { t: "Người đóng", w: 20 }, { t: "Phút tới tiếp nhận", w: 17 }, { t: "Phút tới thực hiện", w: 17 }] }
  ];
}

function tenKy(win) {
  return win.from.getTime() <= 0 ? "toan-bo"
    : `${isoDay(win.from)}_den_${isoDay(new Date(win.to.getTime() - 1))}`;
}
function xuatExcel(m, win) {

    ["Đánh giá lại đúng hạn", pc(m.onTime), `${m.pairs} lượt đến hạn`],
    ["Tuân thủ gói chăm sóc", pc(m.bundleRate), `${m.asses.length} phiếu`]
  ]});

  k.push({ k: "h2", t: "4. Hiệu quả chuỗi cảnh báo" });

  if (m.months.length) {

      head: ["Tháng", "Ngày nằm", "Lượt đánh giá", "Loét có sẵn", "Loét mới", "Tỷ suất/1000", "Tuân thủ gói"],

  k.push({ k: "p", t: "" });
  k.push({ k: "bang", head: ["Người lập báo cáo", "Trưởng khoa"], rows: [["", ""], ["", ""]] });
  k.push({ k: "note", t: "Thang điểm Waterlow bản sửa đổi 2005 · Phân độ NPIAP/EPUAP · Các mốc thời gian và khoảng cách chăm sóc theo quy định của khoa." });

  const ten = `bao-cao-loet-ti-de_${tenKy(win)}.docx`;
  taiTep(ten, docxMake("Báo cáo loét tì đè", k),
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  DB.log("xuat-bao-cao", `Word — ${win.label}`);
}
