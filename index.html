  k.push({ k: "h2", t: "3. Chỉ số quá trình" });
  k.push({ k: "bang", head: ["Chỉ số", "Kết quả", "Mẫu số"], rows: [
    [`Đánh giá trong ${st.firstAssessHours} giờ đầu`, pc(m.firstRate), `${m.epsAdmN} lượt nhập khoa`],
    ["Đánh giá lại đúng hạn", pc(m.onTime), `${m.pairs} lượt đến hạn`],
    ["Tuân thủ gói chăm sóc", pc(m.bundleRate), `${m.asses.length} phiếu`]
  ]});

  k.push({ k: "h2", t: "4. Hiệu quả chuỗi cảnh báo" });
  k.push({ k: "bang", head: ["Chỉ số", "Kết quả"], rows: [
    ["Số lưu ý đã phát", m.flagsN],
    ["Trung bình từ cảnh báo tới tiếp nhận", fmtDur(m.accAvg)],
    ["Trung bình từ cảnh báo tới thực hiện xong", fmtDur(m.doneAvg)]
  ]});

  if (m.months.length) {
    k.push({ k: "h2", t: "5. Diễn biến theo tháng" });
    k.push({ k: "bang",
      head: ["Tháng", "Ngày nằm", "Lượt đánh giá", "Loét có sẵn", "Loét mới", "Tỷ suất/1000", "Tuân thủ gói"],
      rows: m.months.map(x => [x.label, Math.round(x.patientDays), x.assessments, x.poa, x.hapi,
        x.rate.toFixed(1), Math.round(x.bundle) + "%"]) });
  }

  k.push({ k: "h2", t: "6. Nhận xét" });
  k.push({ k: "p", t: "…" });
  k.push({ k: "h2", t: "7. Kết luận và kiến nghị" });
  k.push({ k: "p", t: "…" });
  k.push({ k: "p", t: "" });
  k.push({ k: "bang", head: ["Người lập báo cáo", "Trưởng khoa"], rows: [["", ""], ["", ""]] });
  k.push({ k: "note", t: "Thang điểm Waterlow bản sửa đổi 2005 · Phân độ NPIAP/EPUAP · Các mốc thời gian và khoảng cách chăm sóc theo quy định của khoa." });

  const ten = `bao-cao-loet-ti-de_${tenKy(win)}.docx`;
  taiTep(ten, docxMake("Báo cáo loét tì đè", k),
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  DB.log("xuat-bao-cao", `Word — ${win.label}`);
}
</script>
<script>
/* ============================================================
   DỮ LIỆU TRÌNH DIỄN + KHỞI ĐỘNG
   Toàn bộ người bệnh dưới đây là HƯ CẤU, dùng để trình bày đề án.
   Bấm “Xoá toàn bộ dữ liệu mẫu” trong Cài đặt trước khi bàn giao.
   ============================================================ */
function rngFrom(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
const HO = ["Nguyễn", "Trần", "Lê", "Phạm", "Huỳnh", "Võ", "Đặng", "Bùi", "Đỗ", "Hồ", "Ngô", "Dương", "Lý", "Phan"];
const DEM_NAM = ["Văn", "Hữu", "Minh", "Quốc", "Thanh", "Công", "Đức", "Tấn", "Hoàng"];
const DEM_NU = ["Thị", "Ngọc", "Thanh", "Kim", "Mỹ", "Thu", "Hồng"];
const TEN_NAM = ["An", "Bình", "Cường", "Dũng", "Hải", "Hùng", "Khoa", "Lâm", "Minh", "Nam", "Phúc", "Quang", "Sơn", "Tài", "Thắng", "Tuấn", "Vinh"];
const TEN_NU = ["Ánh", "Bích", "Chi", "Dung", "Hà", "Hạnh", "Hoa", "Lan", "Linh", "Mai", "Nga", "Nhung", "Oanh", "Phương", "Thuý", "Trang", "Yến"];
const DX = ["Viêm phổi nặng, suy hô hấp cấp", "Sốc nhiễm khuẩn từ đường tiêu hoá",
  "Nhiễm khuẩn huyết", "Sốt xuất huyết Dengue nặng", "Viêm màng não mủ",
  "Uốn ván toàn thể", "Đợt cấp bệnh phổi tắc nghẽn mạn tính", "Viêm não",
  "Sốc nhiễm khuẩn đường tiết niệu", "Suy đa tạng sau nhiễm khuẩn huyết",
  "Viêm phổi bệnh viện, thở máy kéo dài", "Nhiễm khuẩn huyết do Burkholderia"];

async function seedDemo() {
  const rnd = rngFrom(20260922);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const chance = p => rnd() < p;
  const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const salt = "khoa-hstc";
  const now = new Date();   // dữ liệu mẫu luôn tính theo thời điểm hiện tại

  DB.data = emptyDB();
  DB.data.meta.salt = salt;
  DB.data.settings = DEFAULT_SETTINGS();

  const mkUser = (name, username, role) => {
    const u = { id: uid("u"), name, username, role, pw: hashPw("123456", salt),
      active: true, demo: true, createdAt: new Date(now.getTime() - 200 * 86400000).toISOString() };
    DB.data.users.push(u); return u;
  };
  const ddt = mkUser("Nguyễn Thị Châu", "ddt.chau", "ddt");
  const nurses = [
    mkUser("Trần Văn An", "dd.an", "dd"),
    mkUser("Lê Thị Bình", "dd.binh", "dd"),
    mkUser("Phạm Thị Dung", "dd.dung", "dd"),
    mkUser("Huỳnh Minh Khoa", "dd.khoa", "dd")
  ];
  mkUser("Quản trị hệ thống", "admin", "admin");

  let mrnSeq = 40100;
  function mkPatient(demoFlag) {
    const nu = chance(0.46);
    const name = `${pick(HO)} ${nu ? pick(DEM_NU) : pick(DEM_NAM)} ${nu ? pick(TEN_NU) : pick(TEN_NAM)}`;
    const age = int(38, 89);
    const dob = new Date(now.getFullYear() - age, int(0, 11), int(1, 28));
    const p = { id: uid("p"), name, mrn: "26-0" + (mrnSeq++), dob: isoDay(dob),
      sex: nu ? "nu" : "nam", createdAt: now.toISOString(), demo: true };
    DB.data.patients.push(p);
    return p;
  }

  /* --- Bộ trả lời Waterlow thực tế cho người bệnh hồi sức --- */
  function mkAnswers(p, severity) {
    const ans = {};
    WATERLOW.forEach(b => { ans[b.key] = b.multi ? [] : null; });
    const age = ageFrom(p.dob);
    ans.sex = p.sex === "nu" ? 1 : 0;
    ans.age = ageBandIndex(age) ?? 2;
    ans.build = chance(0.5) ? 0 : chance(0.6) ? 3 : 1;
    ans.skin = [];
    if (severity >= 2 && chance(0.7)) ans.skin.push(3);           // phù nề
    if (chance(0.5)) ans.skin.push(4);                            // ẩm / sốt
    if (severity >= 2 && chance(0.35)) ans.skin.push(5);          // đổi màu độ I
    if (!ans.skin.length) ans.skin.push(0);
    ans.cont = severity >= 2 ? (chance(0.5) ? 3 : 1) : int(0, 1);
    ans.mob = severity >= 3 ? 4 : severity === 2 ? (chance(0.6) ? 4 : 3) : int(2, 3);
    ans.tissue = [];
    if (severity >= 3) ans.tissue.push(chance(0.5) ? 1 : 2);
    else if (severity === 2 && chance(0.6)) ans.tissue.push(2);
    if (chance(0.25)) ans.tissue.push(4);
    if (chance(0.2)) ans.tissue.push(5);
    ans.neuro = chance(0.35) ? int(1, 2) : 0;
    ans.surg = severity >= 2 && chance(0.25) ? [1] : [];
    ans.med = chance(0.3) ? [1] : [];
    ans.mst = { a: chance(0.55) ? "co" : chance(0.5) ? "khongro" : "khong",
      b: null, c: chance(0.6) ? 1 : 0 };
    if (ans.mst.a === "co") ans.mst.b = int(0, 2);
    return ans;
  }

  function mkICU(severity) {
    const out = [];
    const pool = ICU_FACTORS.slice();
    const n = severity >= 3 ? int(3, 6) : severity === 2 ? int(1, 3) : int(0, 1);
    for (let i = 0; i < n; i++) {
      const f = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
      if (f) out.push(f);
    }
    return out;
  }

  function addAssessment(p, ep, at, severity, nurse, lesions, mdrpi) {
    const ans = mkAnswers(p, severity);
    const r = scoreWaterlow(ans);
    const lv = levelOf(r.total);
    const icu = mkICU(severity);
    const draft = { score: r.total, level: lv, icu, lesions: lesions || [], mdrpi: mdrpi || [] };
    const clv = careLevelOf(draft);
    const items = bundleFor(clv);
    // Tuân thủ tăng dần theo thời gian — phản ánh quá trình cải tiến
    const monthsAgo = (now - at) / (30 * 86400000);
    const comp = Math.max(0.35, Math.min(0.97, 0.52 + (6 - monthsAgo) * 0.065 + (rnd() - 0.5) * 0.16));
    const done = items.filter(() => rnd() < comp);
    const a = {
      id: uid("as"), patientId: p.id, episodeId: ep.id, userId: nurse.id,
      at: at.toISOString(), signedBy: nurse.name,
      answers: ans, detail: r.detail, score: r.total, level: lv, careLevel: clv,
      icu, lesions: lesions || [], mdrpi: mdrpi || [],
      bundle: done, bundleTotal: items.length, note: "", locked: true, appVer: APP_VER, demo: true
    };
    DB.data.assessments.push(a);
    return a;
  }

  const mkLesion = (site, stage, poa, at, note) => ({
    site, stage, poa, size: `${int(1, 5)} × ${int(1, 4)} cm`, note: note || "",
    foundAt: at.toISOString(), photos: []
  });

  /* --- Các đợt điều trị đã kết thúc trong 6 tháng qua --- */
  const HAPI_PER_MONTH = [5, 4, 4, 3, 2, 0]; // 6 tháng gần nhất, xu hướng giảm dần
  const SITE_POOL = ["Vùng cùng cụt", "Gót chân trái", "Gót chân phải", "Vùng chẩm", "Mấu chuyển lớn phải"];

  for (let mi = 0; mi < 6; mi++) {
    const mStart = new Date(now.getFullYear(), now.getMonth() - (5 - mi), 1, 8, 0, 0);
    const nAdm = 22;
    let hapiLeft = HAPI_PER_MONTH[mi];
    for (let k = 0; k < nAdm; k++) {
      const p = mkPatient();
      const adm = new Date(mStart.getTime() + int(0, 26) * 86400000 + int(0, 20) * 3600000);
      if (adm > now) continue;
      const los = int(3, 15);
      const dis = new Date(Math.min(now.getTime() - 86400000, adm.getTime() + los * 86400000));
      if (dis <= adm) continue;
      const ep = { id: uid("e"), patientId: p.id, admittedAt: adm.toISOString(),
        dischargedAt: dis.toISOString(), bed: "HS-" + pad(int(1, 16)),
        diagnosis: pick(DX), admittedBy: pick(nurses).id, dischargedBy: pick(nurses).id,
        dischargeType: chance(0.12) ? "Tử vong" : chance(0.5) ? "Chuyển khoa" : "Ra viện", demo: true };
      DB.data.episodes.push(ep);

      const severity = chance(0.3) ? 3 : chance(0.6) ? 2 : 1;
      // Mức tuân thủ tiến bộ dần qua 6 tháng — đây chính là câu chuyện cải tiến
      const pOnTime = 0.40 + mi * 0.10;
      const hrs = DB.data.settings.reassessHours[severity] || 24;
      let lesions = [];
      const willHapi = hapiLeft > 0 && severity >= 2 && chance(0.45);
      if (willHapi) hapiLeft--;
      if (chance(0.08)) lesions = [mkLesion(pick(SITE_POOL), chance(0.6) ? "I" : "II", true, adm,
        "Ghi nhận ngay khi tiếp nhận từ khoa khác")];

      // Lần đầu: trong hay ngoài hạn quy định
      const firstH = DB.data.settings.firstAssessHours;
      let t = new Date(adm.getTime() + (rnd() < 0.55 + mi * 0.075
        ? int(1, Math.max(2, firstH - 1)) : firstH + int(2, 20)) * 3600000);
      let count = 0, hapiPlaced = false;
      while (t <= dis && count < 10) {
        if (willHapi && !hapiPlaced && count >= 1 && (chance(0.45) || count === 4)) {
          lesions = lesions.concat([mkLesion(pick(SITE_POOL), chance(0.7) ? "I" : "II", false, t,
            "Phát hiện khi vệ sinh và xoay trở")]);
          hapiPlaced = true;
        }
        const a = addAssessment(p, ep, t, severity, pick(nurses), lesions.slice(), []);
        count++;
        const h = DB.data.settings.reassessHours[a.level] || hrs;
        const gap = rnd() < pOnTime ? h * (0.55 + rnd() * 0.40) : h * (1.25 + rnd() * 1.4);
        t = new Date(t.getTime() + gap * 3600000);
      }
    }
  }

  /* --- Người bệnh đang điều trị --- */
  const current = [];
  const profiles = [
    { sev: 3, days: 9,  overdue: true,  lesion: "sacrum" },
    { sev: 3, days: 5,  overdue: false, lesion: "mdrpi" },
    { sev: 2, days: 12, overdue: false, lesion: null },
    { sev: 2, days: 3,  overdue: true,  lesion: null },
    { sev: 3, days: 7,  overdue: false, lesion: null },
    { sev: 1, days: 2,  overdue: false, lesion: null },
    { sev: 2, days: 6,  overdue: false, lesion: null },
    { sev: 2, days: 4,  overdue: false, lesion: null },
    { sev: 1, days: 1,  overdue: false, lesion: null, noAssess: true },
    { sev: 3, days: 11, overdue: false, lesion: "poa" },
    { sev: 2, days: 8,  overdue: false, lesion: null },
    { sev: 1, days: 5,  overdue: false, lesion: null }
  ];
  let sacrumPatient = null, sacrumAssessments = [];

  profiles.forEach((pr, idx) => {
    const p = mkPatient();
    const adm = new Date(now.getTime() - pr.days * 86400000 - int(0, 10) * 3600000);
    const ep = { id: uid("e"), patientId: p.id, admittedAt: adm.toISOString(), dischargedAt: null,
      bed: "HS-" + pad(idx + 1), diagnosis: DX[idx % DX.length], admittedBy: pick(nurses).id, demo: true };
    DB.data.episodes.push(ep);
    current.push({ p, ep, pr });
    if (pr.noAssess) return;

    let lesions = [], mdrpi = [];
    if (pr.lesion === "poa") lesions = [mkLesion("Vùng cùng cụt", "II", true, adm, "Đã có khi chuyển từ tuyến trước")];
    // Đi tới theo đúng tần suất của mức nguy cơ, lượt cuối rơi đúng mốc mong muốn
    const lastAt = pr.overdue ? new Date(now.getTime() - int(20, 36) * 3600000)
                              : new Date(now.getTime() - int(2, 7) * 3600000);
    const firstH = DB.data.settings.firstAssessHours;
    const times = [new Date(adm.getTime() + int(1, Math.max(2, firstH - 2)) * 3600000)];
    let guard = 0;
    while (guard++ < 40) {
      const prevLv = pr.sev;
      const h = DB.data.settings.reassessHours[prevLv] || 24;
      const nxt = new Date(times[times.length - 1].getTime() + h * (0.6 + rnd() * 0.36) * 3600000);
      if (nxt >= lastAt) break;
      times.push(nxt);
    }
    // Giữ tối đa 6 mốc gần nhất cho gọn, mốc đầu luôn là lần đánh giá đầu tiên
    const trimmed = times.length > 5 ? [times[0]].concat(times.slice(-4)) : times;
    trimmed.push(lastAt);
    const nAss = trimmed.length;
    for (let i = 0; i < nAss; i++) {
      const at = trimmed[i];
      if (pr.lesion === "sacrum" && i === nAss - 2) {
        lesions = lesions.concat([mkLesion("Vùng cùng cụt", "I", false, at,
          "Hồng ban không mất màu khi ấn, đường kính khoảng 3 cm")]);
      }
      if (pr.lesion === "mdrpi" && i === nAss - 1) {
        mdrpi = [{ ...mkLesion("Vành tai trái", "I", false, at, "Do dây oxy gọng mũi tì lâu"),
          device: "Dây thở oxy qua mũi" }];
      }
      const a = addAssessment(p, ep, at, pr.sev, pick(nurses), lesions.slice(), mdrpi.slice());
      if (i === nAss - 1 && pr.lesion === "sacrum") a.note = "Đã kê gót chân treo, đặt đệm hơi, hẹn kiểm tra lại lúc 14 giờ.";
      if (pr.lesion === "sacrum") { sacrumPatient = p; sacrumAssessments.push(a); }
    }
  });

  /* --- BẢN THỬ: xoay trở theo CỮ CỐ ĐỊNH trong 30 giờ qua --- */
  const POS_CYCLE = ["ngua", "ngtrai", "ngua", "ngphai"];
  const S = DEFAULT_SETTINGS();
  current.forEach((c, idx) => {
    const last = DB.lastAssessment(c.ep.id);
    const clv = last ? careLevelOf(last) : 1;
    const every = clv >= S.turnHighFrom ? S.turnEveryHoursHigh : S.turnEveryHours;
    const from = Math.max(dOf(c.ep.admittedAt).getTime() + 30 * 60000, now.getTime() - 30 * 3600000);
    /* Dựng các mốc xoay cách nhau đúng khoảng mục tiêu, lệch ngẫu nhiên cho giống thật */
    const slots = [];
    for (let t = from; t < now.getTime(); t += every * 3600000) slots.push(t);
    // ba ca để trống cữ gần nhất — cảnh "đang tới cữ mà chưa ai ghi"
    const leaveOpen = (idx === 0 || idx === 3 || idx === 6) ? 1 : 0;
    slots.slice(0, slots.length - leaveOpen).forEach((s, i) => {
      if (chance(0.06)) return;                       // bỏ cữ, không ghi gì
      const nurse = pick(nurses);
      if (chance(0.05)) {                             // có ghi nhưng chưa xoay được
        DB.data.turns.push({
          id: uid("t"), patientId: c.p.id, episodeId: c.ep.id,
          at: new Date(s + int(5, 30) * 60000).toISOString(),
          pos: null, skipped: true, by: nurse.id, skinOk: false,
          reason: pick(TURN_REASONS.slice(0, 4)), note: "", demo: true
        });
        return;
      }
      // đa số ghi quanh mốc cữ, thỉnh thoảng trễ vì kẹt việc
      const offset = chance(0.15) ? int(50, 95) : int(-8, 28);
      DB.data.turns.push({
        id: uid("t"), patientId: c.p.id, episodeId: c.ep.id,
        at: new Date(s + offset * 60000).toISOString(),
        pos: POS_CYCLE[(idx + i) % POS_CYCLE.length], skipped: false,
        by: nurse.id, skinOk: chance(0.84),
        reason: offset > 45 ? pick(TURN_REASONS.slice(0, 3)) : "",
        note: chance(0.14) ? pick([
          "Da vùng cùng cụt hồng nhạt, mất màu khi ấn.",
          "Đã kê gối chèn hông, gót chân treo tự do.",
          "Kiểm tra da dưới dây cố định ống nội khí quản, chưa thấy bất thường.",
          "Thay drap do ẩm, đã dùng kem bảo vệ da."
        ]) : "",
        demo: true
      });
    });
  });

  /* --- BẢN THỬ: trạng thái liền thương --- */
  const cPoa = current.find(c => c.pr.lesion === "poa");
  if (cPoa) {
    const les = lesionsOfEpisode(cPoa.ep.id)[0];
    if (les) {
      const at = new Date(now.getTime() - 26 * 3600000);
      DB.data.lesionStates.push({
        id: uid("ls"), key: les.key, episodeId: cPoa.ep.id, site: les.site, device: "",
        status: "lanh", at: at.toISOString(), by: nurses[1].id,
        note: "Da đã liền kín, không còn hồng ban, sờ không thấy cứng. Đã đối chiếu ảnh chụp lúc nhập khoa.",
        updatedAt: at.toISOString(),
        history: [
          { status: "caithien", at: new Date(at.getTime() - 40 * 3600000).toISOString(), by: nurses[2].id,
            note: "Hồng ban nhạt dần, đường kính còn khoảng 1,5 cm." },
          { status: "lanh", at: at.toISOString(), by: nurses[1].id,
            note: "Da đã liền kín, không còn hồng ban, sờ không thấy cứng." }
        ], demo: true
      });
    }
  }
  const cSac = current.find(c => c.pr.lesion === "sacrum");
  if (cSac) {
    const les = lesionsOfEpisode(cSac.ep.id)[0];
    if (les) {
      const at = new Date(now.getTime() - 5 * 3600000);
      DB.data.lesionStates.push({
        id: uid("ls"), key: les.key, episodeId: cSac.ep.id, site: les.site, device: "",
        status: "caithien", at: at.toISOString(), by: nurses[0].id,
        note: "Vùng hồng ban thu nhỏ còn khoảng 2 cm, đã mất màu khi ấn nhẹ. Tiếp tục băng bọt xốp.",
        updatedAt: at.toISOString(),
        history: [
          { status: "theodoi", at: new Date(at.getTime() - 22 * 3600000).toISOString(), by: nurses[1].id,
            note: "Hồng ban khoảng 3 cm, không mất màu khi ấn. Đã dán băng bọt xốp và kê gót treo." },
          { status: "caithien", at: at.toISOString(), by: nurses[0].id,
            note: "Vùng hồng ban thu nhỏ còn khoảng 2 cm, đã mất màu khi ấn nhẹ." }
        ], demo: true
      });
    }
  }

  /* --- BẢN THỬ: sổ giao ban ~2 tuần trước, để điều dưỡng trưởng xem lại --- */
  (function () {
    const base = buildHandoverBody(currentShift(now), now);
    for (let d = 16; d >= 1; d--) {
      SHIFTS.forEach((sh, si) => {
        const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d, sh.from, 30);
        const { start, end } = shiftRange(sh, day);
        if (start > now) return;
        if (chance(0.07)) return;                       // vài ca không ai chốt — để thấy chỗ hổng
        const giao = nurses[(d + si) % nurses.length];
        const nhan = nurses[(d + si + 1) % nurses.length];
        const at = new Date(end.getTime() - int(5, 25) * 60000);
        const nhanRoi = !chance(0.12);                  // đa số có người nhận
        DB.data.handovers.push({
          id: uid("ho"), at: at.toISOString(), shift: sh.v, shiftName: sh.t,
          day: isoDay(start), by: giao.id,
          note: chance(0.4) ? pick([
            "Đệm hơi giường HS-05 đã thay mới.",
            "Người nhà giường HS-09 xin hỗ trợ xoay trở ban đêm.",
            "Băng bọt xốp còn ít, đã báo kho.",
            "Hai ca nằm sấp, lưu ý kiểm tra vùng trán và gò má."
          ]) : "",
          receivedBy: nhanRoi ? nhan.id : null,
          receivedAt: nhanRoi ? new Date(at.getTime() + int(3, 24) * 60000).toISOString() : null,
          receiveNote: nhanRoi && chance(0.35) ? "Đã nhận, sẽ kiểm tra các điểm tì ngay đầu ca." : "",
          body: Object.assign({}, base, {
            shift: sh.v, shiftName: sh.t, from: sh.from, to: sh.to,
            day: isoDay(start), start: start.toISOString(), end: end.toISOString(),
            cases: base.cases.slice(0, int(2, 4)), others: base.others.slice(0, int(5, 9)),
            sum: Object.assign({}, base.sum, {
              moiphatsinh: chance(0.12) ? 1 : 0, quahandg: int(0, 3), quahanxt: int(0, 4),
              luotxt: int(18, 34), luotdg: int(2, 7), lanh: chance(0.15) ? 1 : 0, nhapmoi: int(0, 2)
            })
          }),
          demo: true
        });
      });
    }
  })();

  /* --- BẢN THỬ: ca vừa rồi đã bàn giao xong (có cả chữ ký giao và nhận) --- */
  (function () {
    const prev = new Date(now.getTime() - 8 * 3600000);
    const sh = currentShift(prev);
    DB.data.handovers.push({
      id: uid("ho"), at: prev.toISOString(), shift: sh.v, shiftName: sh.t,
      day: isoDay(shiftRange(sh, prev).start), by: nurses[2].id,
      note: "Giường HS-07 máy đệm hơi kêu, đã báo phòng vật tư. Người nhà giường HS-03 đã được hướng dẫn cách phụ xoay trở.",
      receivedBy: nurses[0].id,
      receivedAt: new Date(prev.getTime() + 11 * 60000).toISOString(),
      receiveNote: "Đã nhận. Sẽ kiểm tra lại vùng cùng cụt giường HS-01 ngay đầu ca.",
      body: buildHandoverBody(sh, prev),
      demo: true
    });
  })();

  /* --- BẢN THỬ: vài dặn dò điều dưỡng tự ghi trong ca đang trực --- */
  (function () {
    const sh = currentShift(now);
    const day = isoDay(shiftRange(sh, now).start);
    const mk = (c, text, byIdx, hoursAgo) => {
      if (!c) return;
      DB.data.handoverNotes.push({
        id: uid("hn"), episodeId: c.ep.id, patientId: c.p.id, day, shift: sh.v,
        text, by: nurses[byIdx].id,
        at: new Date(now.getTime() - hoursAgo * 3600000).toISOString(), demo: true
      });
    };
    mk(current.find(c => c.pr.lesion === "sacrum"),
      "Nghiêng trái thì SpO₂ tụt còn 88%, chỉ nghiêng phải và nửa ngồi. Đã báo bác sĩ, có y lệnh theo dõi sát.", 0, 2.5);
    mk(current.find(c => c.pr.overdue),
      "Người nhà đã được hướng dẫn cách phụ đỡ khi xoay trở, ca đêm có thể nhờ hỗ trợ. Da vùng gò má bên phải hơi đỏ sau khi nằm sấp.", 1, 1.2);
  })();

  /* --- Ảnh minh hoạ cho một ca, để trình diễn tính năng so sánh --- */
  if (sacrumPatient && DB.data.settings.photosEnabled) {
    const withLesion = sacrumAssessments.filter(a => (a.lesions || []).length);
    for (let i = 0; i < withLesion.length; i++) {
      const a = withLesion[i];
      const id = uid("ph");
      const dataUrl = placeholderPhoto(sacrumPatient.mrn, new Date(a.at), i + 1);
      const ok = await Photos.put(id, dataUrl);
      if (ok) a.lesions[0].photos = [{ id, at: a.at, by: a.userId }];
    }
  }

  /* --- Chuỗi cần lưu ý --- */
  const f1 = current.find(c => c.pr.lesion === "sacrum");
  const f2 = current.find(c => c.pr.sev === 3 && c !== f1);
  const f3 = current.find(c => c.pr.overdue && c !== f1);

  if (f1) {
    const t0 = new Date(now.getTime() - 3 * 3600000);
    const fl = { id: uid("f"), patientId: f1.p.id, episodeId: f1.ep.id,
      text: "Theo dõi sát vùng cùng cụt và hai gót chân, báo ngay nếu vùng đỏ lan rộng hoặc xuất hiện bóng nước.",
      priority: 3, auto: false, kind: "manual", createdBy: ddt.id, createdAt: t0.toISOString(),
      status: "dong", demo: true, events: [
        { by: ddt.id, at: t0.toISOString(), type: "tao",
          text: "Theo dõi sát vùng cùng cụt và hai gót chân, báo ngay nếu vùng đỏ lan rộng hoặc xuất hiện bóng nước." },
        { by: nurses[0].id, at: new Date(t0.getTime() + 14 * 60000).toISOString(), type: "tiepnhan",
          text: "Đã nhận thông tin, sẽ kiểm tra trong lượt xoay trở 10 giờ." },
        { by: nurses[0].id, at: new Date(t0.getTime() + 25 * 60000).toISOString(), type: "xuly",
          text: "Đã kiểm tra vùng cùng cụt: hồng ban độ I, chưa có tổn thương hở. Đã dán băng bọt xốp và kê gót chân treo." },
        { by: ddt.id, at: new Date(t0.getTime() + 52 * 60000).toISOString(), type: "dong",
          text: "Đã xem ảnh và xác nhận. Duy trì gói chăm sóc mức nguy cơ rất cao." }
      ]};
    DB.data.flags.push(fl);
  }
  if (f2) {
    const la = DB.lastAssessment(f2.ep.id);
    const t0 = new Date(now.getTime() - 70 * 60000);
    DB.data.flags.push({ id: uid("f"), patientId: f2.p.id, episodeId: f2.ep.id,
      text: `Waterlow ${la ? la.score : 22} — nguy cơ rất cao. Áp dụng gói chăm sóc mức nguy cơ rất cao và kiểm tra điểm tì mỗi 8 giờ.`,
      priority: 3, auto: true, kind: "vhigh", createdBy: null, createdAt: t0.toISOString(),
      status: "tiepnhan", demo: true, events: [
        { by: null, at: t0.toISOString(), type: "tao", text: `Hệ thống phát hiện điểm Waterlow ${la ? la.score : 22} — nguy cơ rất cao.` },
        { by: nurses[1].id, at: new Date(t0.getTime() + 21 * 60000).toISOString(), type: "tiepnhan",
          text: "Đã tiếp nhận, đang chuẩn bị đệm động giảm áp." }
      ]});
  }
  if (f3) {
    const t0 = new Date(now.getTime() - 22 * 60000);
    DB.data.flags.push({ id: uid("f"), patientId: f3.p.id, episodeId: f3.ep.id,
      text: "Người bệnh nằm sấp từ 6 giờ sáng — kiểm tra kỹ vùng trán, gò má, ngực và hai gối, ghi nhận bằng ảnh nếu có hồng ban.",
      priority: 2, auto: false, kind: "manual", createdBy: ddt.id, createdAt: t0.toISOString(),
      status: "moi", demo: true, events: [
        { by: ddt.id, at: t0.toISOString(), type: "tao",
          text: "Người bệnh nằm sấp từ 6 giờ sáng — kiểm tra kỹ vùng trán, gò má, ngực và hai gối, ghi nhận bằng ảnh nếu có hồng ban." }
      ]});
  }

  DB.data.audit.push({ id: uid("a"), at: now.toISOString(), userId: null, userName: "Hệ thống",
    action: "tao-du-lieu-mau", detail: "Khởi tạo dữ liệu trình diễn (người bệnh hư cấu)", entity: "", entityId: "" });
  DB.saveLocal();
}

/* Ảnh minh hoạ trung tính — KHÔNG phải ảnh lâm sàng thật */
function placeholderPhoto(mrn, date, seq) {
  const cv = document.createElement("canvas");
  cv.width = 640; cv.height = 640;
  const cx = cv.getContext("2d");
  const g = cx.createLinearGradient(0, 0, 640, 640);
  g.addColorStop(0, "#e9e2dc"); g.addColorStop(1, "#d6cdc6");
  cx.fillStyle = g; cx.fillRect(0, 0, 640, 640);
  cx.strokeStyle = "rgba(122,53,23,.35)"; cx.lineWidth = 3;
  cx.setLineDash([9, 7]);
  cx.beginPath(); cx.ellipse(320, 300, 110 - seq * 14, 82 - seq * 10, 0.3, 0, Math.PI * 2); cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle = "#6b5a50";
  cx.font = "600 30px ui-sans-serif, system-ui, sans-serif";
  cx.textAlign = "center";
  cx.fillText("ẢNH MINH HOẠ", 320, 150);
  cx.font = "400 21px ui-sans-serif, system-ui, sans-serif";
  cx.fillText("dữ liệu mẫu, không phải ảnh lâm sàng", 320, 186);
  cx.fillText("Lần ghi nhận thứ " + seq, 320, 470);
  const stamp = `${mrn} · ${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  cx.font = "600 20px ui-monospace, monospace";
  cx.textAlign = "left";
  cx.fillStyle = "rgba(0,0,0,.6)";
  const w = cx.measureText(stamp).width;
  cx.fillRect(0, 640 - 44, w + 28, 44);
  cx.fillStyle = "#fff";
  cx.fillText(stamp, 14, 640 - 15);
  return cv.toDataURL("image/jpeg", 0.7);
}

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
(async function boot() {
  try {
    const t = localStorage.getItem("ltd_theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

  await DB.boot();

  // BẢN THỬ: luôn chạy trên dữ liệu hư cấu, tạo sẵn để xem ngay, không nối máy chủ nào.
  if (PREVIEW && !DB.data.users.length) await seedDemo();
  if (!DB.data.settings) { DB.data.settings = DEFAULT_SETTINGS(); DB.saveLocal(); }
  // Máy đã cài bản cũ: bổ sung các cài đặt mới, giữ nguyên cài đặt cũ
  if (DB.data.settings && DB.data.settings.turnEveryHours == null) {
    Object.assign(DB.data.settings, {
      turnAnchorHour: 7, turnEveryHours: 3, turnEveryHoursHigh: 2, turnHighFrom: 2, turnGraceMin: 45
    });
    DB.saveLocal();
  }

  Session.restore();
  render();

  if (DB.invitedFresh) {
    if (DB.data.users.length) {
      toast("Đã nối vào kho dữ liệu chung của khoa. Đăng nhập bằng tài khoản của bạn.", "ok", 7000);
    } else {
      toast("Chưa lấy được dữ liệu từ máy chủ. Kiểm tra mạng rồi mở lại ứng dụng.", "err", 8000);
    }
  } else if (DB.inviteSame) {
    toast("Máy này đã nối đúng kho dữ liệu của khoa rồi.", "ok", 5000);
  } else if (DB.invitePending) {
    const url = DB.invitePending; DB.invitePending = null;
    modal({
      title: "Nối máy này vào kho dữ liệu của khoa",
      body: `<div class="notice"><svg><use href="#i-info"/></svg>
          <span>Bạn vừa mở một <b>link mời</b>. Máy này đang dùng một kho dữ liệu khác.</span></div>
        <p style="font-size:14px;line-height:1.55">Chọn <b>Lấy dữ liệu của khoa về</b> nếu đây là điện thoại
        sẽ dùng để làm việc tại khoa. Dữ liệu hiện có trên máy này (kể cả dữ liệu mẫu) sẽ bị thay thế.</p>`,
      actions: [{ label: "Để nguyên" }, { label: "Lấy dữ liệu của khoa về", kind: "pri", onClick: async () => {
        try {
          const server = await DB.peek(url);
          if (!server) { toast("Máy chủ chưa có dữ liệu", "err", 5000); return; }
          CFG.write({ mode: "sheet", url });
          DB.mode = "sheet"; DB.url = url;
          DB.adopt(server); DB.dirty = false;
          try { localStorage.removeItem("ltd_dirty"); } catch (e) {}
          toast("Đã nối vào kho dữ liệu của khoa. Đăng nhập bằng tài khoản của bạn.", "ok", 7000);
          render();
        } catch (e) { toast("Không kết nối được máy chủ: " + e.message, "err", 7000); }
      }}]
    });
  }

  // Làm mới định kỳ để cập nhật hạn đánh giá và đồng bộ
  setInterval(() => {
    if (!Session.user) return;
    if (DB.mode === "sheet") DB.sync();
    else if (["home", "flags", "patients"].includes(Nav.cur.name)) render();
  }, 60000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Session.user && DB.mode === "sheet") DB.sync();
  });
})();
</script>
<script>
/* ============================================================
   Cài đặt ứng dụng vào màn hình chính (PWA)
   ============================================================ */
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", function () {
          if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdateBar(nw);
        });
      });
      // Kiểm tra bản mới mỗi khi mở lại ứng dụng
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) reg.update().catch(function () {});
      });
    }).catch(function () {});
  });

  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return; reloading = true; location.reload();
  });

  function showUpdateBar(worker) {
    if (document.getElementById("updatebar")) return;
    var bar = document.createElement("div");
    bar.id = "updatebar";
    bar.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));" +
      "z-index:600;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;" +
      "display:flex;align-items:center;gap:10px;font-size:13.5px;box-shadow:0 12px 32px -12px rgba(0,0,0,.5);max-width:440px;margin:0 auto";
    bar.innerHTML = '<span style="flex:1">Đã có bản cập nhật của ứng dụng.</span>' +
      '<button style="border:0;border-radius:9px;padding:7px 13px;font-weight:600;' +
      'background:var(--accent);color:var(--accent-ink);font-family:inherit;font-size:13.5px">Cập nhật</button>';
    bar.querySelector("button").onclick = function () {
      bar.remove();
      worker.postMessage({ type: "SKIP_WAITING" });
    };
    document.body.appendChild(bar);
  }

  /* Android: hiện nút cài đặt ngay trong ứng dụng */
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    var b = document.createElement("button");
    b.textContent = "Cài ứng dụng vào màn hình chính";
    b.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));" +
      "z-index:600;border:0;border-radius:12px;padding:13px;font-weight:600;font-family:inherit;font-size:14px;" +
      "background:var(--accent);color:var(--accent-ink);box-shadow:0 12px 32px -12px rgba(0,0,0,.45);max-width:440px;margin:0 auto";
    b.onclick = function () { b.remove(); deferred.prompt(); deferred = null; };
    setTimeout(function () { if (deferred) document.body.appendChild(b); }, 2500);
    setTimeout(function () { if (b.parentNode) b.remove(); }, 18000);
  });
})();
</script>
