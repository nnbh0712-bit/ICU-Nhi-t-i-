function missingAnswers() {
  const out = [];
  WATERLOW.forEach(b => {
    const s = AS.ans[b.key];
    if (b.multi) { if (!(s || []).length && b.key !== "med" && b.key !== "surg" && b.key !== "tissue") out.push(b.title); }
    else if (s == null) out.push(b.title);
  });
  if (!AS.ans.mst || AS.ans.mst.a == null) out.push("Sàng lọc dinh dưỡng");
  return out;
}

/* ---------- Gắn sự kiện theo bước ---------- */
function bindStep() {
  // Waterlow
  $$("[data-opt]").forEach(btn => btn.onclick = () => {
    const key = btn.dataset.opt, i = +btn.dataset.i, multi = btn.dataset.multi === "1";
    const b = WATERLOW.find(x => x.key === key);
    if (multi) {
      let arr = AS.ans[key] || [];
      const isExcl = btn.dataset.excl === "1";
      if (arr.includes(i)) arr = arr.filter(x => x !== i);
      else if (isExcl) arr = [i];
      else arr = arr.filter(x => !b.opts[x].excl).concat(i);
      AS.ans[key] = arr;
      $$(`[data-opt="${key}"]`).forEach(o => o.setAttribute("aria-pressed", arr.includes(+o.dataset.i)));
    } else {
      AS.ans[key] = AS.ans[key] === i ? null : i;
      $$(`[data-opt="${key}"]`).forEach(o => o.setAttribute("aria-pressed", AS.ans[key] === +o.dataset.i));
    }
    recalcAssess();
  });
  // MST
  $$("[data-mst]").forEach(btn => btn.onclick = () => {
    const part = btn.dataset.mst;
    AS.ans.mst = AS.ans.mst || {};
    if (part === "a") {
      AS.ans.mst.a = btn.dataset.v;
      if (btn.dataset.v !== "co") AS.ans.mst.b = null;
      const bBox = $("#mst-b"); if (bBox) bBox.hidden = btn.dataset.v !== "co";
      $$('[data-mst="a"]').forEach(o => o.setAttribute("aria-pressed", o.dataset.v === AS.ans.mst.a));
      if (btn.dataset.v !== "co") $$('[data-mst="b"]').forEach(o => o.setAttribute("aria-pressed", "false"));
    } else {
      const i = +btn.dataset.i;
      AS.ans.mst[part] = AS.ans.mst[part] === i ? null : i;
      $$(`[data-mst="${part}"]`).forEach(o => o.setAttribute("aria-pressed", AS.ans.mst[part] === +o.dataset.i));
    }
    recalcAssess();
  });
  // Yếu tố hồi sức
  $$("[data-icu]").forEach(btn => btn.onclick = () => {
    const f = btn.dataset.icu;
    if (AS.icu.includes(f)) AS.icu = AS.icu.filter(x => x !== f); else AS.icu.push(f);
    btn.setAttribute("aria-pressed", AS.icu.includes(f));
    const c = $("#icu-count"); if (c) { c.textContent = AS.icu.length + " mục"; c.classList.toggle("on", AS.icu.length > 0); }
  });
  // Khám da
  $$("[data-nolesion]").forEach(btn => btn.onclick = () => {
    const yes = btn.dataset.nolesion === "1";
    if (yes && (AS.lesions.length || AS.mdrpi.length)) {
      toast("Đang có tổn thương được ghi nhận — hãy xoá trước khi chọn “không”", "err", 4500); return;
    }
    AS.noLesion = yes; render();
  });
  const al = $("[data-addlesion]"); if (al) al.onclick = () => lesionDialog(false);
  const am = $("[data-addmdrpi]"); if (am) am.onclick = () => lesionDialog(true);
  $$("[data-dellesion]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const dev = b.dataset.dev === "1", i = +b.dataset.dellesion;
    const arr = dev ? AS.mdrpi : AS.lesions;
    (arr[i].photos || []).forEach(ph => Photos.del(ph.id));
    arr.splice(i, 1); render();
  });
  $$("[data-addphoto]").forEach(b => b.onclick = () => pickPhoto(+b.dataset.addphoto, b.dataset.dev === "1"));
  $$("[data-delphoto]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const dev = b.dataset.dev === "1", i = +b.dataset.li, id = b.dataset.delphoto;
    const arr = dev ? AS.mdrpi : AS.lesions;
    arr[i].photos = (arr[i].photos || []).filter(p => p.id !== id);
    Photos.del(id); render();
  });
  // Gói chăm sóc
  $$("[data-bundle]").forEach(btn => btn.onclick = () => {
    const it = btn.dataset.bundle;
    if (AS.bundle.includes(it)) AS.bundle = AS.bundle.filter(x => x !== it); else AS.bundle.push(it);
    btn.setAttribute("aria-pressed", AS.bundle.includes(it));
    const c = $("#bcount"); if (c) c.textContent = AS.bundle.length;
  });
  const ba = $("[data-ball]"), bn = $("[data-bnone]");
  if (ba) ba.onclick = () => { AS.bundle = $$("[data-bundle]").map(b => b.dataset.bundle); render(); };
  if (bn) bn.onclick = () => { AS.bundle = []; render(); };
  const nt = $("#as-note"); if (nt) nt.oninput = () => { AS.note = nt.value; };
  hydratePhotos();
}

function nextStep() {
  if (AS.step === 2 && AS.noLesion == null) { toast("Hãy xác nhận người bệnh có tổn thương hay không", "err"); return; }
  if (AS.step < 3) { AS.step++; render(); return; }
  signAssessment();
}

function signAssessment() {
  const r = scoreWaterlow(AS.ans);
  const lv = levelOf(r.total);
  const draft = { score: r.total, level: lv, icu: AS.icu, lesions: AS.lesions, mdrpi: AS.mdrpi };
  const clv = careLevelOf(draft);
  const now = new Date().toISOString();
  const a = {
    id: uid("as"), patientId: AS.patientId, episodeId: AS.episodeId,
    userId: Session.user.id, at: now, signedBy: Session.user.name,
    answers: clone(AS.ans), detail: r.detail, score: r.total, level: lv, careLevel: clv,
    icu: AS.icu.slice(), lesions: clone(AS.lesions), mdrpi: clone(AS.mdrpi),
    bundle: AS.bundle.slice(), bundleTotal: bundleFor(clv).length,
    note: AS.note.trim(), locked: true, appVer: APP_VER
  };
  a.lesions.forEach(l => delete l.carried);
  a.mdrpi.forEach(l => delete l.carried);
  DB.data.assessments.push(a);

  const p = DB.patient(AS.patientId);
  const st = DB.data.settings || DEFAULT_SETTINGS();

  // Cảnh báo tự động
  const newHapi = [...a.lesions, ...a.mdrpi].filter(l => !l.poa);
  const prevSites = new Set();
  DB.assessmentsOf(AS.episodeId).filter(x => x.id !== a.id)
    .forEach(x => [...(x.lesions || []), ...(x.mdrpi || [])].forEach(l => prevSites.add(l.site)));
  const trulyNew = newHapi.filter(l => !prevSites.has(l.site));
  if (st.autoFlagNewInjury && trulyNew.length) {
    addFlag(AS.patientId, AS.episodeId,
      `Ghi nhận tổn thương mới phát sinh tại khoa: ${trulyNew.map(l => `${l.site} (độ ${l.stage})`).join(", ")}.`,
      3, true);
  }
  if (st.autoFlagVeryHigh && lv === 3 && !DB.data.flags.some(f => f.episodeId === AS.episodeId && f.auto && f.kind === "vhigh" && f.status !== "dong")) {
    addFlag(AS.patientId, AS.episodeId,
      `Waterlow ${r.total} — nguy cơ rất cao. Áp dụng gói chăm sóc mức “${LEVELS[clv].short}” và kiểm tra điểm tì mỗi ${st.reassessHours[3]} giờ.`,
      3, true, "vhigh");
  }

  DB.log("danh-gia", `${p.name} (${p.mrn}) — Waterlow ${r.total}, ${LEVELS[lv].short}`, "assessment", a.id);
  DB.save();
  const id = AS.patientId; AS = null;
  toast("Đã ký và lưu phiếu đánh giá", "ok", 4000);
  Nav.replace("patient", { id });
}
</script>
<script>
/* ============================================================
   CHUỖI "CẦN QUAN TÂM": phát hiện → cảnh báo → tiếp nhận →
   thực hiện → xác nhận. Mỗi bước lưu tên người và thời điểm.
   ============================================================ */
const FLAG_STEPS = [
  { k: "tao",      t: "Phát hiện và cảnh báo" },
  { k: "tiepnhan", t: "Điều dưỡng tiếp nhận" },
  { k: "xuly",     t: "Đã thực hiện" },
  { k: "dong",     t: "Điều dưỡng trưởng xác nhận đóng" }
];
const FLAG_STATUS = { moi: 0, tiepnhan: 1, xuly: 2, dong: 3 };

function addFlag(patientId, episodeId, text, priority, auto, kind) {
  const f = {
    id: uid("f"), patientId, episodeId, text, priority: priority || 2,
    auto: !!auto, kind: kind || (auto ? "auto" : "manual"),
    createdBy: auto ? null : Session.user.id,
    createdAt: new Date().toISOString(), status: "moi",
    events: [{ by: auto ? null : Session.user.id, at: new Date().toISOString(), type: "tao", text }]
  };
  DB.data.flags.push(f);
  return f;
}

function flagDialog(patientId, episodeId) {
  const p = DB.patient(patientId);
  const last = DB.lastAssessment(episodeId);
  modal({
    title: "Đánh dấu cần quan tâm",
    body: `<p style="font-size:14px">
        <b>${esc(p.name)}</b>${last ? ` — Waterlow ${last.score}, ${esc(LEVELS[last.level != null ? last.level : levelOf(last.score)].short)}` : ""}</p>
      <div class="field"><label for="fl-text">Nội dung cần điều dưỡng lưu ý</label>
        <textarea id="fl-text" placeholder="vd: Theo dõi vùng cùng cụt và gót chân, báo ngay nếu xuất hiện hồng ban."></textarea></div>
      <div class="field"><label>Mức ưu tiên</label>
        <div class="qopts" style="padding:0">
          ${[[3, "Khẩn — kiểm tra trong ca này"], [2, "Cao — trong 24 giờ"], [1, "Theo dõi thường quy"]].map(([v, t], i) =>
            `<button class="opt" type="button" data-pri="${v}" aria-pressed="${v === 2}">
              <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">${esc(t)}</span></button>`).join("")}
        </div></div>`,
    actions: [{ label: "Huỷ" }, { label: "Đẩy lên mục Cần lưu ý", kind: "pri", onClick: (b) => {
      const t = $("#fl-text", b).value.trim();
      if (!t) { toast("Chưa nhập nội dung lưu ý", "err"); return false; }
      const pri = +($$("[data-pri]", b).find(x => x.getAttribute("aria-pressed") === "true")?.dataset.pri || 2);
      addFlag(patientId, episodeId, t, pri, false);
      DB.log("can-quan-tam", `${p.name} — ${t.slice(0, 80)}`, "patient", patientId);
      DB.save();
      toast("Đã đẩy lên mục Cần lưu ý của toàn khoa", "ok");
    }}]
  });
  const bd = $(".modal .sb");
  $$("[data-pri]", bd).forEach(btn => btn.onclick = () =>
    $$("[data-pri]", bd).forEach(o => o.setAttribute("aria-pressed", o === btn)));
}

function flagCard(f, compact) {
  const p = DB.patient(f.patientId);
  const stage = FLAG_STATUS[f.status];
  const last = f.episodeId ? DB.lastAssessment(f.episodeId) : null;
  const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
  const priLab = { 3: "Khẩn", 2: "Cao", 1: "Thường quy" }[f.priority] || "Cao";
  const steps = FLAG_STEPS.map((s, i) => {
    const ev = f.events.filter(e => e.type === s.k).slice(-1)[0];
    if (!ev) return `<div class="step pending"><div class="col"><div class="dot"></div><div class="line"></div></div>
      <div class="txt">${esc(s.t)}</div></div>`;
    const who = ev.by ? DB.userName(ev.by) : "Hệ thống tự động";
    return `<div class="step"><div class="col"><div class="dot"></div><div class="line"></div></div>
      <div class="txt">${esc(ev.text || s.t)}
        <span class="who">${esc(who)} · ${fmtDT(ev.at)}</span></div></div>`;
  }).join("");
  return `<article class="flag ${f.status === "dong" ? "done" : ""} ${f.auto ? "auto" : ""}" data-flagid="${f.id}">
    <div class="fh">
      <div class="ftop">
        <span class="fname">${esc(p ? p.name : "—")}</span>
        ${lv != null ? levelPill(lv, " sm") : ""}
        ${last ? `<span class="tag mono">Waterlow ${last.score}</span>` : ""}
        <span class="tag" style="margin-left:auto">${f.auto ? "Tự động" : priLab}</span>
      </div>
      <p class="ftext">${esc(f.text)}</p>
      <div class="btnrow" style="margin-top:2px">
        ${f.status === "moi" ? `<button class="btn pri sm" data-fact="tiepnhan" data-f="${f.id}">Tôi tiếp nhận</button>` : ""}
        ${f.status === "tiepnhan" ? `<button class="btn pri sm" data-fact="xuly" data-f="${f.id}">Ghi kết quả thực hiện</button>` : ""}
        ${f.status === "xuly" && Session.isHead() ? `<button class="btn pri sm" data-fact="dong" data-f="${f.id}">Xác nhận và đóng</button>` : ""}
        ${f.status === "xuly" && !Session.isHead() ? `<span class="tag">Chờ điều dưỡng trưởng xác nhận</span>` : ""}
        <button class="btn sm" data-fopen="${f.patientId}">Mở hồ sơ</button>
      </div>
    </div>
    ${compact && f.status === "moi" ? "" : `<div class="chain">${steps}</div>`}
  </article>`;
}

function bindFlagCards() {
  $$("[data-fact]").forEach(b => b.onclick = () => flagAction(b.dataset.f, b.dataset.fact));
  $$("[data-fopen]").forEach(b => b.onclick = () => Nav.go("patient", { id: b.dataset.fopen }));
}

function flagAction(fid, type) {
  const f = DB.data.flags.find(x => x.id === fid); if (!f) return;
  const cfg = {
    tiepnhan: { title: "Tiếp nhận lưu ý", ph: "vd: Đã nhận thông tin, sẽ kiểm tra trong lượt xoay trở tới.", btn: "Xác nhận tiếp nhận", st: "tiepnhan", need: false },
    xuly:     { title: "Ghi kết quả thực hiện", ph: "vd: Đã kiểm tra vùng cùng cụt, chưa ghi nhận tổn thương. Đã kê gót chân treo.", btn: "Lưu kết quả", st: "xuly", need: true },
    dong:     { title: "Xác nhận và đóng", ph: "vd: Đã kiểm tra lại, tình trạng ổn. Đóng lưu ý.", btn: "Đóng lưu ý", st: "dong", need: false }
  }[type];
  modal({
    title: cfg.title,
    body: `<p style="font-size:13.5px;color:var(--ink-2)">${esc(f.text)}</p>
      <div class="field"><label for="fa-note">Nội dung ghi nhận</label>
        <textarea id="fa-note" placeholder="${esc(cfg.ph)}"></textarea>
        <span class="help">Ghi nhận này lưu kèm tên bạn và thời điểm, không thể sửa về sau.</span></div>`,
    actions: [{ label: "Huỷ" }, { label: cfg.btn, kind: "pri", onClick: (b) => {
      const t = $("#fa-note", b).value.trim();
      if (cfg.need && !t) { toast("Cần ghi rõ việc đã thực hiện", "err"); return false; }
      f.events.push({ by: Session.user.id, at: new Date().toISOString(), type,
        text: t || FLAG_STEPS.find(s => s.k === type).t });
      f.status = cfg.st;
      DB.log("chuoi-luu-y", `${type} — ${DB.patient(f.patientId)?.name || ""}`, "flag", f.id);
      DB.save();
      toast("Đã ghi nhận", "ok");
    }}]
  });
}

function viewFlags() {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const open = DB.openFlags();
  /* Xếp theo THỜI ĐIỂM ĐÓNG, không phải thời điểm tạo — mới đóng thì nằm trên */
  const closedAt = f => {
    const ev = (f.events || []).filter(e => e.type === "dong").slice(-1)[0];
    return (ev && ev.at) || f.createdAt;
  };
  /* Chỉ giữ những mục đóng trong 24 giờ qua, và gói lại cho gọn —
     trang này để xem việc CHƯA làm, phần đã xong không nên chiếm chỗ. */
  const CLOSED_WINDOW_H = 24;
  const allClosed = DB.data.flags.filter(f => f.status === "dong")
    .sort((a, b) => closedAt(b).localeCompare(closedAt(a)));
  const cutoff = Date.now() - CLOSED_WINDOW_H * 3600000;
  const closed = allClosed.filter(f => dOf(closedAt(f)).getTime() >= cutoff);
  const olderCount = allClosed.length - closed.length;
  const overdue = st.autoFlagOverdue
    ? DB.admittedPatients().map(({ ep, p }) => ({ ep, p, due: dueInfo(ep) })).filter(x => x.due.overdue)
    : [];

  const html = `
    ${overdue.length ? `<section>
      <div class="card-h"><h2>Quá hạn đánh giá</h2><span class="hint">${overdue.length} người bệnh</span></div>
      <div class="plist">${overdue.map(r => patientRow({ ...r, last: r.due.last,
        lv: r.due.last ? (r.due.last.level != null ? r.due.last.level : levelOf(r.due.last.score)) : null }, { showDue: true })).join("")}</div>
    </section>` : ""}

    <section>
      <div class="card-h"><h2>Đang mở</h2><span class="hint">${open.length} lưu ý</span></div>
      ${open.length ? `<div style="display:flex;flex-direction:column;gap:10px">${open.map(f => flagCard(f)).join("")}</div>`
        : `<div class="empty">Không có lưu ý nào đang mở.</div>`}
    </section>

    ${closed.length ? `<section class="card" style="padding:12px 14px">
      <details class="closedbox">
        <summary>
          <span class="ct">Đã đóng trong ${CLOSED_WINDOW_H} giờ</span>
          <span class="cn">${closed.length} lưu ý</span>
          <span class="cx">bấm để xem</span>
        </summary>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
          ${closed.map(f => flagCard(f)).join("")}
        </div>
      </details>
      ${olderCount ? `<p style="font-size:12px;color:var(--ink-3);margin-top:8px">
        Còn ${olderCount} lưu ý đã đóng cũ hơn ${CLOSED_WINDOW_H} giờ${
          Session.isHead() ? " — xem trong <b>Nhật ký truy vết</b>" : ""}.</p>` : ""}
    </section>`
      : olderCount ? `<p class="hintbox">Không có lưu ý nào được đóng trong ${CLOSED_WINDOW_H} giờ qua.</p>` : ""}`;

  return { title: "Cần lưu ý", sub: open.length + " đang mở", html,
    bind() { bindFlagCards(); bindPatientRows(); } };
}

/* ============================================================
   BIỂU ĐỒ (SVG tự vẽ, không dùng thư viện ngoài)
   ============================================================ */
const ORD = ["var(--ord1)", "var(--ord2)", "var(--ord3)", "var(--ord4)"];

function chartRiskDist(dist) {
  const total = dist.reduce((a, b) => a + b, 0);
  if (!total) return `<div class="empty">Chưa có người bệnh nào được đánh giá.</div>`;
  const max = Math.max(...dist, 1);
  const rowH = 38, W = 560, L = 132, R = 46;
  const H = dist.length * rowH + 8;
  const bars = dist.map((v, i) => {
    const y = i * rowH + 6, bw = Math.max(v ? 3 : 0, (v / max) * (W - L - R));
    const pct = total ? Math.round(v / total * 100) : 0;
    return `<g>
      <text x="${L - 10}" y="${y + 15}" text-anchor="end" class="vlab">${esc(LEVELS[i].short)}</text>
      <rect x="${L}" y="${y + 3}" width="${bw}" height="20" rx="4" fill="${ORD[i]}"
        data-tip="${esc(LEVELS[i].name)}: ${v} người bệnh (${pct}%)"></rect>
      <text x="${L + bw + 8}" y="${y + 18}" class="vlab">${v}</text>
      <text x="${W - 4}" y="${y + 18}" text-anchor="end" class="vlab" style="opacity:.62">${pct}%</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Phân bố mức nguy cơ: ${dist.map((v, i) => LEVELS[i].short + " " + v).join(", ")}">
    <line x1="${L}" y1="2" x2="${L}" y2="${H - 4}" class="axis"></line>${bars}</svg>`;
}

function chartPatientTrend(assessments) {
  const a = assessments.slice().reverse();
  if (a.length < 2) return "";
  const W = 560, H = 190, P = { l: 34, r: 14, t: 14, b: 30 };
  const th = (DB.data.settings || DEFAULT_SETTINGS()).thresholds;
  const maxY = Math.max(26, ...a.map(x => x.score)) + 2;
  const xs = i => P.l + (a.length === 1 ? 0 : i * (W - P.l - P.r) / (a.length - 1));
  const ys = v => H - P.b - (v / maxY) * (H - P.t - P.b);
  const pts = a.map((x, i) => `${xs(i)},${ys(x.score)}`).join(" ");
  const bands = th.map((t, i) => `<line x1="${P.l}" y1="${ys(t)}" x2="${W - P.r}" y2="${ys(t)}"
      class="grid" stroke-dasharray="3 4"></line>
    <text x="${W - P.r}" y="${ys(t) - 4}" text-anchor="end" style="font-size:9.5px;opacity:.72">${["có nguy cơ", "cao", "rất cao"][i]} ≥${t}</text>`).join("");
  const dots = a.map((x, i) => {
    const lv = x.level != null ? x.level : levelOf(x.score);
    return `<circle cx="${xs(i)}" cy="${ys(x.score)}" r="5.5" fill="${ORD[lv]}" stroke="var(--card)" stroke-width="2"
      data-tip="${fmtDT(x.at)} — Waterlow ${x.score}, ${esc(LEVELS[lv].short)}"></circle>`;
  }).join("");
  const labs = a.map((x, i) => (i === 0 || i === a.length - 1 || a.length <= 5)
    ? `<text x="${xs(i)}" y="${H - 9}" text-anchor="${i === 0 ? "start" : i === a.length - 1 ? "end" : "middle"}"
        style="font-size:10px">${fmtDate(x.at).slice(0, 5)}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Diễn tiến điểm Waterlow qua ${a.length} lượt đánh giá">
    ${bands}
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H - P.b}" class="axis"></line>
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>
    <text x="${P.l - 7}" y="${ys(0) + 4}" text-anchor="end" style="font-size:10px">0</text>
    <text x="${P.l - 7}" y="${ys(maxY) + 9}" text-anchor="end" style="font-size:10px">${maxY}</text>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}${labs}</svg>`;
}

function chartBars(series, opt) {
  opt = opt || {};
  if (!series.length) return `<div class="empty">Chưa đủ dữ liệu.</div>`;
  const W = 560, H = opt.height || 180, P = { l: 34, r: 12, t: 12, b: 34 };
  const max = Math.max(1, ...series.map(s => s.v));
  const bw = (W - P.l - P.r) / series.length;
  const bars = series.map((s, i) => {
    const h = (s.v / max) * (H - P.t - P.b);
    const x = P.l + i * bw + bw * 0.16, w = bw * 0.68;
    const showLab = series.length <= 14;
    return `<g>
      <rect x="${x}" y="${H - P.b - h}" width="${w}" height="${Math.max(h, s.v ? 2 : 0)}" rx="4"
        fill="${opt.color || "var(--accent)"}" data-tip="${esc(s.label)}: ${esc(s.tip || (s.v + (opt.unit || "")))}"></rect>
      ${showLab && s.v ? `<text x="${x + w / 2}" y="${H - P.b - h - 5}" text-anchor="middle" class="vlab">${esc(String(opt.fmt ? opt.fmt(s.v) : s.v))}</text>` : ""}
      <text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" style="font-size:10px">${esc(s.label)}</text>
    </g>`;
  }).join("");
  const gl = [0.5, 1].map(f => `<line x1="${P.l}" y1="${H - P.b - f * (H - P.t - P.b)}" x2="${W - P.r}"
      y2="${H - P.b - f * (H - P.t - P.b)}" class="grid"></line>
    ${f === 1 ? `<text x="${P.l - 6}" y="${H - P.b - f * (H - P.t - P.b) + 4}" text-anchor="end" style="font-size:10px">${opt.fmt ? opt.fmt(max) : Math.round(max)}</text>` : ""}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || "Biểu đồ cột")}">
    ${gl}<line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>${bars}</svg>`;
}

function chartStacked2(series) {
  if (!series.length) return `<div class="empty">Chưa đủ dữ liệu.</div>`;
  const W = 560, H = 190, P = { l: 34, r: 12, t: 12, b: 34 };
  const max = Math.max(1, ...series.map(s => s.a + s.b));
  const bw = (W - P.l - P.r) / series.length;
  const bars = series.map((s, i) => {
    const ha = (s.a / max) * (H - P.t - P.b), hb = (s.b / max) * (H - P.t - P.b);
    const x = P.l + i * bw + bw * 0.18, w = bw * 0.64;
    return `<g>
      ${s.b ? `<rect x="${x}" y="${H - P.b - hb}" width="${w}" height="${hb}" rx="3" fill="var(--s2)"
        data-tip="${esc(s.label)}: ${s.b} tổn thương phát sinh tại khoa"></rect>` : ""}
      ${s.a ? `<rect x="${x}" y="${H - P.b - hb - ha - (s.b ? 2 : 0)}" width="${w}" height="${ha}" rx="3" fill="var(--s1)"
        data-tip="${esc(s.label)}: ${s.a} tổn thương có sẵn khi nhập khoa"></rect>` : ""}
      <text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" style="font-size:10px">${esc(s.label)}</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổn thương theo tháng, tách theo nguồn gốc">
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>
    <text x="${P.l - 6}" y="${P.t + 10}" text-anchor="end" style="font-size:10px">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:var(--s1)"></i>Có sẵn khi nhập khoa</span>
      <span><i style="background:var(--s2)"></i>Phát sinh tại khoa</span></div>`;
}

/* Lớp tương tác cho mọi biểu đồ */
let _tipEl = null;
function bindCharts() {
  $$("[data-tip]").forEach(el => {
    el.style.cursor = "pointer";
    const show = e => {
      if (!_tipEl) { _tipEl = document.createElement("div"); _tipEl.className = "hoverbox"; document.body.appendChild(_tipEl); }
      _tipEl.textContent = el.dataset.tip;
      const pt = e.touches ? e.touches[0] : e;
      const x = Math.min(window.innerWidth - 240, Math.max(8, pt.clientX + 12));
      _tipEl.style.left = x + "px";
      _tipEl.style.top = Math.max(8, pt.clientY - 46) + "px";
      _tipEl.hidden = false;
    };
    const hide = () => { if (_tipEl) _tipEl.hidden = true; };
    el.addEventListener("mouseenter", show);
    el.addEventListener("mousemove", show);
    el.addEventListener("mouseleave", hide);
    el.addEventListener("touchstart", e => { show(e); setTimeout(hide, 2400); }, { passive: true });
  });
}
</script>
<script>
/* ============================================================
   BỘ CHỈ SỐ ĐỀ ÁN, BÁO CÁO, QUẢN TRỊ
   ============================================================ */
let RP = { days: 30 };

function overlapDays(ep, from, to) {
  const a = Math.max(dOf(ep.admittedAt).getTime(), from.getTime());
  const b = Math.min(ep.dischargedAt ? dOf(ep.dischargedAt).getTime() : Date.now(), to.getTime());
  return b <= a ? 0 : (b - a) / 86400000;
}

function computeMetrics(days) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const to = new Date();
  const from = days ? new Date(to.getTime() - days * 86400000) : new Date(0);
  const inWin = t => { const x = dOf(t).getTime(); return x >= from.getTime() && x <= to.getTime(); };

  const eps = DB.liveEpisodes().filter(e => overlapDays(e, from, to) > 0);
  const patientDays = eps.reduce((s, e) => s + overlapDays(e, from, to), 0);
  const asses = DB.data.assessments.filter(a => inWin(a.at));

  /* 1. Đánh giá trong giờ đầu sau nhập khoa */
  const epsAdm = DB.liveEpisodes().filter(e => inWin(e.admittedAt)
    && Date.now() - dOf(e.admittedAt).getTime() > st.firstAssessHours * 3600000);
  let firstOk = 0;
  epsAdm.forEach(e => {
    const first = DB.assessmentsOf(e.id).slice(-1)[0];
    if (first && dOf(first.at) - dOf(e.admittedAt) <= st.firstAssessHours * 3600000) firstOk++;
  });
  const firstRate = epsAdm.length ? firstOk / epsAdm.length : null;

  /* 2. Đánh giá lại đúng hạn */
  let pairs = 0, pairsOk = 0;
  eps.forEach(e => {
    const list = DB.assessmentsOf(e.id).slice().reverse();
    for (let i = 1; i < list.length; i++) {
      if (!inWin(list[i].at)) continue;
      const prev = list[i - 1];
      const lv = prev.level != null ? prev.level : levelOf(prev.score);
      const hrs = st.reassessHours[lv] != null ? st.reassessHours[lv] : 24;
      pairs++;
      if (dOf(list[i].at) - dOf(prev.at) <= hrs * 3600000) pairsOk++;
    }
    // Ca đang quá hạn cũng tính là trễ
    if (!e.dischargedAt && dueInfo(e).overdue) { pairs++; }
  });
  const onTime = pairs ? pairsOk / pairs : null;

  /* 3. Tuân thủ gói chăm sóc */
  const withBundle = asses.filter(a => a.bundleTotal);
  const bundleRate = withBundle.length
    ? withBundle.reduce((s, a) => s + (a.bundle || []).length / a.bundleTotal, 0) / withBundle.length : null;

  /* 4. Tổn thương — tách nguồn gốc, tính lần xuất hiện đầu tiên của mỗi vị trí trong mỗi đợt */
  const seen = new Set(); const hapi = []; const poa = [];
  DB.data.assessments.slice().sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => {
      const k = a.episodeId + "|" + l.site;
      if (seen.has(k)) return;
      seen.add(k);
      const rec = { at: a.at, site: l.site, stage: l.stage, episodeId: a.episodeId, patientId: a.patientId, device: l.device };
      (l.poa ? poa : hapi).push(rec);
    });
  });
  const hapiWin = hapi.filter(x => inWin(x.at));
  const poaWin = poa.filter(x => inWin(x.at));
  const mdrpiWin = hapiWin.filter(x => x.device);
  const hapiRate = patientDays > 0 ? hapiWin.length / patientDays * 1000 : null;

  /* 5. Thời gian đáp ứng chuỗi cần lưu ý */
  const fl = DB.data.flags.filter(f => inWin(f.createdAt));
  const delta = (f, type) => {
    const ev = f.events.find(e => e.type === type);
    return ev ? dOf(ev.at) - dOf(f.createdAt) : null;
  };
  const accs = fl.map(f => delta(f, "tiepnhan")).filter(x => x != null);
  const dones = fl.map(f => delta(f, "xuly")).filter(x => x != null);
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

  /* 6. Chuỗi 6 tháng gần nhất */
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); d.setHours(0, 0, 0, 0);
    const end = new Date(d); end.setMonth(end.getMonth() + 1);
    const label = pad(d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(2);
    const inM = t => { const x = dOf(t).getTime(); return x >= d.getTime() && x < end.getTime(); };
    const pd = DB.liveEpisodes().reduce((s, e) => s + overlapDays(e, d, end), 0);
    const h = hapi.filter(x => inM(x.at)).length;
    const p = poa.filter(x => inM(x.at)).length;
    const am = DB.data.assessments.filter(a => inM(a.at) && a.bundleTotal);
    months.push({
      label, hapi: h, poa: p, patientDays: pd,
      rate: pd > 0 ? h / pd * 1000 : 0,
      bundle: am.length ? am.reduce((s, a) => s + (a.bundle || []).length / a.bundleTotal, 0) / am.length * 100 : 0,
      assessments: DB.data.assessments.filter(a => inM(a.at)).length
    });
  }

  return {
    from, to, days, eps, patientDays, asses, firstRate, epsAdmN: epsAdm.length,
    onTime, pairs, bundleRate, hapi: hapiWin, poa: poaWin, mdrpi: mdrpiWin, hapiRate,
    accAvg: avg(accs), doneAvg: avg(dones), flagsN: fl.length, accN: accs.length, months
  };
}

const pct = v => v == null ? "—" : Math.round(v * 100) + "%";

function viewReports() {
  const m = computeMetrics(RP.days);
  const adm = DB.admittedPatients();
  const dist = [0, 1, 2, 3].map(l => 0);
  adm.forEach(({ ep }) => {
    const la = DB.lastAssessment(ep.id);
    if (la) dist[la.level != null ? la.level : levelOf(la.score)]++;
  });

  const html = `
    <div class="btnrow">
      ${[[30, "30 ngày"], [90, "90 ngày"], [180, "6 tháng"], [0, "Toàn bộ"]].map(([d, t]) =>
        `<button class="btn sm" data-days="${d}"
          style="${RP.days === d ? "background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600" : ""}">${t}</button>`).join("")}
    </div>

    <section class="card">
      <div class="card-h"><h2>Sổ giao ban</h2><span class="hint">biên bản các ca đã qua</span></div>
      <p style="font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:10px">
        Toàn bộ biên bản bàn giao của các ca đã qua, kèm những ca không ai chốt.</p>
      <button class="btn" data-gblog>Mở sổ giao ban</button>
    </section>

    <section>
      <div class="card-h"><h2>Chỉ số đầu ra</h2><span class="hint">kết quả trên người bệnh</span></div>
      <div class="tiles">
        <div class="tile"><span class="lab">Loét mới phát sinh tại khoa</span>
          <span class="val mono">${m.hapi.length}</span>
          <span class="note">${m.mdrpi.length} trong đó do thiết bị y tế</span></div>
        <div class="tile"><span class="lab">Tỷ suất trên 1000 ngày nằm</span>
          <span class="val mono">${m.hapiRate == null ? "—" : m.hapiRate.toFixed(1)}</span>
          <span class="note">${Math.round(m.patientDays)} ngày nằm trong kỳ</span></div>
        <div class="tile"><span class="lab">Loét có sẵn khi vào khoa</span>
          <span class="val mono">${m.poa.length}</span>
          <span class="note">không tính vào tỷ suất mắc mới</span></div>
      </div>
    </section>

    <section>
      <div class="card-h"><h2>Chỉ số quá trình</h2><span class="hint">mức độ thực hiện quy trình</span></div>
      <div class="tiles">
        <div class="tile"><span class="lab">Đánh giá trong ${(DB.data.settings || DEFAULT_SETTINGS()).firstAssessHours} giờ đầu</span>
          <span class="val mono">${pct(m.firstRate)}</span>
          <span class="note">trên ${m.epsAdmN} lượt nhập khoa</span></div>
        <div class="tile"><span class="lab">Đánh giá lại đúng hạn</span>
          <span class="val mono">${pct(m.onTime)}</span>
          <span class="note">trên ${m.pairs} lượt đến hạn</span></div>
        <div class="tile"><span class="lab">Tuân thủ gói chăm sóc</span>
          <span class="val mono">${pct(m.bundleRate)}</span>
          <span class="note">trung bình ${m.asses.length} phiếu</span></div>
      </div>
    </section>

    <section>
      <div class="card-h"><h2>Hiệu quả chuỗi cảnh báo</h2>
        <span class="hint">điều Zalo không đo được</span></div>
      <div class="tiles">
        <div class="tile"><span class="lab">Cảnh báo → tiếp nhận</span>
          <span class="val mono" style="font-size:22px">${fmtDur(m.accAvg)}</span>
          <span class="note">trung bình, ${m.accN}/${m.flagsN} lưu ý đã tiếp nhận</span></div>
        <div class="tile"><span class="lab">Cảnh báo → thực hiện xong</span>
          <span class="val mono" style="font-size:22px">${fmtDur(m.doneAvg)}</span>
          <span class="note">trung bình toàn kỳ</span></div>
        <div class="tile"><span class="lab">Lưu ý đã phát</span>
          <span class="val mono">${m.flagsN}</span>
          <span class="note">${DB.openFlags().length} đang còn mở</span></div>
      </div>
    </section>

    <div class="split">
      <section class="card">
        <div class="card-h"><h2>Tổn thương ghi nhận theo tháng</h2><span class="hint">6 tháng gần nhất</span></div>
        ${chartStacked2(m.months.map(x => ({ label: x.label, a: x.poa, b: x.hapi })))}
      </section>
      <section class="card">
        <div class="card-h"><h2>Tỷ suất trên 1000 ngày nằm</h2></div>
        ${chartBars(m.months.map(x => ({ label: x.label, v: +x.rate.toFixed(1), tip: x.rate.toFixed(1) + " / 1000 ngày nằm" })),
          { color: "var(--ord3)", fmt: v => (Math.round(v * 10) / 10).toFixed(1), aria: "Tỷ suất loét mới theo tháng" })}
      </section>
    </div>

    <div class="split">
      <section class="card">
        <div class="card-h"><h2>Tuân thủ gói chăm sóc theo tháng</h2></div>
        ${chartBars(m.months.map(x => ({ label: x.label, v: Math.round(x.bundle), tip: Math.round(x.bundle) + "% mục can thiệp được đánh dấu đã thực hiện" })),
          { color: "var(--accent)", unit: "%", fmt: v => Math.round(v) + "%", aria: "Tỷ lệ tuân thủ gói chăm sóc theo tháng" })}
      </section>
      <section class="card">
        <div class="card-h"><h2>Phân bố mức nguy cơ hiện tại</h2><span class="hint">${adm.length} người bệnh</span></div>
        ${chartRiskDist(dist)}
      </section>
    </div>

    <section class="card">
      <div class="card-h"><h2>Danh sách người bệnh đang điều trị</h2>
        <span class="hint">${adm.length} ca</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Người bệnh</th><th>Mã hồ sơ</th><th>Giường</th><th>Ngày nằm</th>
          <th>Waterlow</th><th>Mức</th><th>Đánh giá gần nhất</th><th>Tổn thương</th></tr></thead>
        <tbody>${adm.map(({ ep, p }) => {
          const la = DB.lastAssessment(ep.id);
          const lv = la ? (la.level != null ? la.level : levelOf(la.score)) : null;
          const ls = la ? (la.lesions || []).length + (la.mdrpi || []).length : 0;
          const d = dueInfo(ep);
          return `<tr data-row="${p.id}" style="cursor:pointer">
            <td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.mrn)}</td><td>${esc(ep.bed || "—")}</td>
            <td class="num">${daysBetween(ep.admittedAt, new Date()) + 1}</td>
            <td class="num">${la ? la.score : "—"}</td>
            <td>${lv != null ? levelPill(lv, " sm") : '<span class="pill neutral sm">chưa đánh giá</span>'}</td>
            <td style="${d.overdue ? "color:var(--r2-ink);font-weight:600" : ""}">${la ? ago(la.at) : "chưa có"}${d.overdue ? " · quá hạn" : ""}</td>
            <td class="num">${ls || "—"}</td></tr>`;
        }).join("")}</tbody></table></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>Xuất dữ liệu</h2><span class="hint">mở được bằng Excel</span></div>
      <p style="font-size:12.5px;color:var(--ink-3);margin-bottom:10px">
        Tệp CSV có dấu tiếng Việt, mở trực tiếp bằng Excel hoặc Google Sheet.</p>
      <div class="btnrow">
        <button class="btn" data-ex="assess"><svg><use href="#i-dl"/></svg>Toàn bộ lượt đánh giá</button>
        <button class="btn" data-ex="lesion"><svg><use href="#i-dl"/></svg>Danh sách tổn thương</button>
        <button class="btn" data-ex="kpi"><svg><use href="#i-dl"/></svg>Bộ chỉ số theo tháng</button>
        <button class="btn" data-ex="flags"><svg><use href="#i-dl"/></svg>Chuỗi cần lưu ý</button>
      </div>
    </section>`;

  return {
    title: "Báo cáo", sub: RP.days ? RP.days + " ngày gần nhất" : "toàn bộ dữ liệu", html,
    bind() {
      $$("[data-days]").forEach(b => b.onclick = () => { RP.days = +b.dataset.days; render(); });
      const gl = $("[data-gblog]"); if (gl) gl.onclick = () => Nav.go("handoverlog");
      $$("[data-row]").forEach(r => r.onclick = () => Nav.go("patient", { id: r.dataset.row }));
      $$("[data-ex]").forEach(b => b.onclick = () => exportCSV(b.dataset.ex, m));
      bindCharts();
    }
  };
}

function exportCSV(kind, m) {
  const stamp = isoDay(new Date());
  if (kind === "assess") {
    const rows = [["Thời điểm", "Mã hồ sơ", "Họ tên", "Ngày sinh", "Giường", "Điểm Waterlow", "Mức nguy cơ",
      "Mức chăm sóc áp dụng", "Số yếu tố hồi sức", "Số tổn thương", "Gói chăm sóc đã thực hiện", "Tổng mục gói",
      "Người đánh giá", "Ghi chú"]];
    DB.data.assessments.slice().sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
      const p = DB.patient(a.patientId), ep = DB.episode(a.episodeId);
      const lv = a.level != null ? a.level : levelOf(a.score);
      rows.push([fmtDT(a.at), p?.mrn, p?.name, fmtDate(p?.dob), ep?.bed, a.score, LEVELS[lv].short,
        LEVELS[a.careLevel != null ? a.careLevel : lv].short, (a.icu || []).length,
        (a.lesions || []).length + (a.mdrpi || []).length, (a.bundle || []).length, a.bundleTotal || 0,
        DB.userName(a.userId), a.note || ""]);
    });
    downloadFile(`danh-gia-loet-ti-de_${stamp}.csv`, toCSV(rows));
  } else if (kind === "lesion") {
    const rows = [["Ngày phát hiện", "Mã hồ sơ", "Họ tên", "Vị trí", "Phân độ", "Nguồn gốc",
      "Do thiết bị", "Kích thước", "Số ảnh", "Người ghi nhận", "Mô tả"]];
    DB.data.assessments.slice().sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
      const p = DB.patient(a.patientId);
      [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => rows.push([
        fmtDate(l.foundAt || a.at), p?.mrn, p?.name, l.site, l.stage,
        l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa", l.device || "", l.size || "",
        (l.photos || []).length, DB.userName(a.userId), l.note || ""]));
    });
    downloadFile(`ton-thuong-loet-ti-de_${stamp}.csv`, toCSV(rows));
  } else if (kind === "kpi") {
    const rows = [["Tháng", "Ngày nằm viện", "Lượt đánh giá", "Loét có sẵn khi vào khoa",
      "Loét mới phát sinh tại khoa", "Tỷ suất trên 1000 ngày nằm", "Tuân thủ gói chăm sóc (%)"]];
    m.months.forEach(x => rows.push([x.label, Math.round(x.patientDays), x.assessments, x.poa, x.hapi,
      x.rate.toFixed(2), Math.round(x.bundle)]));
    rows.push([]);
    rows.push(["Chỉ số kỳ báo cáo", RP.days ? RP.days + " ngày gần nhất" : "toàn bộ"]);
    rows.push(["Tỷ lệ đánh giá trong giờ đầu", pct(m.firstRate)]);
    rows.push(["Tỷ lệ đánh giá lại đúng hạn", pct(m.onTime)]);
    rows.push(["Tuân thủ gói chăm sóc", pct(m.bundleRate)]);
    rows.push(["Thời gian trung bình cảnh báo đến tiếp nhận", fmtDur(m.accAvg)]);
    rows.push(["Thời gian trung bình cảnh báo đến thực hiện xong", fmtDur(m.doneAvg)]);
    downloadFile(`bo-chi-so-de-an_${stamp}.csv`, toCSV(rows));
  } else if (kind === "flags") {
    const rows = [["Thời điểm phát", "Mã hồ sơ", "Họ tên", "Nội dung", "Nguồn", "Trạng thái",
      "Tiếp nhận lúc", "Người tiếp nhận", "Thực hiện lúc", "Người thực hiện", "Nội dung thực hiện",
      "Đóng lúc", "Người đóng", "Thời gian đến tiếp nhận", "Thời gian đến thực hiện"]];
    DB.data.flags.slice().sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(f => {
      const p = DB.patient(f.patientId);
      const ev = t => f.events.find(e => e.type === t);
      const acc = ev("tiepnhan"), xl = ev("xuly"), dg = ev("dong");
      rows.push([fmtDT(f.createdAt), p?.mrn, p?.name, f.text, f.auto ? "Tự động" : DB.userName(f.createdBy),
        { moi: "Mới", tiepnhan: "Đã tiếp nhận", xuly: "Đã thực hiện", dong: "Đã đóng" }[f.status],
        acc ? fmtDT(acc.at) : "", acc ? DB.userName(acc.by) : "",
        xl ? fmtDT(xl.at) : "", xl ? DB.userName(xl.by) : "", xl ? xl.text : "",
        dg ? fmtDT(dg.at) : "", dg ? DB.userName(dg.by) : "",
        acc ? fmtDur(dOf(acc.at) - dOf(f.createdAt)) : "",
        xl ? fmtDur(dOf(xl.at) - dOf(f.createdAt)) : ""]);
    });
    downloadFile(`chuoi-can-luu-y_${stamp}.csv`, toCSV(rows));
  }
  toast("Đã tạo tệp — kiểm tra thư mục Tải xuống", "ok");
}

/* ============================================================
   QUẢN TRỊ TÀI KHOẢN
   ============================================================ */
function viewAdmin() {
  if (!Session.isHead()) return { title: "Không có quyền", html: `<div class="empty">Mục này dành cho điều dưỡng trưởng.</div>` };
  const us = DB.data.users.slice().sort((a, b) => (a.role === "dd" ? 1 : 0) - (b.role === "dd" ? 1 : 0) || a.name.localeCompare(b.name, "vi"));
  const dupNames = [...new Set(us.map(u => u.username.toLowerCase())
    .filter((v, i, a) => a.indexOf(v) !== i))];
  const html = `
    ${dupNames.length ? `<div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Có <b>${dupNames.length} tên đăng nhập bị trùng</b>: ${esc(dupNames.join(", "))}.
      Thường gặp sau khi hợp nhất dữ liệu của hai máy đều còn tài khoản mẫu.
      Hãy <b>khoá</b> các tài khoản thừa để tránh nhầm lẫn khi đăng nhập.</span></div>` : ""}
    <div class="notice"><svg><use href="#i-shield"/></svg>
      <span>Mỗi điều dưỡng phải có tài khoản riêng. Dùng chung tài khoản làm mất giá trị truy vết khi có sự cố.</span></div>
    <button class="btn pri block" data-newuser><svg><use href="#i-plus"/></svg>Thêm tài khoản</button>
    <div class="tablewrap"><table>
      <thead><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Lượt đánh giá</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>${us.map(u => {
        const n = DB.data.assessments.filter(a => a.userId === u.id).length;
        const dup = dupNames.includes(u.username.toLowerCase());
        return `<tr><td><b>${esc(u.name)}</b>${dup ? ' <span class="pill r2 sm"><span class="bullet"></span>trùng tên</span>' : ''}</td><td class="mono">${esc(u.username)}</td>
          <td>${u.role === "admin" ? "Quản trị" : u.role === "ddt" ? "Điều dưỡng trưởng" : "Điều dưỡng"}</td>
          <td class="num">${n}</td>
          <td>${u.active === false ? '<span class="pill neutral sm">Đã khoá</span>' : '<span class="pill r0 sm"><span class="bullet"></span>Đang dùng</span>'}</td>
          <td><button class="btn sm" data-edituser="${u.id}">Sửa</button></td></tr>`;
      }).join("")}</tbody></table></div>`;
  return {
    title: "Tài khoản điều dưỡng", sub: us.length + " tài khoản", html,
    bind() {
      $("[data-newuser]").onclick = () => userDialog(null);
      $$("[data-edituser]").forEach(b => b.onclick = () => userDialog(DB.user(b.dataset.edituser)));
    }
  };
}

function userDialog(u) {
  const isNew = !u;
  modal({
    title: isNew ? "Thêm tài khoản" : "Sửa tài khoản",
    body: `<div class="field"><label for="u-name">Họ và tên</label>
        <input id="u-name" type="text" value="${esc(u?.name || "")}"></div>
      <div class="field"><label for="u-user">Tên đăng nhập</label>
        <input id="u-user" type="text" class="mono" value="${esc(u?.username || "")}" ${isNew ? "" : "disabled"}
          placeholder="vd: dd.an" autocapitalize="none">
        <span class="help">Không dấu, không khoảng trắng. Không thể đổi sau khi tạo.</span></div>
      <div class="field"><label for="u-role">Vai trò</label>
        <select id="u-role">
          <option value="dd" ${u?.role === "dd" ? "selected" : ""}>Điều dưỡng</option>
          <option value="ddt" ${u?.role === "ddt" ? "selected" : ""}>Điều dưỡng trưởng</option>
          ${Session.isAdmin() ? `<option value="admin" ${u?.role === "admin" ? "selected" : ""}>Quản trị</option>` : ""}
        </select></div>
      <div class="field"><label for="u-pw">${isNew ? "Mật khẩu ban đầu" : "Đặt lại mật khẩu"}</label>
        <input id="u-pw" type="text" placeholder="${isNew ? "ít nhất 6 ký tự" : "để trống nếu không đổi"}">
        <span class="help">Nhắc người dùng đổi mật khẩu ngay sau lần đăng nhập đầu tiên.</span></div>
      ${isNew ? "" : `<div class="field"><label>Trạng thái</label>
        <div class="qopts" style="padding:0">
          <button class="opt" type="button" id="u-on" aria-pressed="${u.active !== false}">
            <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">Đang sử dụng</span></button>
          <button class="opt" type="button" id="u-off" aria-pressed="${u.active === false}">
            <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">Khoá tài khoản (giữ toàn bộ dữ liệu đã ký)</span></button>
        </div></div>`}`,
    actions: [{ label: "Huỷ" }, { label: "Lưu", kind: "pri", onClick: (b) => {
      const name = $("#u-name", b).value.trim();
      const un = $("#u-user", b).value.trim().toLowerCase();
      const pw = $("#u-pw", b).value;
      const role = $("#u-role", b).value;
      if (!name) { toast("Chưa nhập họ tên", "err"); return false; }
      if (isNew) {
        if (!/^[a-z0-9._-]{3,}$/.test(un)) { toast("Tên đăng nhập chỉ gồm chữ thường, số, dấu chấm", "err"); return false; }
        if (DB.data.users.some(x => x.username.toLowerCase() === un)) { toast("Tên đăng nhập đã tồn tại", "err"); return false; }
        if (pw.length < 6) { toast("Mật khẩu phải từ 6 ký tự", "err"); return false; }
        DB.data.users.push(touch({ id: uid("u"), name, username: un, role,
          pw: hashPw(pw, DB.data.meta.salt), active: true, mustChange: true, createdAt: new Date().toISOString() }));
        DB.log("tao-tai-khoan", `${name} (${un}) — ${role}`, "user", un);
      } else {
        u.name = name; u.role = role;
        delete u.demo;   // đã sửa tay thì không còn là tài khoản mẫu nữa
        u.active = $("#u-on", b).getAttribute("aria-pressed") === "true";
        if (pw) {
          if (pw.length < 6) { toast("Mật khẩu phải từ 6 ký tự", "err"); return false; }
          u.pw = hashPw(pw, DB.data.meta.salt); u.mustChange = true;
          DB.log("dat-lai-mat-khau", `${u.name} (${u.username})`, "user", u.id);
        }
        touch(u);
        DB.log("sua-tai-khoan", `${u.name} (${u.username})`, "user", u.id);
      }
      DB.save(); toast("Đã lưu", "ok");
    }}]
  });
  const bd = $(".modal .sb");
  const on = $("#u-on", bd), off = $("#u-off", bd);
  if (on) {
    on.onclick = () => { on.setAttribute("aria-pressed", "true"); off.setAttribute("aria-pressed", "false"); };
    off.onclick = () => { off.setAttribute("aria-pressed", "true"); on.setAttribute("aria-pressed", "false"); };
  }
}

    "tao-tai-khoan": "Tạo tài khoản", "sua-tai-khoan": "Sửa tài khoản",
    "dat-lai-mat-khau": "Đặt lại mật khẩu", "doi-mat-khau": "Đổi mật khẩu",
    "sua-cai-dat": "Sửa cài đặt", "sua-dot-dieu-tri": "Sửa đợt điều trị",
    "xoa-du-lieu-mau": "Xoá dữ liệu mẫu", "nhap-du-lieu": "Nhập dữ liệu",

  };
