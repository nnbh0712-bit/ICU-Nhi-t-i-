/* Xoá sạch danh sách người bệnh, giữ tài khoản và cài đặt */
function wipePatientsDialog() {
  const nP = DB.data.patients.length;
  const nE = DB.data.episodes.length;
  const nA = DB.data.assessments.length;
  const nF = DB.data.flags.length;
  let nPh = 0;
  DB.data.assessments.forEach(a =>
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => { nPh += (l.photos || []).length; }));

  if (!nP) { toast("Danh sách người bệnh đang trống", "err"); return; }

  modal({
    title: "Xoá danh sách người bệnh",
    body: `<div class="notice bad"><svg><use href="#i-alert"/></svg>
        <span>Thao tác này <b>không thể hoàn tác</b>. Nếu cần giữ lại, hãy tải bản sao lưu trước.</span></div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Sẽ bị xoá</div>
        <div class="tagrow">
          <span class="tag">${nP} người bệnh</span>
          <span class="tag">${nE} đợt điều trị</span>
          <span class="tag">${nA} lượt đánh giá</span>
          <span class="tag">${nF} lưu ý</span>
          <span class="tag">${nPh} ảnh tổn thương</span>
        </div>
      </div>
      <div>
        <div class="eyebrow" style="margin-bottom:6px">Được giữ nguyên</div>
        <div class="tagrow">
          <span class="tag poa">${DB.data.users.length} tài khoản đăng nhập</span>
          <span class="tag poa">Cài đặt chuyên môn và gói chăm sóc</span>
          <span class="tag poa">Nhật ký truy vết</span>
        </div>
      </div>
      <div class="field"><label for="wp-confirm">Gõ chữ <b>XOA</b> rồi bấm nút bên dưới để xác nhận</label>
        <input id="wp-confirm" type="text" autocapitalize="characters" autocomplete="off" placeholder="XOA"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Xoá danh sách người bệnh", kind: "danger", onClick: (b) => {
      if ($("#wp-confirm", b).value.trim().toUpperCase() !== "XOA") {
        toast("Chưa gõ đúng chữ XOA để xác nhận", "err"); return false;
      }
      DB.data.assessments.forEach(a =>
        [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l =>
          (l.photos || []).forEach(ph => Photos.del(ph.id))));
      DB.data.patients = [];
      DB.data.episodes = [];
      DB.data.assessments = [];
      DB.data.flags = [];
      DB.data.meta.epoch = uid("ep");   // báo cho các máy khác: dữ liệu đã dựng lại
      DB.forceReplace = true;
      DB.log("xoa-danh-sach-nguoi-benh",
        `Xoá ${nP} người bệnh, ${nA} lượt đánh giá, ${nPh} ảnh — giữ tài khoản và cài đặt`);
      DB.save();
      Nav.tab("patients");
      toast("Đã xoá sạch danh sách người bệnh", "ok", 4000);
    }}]
  });
}
/* Nối máy này vào kho dữ liệu chung — hỏi rõ chiều nào thắng để không ghi đè nhầm */
async function connectSheetDialog(url) {
  toast("Đang kiểm tra máy chủ…");
  let server = null;
  try { server = await DB.peek(url); }
  catch (e) {
    modal({ title: "Không kết nối được máy chủ",
      body: `<div class="notice bad"><svg><use href="#i-alert"/></svg><span>${esc(e.message)}</span></div>
        <p style="font-size:13.5px;line-height:1.55">Kiểm tra lại: địa chỉ đã dán đúng chưa, và khi triển khai trên Apps Script
        mục <b>Người có quyền truy cập</b> đã chọn <b>Bất kỳ ai</b> chưa. Sửa xong phải <b>Triển khai lại</b> và lấy địa chỉ mới.</p>` });
    return;
  }

  const sN = server ? (server.patients || []).length : 0;
  const sU = server ? (server.users || []).length : 0;
  const sA = server ? (server.assessments || []).length : 0;
  const lN = DB.data.patients.length, lU = DB.data.users.length, lA = DB.data.assessments.length;

  const finish = async (mode) => {
    CFG.write({ mode: "sheet", url });
    DB.mode = "sheet"; DB.url = url;
    if (mode === "pull") {
      DB.adopt(server); DB.dirty = false;
      try { localStorage.removeItem("ltd_dirty"); } catch (e) {}
      toast("Đã lấy dữ liệu chung về máy này", "ok", 4000);
    } else {
      DB.dirty = true;
      DB.forceReplace = (mode === "replace");
      await DB.sync();
      toast(mode === "replace" ? "Đã đưa dữ liệu máy này lên làm dữ liệu gốc" : "Đã nối và hợp nhất dữ liệu", "ok", 4000);
    }
    render();
  };

  if (!server || (!sN && !sU)) {
    modal({
      title: "Nối vào kho dữ liệu chung",
      body: `<div class="notice"><svg><use href="#i-check"/></svg>
          <span>Kết nối tốt. Kho dữ liệu chung đang <b>trống</b>.</span></div>
        <p style="font-size:14px;line-height:1.55">Dữ liệu trên máy này
        (<b>${lU} tài khoản</b>, <b>${lN} người bệnh</b>, <b>${lA} lượt đánh giá</b>)
        sẽ được đưa lên làm dữ liệu gốc của khoa. Các máy khác sau đó chỉ cần nối vào là thấy.</p>`,
      actions: [{ label: "Huỷ" }, { label: "Đưa dữ liệu máy này lên", kind: "pri",
        onClick: () => { finish("replace"); } }]
    });
    return;
  }

  modal({
    title: "Kho dữ liệu chung đã có dữ liệu",
    body: `<div class="notice warn"><svg><use href="#i-alert"/></svg>
        <span>Chọn đúng hướng, vì chọn sai có thể ghi đè mất dữ liệu của máy khác.</span></div>
      <div class="tablewrap"><table style="min-width:0">
        <thead><tr><th></th><th>Máy chủ chung</th><th>Máy này</th></tr></thead>
        <tbody>
          <tr><td>Tài khoản</td><td class="num">${sU}</td><td class="num">${lU}</td></tr>
          <tr><td>Người bệnh</td><td class="num">${sN}</td><td class="num">${lN}</td></tr>
          <tr><td>Lượt đánh giá</td><td class="num">${sA}</td><td class="num">${lA}</td></tr>
        </tbody></table></div>
      <div class="qopts" style="padding:0">
        <button class="opt" type="button" id="cs-pull" aria-pressed="true">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt"><b>Lấy dữ liệu chung về máy này</b><br>
            <span style="font-size:12.5px;color:var(--ink-3)">Dữ liệu hiện có trên máy này bị thay thế.
            Chọn cách này cho mọi máy nối vào sau máy đầu tiên.</span></span></button>
        <button class="opt" type="button" id="cs-merge" aria-pressed="false">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt"><b>Hợp nhất hai bên</b><br>
            <span style="font-size:12.5px;color:var(--ink-3)">Giữ cả hai: phiếu đánh giá của bên nào cũng còn,
            hồ sơ trùng thì lấy bản sửa sau. Chọn khi máy này có dữ liệu chưa kịp đẩy lên.</span></span></button>
        <button class="opt" type="button" id="cs-replace" aria-pressed="false">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt"><b>Ghi đè máy chủ bằng dữ liệu máy này</b><br>
            <span style="font-size:12.5px;color:var(--r3-ink)">Xoá sạch dữ liệu chung, thay bằng dữ liệu máy này.
            Chỉ dùng khi bạn chắc chắn máy chủ đang chứa dữ liệu bỏ đi.</span></span></button>
      </div>`,
    actions: [{ label: "Huỷ" }, { label: "Thực hiện", kind: "pri", onClick: (b) => {
      const sel = ["pull", "merge", "replace"].find(k =>
        $("#cs-" + k, b).getAttribute("aria-pressed") === "true");
      finish(sel || "pull");
    }}]
  });
  const bd = $(".modal .sb");
  ["pull", "merge", "replace"].forEach(k => {
    $("#cs-" + k, bd).onclick = () =>
      ["pull", "merge", "replace"].forEach(x =>
        $("#cs-" + x, bd).setAttribute("aria-pressed", x === k));
  });
}

      <div class="field" style="margin-top:12px"><label for="s-idle">Tự khoá sau bao nhiêu phút không thao tác</label>
        <input id="s-idle" type="number" min="2" max="120" value="${s.idleMinutes}"></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>Gói chăm sóc theo mức</h2>
        <span class="hint">mỗi dòng là một can thiệp</span></div>
      ${LEVELS.map((L, i) => `<div class="field" style="margin-bottom:14px">
        <label for="s-b${i}">${esc(L.name)}</label>
        <textarea id="s-b${i}" style="min-height:${Math.max(96, bundleFor(i).length * 24)}px">${esc(bundleFor(i).join("\n"))}</textarea>
      </div>`).join("")}
      <p style="font-size:12px;color:var(--ink-3)">Sửa nội dung cho khớp quy trình của khoa. Các phiếu đã ký giữ nguyên nội dung gói tại thời điểm ký.</p>
    </section>

    <button class="btn pri block" data-savesettings>Lưu toàn bộ cài đặt</button>

    <section class="card">
      <div class="card-h"><h2>Nơi lưu dữ liệu</h2>
        <span class="hint">${DB.mode === "sheet" ? "Google Sheet" : "Trên máy này"}</span></div>
      ${/claude\.(ai|com)$/.test(location.hostname) ? `<div class="notice warn"><svg><use href="#i-alert"/></svg>
        <span>Bạn đang mở bản trình diễn trên web. Bản này <b>không kết nối được Google Sheet</b> vì lý do bảo mật của nền tảng.
        Để dùng chế độ dùng chung, hãy mở tệp <b>loet-ti-de.html</b> đã tải về máy.</span></div>` : ""}
      <div class="notice"><svg><use href="#i-info"/></svg><span>
        <b>Trên máy này:</b> chạy được cả khi mất mạng, nhưng mỗi máy có dữ liệu riêng.<br>
        <b>Google Sheet:</b> nhiều máy dùng chung một kho dữ liệu, điều dưỡng trưởng vẫn lọc và xuất Excel từ Sheet như cũ.
        Cần cài một lần theo tài liệu hướng dẫn kèm theo.</span></div>
      <div class="field" style="margin-top:12px"><label for="s-url">Địa chỉ ứng dụng web Google Apps Script</label>
        <input id="s-url" type="text" class="mono" style="font-size:12.5px" value="${esc(cfg.url || "")}"
          placeholder="https://script.google.com/macros/s/..../exec"></div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn" data-testurl>Kiểm tra kết nối</button>
        <button class="btn ${DB.mode === "sheet" ? "" : "pri"}" data-mode="sheet" ${DB.mode === "sheet" ? "disabled" : ""}>Chuyển sang Google Sheet</button>
        <button class="btn ${DB.mode === "local" ? "" : "pri"}" data-mode="local" ${DB.mode === "local" ? "disabled" : ""}>Chuyển về lưu trên máy</button>
        ${DB.mode === "sheet" ? `<button class="btn" data-syncnow>Đồng bộ ngay</button>` : ""}
      </div>
      <p id="s-urlmsg" style="font-size:12.5px;margin-top:8px"></p>

      ${DB.mode === "sheet" && cfg.url ? `
      <hr class="divider">
      <div class="eyebrow" style="margin-bottom:6px">Link cài đặt cho điều dưỡng</div>
      <p style="font-size:12.5px;color:var(--ink-3);margin-bottom:8px;line-height:1.55">
        Gửi link này cho từng điều dưỡng qua Zalo. Mở link một lần là máy đó <b>tự nối vào kho dữ liệu chung</b>,
        không tạo dữ liệu mẫu, không phải dán địa chỉ máy chủ bằng tay.<br>
        Nhắc người nhận: bấm link rồi chọn <b>Mở bằng Safari</b> (hoặc Chrome), đừng xem trong Zalo.
        Nhớ sao chép <b>trọn vẹn</b> đường link, kể cả phần sau dấu hỏi.</p>
      <div class="field">
        <input id="s-invite" type="text" class="mono" style="font-size:12px" readonly
          value="${esc(location.origin + location.pathname + "?s=" + encodeURIComponent(cfg.url))}">
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn" data-copyinvite>Sao chép link</button>
      </div>` : ""}
    </section>

    ${voidedCard()}

    <section class="card">
      <div class="card-h"><h2>Sao lưu và dữ liệu</h2></div>
      <div class="btnrow">
        <button class="btn" data-backup><svg><use href="#i-dl"/></svg>Tải bản sao lưu</button>
        <button class="btn" data-restore>Phục hồi từ bản sao lưu</button>
        ${DB.data.patients.some(p => p.demo) && DB.mode !== "sheet" ? `<button class="btn" data-reseed>Tạo lại dữ liệu mẫu theo hôm nay</button>` : ""}
      </div>
      <hr class="divider">
      <div class="eyebrow" style="margin-bottom:8px">Dọn dữ liệu</div>
      <div class="btnrow">
        <button class="btn danger" data-wipepatients>Xoá danh sách người bệnh</button>
        ${DB.data.users.some(u => u.demo) ? `<button class="btn danger" data-wipedemo>Xoá toàn bộ dữ liệu mẫu</button>` : ""}
      </div>
      <p style="font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.6">
        <b>Xoá danh sách người bệnh</b> — xoá hết người bệnh, lượt đánh giá, lưu ý và ảnh,
        nhưng <b>giữ nguyên tài khoản đăng nhập và cài đặt chuyên môn</b>. Dùng khi muốn bắt đầu với danh sách trắng.<br>
        <b>Xoá toàn bộ dữ liệu mẫu</b> — xoá thêm cả các tài khoản trình diễn. Dùng khi bàn giao hẳn cho khoa.<br>
        Bản sao lưu không kèm ảnh; ảnh nằm trong bộ nhớ riêng của từng máy.</p>
    </section>`;

  return {
    title: "Cài đặt chuyên môn", html,
    bind() {
      $$("[data-sw]").forEach(b => b.onclick = () =>
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
      $$("[data-tc]").forEach(b => b.onclick = () =>
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));

      $("[data-savesettings]").onclick = () => {
        const ns = clone(DB.data.settings || DEFAULT_SETTINGS());
        ns.wardName = $("#s-ward").value.trim() || ns.wardName;
        ns.hospital = $("#s-hosp").value.trim() || ns.hospital;
        const t = [1, 2, 3].map(i => +$("#s-t" + i).value);
        if (t.some(x => !x || x < 1) || t[0] >= t[1] || t[1] >= t[2]) { toast("Ngưỡng phải tăng dần và lớn hơn 0", "err"); return; }
        ns.thresholds = t;
        ns.firstAssessHours = Math.max(1, +$("#s-first").value || 8);
        ns.reassessHours = LEVELS.map((L, i) => Math.max(1, +$("#s-r" + i).value || 24));
        ns.turnEveryHours = Math.max(1, +$("#s-tevery").value || 3);
        ns.turnEveryHoursHigh = Math.max(1, +$("#s-tevery2").value || 2);
        ns.turnHighFrom = +$("#s-thigh").value;
        ns.hoTieuChi = {};
        HO_TIEUCHI.forEach(t => {
          const el = $(`[data-tc="${t.k}"]`);
          ns.hoTieuChi[t.k] = el ? el.getAttribute("aria-pressed") === "true" : false;
        });
        ns.icuEscalate = Math.max(1, +$("#s-icu").value || 2);
        ns.idleMinutes = Math.min(120, Math.max(2, +$("#s-idle").value || 20));
        $$("[data-sw]").forEach(b => { ns[b.dataset.sw] = b.getAttribute("aria-pressed") === "true"; });
        ns.bundles = LEVELS.map((L, i) => ({ level: i,
          items: $("#s-b" + i).value.split("\n").map(x => x.trim()).filter(Boolean) }));
        DB.data.settings = touch(ns);
        DB.log("sua-cai-dat", "Cập nhật cài đặt chuyên môn");
        DB.save(); toast("Đã lưu cài đặt", "ok");
      };

      $("[data-testurl]").onclick = async () => {
        const url = $("#s-url").value.trim();
        const msg = $("#s-urlmsg");
        if (!url) { msg.textContent = "Chưa nhập địa chỉ."; msg.style.color = "var(--bad)"; return; }
        msg.textContent = "Đang kiểm tra…"; msg.style.color = "var(--ink-3)";
        try {
          const res = await fetch(url, { method: "POST", redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "ping", payload: {} }) });
          const j = await res.json();
          if (j.ok) { msg.textContent = "Kết nối tốt. Máy chủ phản hồi: " + (j.data?.app || "OK"); msg.style.color = "var(--good)"; }
          else { msg.textContent = "Máy chủ trả lỗi: " + (j.error || "?"); msg.style.color = "var(--bad)"; }
        } catch (e) {
          msg.innerHTML = "Không kết nối được. Kiểm tra lại địa chỉ và bảo đảm khi triển khai đã chọn quyền truy cập <b>Bất kỳ ai</b>.";
          msg.style.color = "var(--bad)";
        }
      };

      $$("[data-mode]").forEach(b => b.onclick = () => {
        const m = b.dataset.mode;
        if (m === "sheet") {
          const url = $("#s-url").value.trim();
          if (!url) { toast("Chưa nhập địa chỉ máy chủ", "err"); return; }
          connectSheetDialog(url);
        } else {
          CFG.write({ mode: "local", url: $("#s-url").value.trim() });
          DB.mode = "local"; toast("Đã chuyển về lưu trên máy này", "ok"); render();
        }
      });
      const sn = $("[data-syncnow]"); if (sn) sn.onclick = () => DB.sync();
      const ci = $("[data-copyinvite]");
      if (ci) ci.onclick = async () => {
        const inp = $("#s-invite");
        try {
          await navigator.clipboard.writeText(inp.value);
          toast("Đã sao chép link. Dán vào Zalo gửi cho điều dưỡng.", "ok", 5000);
        } catch (e) {
          inp.focus(); inp.select(); inp.setSelectionRange(0, 99999);
          toast("Link đã được bôi đen — nhấn Cmd+C hoặc nhấn giữ để sao chép", "err", 6000);
        }
      };

      $("[data-backup]").onclick = () => {
        const d = clone(DB.data);
        downloadFile(`sao-luu-loet-ti-de_${isoDay(new Date())}.json`,
          JSON.stringify(d, null, 1), "application/json");
        toast("Đã tạo bản sao lưu", "ok");
      };
      $("[data-restore]").onclick = () => {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = () => {
          const f = inp.files[0]; if (!f) return;
          const fr = new FileReader();
          fr.onload = () => {
            try {
              const d = JSON.parse(fr.result);
              if (!d.users || !d.patients) throw new Error("Tệp không đúng định dạng");
              confirmBox("Phục hồi dữ liệu",
                `Bản sao lưu có ${d.patients.length} người bệnh và ${(d.assessments || []).length} lượt đánh giá.
                 Toàn bộ dữ liệu hiện tại trên máy sẽ bị thay thế. Tiếp tục?`,
                "Phục hồi", () => {
                  DB.data = Object.assign(emptyDB(), d);
                  DB.data.meta.epoch = uid("ep");
                  DB.forceReplace = true;
                  DB.log("nhap-du-lieu", "Phục hồi từ bản sao lưu");
                  DB.save(); toast("Đã phục hồi dữ liệu", "ok");
                }, true);
            } catch (e) { toast("Không đọc được tệp: " + e.message, "err"); }
          };
          fr.readAsText(f);
        };
        inp.click();
      };
      bindVoidedCard();

      const wp = $("[data-wipepatients]");
      if (wp) wp.onclick = wipePatientsDialog;

      const rs = $("[data-reseed]");
      if (rs) rs.onclick = () => confirmBox("Tạo lại dữ liệu mẫu",
        "Dựng lại toàn bộ dữ liệu trình diễn tính theo ngày hôm nay, để các mốc thời gian và hạn đánh giá luôn hợp lý khi bạn trình bày. Dữ liệu mẫu hiện tại sẽ bị thay thế.",
        "Tạo lại", async () => {
          const keep = DB.data.users.filter(u => !u.demo);
          await Photos.clearAll();
          await seedDemo();
          keep.forEach(u => DB.data.users.push(u));
          DB.forceReplace = true;
          DB.saveLocal();
          if (DB.mode === "sheet") DB.sync();
          Session.logout(true);
          toast("Đã tạo lại dữ liệu mẫu — đăng nhập lại để xem", "ok", 5000);
        });
      const wd = $("[data-wipedemo]");
      if (wd) wd.onclick = () => confirmBox("Xoá dữ liệu mẫu",
        "Xoá toàn bộ người bệnh, lượt đánh giá, lưu ý và tài khoản được tạo làm dữ liệu trình diễn. Cài đặt và tài khoản thật được giữ nguyên. Không thể hoàn tác.",
        "Xoá dữ liệu mẫu", () => {
          const demoP = new Set(DB.data.patients.filter(p => p.demo).map(p => p.id));
          DB.data.assessments.filter(a => demoP.has(a.patientId))
            .forEach(a => [...(a.lesions || []), ...(a.mdrpi || [])]
              .forEach(l => (l.photos || []).forEach(ph => Photos.del(ph.id))));
          DB.data.patients = DB.data.patients.filter(p => !p.demo);
          DB.data.episodes = DB.data.episodes.filter(e => !demoP.has(e.patientId));
          DB.data.assessments = DB.data.assessments.filter(a => !demoP.has(a.patientId));
          DB.data.flags = DB.data.flags.filter(f => !demoP.has(f.patientId));
          DB.data.users = DB.data.users.filter(u => !u.demo || u.id === Session.user.id);
          DB.data.meta.epoch = uid("ep");
          DB.forceReplace = true;
          DB.log("xoa-du-lieu-mau", "Đã xoá toàn bộ dữ liệu trình diễn");
          DB.save(); toast("Đã xoá dữ liệu mẫu", "ok");
        }, true);
    }
  };
}
</script>
<script>
/* ============================================================
   BẢN THỬ — BA TÍNH NĂNG ĐANG CÂN NHẮC
   1. Bảng theo dõi xoay trở
   2. Trạng thái liền thương ("đã lành")
   3. Màn hình giao ban
   ============================================================ */

/* ------------------------------------------------------------
   1. XOAY TRỞ
   ------------------------------------------------------------ */

/* Gợi ý tư thế kế tiếp: luân phiên ngửa → nghiêng, đổi bên mỗi vòng */
function suggestPosition(epId) {
  const recent = DB.turnsOf(epId).slice(0, 6);
  const last = recent[0];
  if (!last) return "ngua";
  if (last.pos === "ngua" || last.pos === "nuangoi") {
    const lastLeft = recent.find(t => t.pos === "ngtrai");
    const lastRight = recent.find(t => t.pos === "ngphai");
    if (!lastLeft) return "ngtrai";
    if (!lastRight) return "ngphai";
    return dOf(lastLeft.at) < dOf(lastRight.at) ? "ngtrai" : "ngphai";
  }
  if (last.pos === "ngtrai") return "ngua";
  if (last.pos === "ngphai") return "ngua";
  return "ngua";
}

function turnDialog(p, ep, onDone) {
  const sug = suggestPosition(ep.id);
  const info = turnInfo(ep);

  const body = `
    <div class="notice ${info.toiLuc && !info.never ? "warn" : ""}"><svg><use href="#i-clock"/></svg><span>
      ${info.never
        ? "Chưa ghi lượt xoay nào trong đợt điều trị này."
        : `Lần xoay gần nhất <b>${fmtTime(info.last.at)}</b> — ${esc(posName(info.last.pos))},
           cách đây <b>${fmtDur(info.cach)}</b>.`}
      <br>Khoa đặt mục tiêu xoay mỗi <b>${info.every} giờ</b>
      (${esc(LEVELS[info.level].short.toLowerCase())}).
      <br>Lượt này sẽ ghi đúng giờ bấm nút: <b>${fmtTime(new Date())}</b>.</span></div>

    <div class="field"><label>Tư thế vừa chuyển sang</label>
      <div class="bundle" id="tr-pos">
        ${POSITIONS.map(o => `<div class="bitem" data-pos="${o.v}" aria-pressed="${o.v === sug}" role="button" tabindex="0">
          <span class="box"><svg><use href="#i-check"/></svg></span>
          <span class="bt">${esc(o.t)}${o.v === sug ? ` <span style="color:var(--ink-3);font-size:12px">— gợi ý</span>` : ""}</span>
        </div>`).join("")}
      </div>
    </div>

    <div class="field">
      <div class="bundle">
        <div class="bitem" id="tr-skin" aria-pressed="true" role="button" tabindex="0">
          <span class="box"><svg><use href="#i-check"/></svg></span>
          <span class="bt">Đã quan sát da các điểm tì đè khi xoay trở</span>
        </div>
      </div>
    </div>

    <div class="field" id="tr-reasonwrap" hidden>
      <label for="tr-reason">Vì sao chưa xoay được</label>
      <select id="tr-reason">${TURN_REASONS.map(r => `<option>${esc(r)}</option>`).join("")}</select>
      <span class="help">Ghi lý do thật, tốt hơn là để trống.</span></div>

    <div class="field"><label for="tr-note">Ghi chú (không bắt buộc)</label>
      <textarea id="tr-note" placeholder="vd: Cùng cụt còn hồng ban nhạt, đã kê gối chèn hông trái."></textarea></div>`;

  const save = (skipped) => (b) => {
    const sel = $("[data-pos][aria-pressed='true']", b);
    if (!skipped && !sel) { toast("Chưa chọn tư thế", "err"); return false; }
    const rs = $("#tr-reason", b);
    const t = {
      id: uid("t"), patientId: p.id, episodeId: ep.id,
      at: new Date().toISOString(),
      pos: skipped ? null : sel.dataset.pos,
      skipped: !!skipped,
      reason: skipped && rs ? rs.value : "",
      by: Session.user.id,
      skinOk: skipped ? false : $("#tr-skin", b).getAttribute("aria-pressed") === "true",
      note: $("#tr-note", b).value.trim()
    };
    DB.data.turns.push(t);
    DB.log(skipped ? "xoay-tro-hoan" : "xoay-tro",
      `${p.name} — ${skipped ? "chưa xoay được: " + t.reason : posName(t.pos)}`, "episode", ep.id);
    DB.save();
    toast(skipped ? "Đã ghi nhận chưa xoay được" : "Đã ghi lượt xoay trở lúc " + fmtTime(t.at), "ok");
    if (onDone) onDone();
  };

  modal({
    title: "Ghi lượt xoay trở",
    body,
    actions: [
      { label: "Huỷ" },
      { label: "Chưa xoay được", onClick: (b) => {
        const rw = $("#tr-reasonwrap", b);
        if (rw.hidden) {                       // lần bấm đầu: mở ô chọn lý do
          rw.hidden = false;
          $("#tr-reasonwrap label", b).textContent = "Vì sao chưa xoay được";
          toast("Chọn lý do rồi bấm lại nút này", "err", 4000);
          return false;
        }
        return save(true)(b);
      }},
      { label: "Lưu lượt xoay trở", kind: "pri", onClick: save(false) }
    ]
  });

  // chọn tư thế: một lựa chọn duy nhất
  setTimeout(() => {
    const host = $(".modal");
    $$("[data-pos]", host).forEach(el => {
      const set = () => {
        $$("[data-pos]", host).forEach(x => x.setAttribute("aria-pressed", "false"));
        el.setAttribute("aria-pressed", "true");
      };
      el.onclick = set;
      el.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); set(); } };
    });
    const sk = $("#tr-skin", host);
    const tog = () => sk.setAttribute("aria-pressed", sk.getAttribute("aria-pressed") === "true" ? "false" : "true");
    sk.onclick = tog;
    sk.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); tog(); } };
  }, 30);
}

/* Bảng cữ xoay trở — dựng đúng như bảng giấy treo đầu giường */
const SLOT_LABEL = { done: "đúng cữ", late: "trễ cữ", miss: "bỏ cữ", skip: "chưa xoay được", now: "đang tới cữ", future: "cữ sau" };

function slotChip(r) {
  const t = r.turn;
  return `<div class="turnchip s-${r.status}">
    <div class="h">${fmtTime(r.at)}</div>
    <div class="p">${t ? (t.skipped ? "hoãn" : esc(posShort(t.pos))) :
      r.status === "miss" ? "—" : r.status === "now" ? "chờ" : "·"}</div>
    <div class="w">${t ? esc((DB.userName(t.by) || "").split(" ").slice(-1)[0])
      : r.status === "miss" ? "bỏ cữ" : ""}</div>
  </div>`;
}

function turnBlock(p, ep) {
  if (!ep) return "";
  const info = turnInfo(ep);
  const log = turnLog24(ep, 20);
  const nDat = info.datKhoang, nKhoang = info.khoang.length;

  /* Một dòng nhật ký. Dùng chung cho phần hiện sẵn và phần gấp, để hai chỗ
     không bao giờ hiển thị khác nhau. */
  const dongLog = t => `<div class="row">
      <div class="t">${fmtTime(t.at)}<span>${fmtDate(t.at)}</span></div>
      <div class="d">${t.skipped
        ? `<b>Chưa xoay được</b>${t.reason ? ` — ${esc(t.reason)}` : ""}`
        : `${esc(posName(t.pos))}
           ${t.skinOk ? `<span class="tag">đã xem da</span>` : `<span class="tag watch">chưa xem da</span>`}`}
        <div class="m">${esc(DB.userName(t.by))}${t.note ? " · " + esc(t.note) : ""}</div>
      </div>

  const logHtml = log.length ? `<div class="turnlog">${log.map(dongLog).join("")}</div>`
    : `<div class="empty">Chưa có lượt xoay nào trong 24 giờ qua.</div>`;
  /* Năm lượt gần nhất hiện thẳng ra, không phải bấm mở — ghi xong là thấy ngay */
  const gan5 = log.slice(0, 5);
  const con = log.length - gan5.length;

  return `<section class="card" id="turn-sec">
    <div class="card-h"><h2>Xoay trở</h2>
      <span class="hint">khoa đặt mục tiêu mỗi ${info.every} giờ · ${esc(LEVELS[info.level].short.toLowerCase())}</span></div>

    <div class="turnhead">
      <span class="now">${info.never ? "Chưa ghi lượt nào" : esc(posName(info.last.pos))}</span>
      <span class="when ${info.toiLuc && !info.never ? "bad" : ""}">
        ${info.never
          ? `Nhập khoa ${fmtDur(info.cach)} trước`
          : `Lần gần nhất ${fmtTime(info.last.at)} — cách đây <b>${fmtDur(info.cach)}</b>`}
        ${info.toiLuc && !info.never ? ` · đã quá mục tiêu ${fmtDur(info.quaBaoLau)}` : ""}</span>
    </div>

    <button class="bigtap nhe" data-turn>
      <svg><use href="#i-rotate"/></svg>Ghi lượt xoay trở
    </button>

    <div class="card-h" style="margin:15px 0 8px"><h2>Lượt gần nhất</h2>
      <span class="hint">${info.soLuot24h} lượt trong 24 giờ${
        info.skip24h ? ` · ${info.skip24h} lượt hoãn` : ""}</span></div>
    ${gan5.length ? `<div class="turnlog">${gan5.map(dongLog).join("")}</div>`
      : `<div class="empty">Chưa có lượt xoay nào trong 24 giờ qua.</div>`}

    <details class="fold">
      <summary>Cả nhật ký 24 giờ và số liệu<span class="fsum">${
        con > 0 ? con + " lượt nữa" : "số liệu ca"}</span></summary>
      <div class="foldin">
        <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
          <div class="tile"><span class="lab">Số lượt đã xoay</span>
            <span class="val mono">${info.soLuot24h}</span>
            <span class="note">trong 24 giờ qua</span></div>
          <div class="tile"><span class="lab">Khoảng cách đạt mục tiêu</span>
            <span class="val mono">${nKhoang ? nDat + "/" + nKhoang : "—"}</span>
            <span class="note">khoảng cách ≤ ${info.every} giờ</span></div>
          <div class="tile ${info.skip24h ? "alert" : ""}"><span class="lab">Lượt chưa xoay được</span>
            <span class="val mono">${info.skip24h}</span>
            <span class="note">có ghi lý do</span></div>
        </div>
        ${logHtml}
        <p style="font-size:12px;color:var(--ink-3);margin-top:8px">
          Mỗi lượt ghi đúng giờ bấm nút. Khoảng cách mục tiêu chỉ dùng để nhắc và
          để tổng hợp chỉ số của khoa, không đóng dấu lên từng lượt của ai.</p>
      </div>
    </details>
  </section>`;
}

/* ------------------------------------------------------------
   1b. GHI CẢ BUỒNG MỘT LƯỢT — dành cho cữ xoay đồng loạt
   Mở một màn hình, tư thế đã gợi ý sẵn, bấm một nút lưu hết.
   ------------------------------------------------------------ */
let ROUND = {};   // epId -> {pos, skin, skip, reason}

const QUICK_POS = ["ngua", "ngtrai", "ngphai", "nuangoi"];

function viewRound() {
  const gioGhi = new Date();
  const rows = DB.admittedPatients().map(({ ep, p }) => {
    const ti = turnInfo(ep);
    const last = DB.lastAssessment(ep.id);
    const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
    return { p, ep, ti, lv, last };
  }).sort((a, b) => a.ep.bed.localeCompare(b.ep.bed, "vi"));

  /* Cả buồng đều ghi được. Ai lâu chưa xoay thì để lên đầu cho dễ thấy. */
  const todo = rows.slice().sort((a, b) =>
    (b.ti.toiLuc - a.ti.toiLuc) || (b.ti.cach - a.ti.cach) ||
    a.ep.bed.localeCompare(b.ep.bed, "vi"));
  const done = [];

  // gợi ý sẵn cho từng người, giữ lại lựa chọn người dùng đã sửa
  todo.forEach(r => {
    if (!ROUND[r.ep.id]) ROUND[r.ep.id] = { pos: suggestPosition(r.ep.id), skin: true, skip: false, reason: "" };
  });

  const rowHtml = r => {
    const sel = ROUND[r.ep.id] || {};
    return `<div class="rndrow ${sel.skip ? "skipped" : ""}" data-rrow="${r.ep.id}">
      <div class="rnd-h">
        <span class="bed mono">${esc(r.ep.bed || "—")}</span>
        <b>${esc(r.p.name)}</b>
        ${r.lv != null ? levelPill(r.lv, " sm") : ""}
        <span class="rnd-slot ${r.ti.toiLuc && !r.ti.never ? "bad" : ""}">${
          r.ti.never ? "chưa ghi lượt nào"
            : `${fmtDur(r.ti.cach)} trước`}${r.ti.every !== 3 ? ` · mục tiêu ${r.ti.every}g` : ""}</span>
        ${r.ti.last ? `<span class="rnd-prev">${esc(posShort(r.ti.last.pos))} lúc ${fmtTime(r.ti.last.at)}</span>` : ""}
      </div>
      <div class="rnd-pos">
        ${QUICK_POS.map(v => `<button type="button" data-rpos="${v}" data-ep="${r.ep.id}"
          aria-pressed="${sel.pos === v && !sel.skip}">${esc(posShort(v))}</button>`).join("")}
        <button type="button" class="more" data-rmore="${r.ep.id}" aria-pressed="${
          sel.pos && QUICK_POS.indexOf(sel.pos) < 0 && !sel.skip}">${
          sel.pos && QUICK_POS.indexOf(sel.pos) < 0 ? esc(posShort(sel.pos)) : "khác"}</button>
        <button type="button" class="skip" data-rskip="${r.ep.id}" aria-pressed="${!!sel.skip}">chưa xoay được</button>
      </div>
      ${sel.skip ? `<div class="rnd-reason">
        <select data-rreason="${r.ep.id}">${TURN_REASONS.map(x =>
          `<option ${x === sel.reason ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>` : `
      <button type="button" class="rnd-skin" data-rskin="${r.ep.id}" aria-pressed="${sel.skin !== false}">
        <span class="box"><svg><use href="#i-check"/></svg></span>đã xem da điểm tì đè</button>`}
    </div>`;
  };

  const html = `
    <section class="card">
      <div class="card-h"><h2>Ghi xoay trở cả buồng</h2>
        <span class="hint">${todo.length} người bệnh · ghi lúc ${fmtTime(gioGhi)}</span></div>
      <p style="font-size:13.5px;color:var(--ink-2);line-height:1.55">
        Tư thế đã gợi ý sẵn. Chỉ sửa ca nào khác gợi ý, rồi bấm lưu một lần.
        Lượt ghi mang <b>đúng giờ bấm nút</b>.</p>
      ${todo.filter(r => r.ti.toiLuc && !r.ti.never).length
        ? `<p class="hintbox" style="margin-top:9px">Có <b>${todo.filter(r => r.ti.toiLuc && !r.ti.never).length}
            người bệnh</b> đã quá khoảng cách mục tiêu của khoa — xếp lên đầu danh sách.</p>` : ""}
    </section>

    ${todo.length ? `<section>${todo.map(rowHtml).join("")}</section>`
      : `<div class="empty">Chưa có người bệnh nào đang điều trị.</div>`}

    ${todo.length ? `<div class="stickybar">
      <div class="live"><span class="l">Sẽ lưu</span><span class="v mono">${todo.length}</span></div>
      <button class="btn pri" data-rsave>Lưu cả buồng</button>
    </div><div style="height:56px"></div>` : ""}`;

  return {
    title: "Ghi xoay trở cả buồng", sub: fmtDT(gioGhi), html,
    bind() {
      $$("[data-rpos]").forEach(b => b.onclick = () => {
        const s = ROUND[b.dataset.ep]; s.pos = b.dataset.rpos; s.skip = false; render();
      });
      $$("[data-rskip]").forEach(b => b.onclick = () => {
        const s = ROUND[b.dataset.rskip];
        s.skip = !s.skip;
        if (s.skip && !s.reason) s.reason = TURN_REASONS[0];
        render();
      });
      $$("[data-rskin]").forEach(b => b.onclick = () => {
        const s = ROUND[b.dataset.rskin]; s.skin = s.skin === false; render();
      });
      $$("[data-rreason]").forEach(sel => sel.onchange = () => {
        ROUND[sel.dataset.rreason].reason = sel.value;
      });
      $$("[data-rmore]").forEach(b => b.onclick = () => {
        const epId = b.dataset.rmore;
        modal({
          title: "Chọn tư thế khác",
          body: `<div class="bundle">${POSITIONS.map(o =>
            `<div class="bitem" data-mpos="${o.v}" role="button" tabindex="0"
              aria-pressed="${ROUND[epId].pos === o.v}">
              <span class="box"><svg><use href="#i-check"/></svg></span>
              <span class="bt">${esc(o.t)}</span></div>`).join("")}</div>`,
          actions: [{ label: "Đóng" }]
        });
        setTimeout(() => $$(".modal [data-mpos]").forEach(el => el.onclick = () => {
          ROUND[epId].pos = el.dataset.mpos; ROUND[epId].skip = false;
          $(".modal").remove(); render();
        }), 30);
      });

      const sv = $("[data-rsave]");
      if (sv) sv.onclick = () => {
        const nowIso = new Date().toISOString();
        let n = 0, ns = 0;
        todo.forEach(r => {
          const s = ROUND[r.ep.id]; if (!s) return;

          DB.data.turns.push({
            id: uid("t"), patientId: r.p.id, episodeId: r.ep.id,
            at: nowIso,
            pos: s.skip ? null : s.pos, skipped: !!s.skip,
            reason: s.skip ? s.reason : "",
            by: Session.user.id, skinOk: s.skip ? false : s.skin !== false,
            note: "", batch: true
          });
          s.skip ? ns++ : n++;
        });
        DB.log("xoay-tro-ca-buong", `${fmtTime(gioGhi)} — ${n} lượt xoay, ${ns} hoãn`, "round", "");
        DB.save();
        ROUND = {};
        toast(`Đã ghi ${n} lượt xoay trở cho cả buồng`, "ok", 5000);
        Nav.back();
      };
    }
  };
}

/* ------------------------------------------------------------
   2. TRẠNG THÁI LIỀN THƯƠNG
   ------------------------------------------------------------ */
function setLesionStatus(les, status, note) {
  const now = new Date().toISOString();
  const old = DB.lesionState(les.key);
  const rec = old || { id: uid("ls"), key: les.key, episodeId: les.key.split("|")[0],
                       site: les.site, device: les.device || "" };
  rec.status = status;
  rec.at = now;
  rec.by = Session.user.id;
  rec.note = note || "";
  rec.history = (rec.history || []).concat([{ status, at: now, by: Session.user.id, note: note || "" }]);
  touch(rec);
  if (!old) DB.data.lesionStates.push(rec);
  DB.log("trang-thai-ton-thuong", `${les.site}: ${LESION_STATUS[status].t}`, "lesion", les.key);
  DB.save();
}

/* Ghi một lần theo dõi — ghi được bao nhiêu lần tuỳ ý, mỗi lần là một dòng trong diễn tiến */
function lesionStatusDialog(les, status) {
  const isHeal = status === "lanh";
  const isReopen = status === "moflai";
  const head = `<p style="font-size:14px;line-height:1.55">
      <b>${esc(les.site)}</b>${les.device ? ` — ${esc(les.device)}` : ""} · độ ${esc(les.stage)} ·
      phát hiện ${fmtDate(les.foundAt)}${les.poa ? " (có sẵn khi nhập khoa)" : " (phát sinh tại khoa)"}.</p>`;

  if (isHeal || isReopen) {
    modal({
      title: isHeal ? "Đánh dấu tổn thương đã lành" : "Mở lại theo dõi",
      body: head + (isHeal ? `<div class="notice"><svg><use href="#i-info"/></svg><span>
          Chỉ đánh dấu khi da đã liền kín, hết hồng ban và ổn định qua ít nhất một ca sau.</span></div>`
        : `<div class="notice warn"><svg><use href="#i-alert"/></svg><span>
          Dùng khi vùng đã lành bị tổn thương trở lại. Diễn tiến cũ vẫn giữ nguyên.</span></div>`) + `
        <div class="field"><label for="ls-note">Mô tả tình trạng da</label>
          <textarea id="ls-note" placeholder="${isHeal
            ? "vd: Da đã liền kín, không còn hồng ban, sờ không thấy cứng."
            : "vd: Vùng cùng cụt đỏ trở lại sau 2 ngày nằm sấp."}"></textarea></div>`,
      actions: [{ label: "Huỷ" }, {
        label: isHeal ? "Xác nhận đã lành" : "Mở lại theo dõi", kind: "pri", onClick: (b) => {
          const note = $("#ls-note", b).value.trim();
          if (!note) { toast("Cần mô tả tình trạng da", "err"); return false; }
          setLesionStatus(les, isHeal ? "lanh" : "theodoi", note);
          toast(isHeal ? "Đã ghi nhận tổn thương lành" : "Đã mở lại theo dõi", "ok");
        }
      }]
    });
    return;
  }

  /* Cập nhật diễn tiến: chọn tình trạng hiện tại, ghi bao nhiêu lần cũng được */
  modal({
    title: "Ghi diễn tiến tổn thương",
    body: head + `
      <div class="field"><label>Tình trạng hiện tại</label>
        <div class="bundle" id="ls-pick">
          ${LESION_PROGRESS.map(v => `<div class="bitem" data-lsp="${v}" role="button" tabindex="0"
            aria-pressed="${v === (les.status === "lanh" ? "theodoi" : les.status)}">
            <span class="box"><svg><use href="#i-check"/></svg></span>
            <span class="bt">${esc(LESION_STATUS[v].t)}</span></div>`).join("")}
        </div></div>
      <div class="field"><label for="ls-note">Mô tả lần theo dõi này</label>
        <textarea id="ls-note" placeholder="vd: Vết trợt thu nhỏ còn 1 × 1 cm, đáy đỏ, không tiết dịch."></textarea></div>
      <p style="font-size:12.5px;color:var(--ink-3)">
        Mỗi lần ghi là một dòng trong diễn tiến, lưu tên người ghi và giờ. Ghi được nhiều lần.</p>`,
    actions: [{ label: "Huỷ" }, { label: "Lưu diễn tiến", kind: "pri", onClick: (b) => {
      const sel = $("[data-lsp][aria-pressed='true']", b);
      const note = $("#ls-note", b).value.trim();
      if (!sel) { toast("Chưa chọn tình trạng", "err"); return false; }
      if (!note) { toast("Cần mô tả lần theo dõi này", "err"); return false; }
      setLesionStatus(les, sel.dataset.lsp, note);
      toast("Đã ghi diễn tiến", "ok");
    }}]
  });
  setTimeout(() => {
    const host = $(".modal");
    $$("[data-lsp]", host).forEach(el => {
      const set = () => {
        $$("[data-lsp]", host).forEach(x => x.setAttribute("aria-pressed", "false"));
        el.setAttribute("aria-pressed", "true");
      };
      el.onclick = set;
      el.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); set(); } };
    });
  }, 30);
}


/* ============================================================
   GHI TỔN THƯƠNG NGOÀI PHIẾU ĐÁNH GIÁ
   ------------------------------------------------------------
   Lần đầu người bệnh nhập khoa vẫn đi trọn: Waterlow → yếu tố
   hồi sức → tổn thương. Những lần sau, phát hiện tổn thương mới
   hay tổn thương đổi độ thì ghi thẳng ở đây, không phải làm lại
   thang điểm.

   Bản ghi tạo ra KHÔNG SỬA ĐƯỢC, y như phiếu đánh giá đã ký.
   Ghi sai thì ghi bản mới đè lên, vết cũ vẫn còn trong nhật ký.
   ============================================================ */

/* Ảnh chụp cho bản ghi tổn thương. Trả về bản ghi ảnh, hoặc null. */
async function chupAnhTonThuong(p) {
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve(null);
      const now = new Date();
      const dau = `${p.mrn} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      try {
        toast("Đang xử lý ảnh…");
        const dataUrl = await compressImage(f, dau);
        const id = uid("ph");
        const ok = await Photos.put(id, dataUrl);
        if (!ok) { toast("Không lưu được ảnh trên thiết bị này", "err"); return resolve(null); }
        Photos.push(id, dataUrl);
        resolve({ id, at: now.toISOString(), by: Session.user.id });
      } catch (e) { toast(e.message || "Không xử lý được ảnh", "err"); resolve(null); }
    };
    inp.click();
  });
}

      <div class="field"><label>Ảnh vùng tổn thương</label>
        <div class="btnrow"><button class="btn sm" type="button" id="ll-anh">
          <svg><use href="#i-cam"/></svg>Chụp ảnh</button>
          <span id="ll-anhso" class="help" style="align-self:center">chưa có ảnh</span></div>
        <span class="help">Chỉ chụp vùng tổn thương, không chụp mặt hay chi tiết nhận dạng.</span></div>`,
    actions: [{ label: "Huỷ" }, { label: capNhat ? "Lưu bản ghi" : "Ghi nhận", kind: "pri", onClick: (b) => {
      const gio = new Date().toISOString();
      const kDev = capNhat ? isDev : $("#ll-k1", b).getAttribute("aria-pressed") === "true";
      const rec = {
        id: uid("ll"), patientId: p.id, episodeId: ep.id, at: gio, by: Session.user.id,
        kind: capNhat ? "capnhat" : "moi",
        site: capNhat ? les.site : $("#ll-site", b).value,
        device: capNhat ? (les.device || null) : (kDev ? $("#ll-dev", b).value : null),
        stage: $("#ll-stage", b).value,
        poa: capNhat ? !!les.poa : $("#ll-poa1", b).getAttribute("aria-pressed") === "true",
        size: $("#ll-size", b).value.trim(),
        note: $("#ll-note", b).value.trim(),
        photos: anh,
        foundAt: capNhat ? les.foundAt
          : new Date($("#ll-found", b).value || Date.now()).toISOString()
      };
      (DB.data.lesionLogs = DB.data.lesionLogs || []).push(rec);
      DB.log(capNhat ? "cap-nhat-ton-thuong" : "ghi-ton-thuong-moi",
        `${p.name} (${p.mrn}) — ${rec.site} độ ${rec.stage}`, "episode", ep.id);
      DB.save();
      toast(capNhat ? "Đã lưu bản ghi" : "Đã ghi nhận tổn thương", "ok");
      render();
    }}]
  });

  /* Tì đè / thiết bị */
  if (!capNhat) {
    const k0 = $("#ll-k0", m.body), k1 = $("#ll-k1", m.body), dw = $("#ll-devwrap", m.body);
    const doi = dev => { k0.setAttribute("aria-pressed", !dev); k1.setAttribute("aria-pressed", dev);
      dw.hidden = !dev; };
    k0.onclick = () => doi(false);
    k1.onclick = () => doi(true);
    const p0 = $("#ll-poa0", m.body), p1 = $("#ll-poa1", m.body);
    p0.onclick = () => { p0.setAttribute("aria-pressed", "true"); p1.setAttribute("aria-pressed", "false"); };
    p1.onclick = () => { p1.setAttribute("aria-pressed", "true"); p0.setAttribute("aria-pressed", "false"); };
  }

  const nutAnh = $("#ll-anh", m.body), soAnh = $("#ll-anhso", m.body);
  nutAnh.onclick = async () => {
    const a = await chupAnhTonThuong(p);
    if (a) { anh.push(a); soAnh.textContent = `${anh.length} ảnh đã chụp`; }
  };
}

  const hist = (les.state && les.state.history) || [];
  const days = daysBetween(les.foundAt, healed && les.state ? les.state.at : new Date());
  return `<div class="lesion ${healed ? "healed" : ""}">
    <div class="lh"><span class="t">${esc(les.site)}${les.device ? ` — ${esc(les.device)}` : ""}</span>
      <span class="pill neutral sm">Độ ${esc(les.stage)}</span></div>
    <div class="tagrow">
      <span class="tag ${sInfo.tag}">${esc(sInfo.t)}</span>
      <span class="tag ${les.poa ? "poa" : "hapi"}">${les.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa"}</span>
      ${les.isDevice ? `<span class="tag">Do thiết bị y tế</span>` : ""}
      <span class="tag">Phát hiện ${fmtDate(les.foundAt)}</span>
      <span class="tag">${healed ? `Lành sau ${days} ngày` : `Đang theo dõi ngày thứ ${days + 1}`}</span>

    </div>
    ${les.note ? `<p style="font-size:13px;color:var(--ink-2)">${esc(les.note)}</p>` : ""}
    ${hist.length ? `<div class="lshist">
      <div class="lsrow">
        <span class="tag ${LESION_STATUS[hist[hist.length-1].status] ? LESION_STATUS[hist[hist.length-1].status].tag : ""}">${
          esc((LESION_STATUS[hist[hist.length-1].status] || {}).t || hist[hist.length-1].status)}</span>
        <div><span class="lsnote">${esc(hist[hist.length-1].note || "—")}</span>
          <span class="who">${esc(DB.userName(hist[hist.length-1].by))} · ${fmtDT(hist[hist.length-1].at)}</span></div>
      </div>
      ${hist.length > 1 ? `<details class="fold bare sm">
        <summary>${hist.length - 1} lần ghi trước<span class="fsum">từ ${fmtDate(hist[0].at)}</span></summary>
        <div class="foldin">
      ${hist.slice(0, -1).reverse().map(h => `<div class="lsrow">
        <span class="tag ${LESION_STATUS[h.status] ? LESION_STATUS[h.status].tag : ""}">${
          esc((LESION_STATUS[h.status] || {}).t || h.status)}</span>
        <div><span class="lsnote">${esc(h.note || "—")}</span>
          <span class="who">${esc(DB.userName(h.by))} · ${fmtDT(h.at)}</span></div>
      </div>`).join("")}
        </div></details>` : ""}
    </div>` : ""}
    ${(les.photos || []).length ? `<details class="fold bare sm">
      <summary>Ảnh vùng tổn thương<span class="fsum">${les.photos.length} ảnh</span></summary>
      <div class="foldin"><div class="gal">${les.photos.map(ph =>
        `<figure data-lb="${ph.id}" data-cap="${esc(les.site + " · " + fmtDT(ph.at))}">
          <img data-photo="${ph.id}" alt="Ảnh ${esc(les.site)}">
          <figcaption>${fmtDate(ph.at)}</figcaption></figure>`).join("")}</div></div>
    </details>` : ""}
    <div class="btnrow" style="margin-top:6px">
      ${healed

        : `<button class="btn sm" data-lupd="${esc(les.key)}">Đổi độ / thêm ảnh</button>
           <button class="btn sm" data-lstat="theodoi" data-lkey="${esc(les.key)}">Ghi diễn tiến</button>
           <button class="btn sm" data-lstat="lanh" data-lkey="${esc(les.key)}">Đánh dấu đã lành</button>`}

function lesionsBlockNew(ep, dangDieuTri) {
  if (!ep) return "";
  const all = lesionsOfEpisode(ep.id);
  const active = all.filter(l => l.status !== "lanh");
  const healed = all.filter(l => l.status === "lanh");
  return `<section class="phang" id="lesion-sec">
    <div class="card-h"><h2>Tổn thương của đợt điều trị này</h2>
      <span class="hint">${active.length} đang theo dõi · ${healed.length} đã lành</span></div>
    ${dangDieuTri ? `<div class="btnrow" style="margin-bottom:10px">
      <button class="btn sm pri" data-lnew><svg><use href="#i-plus"/></svg>Ghi nhận tổn thương mới</button>
    </div>` : ""}
    ${active.length ? active.map(lesionCard).join("")
      : all.length ? `<div class="notice"><svg><use href="#i-check"/></svg><span>
          Không còn tổn thương nào đang theo dõi. Vẫn tiếp tục gói chăm sóc dự phòng.</span></div>`
      : `<div class="card"><div class="empty">Đợt điều trị này chưa ghi nhận tổn thương nào.${
          dangDieuTri ? `<br>Phát hiện tổn thương thì bấm <b>Ghi nhận tổn thương mới</b> ở trên —
          không cần làm lại thang điểm Waterlow.` : ""}</div></div>`}
    ${healed.length ? `<details style="margin-top:6px">
      <summary style="cursor:pointer;font-size:13.5px;color:var(--ink-2);padding:6px 0">
        Đã lành (${healed.length}) — bấm để xem</summary>
      <div style="margin-top:8px">${healed.map(lesionCard).join("")}</div>

function bindLesionActions(pid) {
  const p = DB.patient(pid);
  const epCur = DB.activeEpisode(pid);
  const epAny = epCur || DB.episodesOf(pid)[0];
  $$("[data-lstat]").forEach(b => b.onclick = () => {
    const les = lesionsOfEpisode(epAny.id).find(l => l.key === b.dataset.lkey);
    if (les) lesionStatusDialog(les, b.dataset.lstat);
  });
  /* Ghi tổn thương mới, và đổi độ / thêm ảnh cho tổn thương đang có —
     không phải đi qua phiếu đánh giá Waterlow nữa */
  const nm = $("[data-lnew]");
  if (nm) nm.onclick = () => lesionLogDialog(p, epCur, null);
  $$("[data-lupd]").forEach(b => b.onclick = () => {

/* ------------------------------------------------------------
   3. GIAO BAN
   Màn hình luôn là CA ĐANG TRỰC. Chốt xong thì ca đó đóng lại,
   thành biên bản cố định; ca sau mở trang trắng của mình.
   ------------------------------------------------------------ */

/* Dựng toàn bộ nội dung bàn giao của một ca thành dữ liệu thuần,
   để khi ký thì đóng băng đúng những gì đã ký. */
function buildHandoverBody(shift, ref) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const { start, end } = shiftRange(shift, ref);
  const dayKey = isoDay(start);
  const notesOf = epId => (DB.data.handoverNotes || [])
    .filter(n => n.episodeId === epId && n.day === dayKey && n.shift === shift.v)
    .sort((a, b) => a.at.localeCompare(b.at))
    .map(n => ({ text: n.text, by: DB.userName(n.by), at: n.at }));

  const rows = DB.admittedPatients().map(({ ep, p }) => {
    const last = DB.lastAssessment(ep.id);
    const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
    const clv = last ? careLevelOf(last) : null;
    const due = dueInfo(ep);
    const ti = turnInfo(ep);
    const les = lesionsOfEpisode(ep.id);
    const lesActive = les.filter(l => l.status !== "lanh");
    const lesHealed = les.filter(l => l.status === "lanh" && l.state &&
      dOf(l.state.at) >= start && dOf(l.state.at) < end);
    const newHapi = les.filter(l => !l.poa && dOf(l.foundAt) >= start && dOf(l.foundAt) < end);
    const assessShift = DB.assessmentsOf(ep.id).filter(a => dOf(a.at) >= start && dOf(a.at) < end);
    const turnsShift = (DB.data.turns || []).filter(t => t.episodeId === ep.id &&
      dOf(t.at) >= start && dOf(t.at) < end);
    const flags = DB.flagsOf(p.id).filter(f => f.status !== "dong");
    const newAdmit = dOf(ep.admittedAt) >= start;

    /* Ca có vào phần BÀN GIAO TRỌNG ĐIỂM hay không — theo DANH SÁCH TIÊU CHÍ
       do khoa bật/tắt trong Cài đặt, không phải bảng điểm.
       Thoả bất kỳ tiêu chí nào đang bật thì vào trọng điểm, và ghi rõ vì sao.
       Cơ sở: Thông tư 31/2021/TT-BYT Điều 6 khoản 1 điểm h yêu cầu bàn giao
       "các vấn đề cần theo dõi" nhưng để khoa tự xác định; khung I-PASS dùng
       cách đánh dấu theo mức thay vì chấm điểm. */
    const tc = (DB.data.settings || DEFAULT_SETTINGS()).hoTieuChi || DEFAULT_HO_TIEUCHI();
    const why = [];
    if (tc.loetMoi && newHapi.length) why.push("loét mới phát sinh trong ca");
    if (tc.dangLoet && lesActive.length) why.push("đang có tổn thương chưa lành");
    if (tc.luuY && flags.length) why.push("có mục cần lưu ý chưa đóng");
    if (tc.quaHanDG && due.overdue) why.push("quá hạn đánh giá lại");
    if (tc.chuaDG && !last) why.push("chưa đánh giá lần nào");
    if (tc.xoayTre && ti.toiLuc && !ti.never) why.push(`quá khoảng cách xoay trở mục tiêu (${fmtDur(ti.quaBaoLau)})`);
    if (tc.nguyCoRatCao && lv === 3) why.push("nguy cơ rất cao");
    if (tc.moiNhapKhoa && newAdmit) why.push("mới nhập khoa trong ca");
    const score = why.length ? 100 : 0;   // giữ tên cũ để phần xếp thứ tự không phải sửa

    /* Diễn biến trong ca */
    const pts = [];
    if (!last) pts.push(`<b>Chưa đánh giá lần nào</b>`);
    else if (clv > lv) pts.push(`Chăm sóc theo mức <b>${esc(LEVELS[clv].short.toLowerCase())}</b>
      — nâng một mức so với mức nguy cơ`);
    if (newAdmit) pts.push(`Mới nhập khoa lúc ${fmtTime(ep.admittedAt)}`);
    newHapi.forEach(l => pts.push(`<b>Tổn thương mới trong ca: ${esc(l.site)} độ ${esc(l.stage)}</b>`));
    lesActive.filter(l => newHapi.indexOf(l) < 0).forEach(l => pts.push(
      `${esc(l.site)} độ ${esc(l.stage)} — ${esc(LESION_STATUS[l.status].t.toLowerCase())}, ngày thứ ${daysBetween(l.foundAt, new Date()) + 1}`));
    lesHealed.forEach(l => pts.push(`${esc(l.site)} — <b>đã lành</b> trong ca này`));
    pts.push(`Xoay trở ${turnsShift.length} lượt trong ca (mục tiêu mỗi ${ti.every} giờ)${
      ti.last ? `, gần nhất ${fmtTime(ti.last.at)} — ${esc(posName(ti.last.pos))}` : ""}${
      ti.skip24h ? `, ${ti.skip24h} lượt chưa xoay được có ghi lý do` : ""}`);
    if (assessShift.length) pts.push(`Đã đánh giá lại ${assessShift.length} lượt trong ca`);
    flags.forEach(f => pts.push(`Cần lưu ý (${esc(f.status === "moi" ? "chưa tiếp nhận"
      : f.status === "tiepnhan" ? "đã tiếp nhận" : "đang xử lý")}): ${esc(f.text)}`));

    /* Việc của ca sau */
    const todo = [];
    if (!last) todo.push(due.overdue
      ? `<b>Đánh giá Waterlow lần đầu ngay</b> — đã quá hạn ${fmtDur(Date.now() - due.due.getTime())}`
      : `Đánh giá Waterlow lần đầu — hạn ${fmtDT(due.due)}`);
    else if (due.overdue) todo.push(`<b>Đánh giá lại ngay</b> — đã quá hạn ${fmtDur(Date.now() - due.due.getTime())}`);
    else todo.push(`Đánh giá lại trước ${fmtDT(due.due)}`);
    if (ti.toiLuc && !ti.never) todo.push(`<b>Xoay trở ngay</b> — lần gần nhất đã ${fmtDur(ti.cach)} trước`);
    else todo.push(`Xoay trở tiếp khoảng ${fmtTime(ti.due)}${
      ti.last ? ` (gợi ý: ${esc(posName(suggestPosition(ep.id)))})` : ""}`);
    if (lesActive.length) todo.push(`Thay băng / chụp ảnh theo dõi ${lesActive.map(l => esc(l.site)).join(", ")}`);
    flags.filter(f => f.status === "moi").forEach(() => todo.push(`Tiếp nhận mục cần lưu ý trên ứng dụng`));

    return {
      epId: ep.id, patientId: p.id, score,
      bed: ep.bed || "—", name: p.name, mrn: p.mrn, dx: ep.diagnosis || "",
      lv, waterlow: last ? last.score : null,
      turnsShift: turnsShift.length, dueTxt: fmtDT(due.due),
      pts, todo, why, notes: notesOf(ep.id),
      /* gap = ca sau phải LÀM cái gì đó ngay, không chỉ theo dõi tiếp.
         Dùng để tách hai mức trong màn giao ban. Biên bản cũ không có trường
         này — chỗ hiển thị coi thiếu là "cần làm ngay", nên bản cũ vẫn đọc y như trước. */
      gap: !!(newHapi.length || due.overdue || !last || (ti.toiLuc && !ti.never)
              || flags.some(f => f.status === "moi")),
      _f: { lesActive: lesActive.length, newHapi: newHapi.length, lesHealed: lesHealed.length,
            dueOver: due.overdue, turnOver: !!(ti.toiLuc && !ti.never), assess: assessShift.length, newAdmit }
    };
  }).sort((a, b) => b.score - a.score || (b.gap ? 1 : 0) - (a.gap ? 1 : 0)
                 || (b.waterlow || 0) - (a.waterlow || 0));

  const sum = {
    tong: rows.length,
    loet: rows.filter(r => r._f.lesActive).length,
    moiphatsinh: rows.filter(r => r._f.newHapi).length,
    quahandg: rows.filter(r => r._f.dueOver).length,
    quahanxt: rows.filter(r => r._f.turnOver).length,
    canluuy: DB.openFlags().length,
    lanh: rows.reduce((n, r) => n + r._f.lesHealed, 0),
    luotdg: rows.reduce((n, r) => n + r._f.assess, 0),
    luotxt: rows.reduce((n, r) => n + r.turnsShift, 0),
    nhapmoi: rows.filter(r => r._f.newAdmit).length
  };

  return {
    wardName: st.wardName, hospital: st.hospital,
    shift: shift.v, shiftName: shift.t, from: shift.from, to: shift.to,
    day: dayKey, start: start.toISOString(), end: end.toISOString(),
    sum,
    cases: rows.filter(r => r.score > 0),
    others: rows.filter(r => r.score === 0).map(r => ({
      bed: r.bed, name: r.name, waterlow: r.waterlow, turnsShift: r.turnsShift, dueTxt: r.dueTxt })),
    notesCount: rows.reduce((n, r) => n + r.notes.length, 0)
  };
}

/* Vẽ nội dung bàn giao — dùng chung cho bản nháp đang trực và biên bản đã ký */
function renderHOBody(b, opts) {
  opts = opts || {};
  const s = b.sum;
  /* Thứ tự đọc: ai — vì sao trong trọng điểm — ca sau phải làm gì.
     Phần mô tả diễn biến gấp lại; in giấy thì bung hết ra (xem @media print). */
  /* Đầu thẻ nói đủ ai và nặng cỡ nào: giường · tên · mã hồ sơ · mức nguy cơ ·
     điểm Waterlow, rồi chẩn đoán một dòng. Không còn dòng "trọng điểm vì" —
     nhìn việc của ca sau là biết vì sao ca này nằm đây.
     Diễn biến bung sẵn, không gấp, để đọc một lượt lúc giao ban. */
  const caseCard = r => `<div class="hocase ${levelClass(r.lv == null ? 2 : r.lv)}">
    <div class="hn"><span class="bed">${esc(r.bed)}</span><b>${esc(r.name)}</b>
      <span class="mrn mono">${esc(r.mrn)}</span>
      ${r.waterlow == null ? `<span class="pill neutral sm">chưa đánh giá</span>`
        : `${levelPill(r.lv, " sm")}<span class="tag mono">Waterlow ${r.waterlow}</span>`}</div>
    ${r.dx ? `<div class="hdx">${esc(r.dx)}</div>` : ""}
    <div class="todo"><b>Việc của ca sau:</b> ${r.todo.join(" · ")}</div>
    ${r.pts.length ? `<ul class="hpts">${r.pts.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
    ${r.notes.length ? `<div class="hnotes">
      ${r.notes.map(n => `<div class="hnote"><span class="q">”</span><div>${esc(n.text)}
        <span class="who">${esc(n.by)} · ${fmtTime(n.at)}</span></div></div>`).join("")}
    </div>` : ""}
    ${opts.editable ? `<div class="btnrow noprint" style="margin-top:10px">
      <button class="btn sm" data-honote="${r.epId}">+ Điều dưỡng dặn thêm</button>
      <button class="btn sm ghost" data-hopatient="${r.patientId}">Mở hồ sơ</button>
    </div>` : ""}
  </div>`;

  /* Ca chỉ cần theo dõi tiếp: một dòng, mở ra mới thấy diễn biến và việc ca sau */
  const caseSlim = r => `<div class="hocase slim ${levelClass(r.lv == null ? 2 : r.lv)}">
    <details class="fold bare sm"><summary>
      <span class="bed">${esc(r.bed)}</span><b>${esc(r.name)}</b>
      ${r.waterlow == null ? "" : `<span class="tag mono">W ${r.waterlow}</span>`}
      <span class="fsum">${esc(r.dx || "theo dõi tiếp")}</span></summary>
      <div class="foldin">
        <div class="hdx"><span class="mono">${esc(r.mrn)}</span>${r.dx ? " · " + esc(r.dx) : ""}</div>
        ${r.pts.length ? `<ul class="hpts">${r.pts.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
        <div class="todo"><b>Việc của ca sau:</b> ${r.todo.join(" · ")}</div>
        ${r.notes.length ? `<div class="hnotes">
          ${r.notes.map(n => `<div class="hnote"><span class="q">”</span><div>${esc(n.text)}
            <span class="who">${esc(n.by)} · ${fmtTime(n.at)}</span></div></div>`).join("")}
        </div>` : ""}
        ${opts.editable ? `<div class="btnrow noprint" style="margin-top:8px">

      ${!b.cases.length ? `<div class="empty">Không có ca nào cần bàn giao đặc biệt trong ca này.</div>` : ""}

/* Chuỗi chữ ký của một biên bản */
function hoChain(b, ho, nNotes, lastNote) {
  const step = (done, title, who, at, pendingTxt) => `<div class="step ${done ? "" : "pending"}">
    <div class="col"><div class="dot"></div><div class="line"></div></div>
    <div class="txt">${done ? title : esc(pendingTxt || title)}
      ${done && who ? `<span class="who">${esc(who)} · ${fmtDT(at)}</span>` : ""}</div></div>`;
  return `<div class="chain" style="border-radius:var(--r-md);border:1px solid var(--line);border-top:1px solid var(--line)">
    ${step(true, `Hệ thống tổng hợp diễn biến ${esc(b.shiftName.toLowerCase())}: ${b.sum.tong} người bệnh, ${b.sum.luotxt} lượt xoay trở, ${b.sum.luotdg} lượt đánh giá`,
      "Tự động", b.start, "")}
    ${step(nNotes > 0, `Điều dưỡng trực dặn thêm ${nNotes} nội dung cho ca sau`,
      lastNote ? `ghi gần nhất: ${lastNote.by}` : "", lastNote ? lastNote.at : null,
      "Điều dưỡng trực bổ sung dặn dò (bấm “+ Điều dưỡng dặn thêm” ở từng ca)")}
    ${step(!!ho, ho ? `Chốt bàn giao${ho.note ? ": " + esc(ho.note) : ""}` : "",
      ho ? DB.userName(ho.by) : "", ho ? ho.at : null, "Người giao ca chốt và ký")}
    ${step(!!(ho && ho.receivedAt), ho && ho.receivedAt
      ? `Nhận bàn giao${ho.receiveNote ? ": " + esc(ho.receiveNote) : ""}` : "",
      ho && ho.receivedBy ? DB.userName(ho.receivedBy) : "", ho ? ho.receivedAt : null,
      "Người nhận ca xác nhận đã nhận")}
  </div>`;
}

function hoFind(day, shiftV) {
  return (DB.data.handovers || []).find(h => h.day === day && h.shift === shiftV) || null;
}
function hoAll() {
  return (DB.data.handovers || []).slice().sort((a, b) => b.at.localeCompare(a.at));
}
