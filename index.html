/* Dòng thời gian ảnh theo vị trí — dùng để so sánh tiến triển */
function photoTimeline(pid, ep) {
  if (!ep) return "";
  const all = DB.assessmentsOf(ep.id).slice().reverse();
  const bySite = {};
  all.forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => {
      (l.photos || []).forEach(ph => {
        (bySite[l.site] = bySite[l.site] || []).push({ ...ph, stage: l.stage, site: l.site });
      });
    });
  });
  const sites = Object.keys(bySite).filter(s => bySite[s].length);
  if (!sites.length) return "";
  const nAnh = sites.reduce((n, s) => n + bySite[s].length, 0);
  return `
    <details class="fold">
      <summary>So sánh tiến triển bằng hình ảnh<span class="fsum">${sites.length} vị trí · ${nAnh} ảnh</span></summary>
      <div class="foldin">
    ${sites.map(s => `<div style="margin-bottom:14px">
      <div class="eyebrow" style="margin-bottom:6px">${esc(s)}</div>
      <div class="gal">${bySite[s].map(ph => `<figure data-lb="${ph.id}" data-cap="${esc(s + " · độ " + ph.stage + " · " + fmtDT(ph.at))}">
        <img data-photo="${ph.id}" alt="Ảnh ${esc(s)} ngày ${fmtDate(ph.at)}">
        <figcaption>${fmtDate(ph.at)} · độ ${esc(ph.stage)}</figcaption></figure>`).join("")}</div>
    </div>`).join("")}
      </div>
    </details>`;
}

async function hydratePhotos(root) {
  const imgs = $$("img[data-photo]", root);
  for (const im of imgs) {
    if (im.dataset.loaded) continue;
    const d = await Photos.get(im.dataset.photo);
    if (d) { im.src = d; im.dataset.loaded = "1"; }
    else { im.replaceWith(Object.assign(document.createElement("div"),
      { className: "empty", style: "font-size:11px;padding:8px;height:100%;display:grid;place-items:center", textContent: "Ảnh không có trên máy này" })); }
  }
  $$("[data-lb]", root).forEach(fg => fg.onclick = async () => {
    const d = await Photos.get(fg.dataset.lb);
    if (d) lightbox(d, fg.dataset.cap); else toast("Ảnh chưa được tải về máy này", "err");
  });
}

/* --- Nhập / xuất viện --- */
function dischargeDialog(p, ep) {
  modal({
    title: "Kết thúc đợt điều trị",
    body: `<p style="font-size:14px;line-height:1.55">Xác nhận <b>${esc(p.name)}</b> ra khỏi khoa.
        Hồ sơ vẫn được lưu; khi người bệnh nhập lại chỉ cần tìm theo tên và ngày sinh rồi bấm “Nhập viện lại”.</p>
      <div class="field"><label for="dc-type">Hình thức kết thúc</label>
        <select id="dc-type">${KETTHUC.map(t => `<option>${t}</option>`).join("")}</select></div>
      <div class="field"><label for="dc-note">Ghi chú bàn giao (tình trạng da khi rời khoa)</label>
        <textarea id="dc-note" placeholder="vd: Vùng cùng cụt còn hồng ban độ I, đã bàn giao khoa Nội."></textarea></div>`,
    actions: [{ label: "Huỷ" }, { label: "Xác nhận xuất khoa", kind: "pri", onClick: (b) => {
      ep.dischargedAt = new Date().toISOString();
      ep.dischargeType = $("#dc-type", b).value;
      ep.dischargeNote = $("#dc-note", b).value.trim();
      ep.dischargedBy = Session.user.id;
      touch(ep);
      DB.data.flags.filter(f => f.episodeId === ep.id && f.status !== "dong").forEach(f => {
        f.status = "dong";
        f.events.push({ by: Session.user.id, at: new Date().toISOString(), type: "dong", text: "Đóng tự động do người bệnh xuất khoa" });
      });
      DB.log("xuat-khoa", `${p.name} (${p.mrn}) — ${ep.dischargeType}`, "episode", ep.id);
      DB.save(); toast("Đã kết thúc đợt điều trị", "ok");
    }}]
  });
}
function readmitDialog(p) {
  modal({
    title: "Nhập viện lại",
    body: `<p style="font-size:14px;line-height:1.55">Mở đợt điều trị mới cho <b>${esc(p.name)}</b> (${esc(p.mrn)}).
        Toàn bộ hồ sơ và ảnh các đợt trước vẫn được giữ để so sánh.</p>
      <div class="grid2">
        <div class="field"><label for="ra-bed">Giường</label><input id="ra-bed" type="text" placeholder="vd: HS-07"></div>
        <div class="field"><label for="ra-dx">Chẩn đoán chính</label><input id="ra-dx" type="text"></div>
      </div>`,
    actions: [{ label: "Huỷ" }, { label: "Nhập khoa", kind: "pri", onClick: (b) => {
      newEpisode(p.id, $("#ra-bed", b).value.trim(), $("#ra-dx", b).value.trim());
      DB.log("nhap-khoa-lai", `${p.name} (${p.mrn})`, "patient", p.id);
      DB.save(); toast("Đã mở đợt điều trị mới", "ok");
    }}]
  });
}
function editEpisodeDialog(ep) {
  modal({
    title: "Cập nhật thông tin đợt điều trị",
    body: `<div class="field"><label for="ee-bed">Giường</label><input id="ee-bed" type="text" value="${esc(ep.bed || "")}"></div>
      <div class="field"><label for="ee-dx">Chẩn đoán chính</label><input id="ee-dx" type="text" value="${esc(ep.diagnosis || "")}"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Lưu", kind: "pri", onClick: (b) => {
      ep.bed = $("#ee-bed", b).value.trim(); ep.diagnosis = $("#ee-dx", b).value.trim();
      touch(ep);
      DB.log("sua-dot-dieu-tri", `Giường ${ep.bed}`, "episode", ep.id);
      DB.save(); toast("Đã lưu", "ok");
    }}]
  });
}

/* --- Xem lại một phiếu đánh giá đã ký --- */
function showAssessment(aid) {
  const a = DB.data.assessments.find(x => x.id === aid);
  if (!a) return;
  const lv = a.level != null ? a.level : levelOf(a.score);
  const rows = WATERLOW.map(b => {
    const s = a.answers[b.key];
    let txt = "—";
    if (b.multi) txt = (s || []).map(i => b.opts[i]?.t).filter(Boolean).join("; ") || "không chọn";
    else if (s != null && b.opts[s]) txt = b.opts[s].t;
    return `<tr><td>${esc(b.title)}</td><td>${esc(txt)}</td><td class="num">${a.detail[b.key] || 0}</td></tr>`;
  }).join("");
  const mstTxt = (() => {
    const m = a.answers.mst || {};
    const aa = MST.a.opts.find(o => o.v === m.a);
    let t = aa ? aa.t : "—";
    if (m.a === "co" && m.b != null) t += "; sụt " + MST.b.opts[m.b].t;
    if (m.c != null) t += "; ăn kém: " + MST.c.opts[m.c].t;
    return t;
  })();
  modal({
    title: "Phiếu đánh giá đã ký", wide: true,
    body: `<div class="result ${levelClass(lv)}">
        <span class="big">${a.score}</span><span class="lvl">${esc(LEVELS[lv].name)}</span>
        <span class="sub">${fmtDT(a.at)} · ${esc(DB.userName(a.userId))}</span></div>
      <div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Mục</th><th>Lựa chọn</th><th>Điểm</th></tr></thead>
        <tbody>${rows}<tr><td>Sàng lọc dinh dưỡng (MST)</td><td>${esc(mstTxt)}</td><td class="num">${a.detail.mst || 0}</td></tr>
        <tr style="font-weight:700"><td colspan="2">Tổng điểm Waterlow</td><td class="num">${a.score}</td></tr></tbody></table></div>
      ${(a.icu || []).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Yếu tố nguy cơ đặc thù hồi sức</div>
        <div class="tagrow">${a.icu.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div>` : ""}
      ${(a.lesions || []).length || (a.mdrpi || []).length ? `<div><div class="eyebrow" style="margin-bottom:6px">Tổn thương ghi nhận</div>
        ${(a.lesions || []).map(l => lesionView(l)).join("")}${(a.mdrpi || []).map(l => lesionView(l, true)).join("")}</div>`
        : `<div class="notice"><svg><use href="#i-check"/></svg><span>Không ghi nhận tổn thương do tì đè tại thời điểm đánh giá.</span></div>`}
      ${a.note ? `<div><div class="eyebrow" style="margin-bottom:4px">Ghi chú</div><p style="font-size:14px;line-height:1.5">${esc(a.note)}</p></div>` : ""}
      <div class="notice"><svg><use href="#i-shield"/></svg><span>Phiếu đã ký bởi <b>${esc(DB.userName(a.userId))}</b> lúc ${fmtDT(a.at)} và không thể chỉnh sửa. Mọi thay đổi phải thực hiện bằng một lượt đánh giá mới.</span></div>`,
    actions: [{ label: "Đóng" }]
  });
  setTimeout(() => hydratePhotos($(".modal")), 60);
}
</script>
<script>
/* ============================================================
   PHIẾU ĐÁNH GIÁ LOÉT TÌ ĐÈ — 4 BƯỚC
   ============================================================ */
let AS = null;
const STEP_TITLES = ["Thang điểm Waterlow", "Yếu tố nguy cơ hồi sức", "Khám da và tổn thương", "Kết quả và gói chăm sóc"];

function initAssess(patientId, episodeId) {
  const p = DB.patient(patientId);
  const prev = DB.lastAssessment(episodeId);
  const ans = {};
  WATERLOW.forEach(b => { ans[b.key] = b.multi ? [] : null; });
  ans.mst = {};
  // Gợi ý sẵn từ hồ sơ và lần đánh giá trước
  if (p) {
    ans.sex = p.sex === "nu" ? 1 : 0;
    const ab = ageBandIndex(ageFrom(p.dob));
    if (ab != null) ans.age = ab;
  }
  if (prev) {
    // Chép lại các mục ít thay đổi để điều dưỡng chỉ cần soát lại
    ["build", "tissue", "neuro", "med"].forEach(k => {
      ans[k] = Array.isArray(prev.answers[k]) ? prev.answers[k].slice() : prev.answers[k];
    });
    ans.mst = clone(prev.answers.mst || {});
  }
  AS = {
    patientId, episodeId, step: 0, ans,
    icu: prev ? (prev.icu || []).slice() : [],
    noLesion: null, lesions: [], mdrpi: [],
    bundle: [], note: "", carriedFrom: prev ? prev.id : null
  };
  // Tổn thương đã ghi nhận trước đó được mang sang để theo dõi tiếp
  if (prev) {
    AS.lesions = clone(prev.lesions || []).map(l => ({ ...l, photos: (l.photos || []).slice(0, 0), carried: true }));
    AS.mdrpi = clone(prev.mdrpi || []).map(l => ({ ...l, photos: [], carried: true }));
    if (AS.lesions.length || AS.mdrpi.length) AS.noLesion = false;
  }
}

function viewAssess({ patientId, episodeId }) {
  if (!AS || AS.episodeId !== episodeId) initAssess(patientId, episodeId);
  const p = DB.patient(patientId);
  const ep = DB.episode(episodeId);
  if (!p || !ep) return { title: "Lỗi", html: `<div class="empty">Không tìm thấy đợt điều trị.</div>` };

  const body = [stepWaterlow, stepICU, stepSkin, stepResult][AS.step]();
  const html = `
    <div class="steps">${[0, 1, 2, 3].map(i =>
      `<span class="s ${i === AS.step ? "on" : i < AS.step ? "done" : ""}"></span>`).join("")}</div>
    <div class="stepinfo"><h2>${esc(STEP_TITLES[AS.step])}</h2><span class="of mono">Bước ${AS.step + 1}/4</span></div>
    <div id="stepbody">${body}</div>
    ${stickyBar()}`;

  return {
    title: p.name, sub: "Đánh giá · giường " + (ep.bed || "—"), html,
    bind() {
      bindStep();
      $("#as-next").onclick = nextStep;
      const pv = $("#as-prev"); if (pv) pv.onclick = () => { AS.step--; render(); };
      recalcAssess();
    }
  };
}

function stickyBar() {
  const last = AS.step === 3;
  return `<div class="stickybar">
    <div class="live"><span class="l">Tổng điểm Waterlow</span>
      <span class="v" id="live-score">0</span></div>
    <span id="live-pill"></span>
    ${AS.step > 0 ? `<button class="btn sm" id="as-prev">Quay lại</button>` : ""}
    <button class="btn pri" id="as-next">${last ? "Hoàn tất và ký" : "Tiếp tục"}</button>
  </div>`;
}

function recalcAssess() {
  if (!AS) return;
  const r = scoreWaterlow(AS.ans);
  const lv = levelOf(r.total);
  const s = $("#live-score"); if (s) s.textContent = r.total;
  const pl = $("#live-pill"); if (pl) pl.innerHTML = levelPill(lv, " sm");
  WATERLOW.forEach(b => {
    const el = $(`[data-pts="${b.key}"]`);
    if (el) { el.textContent = "+" + (r.detail[b.key] || 0); el.classList.toggle("on", (r.detail[b.key] || 0) > 0); }
  });
  const m = $('[data-pts="mst"]');
  if (m) { m.textContent = "+" + r.mst; m.classList.toggle("on", r.mst > 0); }
  const warn = $("#mst-warn");
  if (warn) warn.hidden = r.mst < 2;
  return r;
}

/* ---------- Bước 1: Waterlow ---------- */
function stepWaterlow() {
  const p = DB.patient(AS.patientId);
  const carried = AS.carriedFrom ? `<div class="notice"><svg><use href="#i-info"/></svg>
    <span>Một số mục ít thay đổi đã được điền sẵn từ lần đánh giá trước. <b>Vui lòng soát lại toàn bộ</b> trước khi ký.</span></div>` : "";
  const groups = { "": [], "Nguy cơ đặc biệt": [] };
  WATERLOW.forEach((b, i) => groups[b.group || ""].push({ b, i }));
  const renderBlock = ({ b, i }) => `
    <div class="qblock">
      <div class="qhead"><span class="qnum">${i + 1}</span><span class="t">${esc(b.title)}</span>
        <span class="pts" data-pts="${b.key}">+0</span></div>
      ${b.hint ? `<p class="qnote" style="padding-top:8px;font-size:12.5px;color:var(--ink-3);margin:0">${esc(b.hint)}</p>` : ""}
      <div class="qopts">${b.opts.map((o, j) => optHTML(b, j, o)).join("")}</div>
    </div>`;
  return carried + `
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:4px">
      ${esc(p.name)} · ${ageFrom(p.dob) != null ? ageFrom(p.dob) + " tuổi" : ""} · Chạm vào ô đúng với tình trạng người bệnh.</p>
    ${groups[""].map(renderBlock).join("")}
    ${mstBlock()}
    <div class="eyebrow" style="margin:18px 0 8px">Nguy cơ đặc biệt</div>
    ${groups["Nguy cơ đặc biệt"].map(renderBlock).join("")}`;
}
function optHTML(b, j, o) {
  const sel = AS.ans[b.key];
  const on = b.multi ? (sel || []).includes(j) : sel === j;
  return `<button class="opt ${b.multi ? "multi" : ""}" type="button" aria-pressed="${on}"
    data-opt="${b.key}" data-i="${j}" data-multi="${b.multi ? 1 : 0}" data-excl="${o.excl ? 1 : 0}">
    <span class="mark"><svg><use href="#i-check"/></svg></span>
    <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`;
}
function mstBlock() {
  const m = AS.ans.mst || {};
  const showB = m.a === "co";
  return `<div class="qblock">
    <div class="qhead"><span class="qnum">DD</span><span class="t">Sàng lọc dinh dưỡng (MST)</span>
      <span class="pts" data-pts="mst">+0</span></div>
    <p class="qnote" style="padding-top:8px;font-size:12.5px;color:var(--ink-3);margin:0">Thuộc thang Waterlow bản 2005. Điểm từ 2 trở lên cần hội chẩn dinh dưỡng.</p>
    <div style="padding:6px 13px 0"><div class="eyebrow">${esc(MST.a.q)}</div></div>
    <div class="qopts">${MST.a.opts.map((o, j) =>
      `<button class="opt" type="button" aria-pressed="${m.a === o.v}" data-mst="a" data-v="${o.v}" data-i="${j}">
        <span class="mark"><svg><use href="#i-check"/></svg></span>
        <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`).join("")}</div>
    <div id="mst-b" ${showB ? "" : "hidden"}>
      <div style="padding:6px 13px 0"><div class="eyebrow">${esc(MST.b.q)}</div></div>
      <div class="qopts">${MST.b.opts.map((o, j) =>
        `<button class="opt" type="button" aria-pressed="${m.b === j}" data-mst="b" data-i="${j}">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`).join("")}</div>
    </div>
    <div style="padding:6px 13px 0"><div class="eyebrow">${esc(MST.c.q)}</div></div>
    <div class="qopts">${MST.c.opts.map((o, j) =>
      `<button class="opt" type="button" aria-pressed="${m.c === j}" data-mst="c" data-i="${j}">
        <span class="mark"><svg><use href="#i-check"/></svg></span>
        <span class="txt">${esc(o.t)}</span><span class="p">+${o.p}</span></button>`).join("")}</div>
    <div class="qnote" id="mst-warn" hidden><div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Điểm MST từ 2 trở lên — cần hội chẩn dinh dưỡng cho người bệnh.</span></div></div>
  </div>`;
}

/* ---------- Bước 2: yếu tố hồi sức ---------- */
function stepICU() {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  return `<div class="notice"><svg><use href="#i-info"/></svg>
      <span>Các yếu tố này <b>không cộng vào điểm Waterlow</b>. Nếu có từ ${st.icuEscalate} yếu tố trở lên, hệ thống sẽ đề xuất nâng gói chăm sóc lên một mức.</span></div>
    <div class="qblock"><div class="qhead"><span class="qnum">HS</span>
      <span class="t">Yếu tố nguy cơ đặc thù hồi sức</span>
      <span class="pts" id="icu-count">${AS.icu.length} mục</span></div>
      <div class="qopts">${ICU_FACTORS.map(f =>
        `<button class="opt multi" type="button" aria-pressed="${AS.icu.includes(f)}" data-icu="${esc(f)}">
          <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">${esc(f)}</span></button>`).join("")}</div>
    </div>`;
}

/* ---------- Bước 3: khám da ---------- */
function stepSkin() {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const hasAny = AS.lesions.length || AS.mdrpi.length;
  return `
    <div class="notice"><svg><use href="#i-info"/></svg>
      <span>Đánh giá nguy cơ không thay thế khám da. Hãy quan sát toàn bộ điểm tì đè và <b>vùng da dưới mọi thiết bị y tế</b>.</span></div>

    <div class="qblock"><div class="qhead"><span class="qnum">DA</span>
      <span class="t">Hiện tại người bệnh có tổn thương do tì đè không?</span></div>
      <div class="qopts">
        <button class="opt" type="button" aria-pressed="${AS.noLesion === true}" data-nolesion="1">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt">Không — da còn nguyên vẹn tại mọi điểm tì</span></button>
        <button class="opt" type="button" aria-pressed="${AS.noLesion === false}" data-nolesion="0">
          <span class="mark"><svg><use href="#i-check"/></svg></span>
          <span class="txt">Có — ghi nhận tổn thương bên dưới</span></button>
      </div>
    </div>

    <div id="lesion-area" ${AS.noLesion === false ? "" : "hidden"}>
      <div class="card-h" style="margin-top:16px"><h2>Tổn thương do tì đè</h2>
        <span class="hint">${AS.lesions.length} vị trí</span></div>
      <div id="lesion-list">${AS.lesions.map((l, i) => lesionEditCard(l, i, false)).join("")
        || `<div class="empty">Chưa ghi nhận vị trí nào.</div>`}</div>
      <button class="btn block" data-addlesion style="margin-top:8px"><svg><use href="#i-plus"/></svg>Thêm vị trí tổn thương</button>

      <div class="card-h" style="margin-top:20px"><h2>Loét do thiết bị y tế</h2>
        <span class="hint">${AS.mdrpi.length} vị trí</span></div>
      <p style="font-size:12.5px;color:var(--ink-3);margin-bottom:8px">
        Sau tai do dây oxy, sống mũi do mặt nạ, mép miệng và môi do ống nội khí quản, cổ tay do vòng cố định…</p>
      <div id="mdrpi-list">${AS.mdrpi.map((l, i) => lesionEditCard(l, i, true)).join("")
        || `<div class="empty">Chưa ghi nhận vị trí nào.</div>`}</div>
      <button class="btn block" data-addmdrpi style="margin-top:8px"><svg><use href="#i-plus"/></svg>Thêm tổn thương do thiết bị</button>
    </div>

    ${st.photosEnabled ? `<div class="notice" style="margin-top:16px"><svg><use href="#i-cam"/></svg>
      <span>Ảnh chụp chỉ lấy vùng tổn thương, <b>không lấy mặt hoặc đặc điểm nhận dạng</b>. Ảnh được tự động đóng dấu mã hồ sơ và thời điểm chụp để phục vụ so sánh và truy vết.</span></div>` : ""}`;
}

function lesionEditCard(l, i, isDev) {
  return `<div class="lesion">
    <div class="lh"><span class="t">${esc(l.site)}${isDev && l.device ? " — " + esc(l.device) : ""}</span>
      <span class="pill neutral sm">Độ ${esc(l.stage)}</span>
      <button class="iconbtn" style="width:32px;height:32px" data-dellesion="${i}" data-dev="${isDev ? 1 : 0}" aria-label="Xoá"><svg><use href="#i-x"/></svg></button></div>
    <div class="tagrow">
      <span class="tag ${l.poa ? "poa" : "hapi"}">${l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa"}</span>
      ${l.carried ? `<span class="tag">Theo dõi tiếp từ lần trước</span>` : ""}
      ${l.size ? `<span class="tag">${esc(l.size)}</span>` : ""}
      <span class="tag">${(l.photos || []).length} ảnh</span>
    </div>
    ${l.note ? `<p style="font-size:13px;color:var(--ink-2)">${esc(l.note)}</p>` : ""}
    <div class="gal">
      ${(l.photos || []).map(ph => `<figure data-lb="${ph.id}" data-cap="${esc(l.site)}">
        <img data-photo="${ph.id}" alt="Ảnh tổn thương">
        <button class="del" data-delphoto="${ph.id}" data-li="${i}" data-dev="${isDev ? 1 : 0}" aria-label="Xoá ảnh"><svg style="width:13px;height:13px"><use href="#i-x"/></svg></button>
      </figure>`).join("")}
      ${(DB.data.settings || DEFAULT_SETTINGS()).photosEnabled ? `<button class="photoadd" data-addphoto="${i}" data-dev="${isDev ? 1 : 0}">
        <svg><use href="#i-cam"/></svg>Chụp ảnh</button>` : ""}
    </div>
  </div>`;
}

function lesionDialog(isDev, existing, idx) {
  const l = existing || { site: SITES[0], stage: "I", poa: false, size: "", note: "", photos: [],
    foundAt: new Date().toISOString(), device: isDev ? DEVICES[0] : null };
  modal({
    title: isDev ? "Tổn thương do thiết bị y tế" : "Tổn thương do tì đè",
    body: `${isDev ? `<div class="field"><label for="le-dev">Thiết bị gây tì đè</label>
        <select id="le-dev">${DEVICES.map(d => `<option ${l.device === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>` : ""}
      <div class="field"><label for="le-site">Vị trí</label>
        <select id="le-site">${SITES.map(s => `<option ${l.site === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></div>
      <div class="field"><label for="le-stage">Phân độ (NPIAP / EPUAP)</label>
        <select id="le-stage">${STAGES.map(s => `<option value="${s.v}" ${l.stage === s.v ? "selected" : ""}>${esc(s.t)}</option>`).join("")}</select></div>
      <div class="field"><label>Nguồn gốc tổn thương</label>
        <div class="qopts" style="padding:0">
          <button class="opt" type="button" id="le-poa0" aria-pressed="${!l.poa}">
            <span class="mark"><svg><use href="#i-check"/></svg></span>
            <span class="txt">Mới phát sinh tại khoa</span></button>
          <button class="opt" type="button" id="le-poa1" aria-pressed="${!!l.poa}">
            <span class="mark"><svg><use href="#i-check"/></svg></span>
            <span class="txt">Đã có sẵn khi người bệnh vào khoa</span></button>
        </div>
        <span class="help">Phân biệt này quyết định chỉ số loét mới mắc tại khoa. Ghi cho đúng.</span></div>
      <div class="grid2">
        <div class="field"><label for="le-size">Kích thước (dài × rộng)</label>
          <input id="le-size" type="text" value="${esc(l.size || "")}" placeholder="vd: 3 × 2 cm"></div>
        <div class="field"><label for="le-found">Ngày phát hiện</label>
          <input id="le-found" type="date" value="${isoDay(l.foundAt)}"></div>
      </div>
      <div class="field"><label for="le-note">Mô tả thêm</label>
        <textarea id="le-note" placeholder="vd: đáy vết đỏ, dịch tiết ít, bờ không hoại tử">${esc(l.note || "")}</textarea></div>`,
    actions: [{ label: "Huỷ" }, { label: existing ? "Lưu" : "Thêm", kind: "pri", onClick: (b) => {
      const obj = {
        ...l,
        site: $("#le-site", b).value,
        stage: $("#le-stage", b).value,
        poa: $("#le-poa1", b).getAttribute("aria-pressed") === "true",
        size: $("#le-size", b).value.trim(),
        note: $("#le-note", b).value.trim(),
        foundAt: new Date($("#le-found", b).value || Date.now()).toISOString(),
        device: isDev ? $("#le-dev", b).value : null,
        photos: l.photos || []
      };
      const arr = isDev ? AS.mdrpi : AS.lesions;
      if (existing != null && idx != null) arr[idx] = obj; else arr.push(obj);
      AS.noLesion = false;
      render();
    }}]
  });
  const bd = $(".modal .sb");
  const p0 = $("#le-poa0", bd), p1 = $("#le-poa1", bd);
  p0.onclick = () => { p0.setAttribute("aria-pressed", "true"); p1.setAttribute("aria-pressed", "false"); };
  p1.onclick = () => { p1.setAttribute("aria-pressed", "true"); p0.setAttribute("aria-pressed", "false"); };
}

/* --- Chụp ảnh --- */
function pickPhoto(lesionIdx, isDev) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const p = DB.patient(AS.patientId);
    const now = new Date();
    const stamp = `${p.mrn} · ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    try {
      toast("Đang xử lý ảnh…");
      const dataUrl = await compressImage(f, stamp);
      const id = uid("ph");
      const ok = await Photos.put(id, dataUrl);
      if (!ok) { toast("Không lưu được ảnh trên thiết bị này", "err"); return; }
      Photos.push(id, dataUrl);   // đẩy lên Drive nếu đang dùng chung dữ liệu
      const arr = isDev ? AS.mdrpi : AS.lesions;
      (arr[lesionIdx].photos = arr[lesionIdx].photos || []).push({
        id, at: now.toISOString(), by: Session.user.id
      });
      render(); toast("Đã thêm ảnh", "ok");
    } catch (e) { toast(e.message || "Không xử lý được ảnh", "err"); }
  };
  inp.click();
}

/* ---------- Bước 4: kết quả ---------- */
function stepResult() {
  const r = scoreWaterlow(AS.ans);
  const lv = levelOf(r.total);
  const draft = { score: r.total, level: lv, icu: AS.icu, lesions: AS.lesions, mdrpi: AS.mdrpi };
  const clv = careLevelOf(draft);
  const items = bundleFor(clv);
  const newHapi = [...AS.lesions, ...AS.mdrpi].filter(l => !l.poa && !l.carried);
  const missing = missingAnswers();

  return `
    ${missing.length ? `<div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Còn ${missing.length} mục chưa chọn: ${esc(missing.join(", "))}. Vẫn có thể ký nhưng điểm sẽ không đầy đủ.</span></div>` : ""}

    <div class="result ${levelClass(lv)}">
      <span class="big">${r.total}</span>
      <span class="lvl">${esc(LEVELS[lv].name)}</span>
      <span class="sub">Tổng điểm Waterlow · ngưỡng phân mức ${(DB.data.settings || DEFAULT_SETTINGS()).thresholds.join(" / ")}</span>
    </div>

    ${clv > lv ? `<div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Đề xuất <b>nâng gói chăm sóc lên mức “${esc(LEVELS[clv].short)}”</b> vì người bệnh có ${AS.icu.length} yếu tố nguy cơ hồi sức${AS.lesions.length || AS.mdrpi.length ? " và đã có tổn thương" : ""}.</span></div>` : ""}

    ${newHapi.length ? `<div class="notice bad"><svg><use href="#i-alert"/></svg>
      <span>Ghi nhận <b>${newHapi.length} tổn thương mới phát sinh tại khoa</b> (${esc(newHapi.map(l => l.site).join(", "))}).
      Hệ thống sẽ tự động đẩy ca này lên mục Cần lưu ý.</span></div>` : ""}

    <div class="card">
      <div class="card-h"><h2>Gói chăm sóc đề xuất — ${esc(LEVELS[clv].short)}</h2>
        <span class="hint"><span id="bcount">${AS.bundle.length}</span>/${items.length} đã thực hiện</span></div>
      <p style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px">
        Đánh dấu những can thiệp đã thực hiện tại thời điểm này. Tỷ lệ đánh dấu chính là chỉ số tuân thủ gói chăm sóc của khoa.</p>
      <div class="bundle">${items.map(it =>
        `<button class="bitem" type="button" aria-pressed="${AS.bundle.includes(it)}" data-bundle="${esc(it)}">
          <span class="box"><svg><use href="#i-check"/></svg></span><span class="bt">${esc(it)}</span></button>`).join("")}</div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn sm" data-ball>Đánh dấu tất cả</button>
        <button class="btn sm" data-bnone>Bỏ đánh dấu tất cả</button>
      </div>
    </div>

    <div class="field"><label for="as-note">Ghi chú của điều dưỡng</label>
      <textarea id="as-note" placeholder="vd: Đã đặt đệm hơi, hẹn kiểm tra gót chân lúc 14 giờ.">${esc(AS.note)}</textarea></div>

    <div class="notice"><svg><use href="#i-shield"/></svg>
      <span>Bấm <b>Hoàn tất và ký</b> đồng nghĩa <b>${esc(Session.user.name)}</b> xác nhận đã trực tiếp đánh giá người bệnh này
      lúc ${fmtTime(new Date())} ngày ${fmtDate(new Date())}. Phiếu sau khi ký <b>không thể sửa hay xoá</b>;
      muốn điều chỉnh phải thực hiện một lượt đánh giá mới.</span></div>`;
}

function missingAnswers() {
  const out = [];
  WATERLOW.forEach(b => {
    const s = AS.ans[b.key];
    if (b.multi) { if (!(s || []).length && b.key !== "med" && b.key !== "surg" && b.key !== "tissue") out.push(b.title); }
    else if (s == null) out.push(b.title);
  });
  if (!AS.ans.mst || AS.ans.mst.a == null) out.push("Sàng lọc dinh dưỡng");
  return out;
}

/* ---------- Gắn sự kiện theo bước ---------- */
function bindStep() {
  // Waterlow
  $$("[data-opt]").forEach(btn => btn.onclick = () => {
    const key = btn.dataset.opt, i = +btn.dataset.i, multi = btn.dataset.multi === "1";
    const b = WATERLOW.find(x => x.key === key);
    if (multi) {
      let arr = AS.ans[key] || [];
      const isExcl = btn.dataset.excl === "1";
      if (arr.includes(i)) arr = arr.filter(x => x !== i);
      else if (isExcl) arr = [i];
      else arr = arr.filter(x => !b.opts[x].excl).concat(i);
      AS.ans[key] = arr;
      $$(`[data-opt="${key}"]`).forEach(o => o.setAttribute("aria-pressed", arr.includes(+o.dataset.i)));
    } else {
      AS.ans[key] = AS.ans[key] === i ? null : i;
      $$(`[data-opt="${key}"]`).forEach(o => o.setAttribute("aria-pressed", AS.ans[key] === +o.dataset.i));
    }
    recalcAssess();
  });
  // MST
  $$("[data-mst]").forEach(btn => btn.onclick = () => {
    const part = btn.dataset.mst;
    AS.ans.mst = AS.ans.mst || {};
    if (part === "a") {
      AS.ans.mst.a = btn.dataset.v;
      if (btn.dataset.v !== "co") AS.ans.mst.b = null;
      const bBox = $("#mst-b"); if (bBox) bBox.hidden = btn.dataset.v !== "co";
      $$('[data-mst="a"]').forEach(o => o.setAttribute("aria-pressed", o.dataset.v === AS.ans.mst.a));
      if (btn.dataset.v !== "co") $$('[data-mst="b"]').forEach(o => o.setAttribute("aria-pressed", "false"));
    } else {
      const i = +btn.dataset.i;
      AS.ans.mst[part] = AS.ans.mst[part] === i ? null : i;
      $$(`[data-mst="${part}"]`).forEach(o => o.setAttribute("aria-pressed", AS.ans.mst[part] === +o.dataset.i));
    }
    recalcAssess();
  });
  // Yếu tố hồi sức
  $$("[data-icu]").forEach(btn => btn.onclick = () => {
    const f = btn.dataset.icu;
    if (AS.icu.includes(f)) AS.icu = AS.icu.filter(x => x !== f); else AS.icu.push(f);
    btn.setAttribute("aria-pressed", AS.icu.includes(f));
    const c = $("#icu-count"); if (c) { c.textContent = AS.icu.length + " mục"; c.classList.toggle("on", AS.icu.length > 0); }
  });
  // Khám da
  $$("[data-nolesion]").forEach(btn => btn.onclick = () => {
    const yes = btn.dataset.nolesion === "1";
    if (yes && (AS.lesions.length || AS.mdrpi.length)) {
      toast("Đang có tổn thương được ghi nhận — hãy xoá trước khi chọn “không”", "err", 4500); return;
    }
    AS.noLesion = yes; render();
  });
  const al = $("[data-addlesion]"); if (al) al.onclick = () => lesionDialog(false);
  const am = $("[data-addmdrpi]"); if (am) am.onclick = () => lesionDialog(true);
  $$("[data-dellesion]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const dev = b.dataset.dev === "1", i = +b.dataset.dellesion;
    const arr = dev ? AS.mdrpi : AS.lesions;
    (arr[i].photos || []).forEach(ph => Photos.del(ph.id));
    arr.splice(i, 1); render();
  });
  $$("[data-addphoto]").forEach(b => b.onclick = () => pickPhoto(+b.dataset.addphoto, b.dataset.dev === "1"));
  $$("[data-delphoto]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const dev = b.dataset.dev === "1", i = +b.dataset.li, id = b.dataset.delphoto;
    const arr = dev ? AS.mdrpi : AS.lesions;
    arr[i].photos = (arr[i].photos || []).filter(p => p.id !== id);
    Photos.del(id); render();
  });
  // Gói chăm sóc
  $$("[data-bundle]").forEach(btn => btn.onclick = () => {
    const it = btn.dataset.bundle;
    if (AS.bundle.includes(it)) AS.bundle = AS.bundle.filter(x => x !== it); else AS.bundle.push(it);
    btn.setAttribute("aria-pressed", AS.bundle.includes(it));
    const c = $("#bcount"); if (c) c.textContent = AS.bundle.length;
  });
  const ba = $("[data-ball]"), bn = $("[data-bnone]");
  if (ba) ba.onclick = () => { AS.bundle = $$("[data-bundle]").map(b => b.dataset.bundle); render(); };
  if (bn) bn.onclick = () => { AS.bundle = []; render(); };
  const nt = $("#as-note"); if (nt) nt.oninput = () => { AS.note = nt.value; };
  hydratePhotos();
}

function nextStep() {
  if (AS.step === 2 && AS.noLesion == null) { toast("Hãy xác nhận người bệnh có tổn thương hay không", "err"); return; }
  if (AS.step < 3) { AS.step++; render(); return; }
  signAssessment();
}

function signAssessment() {
  const r = scoreWaterlow(AS.ans);
  const lv = levelOf(r.total);
  const draft = { score: r.total, level: lv, icu: AS.icu, lesions: AS.lesions, mdrpi: AS.mdrpi };
  const clv = careLevelOf(draft);
  const now = new Date().toISOString();
  const a = {
    id: uid("as"), patientId: AS.patientId, episodeId: AS.episodeId,
    userId: Session.user.id, at: now, signedBy: Session.user.name,
    answers: clone(AS.ans), detail: r.detail, score: r.total, level: lv, careLevel: clv,
    icu: AS.icu.slice(), lesions: clone(AS.lesions), mdrpi: clone(AS.mdrpi),
    bundle: AS.bundle.slice(), bundleTotal: bundleFor(clv).length,
    note: AS.note.trim(), locked: true, appVer: APP_VER
  };
  a.lesions.forEach(l => delete l.carried);
  a.mdrpi.forEach(l => delete l.carried);
  DB.data.assessments.push(a);

  const p = DB.patient(AS.patientId);
  const st = DB.data.settings || DEFAULT_SETTINGS();

  // Cảnh báo tự động
  const newHapi = [...a.lesions, ...a.mdrpi].filter(l => !l.poa);
  const prevSites = new Set();
  DB.assessmentsOf(AS.episodeId).filter(x => x.id !== a.id)
    .forEach(x => [...(x.lesions || []), ...(x.mdrpi || [])].forEach(l => prevSites.add(l.site)));
  const trulyNew = newHapi.filter(l => !prevSites.has(l.site));
  if (st.autoFlagNewInjury && trulyNew.length) {
    addFlag(AS.patientId, AS.episodeId,
      `Ghi nhận tổn thương mới phát sinh tại khoa: ${trulyNew.map(l => `${l.site} (độ ${l.stage})`).join(", ")}.`,
      3, true);
  }
  if (st.autoFlagVeryHigh && lv === 3 && !DB.data.flags.some(f => f.episodeId === AS.episodeId && f.auto && f.kind === "vhigh" && f.status !== "dong")) {
    addFlag(AS.patientId, AS.episodeId,
      `Waterlow ${r.total} — nguy cơ rất cao. Áp dụng gói chăm sóc mức “${LEVELS[clv].short}” và kiểm tra điểm tì mỗi ${st.reassessHours[3]} giờ.`,
      3, true, "vhigh");
  }

  DB.log("danh-gia", `${p.name} (${p.mrn}) — Waterlow ${r.total}, ${LEVELS[lv].short}`, "assessment", a.id);
  DB.save();
  const id = AS.patientId; AS = null;
  toast("Đã ký và lưu phiếu đánh giá", "ok", 4000);
  Nav.replace("patient", { id });
}
</script>
<script>
/* ============================================================
   CHUỖI "CẦN QUAN TÂM": phát hiện → cảnh báo → tiếp nhận →
   thực hiện → xác nhận. Mỗi bước lưu tên người và thời điểm.
   ============================================================ */
const FLAG_STEPS = [
  { k: "tao",      t: "Phát hiện và cảnh báo" },
  { k: "tiepnhan", t: "Điều dưỡng tiếp nhận" },
  { k: "xuly",     t: "Đã thực hiện" },
  { k: "dong",     t: "Điều dưỡng trưởng xác nhận đóng" }
];
const FLAG_STATUS = { moi: 0, tiepnhan: 1, xuly: 2, dong: 3 };

function addFlag(patientId, episodeId, text, priority, auto, kind) {
  const f = {
    id: uid("f"), patientId, episodeId, text, priority: priority || 2,
    auto: !!auto, kind: kind || (auto ? "auto" : "manual"),
    createdBy: auto ? null : Session.user.id,
    createdAt: new Date().toISOString(), status: "moi",
    events: [{ by: auto ? null : Session.user.id, at: new Date().toISOString(), type: "tao", text }]
  };
  DB.data.flags.push(f);
  return f;
}

function flagDialog(patientId, episodeId) {
  const p = DB.patient(patientId);
  const last = DB.lastAssessment(episodeId);
  modal({
    title: "Đánh dấu cần quan tâm",
    body: `<p style="font-size:14px">
        <b>${esc(p.name)}</b>${last ? ` — Waterlow ${last.score}, ${esc(LEVELS[last.level != null ? last.level : levelOf(last.score)].short)}` : ""}</p>
      <div class="field"><label for="fl-text">Nội dung cần điều dưỡng lưu ý</label>
        <textarea id="fl-text" placeholder="vd: Theo dõi vùng cùng cụt và gót chân, báo ngay nếu xuất hiện hồng ban."></textarea></div>
      <div class="field"><label>Mức ưu tiên</label>
        <div class="qopts" style="padding:0">
          ${[[3, "Khẩn — kiểm tra trong ca này"], [2, "Cao — trong 24 giờ"], [1, "Theo dõi thường quy"]].map(([v, t], i) =>
            `<button class="opt" type="button" data-pri="${v}" aria-pressed="${v === 2}">
              <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">${esc(t)}</span></button>`).join("")}
        </div></div>`,
    actions: [{ label: "Huỷ" }, { label: "Đẩy lên mục Cần lưu ý", kind: "pri", onClick: (b) => {
      const t = $("#fl-text", b).value.trim();
      if (!t) { toast("Chưa nhập nội dung lưu ý", "err"); return false; }
      const pri = +($$("[data-pri]", b).find(x => x.getAttribute("aria-pressed") === "true")?.dataset.pri || 2);
      addFlag(patientId, episodeId, t, pri, false);
      DB.log("can-quan-tam", `${p.name} — ${t.slice(0, 80)}`, "patient", patientId);
      DB.save();
      toast("Đã đẩy lên mục Cần lưu ý của toàn khoa", "ok");
    }}]
  });
  const bd = $(".modal .sb");
  $$("[data-pri]", bd).forEach(btn => btn.onclick = () =>
    $$("[data-pri]", bd).forEach(o => o.setAttribute("aria-pressed", o === btn)));
}

function flagCard(f, compact) {
  const p = DB.patient(f.patientId);
  const stage = FLAG_STATUS[f.status];
  const last = f.episodeId ? DB.lastAssessment(f.episodeId) : null;
  const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
  const priLab = { 3: "Khẩn", 2: "Cao", 1: "Thường quy" }[f.priority] || "Cao";
  const steps = FLAG_STEPS.map((s, i) => {
    const ev = f.events.filter(e => e.type === s.k).slice(-1)[0];
    if (!ev) return `<div class="step pending"><div class="col"><div class="dot"></div><div class="line"></div></div>
      <div class="txt">${esc(s.t)}</div></div>`;
    const who = ev.by ? DB.userName(ev.by) : "Hệ thống tự động";
    return `<div class="step"><div class="col"><div class="dot"></div><div class="line"></div></div>
      <div class="txt">${esc(ev.text || s.t)}
        <span class="who">${esc(who)} · ${fmtDT(ev.at)}</span></div></div>`;
  }).join("");
  return `<article class="flag ${f.status === "dong" ? "done" : ""} ${f.auto ? "auto" : ""}" data-flagid="${f.id}">
    <div class="fh">
      <div class="ftop">
        <span class="fname">${esc(p ? p.name : "—")}</span>
        ${lv != null ? levelPill(lv, " sm") : ""}
        ${last ? `<span class="tag mono">Waterlow ${last.score}</span>` : ""}
        <span class="tag" style="margin-left:auto">${f.auto ? "Tự động" : priLab}</span>
      </div>
      <p class="ftext">${esc(f.text)}</p>
      <div class="btnrow" style="margin-top:2px">
        ${f.status === "moi" ? `<button class="btn pri sm" data-fact="tiepnhan" data-f="${f.id}">Tôi tiếp nhận</button>` : ""}
        ${f.status === "tiepnhan" ? `<button class="btn pri sm" data-fact="xuly" data-f="${f.id}">Ghi kết quả thực hiện</button>` : ""}
        ${f.status === "xuly" && Session.isHead() ? `<button class="btn pri sm" data-fact="dong" data-f="${f.id}">Xác nhận và đóng</button>` : ""}
        ${f.status === "xuly" && !Session.isHead() ? `<span class="tag">Chờ điều dưỡng trưởng xác nhận</span>` : ""}
        <button class="btn sm" data-fopen="${f.patientId}">Mở hồ sơ</button>
      </div>
    </div>
    ${compact && f.status === "moi" ? "" : `<div class="chain">${steps}</div>`}
  </article>`;
}

function bindFlagCards() {
  $$("[data-fact]").forEach(b => b.onclick = () => flagAction(b.dataset.f, b.dataset.fact));
  $$("[data-fopen]").forEach(b => b.onclick = () => Nav.go("patient", { id: b.dataset.fopen }));
}

function flagAction(fid, type) {
  const f = DB.data.flags.find(x => x.id === fid); if (!f) return;
  const cfg = {
    tiepnhan: { title: "Tiếp nhận lưu ý", ph: "vd: Đã nhận thông tin, sẽ kiểm tra trong lượt xoay trở tới.", btn: "Xác nhận tiếp nhận", st: "tiepnhan", need: false },
    xuly:     { title: "Ghi kết quả thực hiện", ph: "vd: Đã kiểm tra vùng cùng cụt, chưa ghi nhận tổn thương. Đã kê gót chân treo.", btn: "Lưu kết quả", st: "xuly", need: true },
    dong:     { title: "Xác nhận và đóng", ph: "vd: Đã kiểm tra lại, tình trạng ổn. Đóng lưu ý.", btn: "Đóng lưu ý", st: "dong", need: false }
  }[type];
  modal({
    title: cfg.title,
    body: `<p style="font-size:13.5px;color:var(--ink-2)">${esc(f.text)}</p>
      <div class="field"><label for="fa-note">Nội dung ghi nhận</label>
        <textarea id="fa-note" placeholder="${esc(cfg.ph)}"></textarea>
        <span class="help">Ghi nhận này lưu kèm tên bạn và thời điểm, không thể sửa về sau.</span></div>`,
    actions: [{ label: "Huỷ" }, { label: cfg.btn, kind: "pri", onClick: (b) => {
      const t = $("#fa-note", b).value.trim();
      if (cfg.need && !t) { toast("Cần ghi rõ việc đã thực hiện", "err"); return false; }
      f.events.push({ by: Session.user.id, at: new Date().toISOString(), type,
        text: t || FLAG_STEPS.find(s => s.k === type).t });
      f.status = cfg.st;
      DB.log("chuoi-luu-y", `${type} — ${DB.patient(f.patientId)?.name || ""}`, "flag", f.id);
      DB.save();
      toast("Đã ghi nhận", "ok");
    }}]
  });
}

function viewFlags() {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const open = DB.openFlags();
  /* Xếp theo THỜI ĐIỂM ĐÓNG, không phải thời điểm tạo — mới đóng thì nằm trên */
  const closedAt = f => {
    const ev = (f.events || []).filter(e => e.type === "dong").slice(-1)[0];
    return (ev && ev.at) || f.createdAt;
  };
  /* Chỉ giữ những mục đóng trong 24 giờ qua, và gói lại cho gọn —
     trang này để xem việc CHƯA làm, phần đã xong không nên chiếm chỗ. */
  const CLOSED_WINDOW_H = 24;
  const allClosed = DB.data.flags.filter(f => f.status === "dong")
    .sort((a, b) => closedAt(b).localeCompare(closedAt(a)));
  const cutoff = Date.now() - CLOSED_WINDOW_H * 3600000;
  const closed = allClosed.filter(f => dOf(closedAt(f)).getTime() >= cutoff);
  const olderCount = allClosed.length - closed.length;
  const overdue = st.autoFlagOverdue
    ? DB.admittedPatients().map(({ ep, p }) => ({ ep, p, due: dueInfo(ep) })).filter(x => x.due.overdue)
    : [];

  const html = `
    ${overdue.length ? `<section>
      <div class="card-h"><h2>Quá hạn đánh giá</h2><span class="hint">${overdue.length} người bệnh</span></div>
      <div class="plist">${overdue.map(r => patientRow({ ...r, last: r.due.last,
        lv: r.due.last ? (r.due.last.level != null ? r.due.last.level : levelOf(r.due.last.score)) : null }, { showDue: true })).join("")}</div>
    </section>` : ""}

    <section>
      <div class="card-h"><h2>Đang mở</h2><span class="hint">${open.length} lưu ý</span></div>
      ${open.length ? `<div style="display:flex;flex-direction:column;gap:10px">${open.map(f => flagCard(f)).join("")}</div>`
        : `<div class="empty">Không có lưu ý nào đang mở.</div>`}
    </section>

    ${closed.length ? `<section class="card" style="padding:12px 14px">
      <details class="closedbox">
        <summary>
          <span class="ct">Đã đóng trong ${CLOSED_WINDOW_H} giờ</span>
          <span class="cn">${closed.length} lưu ý</span>
          <span class="cx">bấm để xem</span>
        </summary>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
          ${closed.map(f => flagCard(f)).join("")}
        </div>
      </details>
      ${olderCount ? `<p style="font-size:12px;color:var(--ink-3);margin-top:8px">
        Còn ${olderCount} lưu ý đã đóng cũ hơn ${CLOSED_WINDOW_H} giờ${
          Session.isHead() ? " — xem trong <b>Nhật ký truy vết</b>" : ""}.</p>` : ""}
    </section>`
      : olderCount ? `<p class="hintbox">Không có lưu ý nào được đóng trong ${CLOSED_WINDOW_H} giờ qua.</p>` : ""}`;

  return { title: "Cần lưu ý", sub: open.length + " đang mở", html,
    bind() { bindFlagCards(); bindPatientRows(); } };
}

/* ============================================================
   BIỂU ĐỒ (SVG tự vẽ, không dùng thư viện ngoài)
   ============================================================ */
const ORD = ["var(--ord1)", "var(--ord2)", "var(--ord3)", "var(--ord4)"];

function chartRiskDist(dist) {
  const total = dist.reduce((a, b) => a + b, 0);
  if (!total) return `<div class="empty">Chưa có người bệnh nào được đánh giá.</div>`;
  const max = Math.max(...dist, 1);
  const rowH = 38, W = 560, L = 132, R = 46;
  const H = dist.length * rowH + 8;
  const bars = dist.map((v, i) => {
    const y = i * rowH + 6, bw = Math.max(v ? 3 : 0, (v / max) * (W - L - R));
    const pct = total ? Math.round(v / total * 100) : 0;
    return `<g>
      <text x="${L - 10}" y="${y + 15}" text-anchor="end" class="vlab">${esc(LEVELS[i].short)}</text>
      <rect x="${L}" y="${y + 3}" width="${bw}" height="20" rx="4" fill="${ORD[i]}"
        data-tip="${esc(LEVELS[i].name)}: ${v} người bệnh (${pct}%)"></rect>
      <text x="${L + bw + 8}" y="${y + 18}" class="vlab">${v}</text>
      <text x="${W - 4}" y="${y + 18}" text-anchor="end" class="vlab" style="opacity:.62">${pct}%</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Phân bố mức nguy cơ: ${dist.map((v, i) => LEVELS[i].short + " " + v).join(", ")}">
    <line x1="${L}" y1="2" x2="${L}" y2="${H - 4}" class="axis"></line>${bars}</svg>`;
}

function chartPatientTrend(assessments) {
  const a = assessments.slice().reverse();
  if (a.length < 2) return "";
  const W = 560, H = 190, P = { l: 34, r: 14, t: 14, b: 30 };
  const th = (DB.data.settings || DEFAULT_SETTINGS()).thresholds;
  const maxY = Math.max(26, ...a.map(x => x.score)) + 2;
  const xs = i => P.l + (a.length === 1 ? 0 : i * (W - P.l - P.r) / (a.length - 1));
  const ys = v => H - P.b - (v / maxY) * (H - P.t - P.b);
  const pts = a.map((x, i) => `${xs(i)},${ys(x.score)}`).join(" ");
  const bands = th.map((t, i) => `<line x1="${P.l}" y1="${ys(t)}" x2="${W - P.r}" y2="${ys(t)}"
      class="grid" stroke-dasharray="3 4"></line>
    <text x="${W - P.r}" y="${ys(t) - 4}" text-anchor="end" style="font-size:9.5px;opacity:.72">${["có nguy cơ", "cao", "rất cao"][i]} ≥${t}</text>`).join("");
  const dots = a.map((x, i) => {
    const lv = x.level != null ? x.level : levelOf(x.score);
    return `<circle cx="${xs(i)}" cy="${ys(x.score)}" r="5.5" fill="${ORD[lv]}" stroke="var(--card)" stroke-width="2"
      data-tip="${fmtDT(x.at)} — Waterlow ${x.score}, ${esc(LEVELS[lv].short)}"></circle>`;
  }).join("");
  const labs = a.map((x, i) => (i === 0 || i === a.length - 1 || a.length <= 5)
    ? `<text x="${xs(i)}" y="${H - 9}" text-anchor="${i === 0 ? "start" : i === a.length - 1 ? "end" : "middle"}"
        style="font-size:10px">${fmtDate(x.at).slice(0, 5)}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Diễn tiến điểm Waterlow qua ${a.length} lượt đánh giá">
    ${bands}
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H - P.b}" class="axis"></line>
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>
    <text x="${P.l - 7}" y="${ys(0) + 4}" text-anchor="end" style="font-size:10px">0</text>
    <text x="${P.l - 7}" y="${ys(maxY) + 9}" text-anchor="end" style="font-size:10px">${maxY}</text>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}${labs}</svg>`;
}

function chartBars(series, opt) {
  opt = opt || {};
  if (!series.length) return `<div class="empty">Chưa đủ dữ liệu.</div>`;
  const W = 560, H = opt.height || 180, P = { l: 34, r: 12, t: 12, b: 34 };
  const max = Math.max(1, ...series.map(s => s.v));
  const bw = (W - P.l - P.r) / series.length;
  const bars = series.map((s, i) => {
    const h = (s.v / max) * (H - P.t - P.b);
    const x = P.l + i * bw + bw * 0.16, w = bw * 0.68;
    const showLab = series.length <= 14;
    return `<g>
      <rect x="${x}" y="${H - P.b - h}" width="${w}" height="${Math.max(h, s.v ? 2 : 0)}" rx="4"
        fill="${opt.color || "var(--accent)"}" data-tip="${esc(s.label)}: ${esc(s.tip || (s.v + (opt.unit || "")))}"></rect>
      ${showLab && s.v ? `<text x="${x + w / 2}" y="${H - P.b - h - 5}" text-anchor="middle" class="vlab">${esc(String(opt.fmt ? opt.fmt(s.v) : s.v))}</text>` : ""}
      <text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" style="font-size:10px">${esc(s.label)}</text>
    </g>`;
  }).join("");
  const gl = [0.5, 1].map(f => `<line x1="${P.l}" y1="${H - P.b - f * (H - P.t - P.b)}" x2="${W - P.r}"
      y2="${H - P.b - f * (H - P.t - P.b)}" class="grid"></line>
    ${f === 1 ? `<text x="${P.l - 6}" y="${H - P.b - f * (H - P.t - P.b) + 4}" text-anchor="end" style="font-size:10px">${opt.fmt ? opt.fmt(max) : Math.round(max)}</text>` : ""}`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || "Biểu đồ cột")}">
    ${gl}<line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>${bars}</svg>`;
}

function chartStacked2(series) {
  if (!series.length) return `<div class="empty">Chưa đủ dữ liệu.</div>`;
  const W = 560, H = 190, P = { l: 34, r: 12, t: 12, b: 34 };
  const max = Math.max(1, ...series.map(s => s.a + s.b));
  const bw = (W - P.l - P.r) / series.length;
  const bars = series.map((s, i) => {
    const ha = (s.a / max) * (H - P.t - P.b), hb = (s.b / max) * (H - P.t - P.b);
    const x = P.l + i * bw + bw * 0.18, w = bw * 0.64;
    return `<g>
      ${s.b ? `<rect x="${x}" y="${H - P.b - hb}" width="${w}" height="${hb}" rx="3" fill="var(--s2)"
        data-tip="${esc(s.label)}: ${s.b} tổn thương phát sinh tại khoa"></rect>` : ""}
      ${s.a ? `<rect x="${x}" y="${H - P.b - hb - ha - (s.b ? 2 : 0)}" width="${w}" height="${ha}" rx="3" fill="var(--s1)"
        data-tip="${esc(s.label)}: ${s.a} tổn thương có sẵn khi nhập khoa"></rect>` : ""}
      <text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" style="font-size:10px">${esc(s.label)}</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tổn thương theo tháng, tách theo nguồn gốc">
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" class="axis"></line>
    <text x="${P.l - 6}" y="${P.t + 10}" text-anchor="end" style="font-size:10px">${max}</text>${bars}</svg>
    <div class="legend"><span><i style="background:var(--s1)"></i>Có sẵn khi nhập khoa</span>
      <span><i style="background:var(--s2)"></i>Phát sinh tại khoa</span></div>`;
}

/* Lớp tương tác cho mọi biểu đồ */
let _tipEl = null;
function bindCharts() {
  $$("[data-tip]").forEach(el => {
    el.style.cursor = "pointer";
    const show = e => {
      if (!_tipEl) { _tipEl = document.createElement("div"); _tipEl.className = "hoverbox"; document.body.appendChild(_tipEl); }
      _tipEl.textContent = el.dataset.tip;
      const pt = e.touches ? e.touches[0] : e;
      const x = Math.min(window.innerWidth - 240, Math.max(8, pt.clientX + 12));
      _tipEl.style.left = x + "px";
      _tipEl.style.top = Math.max(8, pt.clientY - 46) + "px";
      _tipEl.hidden = false;
    };
    const hide = () => { if (_tipEl) _tipEl.hidden = true; };
    el.addEventListener("mouseenter", show);
    el.addEventListener("mousemove", show);
    el.addEventListener("mouseleave", hide);
    el.addEventListener("touchstart", e => { show(e); setTimeout(hide, 2400); }, { passive: true });
  });
}
</script>
<script>
/* ============================================================
   BỘ CHỈ SỐ ĐỀ ÁN, BÁO CÁO, QUẢN TRỊ
   ============================================================ */
let RP = { days: 30, from: "", to: "", custom: false };   // custom = người dùng tự chọn khoảng ngày

/* Khoảng thời gian đang xem: hoặc do người dùng chọn, hoặc theo nút số ngày */
function rpWindow() {
  const parse = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const now = new Date();
  let f = parse(RP.from), t = parse(RP.to);
  if (f || t) {
    if (!f) f = new Date(now.getFullYear(), now.getMonth(), 1);
    if (!t) t = now;
    if (f > t) { const x = f; f = t; t = x; }
    const end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);  // trọn ngày cuối
    return { from: f, to: end > now ? now : end, ranged: true, label: `${fmtDate(f)} – ${fmtDate(t)}` };
  }
  return {
    from: RP.days ? new Date(now.getTime() - RP.days * 86400000) : new Date(0),
    to: now, ranged: false,
    label: RP.days ? RP.days + " ngày gần nhất" : "toàn bộ dữ liệu"
  };
}

/* Mục đang chọn trong danh sách xổ kỳ báo cáo */
function rpSel(win) {
  if (RP.custom) return "khac";
  if (!win.ranged) return "d" + RP.days;
  const n = new Date();
  for (const back of [0, 1]) {
    const d = new Date(n.getFullYear(), n.getMonth() - back, 1);
    const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    if (RP.from === isoDay(d) && RP.to === isoDay(e > n ? n : e)) return "m" + back;
  }
  return "khac";
}

/* Đặt nhanh về một tháng dương lịch */
function rpSetMonth(back) {
  RP.custom = false;
  const n = new Date();
  const d = new Date(n.getFullYear(), n.getMonth() - back, 1);
  const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  RP.from = isoDay(d);
  RP.to = isoDay(e > n ? n : e);
}

function overlapDays(ep, from, to) {
  const a = Math.max(dOf(ep.admittedAt).getTime(), from.getTime());
  const b = Math.min(ep.dischargedAt ? dOf(ep.dischargedAt).getTime() : Date.now(), to.getTime());
  return b <= a ? 0 : (b - a) / 86400000;
}

function computeMetrics(win) {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const to = win.to;
  const from = win.from;
  const days = Math.max(1, Math.round((to - from) / 86400000));
  const inWin = t => { const x = dOf(t).getTime(); return x >= from.getTime() && x <= to.getTime(); };

  const eps = DB.liveEpisodes().filter(e => overlapDays(e, from, to) > 0);
  const patientDays = eps.reduce((s, e) => s + overlapDays(e, from, to), 0);
  const asses = DB.data.assessments.filter(a => inWin(a.at));

  /* 1. Đánh giá trong giờ đầu sau nhập khoa */
  const epsAdm = DB.liveEpisodes().filter(e => inWin(e.admittedAt)
    && Date.now() - dOf(e.admittedAt).getTime() > st.firstAssessHours * 3600000);
  let firstOk = 0;
  epsAdm.forEach(e => {
    const first = DB.assessmentsOf(e.id).slice(-1)[0];
    if (first && dOf(first.at) - dOf(e.admittedAt) <= st.firstAssessHours * 3600000) firstOk++;
  });
  const firstRate = epsAdm.length ? firstOk / epsAdm.length : null;

  /* 2. Đánh giá lại đúng hạn */
  let pairs = 0, pairsOk = 0;
  eps.forEach(e => {
    const list = DB.assessmentsOf(e.id).slice().reverse();
    for (let i = 1; i < list.length; i++) {
      if (!inWin(list[i].at)) continue;
      const prev = list[i - 1];
      const lv = prev.level != null ? prev.level : levelOf(prev.score);
      const hrs = st.reassessHours[lv] != null ? st.reassessHours[lv] : 24;
      pairs++;
      if (dOf(list[i].at) - dOf(prev.at) <= hrs * 3600000) pairsOk++;
    }
    // Ca đang quá hạn cũng tính là trễ
    if (!e.dischargedAt && dueInfo(e).overdue) { pairs++; }
  });
  const onTime = pairs ? pairsOk / pairs : null;

  /* 3. Tuân thủ gói chăm sóc */
  const withBundle = asses.filter(a => a.bundleTotal);
  const bundleRate = withBundle.length
    ? withBundle.reduce((s, a) => s + (a.bundle || []).length / a.bundleTotal, 0) / withBundle.length : null;

  /* 4. Tổn thương — tách nguồn gốc, tính lần xuất hiện đầu tiên của mỗi vị trí trong mỗi đợt */
  const seen = new Set(); const hapi = []; const poa = [];
  /* Tổn thương đến từ HAI nguồn: phiếu Waterlow đã ký, và bản ghi tổn thương
     ghi riêng. Trộn chung rồi xếp theo thời gian, nên "lần xuất hiện đầu tiên"
     vẫn đúng dù vị trí đó được ghi bằng đường nào trước. */
  const nguonTT = [];
  DB.data.assessments.forEach(a => {
    [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => nguonTT.push({
      at: a.at, episodeId: a.episodeId, patientId: a.patientId, l }));
  });
  (DB.data.lesionLogs || []).forEach(x => nguonTT.push({
    at: x.at, episodeId: x.episodeId, patientId: x.patientId, l: x }));
  nguonTT.sort((a, b) => String(a.at).localeCompare(String(b.at))).forEach(({ at, episodeId, patientId, l }) => {
      const k = episodeId + "|" + l.site;
      if (seen.has(k)) return;
      seen.add(k);
      const rec = { at, site: l.site, stage: l.stage, episodeId, patientId, device: l.device };
      (l.poa ? poa : hapi).push(rec);
  });
  const hapiWin = hapi.filter(x => inWin(x.at));
  const poaWin = poa.filter(x => inWin(x.at));
  const mdrpiWin = hapiWin.filter(x => x.device);
  const hapiRate = patientDays > 0 ? hapiWin.length / patientDays * 1000 : null;

  /* 5. Thời gian đáp ứng chuỗi cần lưu ý */
  const fl = DB.data.flags.filter(f => inWin(f.createdAt));
  const delta = (f, type) => {
    const ev = f.events.find(e => e.type === type);
    return ev ? dOf(ev.at) - dOf(f.createdAt) : null;
  };
  const accs = fl.map(f => delta(f, "tiepnhan")).filter(x => x != null);
  const dones = fl.map(f => delta(f, "xuly")).filter(x => x != null);
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

  /* 6. Chuỗi tháng — theo đúng khoảng đang xem, tối đa 24 tháng cho dễ nhìn */
  const months = [];
  let mFrom = new Date(from.getFullYear(), from.getMonth(), 1);
  /* to là mốc CUỐI ĐỘC QUYỀN (đầu ngày hôm sau) — lùi 1 ms để lấy đúng tháng cuối cùng */
  const tLast = new Date(to.getTime() - 1);
  const mTo = new Date(tLast.getFullYear(), tLast.getMonth(), 1);
  if (from.getTime() <= 0) {                       // "toàn bộ" — bắt đầu từ dữ liệu sớm nhất
    const t0 = DB.liveEpisodes().map(e => dOf(e.admittedAt).getTime())
      .concat(DB.data.assessments.map(a => dOf(a.at).getTime())).filter(x => x);
    const e0 = t0.length ? new Date(Math.min.apply(null, t0)) : mTo;
    mFrom = new Date(e0.getFullYear(), e0.getMonth(), 1);
  }
  let nM = (mTo.getFullYear() - mFrom.getFullYear()) * 12 + (mTo.getMonth() - mFrom.getMonth()) + 1;
  if (nM < 1) nM = 1;
  if (nM > 24) { mFrom = new Date(mTo.getFullYear(), mTo.getMonth() - 23, 1); nM = 24; }
  for (let i = 0; i < nM; i++) {
    const d = new Date(mFrom.getFullYear(), mFrom.getMonth() + i, 1);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    const label = pad(d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(2);
    void 0;
    const inM = t => { const x = dOf(t).getTime(); return x >= d.getTime() && x < end.getTime(); };
    const pd = DB.liveEpisodes().reduce((s, e) => s + overlapDays(e, d, end), 0);
    const h = hapi.filter(x => inM(x.at)).length;
    const p = poa.filter(x => inM(x.at)).length;
    const am = DB.data.assessments.filter(a => inM(a.at) && a.bundleTotal);
    months.push({
      label, hapi: h, poa: p, patientDays: pd,
      rate: pd > 0 ? h / pd * 1000 : 0,
      bundle: am.length ? am.reduce((s, a) => s + (a.bundle || []).length / a.bundleTotal, 0) / am.length * 100 : 0,
      assessments: DB.data.assessments.filter(a => inM(a.at)).length
    });
  }

  return {
    from, to, days, eps, patientDays, asses, firstRate, epsAdmN: epsAdm.length,
    onTime, pairs, bundleRate, hapi: hapiWin, poa: poaWin, mdrpi: mdrpiWin, hapiRate,
    accAvg: avg(accs), doneAvg: avg(dones), flagsN: fl.length, accN: accs.length, months
  };
}

const pct = v => v == null ? "—" : Math.round(v * 100) + "%";

function viewReports() {
  const win = rpWindow();
  const m = computeMetrics(win);
  const hnay = isoDay(new Date());
  const adm = DB.admittedPatients();
  const dist = [0, 1, 2, 3].map(l => 0);
  adm.forEach(({ ep }) => {

        <div class="tile"><span class="lab">Tỷ suất trên 1000 ngày nằm</span>
          <span class="val mono">${m.hapiRate == null ? "—" : m.hapiRate.toFixed(1)}</span>
          <span class="note">${Math.round(m.patientDays)} ngày nằm trong kỳ</span></div>

    <section class="card">
      <div class="card-h"><h2>Xuất dữ liệu</h2><span class="hint">mở được bằng Excel</span></div>

        <button class="btn pri" data-xlsx><svg><use href="#i-dl"/></svg>Tải Excel — dữ liệu đầy đủ</button>

      </div>
      <p style="font-size:12.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.6">
        <b>Excel</b> — một tệp 6 trang: bộ chỉ số, số liệu theo tháng, lượt đánh giá,
        tổn thương, xoay trở, cần lưu ý. Ngày là ngày, số là số, nên lọc và làm pivot được.<br>
        <b>Word</b> — bản báo cáo có sẵn bảng chỉ số, mục Nhận xét, Kết luận và ô ký,
        mở bằng Word sửa thẳng rồi nộp.</p>

      <hr class="divider">
      <div class="eyebrow" style="margin-bottom:8px">Hoặc tải từng bảng dạng CSV</div>

        <button class="btn sm" data-ex="lesion">Tổn thương</button>
        <button class="btn sm" data-ex="kpi">Chỉ số theo tháng</button>
        <button class="btn sm" data-ex="flags">Cần lưu ý</button>
      </div>
    </section>`;

  return {
    title: "Báo cáo", sub: win.label, html,
    bind() {
      const sel = $("#rp-ky");
      if (sel) sel.onchange = () => {
        const v = sel.value;
        if (v[0] === "d") { RP.days = +v.slice(1); RP.from = ""; RP.to = ""; RP.custom = false; }
        else if (v[0] === "m") { rpSetMonth(+v.slice(1)); RP.custom = false; }
        else { if (!RP.from && !RP.to) rpSetMonth(0); RP.custom = true; }
        render();
        if (v === "khac") { const f = $("#rp-from"); if (f) f.focus(); }
      };
      const go = $("[data-rpgo]");
      if (go) go.onclick = () => {
        RP.from = ($("#rp-from") || {}).value || "";
        RP.to = ($("#rp-to") || {}).value || "";
        if (!RP.from && !RP.to) { toast("Chưa chọn ngày nào", "err"); return; }
        render();
      };
      const cl = $("[data-rpclear]");
      if (cl) cl.onclick = () => { RP.from = ""; RP.to = ""; render(); };
      const gl = $("[data-gblog]"); if (gl) gl.onclick = () => Nav.go("handoverlog");
      $$("[data-row]").forEach(r => r.onclick = () => Nav.go("patient", { id: r.dataset.row }));
      $$("[data-ex]").forEach(b => b.onclick = () => exportCSV(b.dataset.ex, m));
      const bx = $("[data-xlsx]");
      if (bx) bx.onclick = () => { xuatExcel(m, win); toast("Đang tải tệp Excel…", "ok"); };
      const bd = $("[data-docx]");
      if (bd) bd.onclick = () => { xuatWord(m, win); toast("Đang tải tệp Word…", "ok"); };
      bindCharts();
    }
  };
}

function exportCSV(kind, m) {
  /* Tệp CSV bám đúng khoảng đang xem — xuất báo cáo tháng nào ra tháng đó */
  const win = rpWindow();
  const inWin = t => { if (!t) return false; const x = dOf(t).getTime();
    return x >= win.from.getTime() && x <= win.to.getTime(); };
  const stamp = win.ranged ? isoDay(win.from) + "_den_" + isoDay(new Date(win.to.getTime() - 1))
                           : isoDay(new Date());
  const kyBC = win.label;
  if (kind === "assess") {
    const rows = [["Thời điểm", "Mã hồ sơ", "Họ tên", "Ngày sinh", "Giường", "Điểm Waterlow", "Mức nguy cơ",
      "Mức chăm sóc áp dụng", "Số yếu tố hồi sức", "Số tổn thương", "Gói chăm sóc đã thực hiện", "Tổng mục gói",
      "Người đánh giá", "Ghi chú"]];
    DB.data.assessments.filter(a => inWin(a.at))
      .sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
      const p = DB.patient(a.patientId), ep = DB.episode(a.episodeId);
      const lv = a.level != null ? a.level : levelOf(a.score);
      rows.push([fmtDT(a.at), p?.mrn, p?.name, fmtDate(p?.dob), ep?.bed, a.score, LEVELS[lv].short,
        LEVELS[a.careLevel != null ? a.careLevel : lv].short, (a.icu || []).length,
        (a.lesions || []).length + (a.mdrpi || []).length, (a.bundle || []).length, a.bundleTotal || 0,
        DB.userName(a.userId), a.note || ""]);
    });
    downloadFile(`danh-gia-loet-ti-de_${stamp}.csv`, toCSV(rows));
  } else if (kind === "lesion") {
    const rows = [["Ngày phát hiện", "Mã hồ sơ", "Họ tên", "Vị trí", "Phân độ", "Nguồn gốc",
      "Do thiết bị", "Kích thước", "Số ảnh", "Người ghi nhận", "Mô tả"]];
    DB.data.assessments.filter(a => inWin(a.at))
      .sort((a, b) => a.at.localeCompare(b.at)).forEach(a => {
      const p = DB.patient(a.patientId);
      [...(a.lesions || []), ...(a.mdrpi || [])].forEach(l => rows.push([
        fmtDate(l.foundAt || a.at), p?.mrn, p?.name, l.site, l.stage,
        l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa", l.device || "", l.size || "",
        (l.photos || []).length, DB.userName(a.userId), l.note || ""]));
    });
    downloadFile(`ton-thuong-loet-ti-de_${stamp}.csv`, toCSV(rows));
  } else if (kind === "kpi") {
    const rows = [["Tháng", "Ngày nằm viện", "Lượt đánh giá", "Loét có sẵn khi vào khoa",
      "Loét mới phát sinh tại khoa", "Tỷ suất trên 1000 ngày nằm", "Tuân thủ gói chăm sóc (%)"]];
    m.months.forEach(x => rows.push([x.label, Math.round(x.patientDays), x.assessments, x.poa, x.hapi,
      x.rate.toFixed(2), Math.round(x.bundle)]));
    rows.push([]);
    rows.push(["Kỳ báo cáo", kyBC]);
    rows.push(["Tỷ lệ đánh giá trong giờ đầu", pct(m.firstRate)]);
    rows.push(["Tỷ lệ đánh giá lại đúng hạn", pct(m.onTime)]);
    rows.push(["Tuân thủ gói chăm sóc", pct(m.bundleRate)]);
    rows.push(["Thời gian trung bình cảnh báo đến tiếp nhận", fmtDur(m.accAvg)]);
    rows.push(["Thời gian trung bình cảnh báo đến thực hiện xong", fmtDur(m.doneAvg)]);
    downloadFile(`bo-chi-so-de-an_${stamp}.csv`, toCSV(rows));
  } else if (kind === "flags") {
    const rows = [["Thời điểm phát", "Mã hồ sơ", "Họ tên", "Nội dung", "Nguồn", "Trạng thái",
      "Tiếp nhận lúc", "Người tiếp nhận", "Thực hiện lúc", "Người thực hiện", "Nội dung thực hiện",
      "Đóng lúc", "Người đóng", "Thời gian đến tiếp nhận", "Thời gian đến thực hiện"]];
    DB.data.flags.filter(f => inWin(f.createdAt))
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt)).forEach(f => {
      const p = DB.patient(f.patientId);
      const ev = t => f.events.find(e => e.type === t);
      const acc = ev("tiepnhan"), xl = ev("xuly"), dg = ev("dong");
      rows.push([fmtDT(f.createdAt), p?.mrn, p?.name, f.text, f.auto ? "Tự động" : DB.userName(f.createdBy),
        { moi: "Mới", tiepnhan: "Đã tiếp nhận", xuly: "Đã thực hiện", dong: "Đã đóng" }[f.status],
        acc ? fmtDT(acc.at) : "", acc ? DB.userName(acc.by) : "",
        xl ? fmtDT(xl.at) : "", xl ? DB.userName(xl.by) : "", xl ? xl.text : "",
        dg ? fmtDT(dg.at) : "", dg ? DB.userName(dg.by) : "",
        acc ? fmtDur(dOf(acc.at) - dOf(f.createdAt)) : "",
        xl ? fmtDur(dOf(xl.at) - dOf(f.createdAt)) : ""]);
    });
    downloadFile(`chuoi-can-luu-y_${stamp}.csv`, toCSV(rows));
  }
  toast("Đã tạo tệp — kiểm tra thư mục Tải xuống", "ok");
}

function viewAdmin() {
  if (!Session.isHead()) return { title: "Không có quyền", html: `<div class="empty">Mục này dành cho điều dưỡng trưởng.</div>` };
  const us = DB.data.users.slice().sort((a, b) => (a.role === "dd" ? 1 : 0) - (b.role === "dd" ? 1 : 0) || a.name.localeCompare(b.name, "vi"));
  const dupNames = [...new Set(us.map(u => u.username.toLowerCase())
    .filter((v, i, a) => a.indexOf(v) !== i))];
  const html = `
    ${dupNames.length ? `<div class="notice warn"><svg><use href="#i-alert"/></svg>
      <span>Có <b>${dupNames.length} tên đăng nhập bị trùng</b>: ${esc(dupNames.join(", "))}.
      Thường gặp sau khi hợp nhất dữ liệu của hai máy đều còn tài khoản mẫu.
      Hãy <b>khoá</b> các tài khoản thừa để tránh nhầm lẫn khi đăng nhập.</span></div>` : ""}
    <div class="notice"><svg><use href="#i-shield"/></svg>
      <span>Mỗi điều dưỡng phải có tài khoản riêng. Dùng chung tài khoản làm mất giá trị truy vết khi có sự cố.</span></div>
    <button class="btn pri block" data-newuser><svg><use href="#i-plus"/></svg>Thêm tài khoản</button>
    <div class="tablewrap"><table>
      <thead><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Lượt đánh giá</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>${us.map(u => {
        const n = DB.data.assessments.filter(a => a.userId === u.id).length;
        const dup = dupNames.includes(u.username.toLowerCase());
        return `<tr><td><b>${esc(u.name)}</b>${dup ? ' <span class="pill r2 sm"><span class="bullet"></span>trùng tên</span>' : ''}</td><td class="mono">${esc(u.username)}</td>
          <td>${u.role === "admin" ? "Quản trị" : u.role === "ddt" ? "Điều dưỡng trưởng" : "Điều dưỡng"}</td>
          <td class="num">${n}</td>
          <td>${u.active === false ? '<span class="pill neutral sm">Đã khoá</span>' : '<span class="pill r0 sm"><span class="bullet"></span>Đang dùng</span>'}</td>
          <td><button class="btn sm" data-edituser="${u.id}">Sửa</button></td></tr>`;
      }).join("")}</tbody></table></div>`;
  return {
    title: "Tài khoản điều dưỡng", sub: us.length + " tài khoản", html,
    bind() {
      $("[data-newuser]").onclick = () => userDialog(null);
      $$("[data-edituser]").forEach(b => b.onclick = () => userDialog(DB.user(b.dataset.edituser)));
    }
  };
}

        <input id="u-user" type="text" class="mono" value="${esc(u?.username || "")}" ${isNew ? "" : "disabled"}

      ${isNew ? "" : `<div class="field"><label>Trạng thái</label>

            <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">Đang sử dụng</span></button>
          <button class="opt" type="button" id="u-off" aria-pressed="${u.active === false}">
            <span class="mark"><svg><use href="#i-check"/></svg></span><span class="txt">Khoá tài khoản (giữ toàn bộ dữ liệu đã ký)</span></button>
        </div></div>`}`,
    actions: [{ label: "Huỷ" }, { label: "Lưu", kind: "pri", onClick: (b) => {
      const name = $("#u-name", b).value.trim();
      const un = $("#u-user", b).value.trim().toLowerCase();
      const pw = $("#u-pw", b).value;
      const role = $("#u-role", b).value;
      if (!name) { toast("Chưa nhập họ tên", "err"); return false; }
      if (isNew) {
        if (!/^[a-z0-9._-]{3,}$/.test(un)) { toast("Tên đăng nhập chỉ gồm chữ thường, số, dấu chấm", "err"); return false; }
        if (DB.data.users.some(x => x.username.toLowerCase() === un)) { toast("Tên đăng nhập đã tồn tại", "err"); return false; }
        if (pw.length < 6) { toast("Mật khẩu phải từ 6 ký tự", "err"); return false; }
        DB.data.users.push(touch({ id: uid("u"), name, username: un, role,
          pw: hashPw(pw, DB.data.meta.salt), active: true, mustChange: true, createdAt: new Date().toISOString() }));
        DB.log("tao-tai-khoan", `${name} (${un}) — ${role}`, "user", un);
      } else {
        u.name = name; u.role = role;
        delete u.demo;   // đã sửa tay thì không còn là tài khoản mẫu nữa
        u.active = $("#u-on", b).getAttribute("aria-pressed") === "true";
        if (pw) {
          if (pw.length < 6) { toast("Mật khẩu phải từ 6 ký tự", "err"); return false; }
          u.pw = hashPw(pw, DB.data.meta.salt); u.mustChange = true;
          DB.log("dat-lai-mat-khau", `${u.name} (${u.username})`, "user", u.id);
        }
        touch(u);
        DB.log("sua-tai-khoan", `${u.name} (${u.username})`, "user", u.id);
      }
      DB.save(); toast("Đã lưu", "ok");
    }}]
  });
  const bd = $(".modal .sb");
  const on = $("#u-on", bd), off = $("#u-off", bd);
  if (on) {
    on.onclick = () => { on.setAttribute("aria-pressed", "true"); off.setAttribute("aria-pressed", "false"); };
    off.onclick = () => { off.setAttribute("aria-pressed", "true"); on.setAttribute("aria-pressed", "false"); };
  }
}

function viewAudit() {
  if (!Session.isHead()) return { title: "Không có quyền", html: `<div class="empty">Mục này dành cho điều dưỡng trưởng.</div>` };
  const logs = DB.data.audit.slice().reverse().slice(0, 400);
  const labels = {
    "dang-nhap": "Đăng nhập", "dang-xuat": "Đăng xuất", "danh-gia": "Ký phiếu đánh giá",
    "tao-nguoi-benh": "Tạo hồ sơ", "nhap-khoa-lai": "Nhập khoa lại", "xuat-khoa": "Xuất khoa",
    "can-quan-tam": "Đánh dấu cần quan tâm", "chuoi-luu-y": "Xử lý lưu ý",
    "tao-tai-khoan": "Tạo tài khoản", "sua-tai-khoan": "Sửa tài khoản",
    "dat-lai-mat-khau": "Đặt lại mật khẩu", "doi-mat-khau": "Đổi mật khẩu",
    "sua-cai-dat": "Sửa cài đặt", "sua-dot-dieu-tri": "Sửa đợt điều trị",
    "xoa-du-lieu-mau": "Xoá dữ liệu mẫu", "nhap-du-lieu": "Nhập dữ liệu",
    "xoa-danh-sach-nguoi-benh": "Xoá danh sách người bệnh"
  };
  const html = `
    <div class="notice"><svg><use href="#i-info"/></svg>
      <span>Nhật ký ghi lại mọi thao tác quan trọng cùng tên người thực hiện và thời điểm. Dùng để truy lại khi có sự cố.</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Thời điểm</th><th>Người thực hiện</th><th>Thao tác</th><th>Chi tiết</th></tr></thead>
      <tbody>${logs.map(l => `<tr><td class="mono" style="white-space:nowrap">${fmtDT(l.at)}</td>
        <td>${esc(l.userName || "—")}</td><td>${esc(labels[l.action] || l.action)}</td>
        <td>${esc(l.detail)}</td></tr>`).join("")}</tbody></table></div>
    ${logs.length ? "" : `<div class="empty">Chưa có hoạt động nào được ghi nhận.</div>`}
    <button class="btn" data-exaudit><svg><use href="#i-dl"/></svg>Xuất nhật ký ra tệp</button>`;
  return {
    title: "Nhật ký truy vết", sub: logs.length + " dòng gần nhất", html,
    bind() {
      $("[data-exaudit]").onclick = () => {
        const rows = [["Thời điểm", "Người thực hiện", "Thao tác", "Chi tiết"]];
        DB.data.audit.forEach(l => rows.push([fmtDT(l.at), l.userName || "", labels[l.action] || l.action, l.detail]));
        downloadFile(`nhat-ky-truy-vet_${isoDay(new Date())}.csv`, toCSV(rows));
      };
    }
  };
}
</script>
<script>
/* ============================================================
   CÀI ĐẶT CHUYÊN MÔN & KẾT NỐI DỮ LIỆU
