function bindLogin() {
  const f = $("#loginform"); if (!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const id = $("#lg-id").value.trim().toLowerCase();
    const pw = $("#lg-pw").value;
    const err = $("#lg-err");
    // Có thể tồn tại nhiều tài khoản trùng tên đăng nhập sau khi hợp nhất dữ liệu:
    // chọn đúng tài khoản có mật khẩu khớp.
    const hash = hashPw(pw, DB.data.meta.salt);
    const cands = DB.data.users.filter(x =>
      x.username.toLowerCase() === id && x.active !== false);
    const u = cands.find(x => x.pw === hash);
    if (!u) {
      err.hidden = false;
      err.textContent = "Tên đăng nhập hoặc mật khẩu không đúng.";
      return;
    }
    Session.login(u);
    toast("Xin chào " + u.name, "ok");
  };
  const su = $("#lg-setup");
  if (su) su.onclick = () => { SHOW_SETUP = true; render(); };
}

function viewHome() {
  const st = DB.data.settings || DEFAULT_SETTINGS();
  const adm = DB.admittedPatients();
  const rows = adm.map(({ ep, p }) => {
    const d = dueInfo(ep);
    const last = d.last;
    return { ep, p, due: d, lv: last ? (last.level != null ? last.level : levelOf(last.score)) : null, last };
  });
  const overdue = rows.filter(r => r.due.overdue);
  const high = rows.filter(r => r.lv >= 2).sort((a, b) => (b.last?.score || 0) - (a.last?.score || 0));
  const flags = DB.openFlags();
  const dist = [0, 1, 2, 3].map(l => rows.filter(r => r.lv === l).length);
  const noAssess = rows.filter(r => !r.last).length;

  const hour = new Date().getHours();
  const greet = hour < 11 ? "Chào buổi sáng" : hour < 14 ? "Chào buổi trưa" : hour < 18 ? "Chào buổi chiều" : "Chào ca trực";

  const flagCards = flags.slice(0, 4).map(f => flagCard(f, true)).join("");
  const overdueList = overdue.slice(0, 6).map(r => patientRow(r, { showDue: true })).join("");

  /* BẢN THỬ: cữ xoay trở của khoa — ai chưa xoay trong cữ đang chạy */
  const tRows = rows.map(r => ({ ...r, ti: turnInfo(r.ep) }));
  const denLuc = tRows.filter(r => r.ti.toiLuc && !r.ti.never).length;
  const html = `
    <section class="card" style="background:linear-gradient(135deg,var(--accent-soft),var(--card) 70%)">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
          <div class="eyebrow">${esc(st.wardName)}</div>
          <h2 style="font-size:19px;margin-top:3px">${greet}, ${esc(Session.user.name.split(" ").slice(-1)[0])}</h2>
          <p style="font-size:13px;color:var(--ink-2);margin-top:4px">
            ${esc(Session.roleName())} · phiên làm việc bắt đầu ${fmtTime(Session.at)} ngày ${fmtDate(Session.at)}</p>
        </div>
      </div>
    </section>

    ${PREVIEW ? `<section class="card" style="border-color:var(--r1)">
      <div class="card-h"><h2>Ba mục đang thử trong bản này</h2><span class="hint">chưa có trong app của khoa</span></div>
      <ol style="font-size:13.5px;line-height:1.7;color:var(--ink-2);margin:0;padding-left:20px">
        <li><b>Bảng theo dõi xoay trở</b> — ô “Đến hạn xoay trở” ngay bên dưới, và thẻ riêng trong hồ sơ từng người bệnh.</li>
        <li><b>Trạng thái tổn thương “đã lành”</b> — mở hồ sơ một ca có tổn thương, xem mục <i>Tổn thương của đợt điều trị này</i>.</li>
        <li><b>Màn hình giao ban</b> — tab <b>Giao ban</b> ở thanh dưới.</li>
      </ol>
      <p style="font-size:12.5px;color:var(--ink-3);margin-top:9px">
        Cứ bấm thử thoải mái: dữ liệu ở đây hoàn toàn hư cấu và nằm riêng, không đụng gì tới kho dữ liệu của khoa.</p>
    </section>` : ""}

    <section class="tiles">
      <button class="tile tap" data-go="patients"><span class="lab">Người bệnh đang điều trị</span>
        <span class="val mono">${rows.length}</span>
        <span class="note">${high.length} ca nguy cơ cao trở lên</span></button>
      <button class="tile tap ${overdue.length ? "warnT" : ""}" data-goto-overdue><span class="lab">Đến hạn đánh giá</span>
        <span class="val mono">${overdue.length}</span>
        <span class="note">${noAssess} ca chưa đánh giá lần nào</span></button>
      <button class="tile tap ${denLuc ? "warnT" : ""}" data-goto-turn><span class="lab">Đã tới lúc xoay trở</span>
        <span class="val mono">${denLuc}</span>
        <span class="note">quá khoảng cách mục tiêu của khoa</span></button>
      <button class="tile tap ${flags.length ? "alert" : ""}" data-go="flags"><span class="lab">Cần lưu ý chưa xử lý</span>
        <span class="val mono">${flags.length}</span>
        <span class="note">${flags.filter(f => f.status === "moi").length} mục chưa tiếp nhận</span></button>
    </section>

    ${!rows.length ? `<section><div class="card"><div class="empty">
        Chưa có người bệnh nào trong khoa.
        <div style="margin-top:12px"><button class="btn sm pri" data-go="patients">Tạo hồ sơ người bệnh</button></div>
      </div></div></section>` : `

    <section>
      <div class="card-h"><h2>Xoay trở</h2>
        <span class="hint">${denLuc ? `${denLuc} người bệnh đã tới lúc xoay` : "cả buồng đang trong khoảng mục tiêu"}</span></div>
      <button class="bigtap ${denLuc ? "warnb" : ""}" data-goround>
        <svg><use href="#i-rotate"/></svg>Ghi xoay trở cả buồng (${tRows.length} người bệnh)
      </button>
    </section>

    ${viecCanLamBlock(tRows)}

    ${Session.isHead() ? `
    <section class="card">
      <div class="card-h"><h2>Phân bố mức nguy cơ tại khoa</h2>
        <span class="hint">${rows.length} người bệnh đang điều trị</span></div>
      ${chartRiskDist(dist)}

  `;

  return {
    title: "Tổng quan", sub: st.hospital, html,
    bind() {
      $$("[data-go]").forEach(b => b.onclick = () => Nav.tab(b.dataset.go));

      const ov = $("[data-goto-overdue]");
      if (ov) ov.onclick = () => $("#overdue-sec").scrollIntoView({ behavior: "smooth", block: "start" });
      const tv = $("[data-goto-turn]");
      if (tv) tv.onclick = () => Nav.go("round");
      const gr = $("[data-goround]"); if (gr) gr.onclick = () => Nav.go("round");
      $$("[data-qturn]").forEach(b => b.onclick = () => {
        const ep = DB.episode(b.dataset.qturn);
        const p = ep && DB.patient(ep.patientId);
        if (ep && p) turnDialog(p, ep);
      });
      bindPatientRows(); bindFlagCards(); bindCharts();
    }
  };
}

/* --- Dòng người bệnh dùng chung --- */
function patientRow(r, opt) {
  opt = opt || {};
  const { p, ep, lv, last, due } = r;
  const age = ageFrom(p.dob);
  const cls = lv == null ? "" : levelClass(lv);
  const dueTxt = due
    ? (due.overdue ? `<span style="color:var(--r2-ink);font-weight:600">${due.first ? "Chưa đánh giá lần đầu" : "Quá hạn " + fmtDur(Date.now() - due.due.getTime())}</span>`
      : `Đến hạn ${fmtDT(due.due)}`)
    : "";
  return `<button class="prow ${cls}" data-patient="${p.id}">
    <span class="stripe"></span>
    <span class="body">
      <span class="n">${esc(p.name)}</span>
      <span class="m">
        <span class="mono">${esc(p.mrn)}</span><span class="sep">·</span>
        <span>${age != null ? age + " tuổi" : "—"}</span><span class="sep">·</span>
        <span>${esc(ep.bed || "chưa xếp giường")}</span>
      </span>
      <span class="m">${opt.showDue ? dueTxt : (last ? "Đánh giá gần nhất " + ago(last.at) : "<span style='color:var(--r2-ink);font-weight:600'>Chưa đánh giá lần nào</span>")}</span>
    </span>
    <span class="right">
      ${last ? `<span class="score mono">${last.score}</span><span class="scorelab">Waterlow</span>`
        : `<span class="scorelab">chưa có<br>điểm</span>`}
    </span>
  </button>`;
}
function bindPatientRows() {
  $$("[data-patient]").forEach(b => b.onclick = () => Nav.go("patient", { id: b.dataset.patient }));
}

      <p style="font-size:13px;color:var(--ink-2);line-height:1.6">
        Phiên bản ${APP_VER} · Thang điểm <b>Waterlow</b> (bản sửa đổi 2005), phân độ tổn thương theo NPIAP/EPUAP.
        Ứng dụng hỗ trợ ghi nhận và theo dõi, <b>không thay thế</b> đánh giá lâm sàng trực tiếp của điều dưỡng và bác sĩ.</p>
      <p style="font-size:12.5px;color:var(--ink-3);margin-top:8px">
        Chế độ dữ liệu: <b>${DB.mode === "sheet" ? "Google Sheet dùng chung" : "Lưu trên máy này"}</b></p>
    </section>`;
  return {
    title: "Tài khoản", html,
    bind() {
      $("[data-logout]").onclick = () => confirmBox("Đăng xuất", "Bạn có chắc muốn đăng xuất khỏi hệ thống?", "Đăng xuất", () => Session.logout());
      const c = $("[data-chpw]"); if (c) c.onclick = changePasswordDialog;
      $$("[data-goview]").forEach(b => b.onclick = () => Nav.go(b.dataset.goview));
    }
  };
}

function changePasswordDialog() {
  modal({
    title: "Đổi mật khẩu",
    body: `<div class="field"><label for="cp-old">Mật khẩu hiện tại</label><input id="cp-old" type="password"></div>
      <div class="field"><label for="cp-new">Mật khẩu mới</label><input id="cp-new" type="password">
        <span class="help">Ít nhất 6 ký tự.</span></div>
      <div class="field"><label for="cp-new2">Nhập lại mật khẩu mới</label><input id="cp-new2" type="password"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Cập nhật", kind: "pri", onClick: (b) => {
      const o = $("#cp-old", b).value, n = $("#cp-new", b).value, n2 = $("#cp-new2", b).value;
      const u = Session.user;
      if (u.pw !== hashPw(o, DB.data.meta.salt)) { toast("Mật khẩu hiện tại không đúng", "err"); return false; }
      if (n.length < 6) { toast("Mật khẩu mới phải từ 6 ký tự", "err"); return false; }
      if (n !== n2) { toast("Hai lần nhập không khớp", "err"); return false; }
      u.pw = hashPw(n, DB.data.meta.salt); u.mustChange = false; touch(u);
      DB.log("doi-mat-khau", "Tự đổi mật khẩu");
      DB.save(); toast("Đã đổi mật khẩu", "ok");
    }}]
  });
}
</script>
<script>
/* ============================================================
   DANH SÁCH & HỒ SƠ NGƯỜI BỆNH
   ============================================================ */
let PQ = { q: "", filter: "dang", sort: "uutien", view: null,
           ky: "", from: "", to: "" };   // ky: "" = không lọc ngày

/* Khoảng ngày đang lọc trong danh sách người bệnh.
   Lọc theo NGÀY NHẬP KHOA của đợt gần nhất, vì đó là mốc điều dưỡng nhớ. */
function pqWindow() {
  const parse = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  if (!PQ.ky) return null;
  const n = new Date();
  if (PQ.ky === "khac") {
    let f = parse(PQ.from), t = parse(PQ.to);
    if (!f && !t) return null;
    if (!f) f = new Date(2000, 0, 1);
    if (!t) t = n;
    if (f > t) { const x = f; f = t; t = x; }
    return { from: f, to: new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1),
             nhan: `${fmtDate(f)} – ${fmtDate(t)}` };
  }
  if (PQ.ky[0] === "m") {
    const back = +PQ.ky.slice(1);
    const f = new Date(n.getFullYear(), n.getMonth() - back, 1);
    const t = new Date(f.getFullYear(), f.getMonth() + 1, 1);
    return { from: f, to: t > n ? n : t, nhan: back ? "tháng trước" : "tháng này" };
  }
  const ng = +PQ.ky.slice(1);
  return { from: new Date(n.getTime() - ng * 86400000), to: n, nhan: ng + " ngày gần nhất" };
}
const PQKY = [["", "Mọi thời điểm"], ["d7", "7 ngày gần nhất"], ["d30", "30 ngày gần nhất"],
              ["m0", "Tháng này"], ["m1", "Tháng trước"], ["khac", "Chọn khoảng ngày…"]];   // view: "the" = thẻ, "bang" = bảng
/* Chưa chọn thì tự quyết theo bề ngang màn hình: máy tính xem bảng, điện thoại xem thẻ */
function listView() {
  if (PQ.view) return PQ.view;
  try { return window.innerWidth >= 900 ? "bang" : "the"; } catch (e) { return "the"; }
}

/* Sắp xếp tên theo lối Việt Nam: lấy TÊN trước, rồi mới tới họ và chữ lót */
function nameKey(full) {
  const parts = String(full || "").trim().split(/\s+/);
  const ten = parts.length ? parts[parts.length - 1] : "";
  return ten + " " + parts.slice(0, -1).join(" ");
}
const SORTS = [
  { v: "uutien", t: "Ưu tiên chăm sóc" },
  { v: "az",     t: "Tên A → Z" },
  { v: "za",     t: "Tên Z → A" },
  { v: "giuong", t: "Theo giường" },
  { v: "nvmoi",  t: "Nhập viện mới nhất" },
  { v: "nvcu",   t: "Nhập viện lâu nhất" },
  { v: "diem",   t: "Điểm Waterlow cao nhất" }
];

function viewPatients() {
  const q = noAccent(PQ.q);
  let list = livePatients().map(p => {
    const ep = DB.activeEpisode(p.id);
    const lastEp = ep || DB.episodesOf(p.id)[0];
    const last = lastEp ? DB.lastAssessment(lastEp.id) : null;
    return { p, ep, lastEp, last, due: ep ? dueInfo(ep) : null,
             lv: last ? (last.level != null ? last.level : levelOf(last.score)) : null };
  });
  if (PQ.filter === "dang") list = list.filter(x => x.ep);
  if (PQ.filter === "xuat") list = list.filter(x => !x.ep);
  if (q) list = list.filter(x => noAccent(x.p.name).includes(q) || noAccent(x.p.mrn).includes(q));
  /* Lọc ngày: đợt gần nhất phải có giao với khoảng đang chọn */
  const pw = pqWindow();
  if (pw) list = list.filter(x => {
    if (!x.lastEp) return false;
    const vao = dOf(x.lastEp.admittedAt).getTime();
    const ra = x.lastEp.dischargedAt ? dOf(x.lastEp.dischargedAt).getTime() : Date.now();
    return ra >= pw.from.getTime() && vao < pw.to.getTime();
  });
  const byName = (a, b) => nameKey(a.p.name).localeCompare(nameKey(b.p.name), "vi");
  const admOf = r => (r.lastEp ? dOf(r.lastEp.admittedAt).getTime() : 0);
  list.sort((a, b) => {
    switch (PQ.sort) {
      case "az": return byName(a, b);
      case "za": return byName(b, a);
      case "giuong": {
        const ab = (a.ep && a.ep.bed) || "zzz", bb = (b.ep && b.ep.bed) || "zzz";
        return ab.localeCompare(bb, "vi", { numeric: true }) || byName(a, b);
      }
      case "nvmoi": return admOf(b) - admOf(a) || byName(a, b);
      case "nvcu":  return admOf(a) - admOf(b) || byName(a, b);
      case "diem":  return ((b.last && b.last.score) || -1) - ((a.last && a.last.score) || -1) || byName(a, b);
      default: {
        if (PQ.filter === "dang") {
          const ao = a.due && a.due.overdue ? 1 : 0, bo = b.due && b.due.overdue ? 1 : 0;
          if (ao !== bo) return bo - ao;
          if ((b.lv == null ? -1 : b.lv) !== (a.lv == null ? -1 : a.lv))
            return (b.lv == null ? -1 : b.lv) - (a.lv == null ? -1 : a.lv);
        }
        return byName(a, b);
      }
    }
  });

  const counts = {
    dang: livePatients().filter(p => DB.activeEpisode(p.id)).length,
    xuat: livePatients().filter(p => !DB.activeEpisode(p.id)).length
  };

  const html = `
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1;position:relative">
        <svg style="position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none"><use href="#i-search"/></svg>
        <input id="psearch" type="search" placeholder="Tìm theo tên hoặc mã hồ sơ" value="${esc(PQ.q)}"
          style="padding-left:34px" autocomplete="off">
      </div>
      <button class="btn pri" data-newp aria-label="Tạo hồ sơ mới"><svg><use href="#i-plus"/></svg><span class="hidesm">Hồ sơ mới</span></button>
    </div>
    <div class="listbar">
      <div class="lb1" role="tablist">
        ${[["dang", "Đang điều trị", counts.dang], ["xuat", "Đã kết thúc", counts.xuat], ["all", "Tất cả", livePatients().length]]
          .map(([k, t, n]) => `<button class="lbchip" data-filter="${k}"
            aria-pressed="${PQ.filter === k}"><span class="t">${t}</span><span class="n">${n}</span></button>`).join("")}
      </div>
      <div class="lb2">
      <label class="sortsel">
        <span>Thời gian</span>
        <select id="pky">${PQKY.map(([v, t]) =>
          `<option value="${v}"${PQ.ky === v ? " selected" : ""}>${t}</option>`).join("")}</select>
      </label>
      <label class="sortsel">
        <span>Sắp xếp</span>
        <select id="psort">${SORTS.map(s =>
          `<option value="${s.v}" ${PQ.sort === s.v ? "selected" : ""}>${esc(s.t)}</option>`).join("")}</select>
      </label>
      <div class="viewtog" role="group" aria-label="Kiểu hiển thị">
        <button data-view="the" aria-pressed="${listView() === "the"}">Thẻ</button>
        <button data-view="bang" aria-pressed="${listView() === "bang"}">Bảng</button>
      </div>
      </div>
    </div>
    ${PQ.ky === "khac" ? `<div class="rprange" style="margin-top:8px">
      <label for="pq-from">Từ</label>
      <input id="pq-from" type="date" value="${esc(PQ.from)}" max="${isoDay(new Date())}">
      <label for="pq-to">đến</label>
      <input id="pq-to" type="date" value="${esc(PQ.to)}" max="${isoDay(new Date())}">
      <button class="btn sm pri" data-pqgo>Xem</button>
    </div>` : ""}
    ${pw ? `<p class="sorthint">Đang lọc: người bệnh có mặt tại khoa trong <b>${esc(pw.nhan)}</b>
      — ${list.length} hồ sơ.</p>` : ""}
    ${PQ.sort === "az" || PQ.sort === "za" ? `<p class="sorthint">Xếp theo tên gọi, không theo họ.</p>` : ""}
    ${list.length ? (listView() === "bang" ? patientTable(list) : `<div class="plist">${list.map(r => r.ep
        ? patientRow(r, { showDue: true })
        : dischargedRow(r)).join("")}</div>`)
      : `<div class="empty">${PQ.q ? "Không tìm thấy người bệnh nào khớp với từ khoá."
            : livePatients().length ? "Chưa có người bệnh nào trong nhóm này."
            : "Danh sách còn trống. Bấm nút bên dưới để tạo hồ sơ người bệnh đầu tiên."}
          <div style="margin-top:12px"><button class="btn sm pri" data-newp>
            ${PQ.q ? `Tạo hồ sơ mới cho “${esc(PQ.q)}”` : "Tạo hồ sơ người bệnh"}</button></div></div>`}
  `;
  return {
    title: "Người bệnh", sub: `${counts.dang} đang điều trị`, html,
    bind() {
      const s = $("#psearch");
      s.oninput = () => { PQ.q = s.value; const p = s.selectionStart; render();
        const n = $("#psearch"); if (n) { n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} } };
      $$("[data-filter]").forEach(b => b.onclick = () => { PQ.filter = b.dataset.filter; render(); });
      const so = $("#psort");
      if (so) so.onchange = () => { PQ.sort = so.value; render(); };
      const ky = $("#pky");
      if (ky) ky.onchange = () => {
        PQ.ky = ky.value;
        if (PQ.ky !== "khac") { PQ.from = ""; PQ.to = ""; }
        render();
        if (PQ.ky === "khac") { const f = $("#pq-from"); if (f) f.focus(); }
      };
      const pgo = $("[data-pqgo]");
      if (pgo) pgo.onclick = () => {
        PQ.from = ($("#pq-from") || {}).value || "";
        PQ.to = ($("#pq-to") || {}).value || "";
        if (!PQ.from && !PQ.to) { toast("Chưa chọn ngày nào", "err"); return; }
        render();
      };
      $$("[data-view]").forEach(b => b.onclick = () => { PQ.view = b.dataset.view; render(); });
      $$("tr[data-row]").forEach(tr => tr.onclick = () => Nav.go("patient", { id: tr.dataset.row }));
      $$("[data-newp]").forEach(b => b.onclick = () => newPatientDialog(PQ.q));
      bindPatientRows();
    }
  };
}

/* Dạng bảng — một dòng một người bệnh, đọc nhanh khi chiếu máy chiếu hoặc xem trên máy tính */
function patientTable(list) {
  const showOut = list.some(r => !r.ep);
  return `<div class="card" style="padding:14px">
    <div class="tablewrap"><table class="ptable">
      <thead><tr><th>Người bệnh</th><th>Mã hồ sơ</th><th>Giường</th><th>Ngày<br>nằm</th>
        <th>Waterlow</th><th>Mức</th><th>${showOut ? "Tình trạng" : "Đánh giá gần nhất"}</th>
        <th>Xoay trở<br>24 giờ</th><th>Tổn<br>thương</th></tr></thead>
      <tbody>${list.map(r => {
        const { p, ep, lastEp, last, lv, due } = r;
        const ls = last ? (last.lesions || []).length + (last.mdrpi || []).length : 0;
        const ti = ep ? turnInfo(ep) : null;
        const dayN = lastEp ? daysBetween(lastEp.admittedAt, (ep ? new Date() : lastEp.dischargedAt)) + 1 : "—";
        const tinh = ep
          ? `<span style="${due && due.overdue ? "color:var(--r2-ink);font-weight:600" : ""}">${
              last ? ago(last.at) : "chưa có"}${due && due.overdue ? " · quá hạn" : ""}</span>`
          : `<span style="color:var(--ink-3)">${esc(ketThucOf(lastEp))} ${lastEp ? fmtDate(lastEp.dischargedAt) : "—"}</span>`;
        return `<tr data-row="${p.id}" style="cursor:pointer"${ep ? "" : ' class="out"'}>
          <td><b>${esc(p.name)}</b></td>
          <td class="mono">${esc(p.mrn)}</td>
          <td>${esc((ep || lastEp || {}).bed || "—")}</td>
          <td class="num">${dayN}</td>
          <td class="num">${last ? last.score : "—"}</td>
          <td>${lv != null ? levelPill(lv, " sm") : '<span class="pill neutral sm">chưa đánh giá</span>'}</td>
          <td>${tinh}</td>
          <td class="num">${ti ? `<span style="${ti.missCount ? "color:var(--r2-ink);font-weight:600" : ""}">${
            ti.doneCount}/${ti.totalDue}</span>` : "—"}</td>
          <td class="num">${ls || "—"}</td></tr>`;
      }).join("")}</tbody></table></div>
    <p style="font-size:12px;color:var(--ink-3);margin-top:9px">
      Cột <b>Xoay trở 24 giờ</b>: số cữ đã ghi trên tổng số cữ đến hạn.</p>
  </div>`;
}

/* Hình thức kết thúc đợt điều trị. Hồ sơ cũ chưa ghi thì để "Đã kết thúc",
   không đoán là ra viện. */
const KETTHUC = ["Chuyển khoa", "Chuyển viện", "Ra viện", "Tử vong"];
function ketThucOf(ep) {
  const t = ep && ep.dischargeType;
  return KETTHUC.indexOf(t) >= 0 ? t : "Đã kết thúc";
}

function dischargedRow(r) {
  const { p, lastEp, last, lv } = r;
  const age = ageFrom(p.dob);
  return `<button class="prow" data-patient="${p.id}" style="opacity:.86">
    <span class="stripe" style="background:var(--line-2)"></span>
    <span class="body">
      <span class="n">${esc(p.name)}</span>
      <span class="m"><span class="mono">${esc(p.mrn)}</span><span class="sep">·</span>
        <span>${age != null ? age + " tuổi" : "—"}</span></span>
      <span class="m">${esc(ketThucOf(lastEp))} ${lastEp ? fmtDate(lastEp.dischargedAt) : "—"}${last ? " · Waterlow lần cuối " + last.score : ""}</span>
    </span>
    <span class="right"><span class="pill neutral sm">${esc(ketThucOf(lastEp))}</span></span>
  </button>`;
}

/* --- Tạo hồ sơ mới / tìm trùng --- */
function newPatientDialog(prefill) {
  modal({
    title: "Hồ sơ người bệnh mới",
    body: `<div class="notice"><svg><use href="#i-info"/></svg>
        <span>Nếu người bệnh đã từng nằm khoa, hãy tìm lại hồ sơ cũ bằng tên và ngày sinh thay vì tạo mới.</span></div>
      <div class="field"><label for="np-name">Họ và tên</label>
        <input id="np-name" type="text" value="${esc(prefill || "")}" placeholder="Nguyễn Văn A"></div>
      <div class="grid2">
        <div class="field"><label for="np-mrn">Mã hồ sơ bệnh viện</label>
          <input id="np-mrn" type="text" placeholder="vd: 26-045678" class="mono">
          <span class="help">Đây là mã định danh chính, không trùng lặp.</span></div>
        <div class="field"><label for="np-dob">Ngày sinh</label><input id="np-dob" type="date"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="np-sex">Giới tính</label>
          <select id="np-sex"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
        <div class="field"><label for="np-bed">Giường</label><input id="np-bed" type="text" placeholder="vd: HS-07"></div>
      </div>
      <div class="field"><label for="np-dx">Chẩn đoán chính</label>
        <input id="np-dx" type="text" placeholder="vd: Viêm phổi nặng, sốc nhiễm khuẩn"></div>
      <div id="np-dup"></div>`,
    actions: [{ label: "Huỷ" }, { label: "Tạo và nhập khoa", kind: "pri", onClick: (b) => {
      const name = $("#np-name", b).value.trim();
      const mrn = $("#np-mrn", b).value.trim();
      const dob = $("#np-dob", b).value;
      if (!name) { toast("Chưa nhập họ tên", "err"); return false; }
      if (!mrn) { toast("Chưa nhập mã hồ sơ bệnh viện", "err"); return false; }
      const dupMrn = livePatients().find(p => p.mrn.toLowerCase() === mrn.toLowerCase());
      if (dupMrn) {
        toast("Mã hồ sơ này đã tồn tại — mở hồ sơ cũ.", "err", 4500);
        Nav.go("patient", { id: dupMrn.id });
        return;
      }
      const dupName = livePatients().find(p => noAccent(p.name) === noAccent(name) && p.dob === dob && dob);
      if (dupName && !b.dataset.forced) {
        b.dataset.forced = "1";
        $("#np-dup", b).innerHTML = `<div class="notice warn"><svg><use href="#i-alert"/></svg>
          <span>Đã có hồ sơ <b>${esc(dupName.name)}</b> (mã ${esc(dupName.mrn)}) cùng tên và ngày sinh.
          Bấm lại nút “Tạo và nhập khoa” nếu đây thực sự là người bệnh khác, hoặc
          <a href="#" data-open-dup>mở hồ sơ cũ</a>.</span></div>`;
        $("[data-open-dup]", b).onclick = e => { e.preventDefault(); Nav.go("patient", { id: dupName.id }); $(".modal").remove(); };
        return false;
      }
      const p = touch({ id: uid("p"), name, mrn, dob, sex: $("#np-sex", b).value,
        createdAt: new Date().toISOString(), createdBy: Session.user.id });
      DB.data.patients.push(p);
      const ep = newEpisode(p.id, $("#np-bed", b).value.trim(), $("#np-dx", b).value.trim());
      DB.log("tao-nguoi-benh", `Tạo hồ sơ ${name} (${mrn}) và nhập khoa`, "patient", p.id);
      DB.save();
      toast("Đã tạo hồ sơ và nhập khoa", "ok");
      Nav.go("patient", { id: p.id });
    }}]
  });
}
function newEpisode(patientId, bed, dx) {
  const ep = touch({ id: uid("e"), patientId, admittedAt: new Date().toISOString(), dischargedAt: null,
    bed: bed || "", diagnosis: dx || "", admittedBy: Session.user.id });
  DB.data.episodes.push(ep);
  return ep;
}

/* ============================================================
   HỒ SƠ MỘT NGƯỜI BỆNH
   ============================================================ */
/* Một dòng trong Diễn tiến đánh giá — dùng chung, không viết lại lần hai */
function assessRow(a) {
  const l = a.level != null ? a.level : levelOf(a.score);
  return `<div class="tlrow ${levelClass(l)}">
    <div class="tcol"><div class="tscore">${a.score}</div><div class="tline"></div></div>
    <div class="tbody">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${levelPill(l, " sm")}
        ${(a.lesions || []).length ? `<span class="tag hapi">${(a.lesions || []).length} tổn thương</span>` : ""}
        ${(a.mdrpi || []).length ? `<span class="tag">${(a.mdrpi || []).length} do thiết bị</span>` : ""}
        ${(a.icu || []).length ? `<span class="tag">${(a.icu || []).length} yếu tố hồi sức</span>` : ""}
      </div>
      <div class="tmeta">${fmtDT(a.at)} · ${esc(DB.userName(a.userId))}</div>
      ${a.note ? `<div class="tnote">${esc(a.note)}</div>` : ""}
      <button class="btn ghost sm" data-viewa="${a.id}" style="margin-top:4px;padding-left:0">Xem chi tiết phiếu</button>
    </div></div>`;
}


/* Việc hành chính của hồ sơ — gom vào một hộp thoại, mở từ nút ở đầu trang.
   Để riêng khỏi phần chăm sóc, vì đây là việc ít làm và dễ bấm nhầm. */
/* Thẻ đang mở của từng hồ sơ. Vẽ lại màn hình (sau khi ghi xoay trở, ghi diễn tiến
   tổn thương…) thì quay về đúng thẻ đang xem, không văng về Tổng quan. */
let PTAB = {};

function hanhChinhDialog(p, ep) {
  const m = modal({
    title: "Hành chính",
    body: `<div class="hclist">
      ${ep ? `<button class="btn" data-hc-editep>Sửa giường / chẩn đoán</button>` : ""}
      <button class="btn" data-hc-editp>Sửa thông tin hành chính</button>
      ${ep ? `<button class="btn danger" data-hc-discharge>Kết thúc đợt điều trị</button>` : ""}
      ${!ep ? `<button class="btn pri" data-hc-readmit>Nhập viện lại</button>` : ""}
      ${Session.isHead() ? `<button class="btn danger" data-hc-voidp>Huỷ hồ sơ</button>` : ""}
    </div>
    <p class="hcsub">Phiếu đánh giá đã ký không sửa được — muốn sửa thì đánh giá lại.
      Mọi lần sửa hồ sơ đều lưu vết người sửa và thời điểm sửa.</p>`,
    actions: [{ label: "Đóng" }]
  });
  const g = (s, f) => { const el = $(s, m.body); if (el) el.onclick = () => { m.close(); f(); }; };
  g("[data-hc-editep]",    () => editEpisodeDialog(ep));
  g("[data-hc-editp]",     () => editPatientDialog(p));
  g("[data-hc-discharge]", () => dischargeDialog(p, ep));
  g("[data-hc-readmit]",   () => readmitDialog(p));
  g("[data-hc-voidp]",     () => voidPatientDialog(p));
}

function viewPatient({ id }) {
  const p = DB.patient(id);
  if (!p) return { title: "Không tìm thấy", html: `<div class="empty">Hồ sơ không còn tồn tại.</div>` };
  if (isVoid(p)) return {
    title: p.name, sub: "hồ sơ đã huỷ",
    html: `<section class="card"><div class="notice warn"><svg><use href="#i-alert"/></svg><span>
        Hồ sơ này đã bị huỷ ${fmtDT(p.voidedAt)} bởi
        <b>${esc(p.voidedByName || DB.userName(p.voidedBy))}</b> — lý do: ${esc(p.voidReason || "—")}.<br>
        Hồ sơ không còn trong danh sách người bệnh và không được tính vào báo cáo.
        ${Session.isHead() ? "Khôi phục được trong Cài đặt." : "Cần khôi phục thì báo điều dưỡng trưởng."}
      </span></div></section>` + editHistoryBlock(p),
    bind() {}
  };
  const ep = DB.activeEpisode(p.id);
  const eps = DB.episodesOf(p.id);
  const curEp = ep || eps[0];
  const assessments = curEp ? DB.assessmentsOf(curEp.id) : [];
  const last = assessments[0] || null;
  const lv = last ? (last.level != null ? last.level : levelOf(last.score)) : null;
  const clv = last ? careLevelOf(last) : null;
  const due = ep ? dueInfo(ep) : null;
  const age = ageFrom(p.dob);
  const flags = DB.flagsOf(p.id);
  const openF = flags.filter(f => f.status !== "dong");

  /* Việc còn nợ của chính người bệnh này — dùng lại đúng hàm của trang chủ,
     để hai nơi không bao giờ nói khác nhau. */
  const tiCur = ep ? turnInfo(ep) : null;
  const vcl = ep ? viecCuaNguoiBenh({ p, ep, due, lv, last, ti: tiCur }) : { viec: [], uu: 0 };

  /* Một nút chính duy nhất trên cả trang: việc gấp nhất.
     Các nút còn lại là nút viền, để mắt biết bấm gì trước. */
  const uuTien = vcl.viec.length
    ? (vcl.viec.find(v => v.k === "assess") ? "assess"
      : vcl.viec.find(v => v.k === "turn") ? "turn" : "flag")
    : null;

  const canLam = !ep ? "" : `
      <div class="canlam ${vcl.viec.some(v => v.gap) ? "gap" : ""}">
        <div class="cl-h">${vcl.viec.length ? "Cần làm" : "Không còn việc nợ"}</div>
        ${vcl.viec.length
          ? `<ul>${vcl.viec.map(v => `<li>${esc(v.t)}</li>`).join("")}</ul>`
          : `<p class="cl-ok">Đúng hạn đánh giá, đúng khoảng cách xoay trở,
               không có lưu ý nào chưa xử lý.</p>`}
        <div class="btnrow">
          <button class="btn ${uuTien === "assess" ? "pri" : ""}" data-assess>${
            last ? "Đánh giá lại" : "Đánh giá loét tì đè"}</button>
          <button class="btn ${uuTien === "turn" ? "pri" : ""}" data-turn2>Ghi xoay trở</button>
          ${Session.isHead() ? `<button class="btn" data-flag>Cần quan tâm</button>` : ""}
        </div>
      </div>`;

  const header = `
    <section class="card">
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:190px">
          <p style="font-size:13.5px;color:var(--ink);margin:0">
            <span class="mono">${esc(p.mrn)}</span> · ${age != null ? age + " tuổi" : "—"} ·
            ${p.sex === "nu" ? "Nữ" : "Nam"} · sinh ${fmtDate(p.dob)}</p>
          ${curEp ? `<p style="font-size:13px;color:var(--ink-2);margin-top:4px">
            Giường <b>${esc(curEp.bed || "chưa xếp")}</b> · ${esc(curEp.diagnosis || "chưa ghi chẩn đoán")}</p>` : ""}
          ${curEp ? `<p style="font-size:12.5px;color:var(--ink-3);margin-top:3px">
            ${ep ? `Nhập khoa ${fmtDT(ep.admittedAt)} · ngày điều trị thứ ${daysBetween(ep.admittedAt, new Date()) + 1}`
                 : `Đợt gần nhất: ${fmtDate(curEp.admittedAt)} – ${fmtDate(curEp.dischargedAt)}`}</p>` : ""}
          <button class="hcnut" data-hc><svg><use href="#i-cog"/></svg>Hành chính</button>
        </div>
        ${last ? `<div class="result ${levelClass(lv)}" style="min-width:142px;padding:13px 15px">
          <span class="big" style="font-size:38px">${last.score}</span>
          <span class="lvl">${esc(LEVELS[lv].short)}</span>
          <span class="sub">Waterlow · ${ago(last.at)}</span>
        </div>` : `<div class="empty" style="min-width:142px;padding:16px">Chưa đánh giá</div>`}
      </div>
      ${ep ? canLam : `<div class="btnrow" style="margin-top:13px">
        <button class="btn pri" data-readmit>Nhập viện lại</button></div>`}
    </section>`;

  /* BẢN THỬ: bảng xoay trở + danh sách tổn thương có trạng thái liền thương */
  const turnSec = turnBlock(p, ep);
  const lesionsBlock = lesionsBlockNew(curEp, !!ep);

  const photoTl = photoTimeline(p.id, curEp);

  const careBlock = last ? (() => {
    const items = bundleFor(clv);
    const doneList = last.bundle || [];
    const chua = items.filter(it => !doneList.includes(it));
    return `<section class="card">
      <div class="card-h"><h2>Gói chăm sóc</h2>
        <span class="hint">${esc(LEVELS[clv].short)}${clv > lv ? " · đã nâng một mức" : ""}</span></div>
      ${clv > lv ? `<div class="notice"><svg><use href="#i-info"/></svg>
        <span>Mức chăm sóc được nâng lên do người bệnh có ${(last.icu || []).length} yếu tố nguy cơ đặc thù hồi sức${(last.lesions || []).length ? " và đã có tổn thương" : ""}.</span></div>` : ""}

      ${chua.length ? `<p class="carelead">Còn <b>${chua.length}</b> mục chưa đánh dấu thực hiện:</p>
        <div class="bundle">${chua.map(it => `<div class="bitem" aria-pressed="false" style="pointer-events:none">
          <span class="box"><svg><use href="#i-check"/></svg></span><span class="bt">${esc(it)}</span></div>`).join("")}</div>`
      : `<p class="carelead ok">Đã đánh dấu đủ ${items.length} mục lúc ${fmtDT(last.at)}.</p>`}

      <details class="fold">
        <summary>Cả gói ${items.length} mục<span class="fsum">${doneList.length}/${items.length} đã làm</span></summary>
        <div class="foldin">
          <div class="bundle">${items.map(it => `<div class="bitem" aria-pressed="${doneList.includes(it)}" style="pointer-events:none">
            <span class="box"><svg><use href="#i-check"/></svg></span><span class="bt">${esc(it)}</span></div>`).join("")}</div>
          <p style="font-size:12px;color:var(--ink-3);margin-top:8px">
            Đánh dấu lúc ${fmtDT(last.at)} — ${esc(DB.userName(last.userId))}.</p>
        </div>
      </details>
    </section>`;
  })() : "";

  const tl = assessments.length ? `
    <section class="card">
      <div class="card-h"><h2>Diễn tiến đánh giá</h2>
        <span class="hint">${assessments.length} lượt · đợt điều trị hiện tại</span></div>
      ${assessments.length > 1 ? chartPatientTrend(assessments) : ""}
      <div class="tl" style="margin-top:${assessments.length > 1 ? "14px" : "0"}">
        ${assessments.slice(0, 1).map(assessRow).join("")}
      </div>
      ${assessments.length > 1 ? `<details class="fold">
        <summary>${assessments.length - 1} lượt đánh giá cũ hơn<span class="fsum">từ ${
          fmtDate(assessments[assessments.length - 1].at)}</span></summary>
        <div class="foldin"><div class="tl">${assessments.slice(1).map(assessRow).join("")}</div></div>
      </details>` : ""}
    </section>` : "";

  const doneF = flags.filter(f => f.status === "dong");
  /* Còn việc chưa xử lý thì mở sẵn; xong hết rồi thì gói lại một dòng */
  const flagBlock = !flags.length ? "" : openF.length ? `
    <section>
      <div class="card-h"><h2>Lưu ý của điều dưỡng trưởng</h2>
        <span class="hint">${openF.length} chưa xử lý</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">${openF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
      ${doneF.length ? `<section class="card" style="margin-top:10px;padding-top:2px">
        <details class="fold bare">
          <summary>Lưu ý đã đóng<span class="fsum">${doneF.length} mục</span></summary>
          <div class="foldin" style="display:flex;flex-direction:column;gap:10px">
            ${doneF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
        </details></section>` : ""}
    </section>` : `
    <section class="card">
      <details class="fold bare">
        <summary>Lưu ý của điều dưỡng trưởng<span class="fsum">đã xử lý xong ${doneF.length} mục</span></summary>
        <div class="foldin" style="display:flex;flex-direction:column;gap:10px">
          ${doneF.slice(0, 5).map(f => flagCard(f)).join("")}</div>
      </details>
    </section>`;

  const epsBlock = eps.length > 1 ? `
    <details class="fold">
      <summary>Các đợt điều trị<span class="fsum">${eps.length} đợt</span></summary>
      <div class="foldin"><div class="tablewrap"><table><thead><tr><th>Đợt</th><th>Nhập khoa</th><th>Xuất khoa</th><th>Số ngày</th><th>Lượt đánh giá</th><th>Waterlow cao nhất</th></tr></thead><tbody>
        ${eps.map((e, i) => {
          const as = DB.assessmentsOf(e.id);
          const mx = as.length ? Math.max(...as.map(a => a.score)) : null;
          return `<tr><td>${eps.length - i}</td><td>${fmtDate(e.admittedAt)}</td>
            <td>${e.dischargedAt ? fmtDate(e.dischargedAt) : "<b>đang điều trị</b>"}</td>
            <td class="num">${daysBetween(e.admittedAt, e.dischargedAt || new Date()) + 1}</td>
            <td class="num">${as.length}</td><td class="num">${mx == null ? "—" : mx}</td></tr>`;
        }).join("")}
      </tbody></table></div></div>
    </details>` : "";


  const khacBlock = `
    <section class="card">
      <div class="card-h"><h2>Hành chính</h2></div>
      <div class="khac">
      </div>
    </section>`;


  /* ---------- Chia hồ sơ thành bốn thẻ ---------- */
  const soTT = curEp ? lesionsOfEpisode(curEp.id).filter(l => l.status !== "lanh").length : 0;
  const tabs = [
    { k: "tq",  t: "Tổng quan", cham: vcl.viec.length > 0 },
    { k: "tt",  t: "Tổn thương", num: soTT || null },
    { k: "xt",  t: "Xoay trở",  cham: !!(tiCur && (tiCur.toiLuc || tiCur.never)) },
    { k: "dt",  t: "Diễn tiến" }
  ];
  const noiDung = {
    tq: header + flagBlock + careBlock + editHistoryBlock(p),
    tt: lesionsBlock + photoTl,
    xt: turnSec || `<div class="empty">Người bệnh đã xuất khoa, không còn theo dõi xoay trở.</div>`,
    dt: tl + epsBlock
  };
  /* Thẻ nào đang mở: lấy lại của lần trước nếu thẻ đó còn tồn tại */
  const dangMo = tabs.some(t => t.k === PTAB[p.id]) ? PTAB[p.id] : tabs[0].k;
  PTAB[p.id] = dangMo;

  const tabHtml = `
    <div class="ptabs" role="tablist">${tabs.map(t => `
      <button role="tab" data-ptab="${t.k}" aria-selected="${t.k === dangMo}">
        ${esc(t.t)}${t.cham ? `<span class="dot"></span>` : ""}${
          t.num ? `<span class="num">${t.num}</span>` : ""}</button>`).join("")}</div>
    ${tabs.map(t => `<div data-ppane="${t.k}"${t.k === dangMo ? "" : " hidden"}>${noiDung[t.k]}</div>`).join("")}`;

  return {
    title: p.name, sub: p.mrn,
    html: tabHtml,
    bind() {
      const ep3 = $("[data-editp]"); if (ep3) ep3.onclick = () => editPatientDialog(p);
      const vp = $("[data-voidp]"); if (vp) vp.onclick = () => voidPatientDialog(p);
      const hc = $("[data-hc]"); if (hc) hc.onclick = () => hanhChinhDialog(p, ep);
      const tb = $("[data-turn]"); if (tb) tb.onclick = () => turnDialog(p, ep);
      const tb2 = $("[data-turn2]"); if (tb2) tb2.onclick = () => turnDialog(p, ep);
      bindLesionActions(p.id);
      const a = $("[data-assess]"); if (a) a.onclick = () => Nav.go("assess", { patientId: p.id, episodeId: ep.id });
      const f = $("[data-flag]"); if (f) f.onclick = () => flagDialog(p.id, ep.id);
      const d = $("[data-discharge]"); if (d) d.onclick = () => dischargeDialog(p, ep);
      const r = $("[data-readmit]"); if (r) r.onclick = () => readmitDialog(p);
      const e2 = $("[data-editep]"); if (e2) e2.onclick = () => editEpisodeDialog(ep);
      $$("[data-viewa]").forEach(b => b.onclick = () => showAssessment(b.dataset.viewa));
      bindFlagCards(); bindCharts(); hydratePhotos();
      /* Đổi thẻ — chỉ ẩn/hiện, không vẽ lại, nên không mất chỗ đang mở */
      $$("[data-ptab]").forEach(b => b.onclick = () => {
        PTAB[p.id] = b.dataset.ptab;
        $$("[data-ptab]").forEach(x => x.setAttribute("aria-selected", x === b));
        $$("[data-ppane]").forEach(pn => pn.hidden = pn.dataset.ppane !== b.dataset.ptab);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  };
}

function lesionView(l, isDevice) {
  return `<div class="lesion">
    <div class="lh"><span class="t">${esc(l.site)}${isDevice && l.device ? ` — ${esc(l.device)}` : ""}</span>
      <span class="pill neutral sm">Độ ${esc(l.stage)}</span></div>
    <div class="tagrow">
      <span class="tag ${l.poa ? "poa" : "hapi"}">${l.poa ? "Có sẵn khi nhập khoa" : "Phát sinh tại khoa"}</span>
      ${isDevice ? `<span class="tag">Do thiết bị y tế</span>` : ""}
      <span class="tag">Phát hiện ${fmtDate(l.foundAt)}</span>
      ${l.size ? `<span class="tag">${esc(l.size)}</span>` : ""}
    </div>
    ${l.note ? `<p style="font-size:13px;color:var(--ink-2)">${esc(l.note)}</p>` : ""}
    ${(l.photos || []).length ? `<div class="gal">${l.photos.map(ph =>
      `<figure data-lb="${ph.id}" data-cap="${esc(l.site + " · " + fmtDT(ph.at))}">
        <img data-photo="${ph.id}" alt="Ảnh ${esc(l.site)}">
